/* ============================================================
   狀態管理
   ============================================================ */
const state = {
  screen: "home",              // home | levelIntro | quiz | feedback | levelResult | retry | final
  currentLevelIdx: 0,
  currentQIdx: 0,
  selectedOption: null,
  levelResults: [null, null, null],   // { score, correctCount, wrongIds:[], passed }
  levelAnswers: [ {}, {}, {} ],        // 每關: {questionId: selectedIndex}
  retryQueue: [],               // 目前錯題重練佇列（題目物件）
  retryIdx: 0,
  inRetry: false,
  abilityStats: {},             // { skillName: {correct, total} }
  conceptStats: {},             // { conceptName: {correct, total} }
};

const LEVEL_STYLES = [
  {icon:"🧭", name:"基礎理解", stars:"★★☆☆☆"},
  {icon:"🗺️", name:"深入分析", stars:"★★★☆☆"},
  {icon:"⚔️", name:"高階思考與情境應用", stars:"★★★★☆"},
];

function currentLevel(){ return QUIZ_DATA.levels[state.currentLevelIdx]; }
function currentQuestion(){ return currentLevel().questions[state.currentQIdx]; }

/* ============================================================
   畫面渲染
   ============================================================ */
const app = document.getElementById("app");

function render(){
  window.scrollTo({top:0, behavior:"instant"});
  if(state.screen === "home") return renderHome();
  if(state.screen === "levelIntro") return renderLevelIntro();
  if(state.screen === "quiz") return renderQuiz();
  if(state.screen === "feedback") return renderFeedback();
  if(state.screen === "levelResult") return renderLevelResult();
  if(state.screen === "retryIntro") return renderRetryIntro();
  if(state.screen === "final") return renderFinal();
}

function renderHome(){
  app.innerHTML = `
    <div class="gate-card rounded-3xl p-8 text-center fade-in">
      <p class="mono text-xs tracking-widest text-[var(--gold-dark)] mb-2">UNCLE SIX STORY LAB</p>
      <h1 class="text-3xl font-black mb-1">六號叔叔說故事</h1>
      <h2 class="text-lg font-bold text-[var(--gold-dark)] mb-6">智慧闖關測驗</h2>
      <div class="bg-white/60 rounded-2xl p-4 mb-6 border border-black/5">
        <p class="text-sm text-gray-500 mb-1">本次教材</p>
        <p class="text-xl font-bold">${esc(QUIZ_DATA.meta.filename || QUIZ_DATA.meta.unit)}</p>
        ${QUIZ_DATA.meta.summary ? `<p class="text-sm text-gray-600 mt-2 leading-relaxed">${esc(QUIZ_DATA.meta.summary)}</p>` : ""}
        <p class="mono text-xs text-gray-500 mt-2">${esc(QUIZ_DATA.meta.subject)} ・ ${esc(QUIZ_DATA.meta.grade || "")}</p>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-8">
        ${LEVEL_STYLES.map((l,i)=>`
          <div class="rounded-xl border border-black/10 p-3">
            <div class="text-2xl mb-1">${l.icon}</div>
            <p class="text-xs font-bold">第${["一","二","三"][i]}關</p>
            <p class="mono text-[10px] text-[var(--gold-dark)]">${l.stars}</p>
          </div>
        `).join("")}
      </div>
      <button onclick="startAdventure()" class="w-full bg-[var(--bg-deep)] text-white font-bold py-3 rounded-xl hover:bg-[var(--bg-deep2)] transition">
        🚀 開始挑戰
      </button>
    </div>
  `;
}

function startAdventure(){
  state.currentLevelIdx = 0;
  state.screen = "levelIntro";
  render();
}

function renderLevelIntro(){
  const idx = state.currentLevelIdx;
  const style = LEVEL_STYLES[idx];
  app.innerHTML = `
    <div class="gate-card rounded-3xl p-8 text-center fade-in">
      <div class="text-5xl mb-3">${style.icon}</div>
      <p class="mono text-xs tracking-widest text-[var(--gold-dark)] mb-1">LEVEL ${idx+1}</p>
      <h2 class="text-2xl font-black mb-2">第${["一","二","三"][idx]}關｜${style.name}</h2>
      <p class="mono text-sm text-[var(--gold-dark)] mb-6">${style.stars}</p>
      <div class="flex justify-center gap-6 text-sm text-gray-600 mb-8">
        <div><p class="text-2xl font-bold text-[var(--ink)]">10</p><p>題數</p></div>
        <div><p class="text-2xl font-bold text-[var(--ink)]">60</p><p>通關門檻</p></div>
      </div>
      <p class="text-sm text-gray-500 mb-6">準備好了嗎？這一關開始囉！</p>
      <button onclick="beginLevelQuiz()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl hover:brightness-110 transition">
        開始挑戰
      </button>
    </div>
  `;
}

function beginLevelQuiz(){
  state.currentQIdx = 0;
  state.selectedOption = null;
  state.inRetry = false;
  state.screen = "quiz";
  render();
}

function renderProgress(current, total){
  const pct = Math.round((current/total)*100);
  return `<div class="torch-bar mb-2"><div style="width:${pct}%"></div></div>
          <p class="mono text-[11px] text-white/70 text-right mb-4">${current}/${total}</p>`;
}

function renderQuiz(){
  const q = state.inRetry ? state.retryQueue[state.retryIdx] : currentQuestion();
  const total = state.inRetry ? state.retryQueue.length : 10;
  const current = (state.inRetry ? state.retryIdx : state.currentQIdx) + 1;
  const style = LEVEL_STYLES[state.currentLevelIdx];

  app.innerHTML = `
    ${renderProgress(current, total)}
    <div class="gate-card rounded-3xl p-6 fade-in">
      <div class="flex items-center justify-between mb-4">
        <span class="badge-tag mono">${style.icon} 第${["一","二","三"][state.currentLevelIdx]}關${state.inRetry ? " ・錯題重練" : ""}</span>
        <span class="badge-tag mono">${esc(q.concept)}</span>
      </div>
      <h3 class="text-lg font-bold mb-5 leading-relaxed">${esc(q.question)}</h3>
      <div class="space-y-3" id="options">
        ${q.options.map((opt,i)=>`
          <button class="option-btn w-full text-left px-4 py-3 rounded-xl bg-white" onclick="selectOption(${i})">
            <span class="mono text-xs text-gray-400 mr-2">${String.fromCharCode(65+i)}</span>${esc(opt)}
          </button>
        `).join("")}
      </div>
      <button id="confirmBtn" disabled onclick="confirmAnswer()"
        class="w-full mt-6 bg-gray-300 text-white font-bold py-3 rounded-xl cursor-not-allowed transition">
        確認答案
      </button>
    </div>
  `;
}

function selectOption(i){
  state.selectedOption = i;
  document.querySelectorAll(".option-btn").forEach((btn,idx)=>{
    btn.classList.toggle("ring-2", idx===i);
    btn.classList.toggle("ring-[var(--gold-dark)]", idx===i);
  });
  const btn = document.getElementById("confirmBtn");
  btn.disabled = false;
  btn.classList.remove("bg-gray-300","cursor-not-allowed");
  btn.classList.add("bg-[var(--bg-deep)]","hover:bg-[var(--bg-deep2)]");
}

function confirmAnswer(){
  if(state.selectedOption === null) return;
  const q = state.inRetry ? state.retryQueue[state.retryIdx] : currentQuestion();
  const isCorrect = state.selectedOption === q.answer;

  if(!state.inRetry){
    state.levelAnswers[state.currentLevelIdx][q.id] = state.selectedOption;
    recordStats(q, isCorrect);
  }
  state.lastCorrect = isCorrect;
  state.screen = "feedback";
  render();
}

function recordStats(q, isCorrect){
  const s = state.abilityStats[q.skill] || {correct:0,total:0};
  s.total++; if(isCorrect) s.correct++;
  state.abilityStats[q.skill] = s;
  const c = state.conceptStats[q.concept] || {correct:0,total:0};
  c.total++; if(isCorrect) c.correct++;
  state.conceptStats[q.concept] = c;
}

function renderFeedback(){
  const q = state.inRetry ? state.retryQueue[state.retryIdx] : currentQuestion();
  const correct = state.lastCorrect;
  app.innerHTML = `
    <div class="gate-card rounded-3xl p-6 fade-in">
      <div class="text-center mb-4">
        <div class="text-4xl mb-2">${correct ? "✅" : "❌"}</div>
        <p class="text-xl font-black ${correct ? "text-[var(--teal)]" : "text-[var(--ember)]"}">
          ${correct ? "答對了！漂亮！" : "再想一下！答錯很正常。"}
        </p>
      </div>
      <div class="bg-white/70 rounded-2xl p-4 border border-black/5">
        <p class="text-sm text-gray-500 mb-1">正確答案</p>
        <p class="font-bold mb-3">${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</p>
        <p class="text-sm text-gray-500 mb-1">解析</p>
        <p class="text-sm leading-relaxed mb-3">${esc(q.explanation)}</p>
        <div class="flex gap-2 flex-wrap">
          <span class="badge-tag mono">考點：${esc(q.concept)}</span>
          <span class="badge-tag mono">能力：${esc(q.skill)}</span>
        </div>
      </div>
      <button onclick="nextQuestion()" class="w-full mt-6 bg-[var(--bg-deep)] text-white font-bold py-3 rounded-xl hover:bg-[var(--bg-deep2)] transition">
        下一題
      </button>
    </div>
  `;
}

function nextQuestion(){
  state.selectedOption = null;
  if(state.inRetry){
    if(!state.lastCorrect){
      // 答錯：保留在錯題佇列尾端，稍後再考
      state.retryQueue.push(state.retryQueue[state.retryIdx]);
    }
    state.retryIdx++;
    // 過濾掉已經跳過的（已處理）題目，改用重新計算的 remaining 清單
    state.retryQueue = state.retryQueue.slice(state.retryIdx);
    state.retryIdx = 0;
    if(state.retryQueue.length === 0){
      state.screen = "levelResult";
    } else {
      state.screen = "quiz";
    }
    render();
    return;
  }

  state.currentQIdx++;
  if(state.currentQIdx >= 10){
    finishLevel();
  } else {
    state.screen = "quiz";
    render();
  }
}

function finishLevel(){
  const level = currentLevel();
  const answers = state.levelAnswers[state.currentLevelIdx];
  let correctCount = 0;
  const wrongQuestions = [];
  level.questions.forEach(q=>{
    if(answers[q.id] === q.answer) correctCount++;
    else wrongQuestions.push(q);
  });
  const score = correctCount * 10;
  state.levelResults[state.currentLevelIdx] = {
    score, correctCount, wrongCount: 10-correctCount,
    wrongQuestions, passed: score >= 60,
  };
  state.screen = "levelResult";
  render();
}

function scoreComment(score){
  if(score >= 90) return {tag:"🏆 完美通關", text:"太棒了！這一關的核心概念掌握得非常穩。"};
  if(score >= 80) return {tag:"🔥 穩定通關", text:"表現很好！主要知識已經掌握，只需要注意少數細節。"};
  if(score >= 60) return {tag:"⚔️ 驚險通關", text:"成功通關！但有幾個考點還需要再確認。"};
  return {tag:"💪 尚未通關", text:"這一關還沒成功，但不用氣餒。先把錯題弄懂，再挑戰一次。"};
}

function renderLevelResult(){
  const r = state.levelResults[state.currentLevelIdx];
  const c = scoreComment(r.score);
  const style = LEVEL_STYLES[state.currentLevelIdx];
  const isLast = state.currentLevelIdx === 2;

  app.innerHTML = `
    <div class="gate-card rounded-3xl p-8 text-center fade-in">
      <p class="mono text-xs tracking-widest text-[var(--gold-dark)] mb-1">第${["一","二","三"][state.currentLevelIdx]}關｜${style.name}</p>
      <div class="text-4xl mb-2">${c.tag.split(" ")[0]}</div>
      <p class="font-black text-lg mb-1">${c.tag.split(" ")[1]}</p>
      <p class="text-5xl font-black my-4">${r.score}<span class="text-lg text-gray-400"> /100</span></p>
      <p class="text-sm text-gray-600 mb-6">答對 ${r.correctCount} 題・答錯 ${r.wrongCount} 題</p>
      <p class="text-sm bg-white/60 rounded-xl p-4 mb-6">${c.text}</p>

      ${r.wrongQuestions.length > 0 ? `
        <div class="text-left bg-white/60 rounded-xl p-4 mb-6">
          <p class="text-sm font-bold mb-2">錯題清單</p>
          <ul class="text-xs text-gray-600 space-y-1">
            ${r.wrongQuestions.map(q=>`<li>・${esc(q.concept)}：${esc(q.question.slice(0,24))}${q.question.length>24?"...":""}</li>`).join("")}
          </ul>
        </div>
      ` : ""}

      <div class="flex flex-col gap-3">
        ${r.wrongQuestions.length > 0 ? `<button onclick="startRetry()" class="w-full bg-[var(--ember)] text-white font-bold py-3 rounded-xl hover:brightness-110">📝 錯題重練</button>` : ""}
        ${r.passed
          ? `<button onclick="${isLast ? "goFinal()" : "nextLevel()"}" class="w-full bg-[var(--bg-deep)] text-white font-bold py-3 rounded-xl hover:bg-[var(--bg-deep2)]">${isLast ? "查看學習診斷 📊" : "繼續挑戰下一關 🚀"}</button>`
          : `<button onclick="retryLevel()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl hover:brightness-110">重新挑戰這一關</button>`
        }
      </div>
    </div>
  `;
}

function startRetry(){
  const r = state.levelResults[state.currentLevelIdx];
  state.retryQueue = [...r.wrongQuestions];
  state.retryIdx = 0;
  state.inRetry = true;
  state.screen = "retryIntro";
  render();
}

function renderRetryIntro(){
  app.innerHTML = `
    <div class="gate-card rounded-3xl p-8 text-center fade-in">
      <div class="text-4xl mb-3">📝</div>
      <h2 class="text-xl font-black mb-2">錯題重練</h2>
      <p class="text-sm text-gray-600 mb-6">這個考點很容易混淆，記住這個關鍵！本次只練習你答錯的 ${state.retryQueue.length} 題，全部答對就能離開。</p>
      <button onclick="state.screen='quiz'; render();" class="w-full bg-[var(--bg-deep)] text-white font-bold py-3 rounded-xl hover:bg-[var(--bg-deep2)]">
        開始重練
      </button>
    </div>
  `;
}

function retryLevel(){
  state.levelAnswers[state.currentLevelIdx] = {};
  state.currentQIdx = 0;
  state.inRetry = false;
  state.screen = "quiz";
  render();
}

function nextLevel(){
  state.currentLevelIdx++;
  state.screen = "levelIntro";
  render();
}

function goFinal(){
  state.screen = "final";
  render();
}

function renderFinal(){
  const totalScore = state.levelResults.reduce((a,r)=>a+r.score,0);
  const totalCorrect = state.levelResults.reduce((a,r)=>a+r.correctCount,0);
  const totalWrong = 30 - totalCorrect;

  const conceptEntries = Object.entries(state.conceptStats)
    .map(([name,s])=>({name, pct: Math.round((s.correct/s.total)*100)}))
    .sort((a,b)=>b.pct-a.pct);
  const strongest = conceptEntries.slice(0,3);
  const weakest = [...conceptEntries].sort((a,b)=>a.pct-b.pct).slice(0,3);

  const abilityEntries = Object.entries(state.abilityStats)
    .map(([name,s])=>({name, pct: Math.round((s.correct/s.total)*100)}))
    .sort((a,b)=>b.pct-a.pct);

  app.innerHTML = `
    <div class="gate-card rounded-3xl p-8 fade-in">
      <div class="text-center mb-6">
        <p class="mono text-xs tracking-widest text-[var(--gold-dark)] mb-1">UNCLE SIX DIAGNOSIS</p>
        <h2 class="text-2xl font-black mb-1">六號叔叔學習診斷</h2>
        <p class="text-5xl font-black my-3">${totalScore}<span class="text-lg text-gray-400"> /300</span></p>
        <p class="text-sm text-gray-600">答對 ${totalCorrect} 題・答錯 ${totalWrong} 題</p>
      </div>

      <div class="grid grid-cols-3 gap-2 mb-6">
        ${state.levelResults.map((r,i)=>`
          <div class="rounded-xl border border-black/10 p-3 text-center">
            <p class="text-xs text-gray-500">第${["一","二","三"][i]}關</p>
            <p class="text-xl font-black">${r.score}</p>
          </div>
        `).join("")}
      </div>

      <div class="bg-white/60 rounded-2xl p-4 mb-4">
        <p class="text-sm font-bold mb-2">能力分析</p>
        ${abilityEntries.map(a=>`
          <div class="mb-2">
            <div class="flex justify-between text-xs mb-1"><span>${esc(a.name)}</span><span class="mono">${a.pct}%</span></div>
            <div class="torch-bar" style="background:rgba(0,0,0,.08)"><div style="width:${a.pct}%"></div></div>
          </div>
        `).join("")}
      </div>

      <div class="grid sm:grid-cols-2 gap-4 mb-4">
        <div class="bg-white/60 rounded-2xl p-4">
          <p class="text-sm font-bold mb-2">✓ 學習優勢</p>
          <ul class="text-xs text-gray-700 space-y-1">
            ${strongest.map(c=>`<li>✓ ${esc(c.name)}（${c.pct}%）</li>`).join("")}
          </ul>
        </div>
        <div class="bg-white/60 rounded-2xl p-4">
          <p class="text-sm font-bold mb-2">⚠ 待加強領域</p>
          <ul class="text-xs text-gray-700 space-y-1">
            ${weakest.map(c=>`<li>⚠ ${esc(c.name)}（${c.pct}%）</li>`).join("")}
          </ul>
        </div>
      </div>

      <div class="bg-[var(--bg-deep)] text-white rounded-2xl p-4 mb-6">
        <p class="text-sm font-bold mb-1">💡 學習建議</p>
        <p class="text-xs leading-relaxed opacity-90">
          建議重新複習「${esc(weakest[0]?.name || "")}」相關內容，
          並特別留意容易混淆的概念。掌握這些考點之後，你的學習就會更完整！
        </p>
      </div>

      <button onclick="restartAll()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl hover:brightness-110">
        🔄 重新挑戰全部
      </button>
    </div>
  `;
}

function restartAll(){
  state.screen = "home";
  state.currentLevelIdx = 0;
  state.currentQIdx = 0;
  state.selectedOption = null;
  state.levelResults = [null,null,null];
  state.levelAnswers = [{},{},{}];
  state.retryQueue = [];
  state.retryIdx = 0;
  state.inRetry = false;
  state.abilityStats = {};
  state.conceptStats = {};
  render();
}

function esc(str){
  const div = document.createElement("div");
  div.textContent = String(str ?? "");
  return div.innerHTML;
}

render();
</script>
</body>
</html>

const state = { screen: "home", currentLevelIdx: 0, currentQIdx: 0, selectedOption: null, levelResults: [null, null, null], levelAnswers: [{}, {}, {}], retryQueue: [], retryIdx: 0, inRetry: false, abilityStats: {}, conceptStats: {} };

const app = document.getElementById("app");

}
function selectOption(i){
  state.selectedOption = i;

function confirmAnswer(){
  if(state.selectedOption === null) return;
  const q = state.inRetry ? state.retryQueue[state.retryIdx] : currentQuestion();
  const isCorrect = state.selectedOption === q.answer;
  if(!state.inRetry){
    state.levelAnswers[state.currentLevelIdx][q.id] = state.selectedOption;
    const s = state.abilityStats[q.skill] || {correct:0,total:0}; s.total++; if(isCorrect) s.correct++; state.abilityStats[q.skill] = s;

  state.lastCorrect = isCorrect; state.screen = "feedback"; render();
}
function renderFeedback(){
  const q = state.inRetry ? state.retryQueue[state.retryIdx] : currentQuestion(), correct = state.lastCorrect;

  state.selectedOption = null;

  state.currentQIdx++;

}
function finishLevel(){
  const level = currentLevel(), answers = state.levelAnswers[state.currentLevelIdx];
  let correctCount = 0; const wrongQuestions = [];
  level.questions.forEach(q=>{ if(answers[q.id] === q.answer) correctCount++; else wrongQuestions.push(q); });

  state.levelResults[state.currentLevelIdx] = { score, correctCount, wrongCount: 10-correctCount, wrongQuestions, passed: score >= 60 };
  state.screen = "levelResult"; render();
}
function renderLevelResult(){
  const r = state.levelResults[state.currentLevelIdx], isLast = state.currentLevelIdx === 2;

      ${r.passed ? `<button onclick="${isLast ? "goFinal()" : "nextLevel()"}" class="w-full bg-[var(--bg-deep)] text-white font-bold py-3 rounded-xl">${isLast ? "查看學習診斷 📊" : "繼續挑戰下一關 🚀"}</button>` : `<button onclick="retryLevel()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl">重新挑戰這一關</button>`}
    </div>
  </div>`;
}
function startRetry(){ const r = state.levelResults[state.currentLevelIdx]; state.retryQueue = [...r.wrongQuestions]; state.retryIdx = 0; state.inRetry = true; state.screen = "retryIntro"; render(); }

function retryLevel(){ state.levelAnswers[state.currentLevelIdx] = {}; state.currentQIdx = 0; state.inRetry = false; state.screen = "quiz"; render(); }
function nextLevel(){ state.currentLevelIdx++; state.screen = "levelIntro"; render(); }
function goFinal(){ state.screen = "final"; render(); }
function renderFinal(){
  const totalScore = state.levelResults.reduce((a,r)=>a+r.score,0);
  app.innerHTML = `<div class="gate-card rounded-3xl p-8 fade-in text-center">
    <h2 class="text-2xl font-black mb-1">六號叔叔學習診斷</h2>
    <p class="text-5xl font-black my-3">${totalScore}<span class="text-lg text-gray-400"> /300</span></p>
    <button onclick="restartAll()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl">🔄 重新挑戰全部</button>
  </div>`;
}
function restartAll(){ state.screen = "home"; state.currentLevelIdx = 0; state.currentQIdx = 0; state.selectedOption = null; state.levelResults = [null,null,null]; state.levelAnswers = [{},{},{}]; state.retryQueue = []; state.retryIdx = 0; state.inRetry = false; state.abilityStats = {}; state.conceptStats = {}; render(); }

render();
</script>

發展，都市內的產業與服務逐漸向周邊鄉村地區擴散。下列哪一項屬於都市向鄉村擴散延伸的服務範疇？","theme":"都市產業延伸與服務擴散","explain":"正確答案為1。課本提到都市人口增長帶動醫療產業發展，如南投醫院等大型醫院會將服務延伸提供給周邊鄉村地區；選項0與3屬於鄉村發揮的農業與資源功能，選項2屬於鄉村利用原料與空間發展的食品加工業，均非都市向鄉村擴散的服務。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"宜蘭縣冬山鄉設有許多水產加工廠，專門製造魚鬆與魚肉罐頭。該地吸引食品加工業進駐的主要區位優勢是什麼？","options":["擁有全臺最密集的大專校院","設有高速鐵路車站方便外銷","鄰近南方澳漁港且取得漁獲方便","擁有一流的晶圓代工製造技術"],"answer":2,"explanation":"正確答案為1。課本明確說明宜蘭縣冬山鄉因為鄰近南方澳漁港、取得漁獲方便，加上鄉村原料豐富且空間廣闊，因而吸引水產加工廠進駐；選項0為科技園區特色，選項2為都市文教資源，選項3非冬山水產加工廠進駐的主因。","concept":"鄉村資源與食品加工進駐","skill":"概念理解","review":"core-2","evidence":"宜蘭縣冬山鄉鄰近南方澳漁港，取得漁獲方便，有許多水產加工廠在此設立","id":"q2","stem":"宜蘭縣冬山鄉設有許多水產加工廠，專門製造魚鬆與魚肉罐頭。該地吸引食品加工業進駐的主要區位優勢是什麼？","theme":"鄉村資源與食品加工進駐","explain":"正確答案為1。課本明確說明宜蘭縣冬山鄉因為鄰近南方澳漁港、取得漁獲方便，加上鄉村原料豐富且空間廣闊，因而吸引水產加工廠進駐；選項0為科技園區特色，選項2為都市文教資源，選項3非冬山水產加工廠進駐的主因。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"臺灣中、南部的農產品能及時送往北部消費市場（如臺北市第一果菜批發市場）銷售，主要仰賴哪一種交通運輸網絡？","options":["捷運地下鐵道","國內空中航線","澎湖輪海運","高速公路運輸"],"answer":3,"explanation":"正確答案為2。課本指出中南部的蔬果農產品主要是透過高速公路順暢運輸至北部市場；選項0主要用於本島與離島之間的人員往來，選項1為高雄與澎湖間的海運，選項3僅為都市內部的短程大眾運輸，均非南北農產大宗運送管道。","concept":"陸路運輸與農產品配送","skill":"概念理解","review":"core-3","evidence":"透過高速公路運輸，中、南部的農產品能送到北部銷售","id":"q3","stem":"臺灣中、南部的農產品能及時送往北部消費市場（如臺北市第一果菜批發市場）銷售，主要仰賴哪一種交通運輸網絡？","theme":"陸路運輸與農產品配送","explain":"正確答案為2。課本指出中南部的蔬果農產品主要是透過高速公路順暢運輸至北部市場；選項0主要用於本島與離島之間的人員往來，選項1為高雄與澎湖間的海運，選項3僅為都市內部的短程大眾運輸，均非南北農產大宗運送管道。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於臺灣高速鐵路的營運路線與服務功能，下列敘述何者完全符合課本事實？","options":["沿線僅經過都市而不經過任何鄉村","主要行駛於高雄與澎湖之間運送大宗貨物","主要功能是協助離島居民跨海就醫","路線在臺北南港與高雄左營之間穿梭"],"answer":3,"explanation":"正確答案為1。課本指出高鐵穿梭於臺北南港與高雄左營之間，使民眾能當日來回臺北與高雄；選項0與2為澎湖輪與離島空運的功能，選項3忽視了高鐵能促進沿線都市與鄉村居民互動的事實。","concept":"高鐵串聯一日生活圈","skill":"概念理解","review":"core-4","evidence":"高速鐵路在臺北南港與高雄左營間穿梭","id":"q4","stem":"關於臺灣高速鐵路的營運路線與服務功能，下列敘述何者完全符合課本事實？","theme":"高鐵串聯一日生活圈","explain":"正確答案為1。課本指出高鐵穿梭於臺北南港與高雄左營之間，使民眾能當日來回臺北與高雄；選項0與2為澎湖輪與離島空運的功能，選項3忽視了高鐵能促進沿線都市與鄉村居民互動的事實。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"穿梭於高雄與澎湖之間的「澎湖輪」，在離島與本島的交通連結中扮演什麼重要角色？","options":["是專門運送中南部蔬果至臺北市場的陸運工具","除了載客往返外，還能運送兩地的各式貨品","僅能載運觀光客，嚴禁載送貨品","行駛於臺北與金門之間的空中航線"],"answer":1,"explanation":"正確答案為1。課本載明澎湖輪除了載客往返高雄與澎湖，還具備運送兩地各式貨物的功能；選項0忽視了其載貨功能，選項2混淆了公路農產運輸，選項3錯把海運船舶當成空中航線。","concept":"離島空運與海運網絡","skill":"概念理解","review":"core-5","evidence":"行駛於高雄及澎湖間的澎湖輪，除了載客往返外，還能運送兩地的各式貨品","id":"q5","stem":"穿梭於高雄與澎湖之間的「澎湖輪」，在離島與本島的交通連結中扮演什麼重要角色？","theme":"離島空運與海運網絡","explain":"正確答案為1。課本載明澎湖輪除了載客往返高雄與澎湖，還具備運送兩地各式貨物的功能；選項0忽視了其載貨功能，選項2混淆了公路農產運輸，選項3錯把海運船舶當成空中航線。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"國道6號通車後，前往南投縣日月潭與清境農場的遊客行車路線發生了什麼變化？","options":["遊客大多改走國道6號，使行車時間大幅縮短","遊客必須先搭高鐵到高雄左營再轉乘省道","遊客強制改搭澎湖輪繞行海路","所有遊客都放棄開車改採步行前往"],"answer":0,"explanation":"正確答案為0。國道6號開通後相較於省道臺14線更為便捷，使遊客前往日月潭、清境的行車時間大幅縮短；選項1、2、3皆將陸路國道混淆為不相干的海運、遠繞路線或極端行為。","concept":"國道6號開通的雙重影響","skill":"概念理解","review":"core-6","evidence":"相較於臺14線，遊客大多選擇經由較便捷的國道6號前往南投縣","id":"q6","stem":"國道6號通車後，前往南投縣日月潭與清境農場的遊客行車路線發生了什麼變化？","theme":"國道6號開通的雙重影響","explain":"正確答案為0。國道6號開通後相較於省道臺14線更為便捷，使遊客前往日月潭、清境的行車時間大幅縮短；選項1、2、3皆將陸路國道混淆為不相干的海運、遠繞路線或極端行為。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"根據課本所述，鄉村或其他都市人口選擇移居到特定都市的主要拉力因素為何？","options":["都市擁有較多就業機會及教育資源","都市完全沒有工廠與商業活動","擁有較廣闊的農地可開墾","都市房價極度低廉且無任何交通負擔"],"answer":0,"explanation":"正確答案為1。課本指出都市因工業與服務業發達，具備較多就業機會及教育醫療資源，因而吸引人口移入；選項0為鄉村優勢，選項2與課本提及都市房價高、交通擁擠的現況相反，選項3與都市產業集中的事實不符。","concept":"都市與鄉村間的人口遷移","skill":"概念理解","review":"core-7","evidence":"有些都市因有較多就業機會及教育資源等優勢，吸引鄉村或其他都市人口移居","id":"q7","stem":"根據課本所述，鄉村或其他都市人口選擇移居到特定都市的主要拉力因素為何？","theme":"都市與鄉村間的人口遷移","explain":"正確答案為1。課本指出都市因工業與服務業發達，具備較多就業機會及教育醫療資源，因而吸引人口移入；選項0為鄉村優勢，選項2與課本提及都市房價高、交通擁擠的現況相反，選項3與都市產業集中的事實不符。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"在閱讀「民國112年臺北市人口遷出到其他縣市統計圖」時，圖中各縣市區塊面積的大小代表什麼意思？","options":["代表該縣市的大型醫院數量多寡","代表遷移至該縣市的人口數量多少","代表該縣市的高速公路總長度","代表該縣市在臺灣的地理土地真實面積"],"answer":1,"explanation":"正確答案為1。圖表下的關鍵思考明確說明，統計圖中面積愈大的縣市代表愈多人往該縣市遷移；選項0、2、3皆錯將遷移人口數量的圖例指標誤解為土地面積、醫院數或公路長度。","concept":"臺北市人口遷出讀圖分析","skill":"概念理解","review":"core-8","evidence":"圖中面積愈大的縣市，代表愈多人往該縣市遷移","id":"q8","stem":"在閱讀「民國112年臺北市人口遷出到其他縣市統計圖」時，圖中各縣市區塊面積的大小代表什麼意思？","theme":"臺北市人口遷出讀圖分析","explain":"正確答案為1。圖表下的關鍵思考明確說明，統計圖中面積愈大的縣市代表愈多人往該縣市遷移；選項0、2、3皆錯將遷移人口數量的圖例指標誤解為土地面積、醫院數或公路長度。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"臺南市、高雄市與屏東縣能夠形成跨縣市共同生活圈，最主要的客觀地理與交通條件是什麼？","options":["三縣市之間只能依靠國內空運往來","三縣市居民全部從事水產加工業","三縣市地理位置相近，並有高速公路與鐵路串聯","三縣市相距遙遠且完全沒有鐵路連接"],"answer":2,"explanation":"正確答案為1。課本敘述臺南、高雄與屏東因地理相近且有高速公路、鐵路串聯，使居民生活往來密切；選項0與事實相反，選項2過度簡化產業型態，選項3忽視了陸路交通網絡的作用。","concept":"跨縣市共同生活圈形成","skill":"概念理解","review":"core-9","evidence":"臺南市、高雄市與屏東縣因為地理位置相近，又有高速公路、鐵路等交通運輸串聯","id":"q9","stem":"臺南市、高雄市與屏東縣能夠形成跨縣市共同生活圈，最主要的客觀地理與交通條件是什麼？","theme":"跨縣市共同生活圈形成","explain":"正確答案為1。課本敘述臺南、高雄與屏東因地理相近且有高速公路、鐵路串聯，使居民生活往來密切；選項0與事實相反，選項2過度簡化產業型態，選項3忽視了陸路交通網絡的作用。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"臺中市能夠吸引許多人前往工作，並進一步帶動周邊餐飲與服務業發展，主要與該市哪種產業的密集發展有關？","options":["水產養殖與魚鬆加工業","有機稻米與高山茶種植","機械設備與五金製造等產業","離島觀光與船務運輸業"],"answer":2,"explanation":"正確答案為1。課本指出臺中市發展密集的機械設備與五金製造等產業吸引就業人口；選項0為宜蘭冬山鄉特色，選項2為鄉村農業，選項3為離島海運特色。","concept":"都市產業延伸與服務擴散","skill":"概念理解","review":"core-1","evidence":"臺中市有較密集的機械設備、五金製造等產業吸引人們到此工作","id":"q10","stem":"臺中市能夠吸引許多人前往工作，並進一步帶動周邊餐飲與服務業發展，主要與該市哪種產業的密集發展有關？","theme":"都市產業延伸與服務擴散","explain":"正確答案為1。課本指出臺中市發展密集的機械設備與五金製造等產業吸引就業人口；選項0為宜蘭冬山鄉特色，選項2為鄉村農業，選項3為離島海運特色。","reviewText":"核心 1","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 都市產業延伸與服務擴散","title":"都市產業延伸與服務擴散","bullets":["都市內店家、商辦大樓與廠房聚集，產業與服務會延伸至周邊鄉村","都市具備較密集的機械設備與五金製造等產業，吸引許多就業人口","人口增長帶動都市內的餐飲與醫療發展，並進一步將服務擴展至周邊鄉村","例如臺中市機械設備產業吸引就業，南投醫院等大型醫院提供周邊鄉村醫療服務"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 鄉村資源與食品加工進駐","title":"鄉村資源與食品加工進駐","bullets":["鄉村擁有豐富自然資源與廣闊空間，適合發展農漁牧業與觀光休閒","鄉村原料豐富且土地空間廣闊，容易吸引食品加工產業進駐","漁獲或農產品經工廠加工後，透過交通運輸配送銷售給都市與鄉村居民","例如宜蘭縣冬山鄉鄰近南方澳漁港，設立水產加工廠製造魚鬆與魚肉罐頭銷往各地"]},{"id":"core-3","type":"core","tag":"C 陸路運輸與農產品配送","title":"陸路運輸與農產品配送","bullets":["陸運包含高速公路與高速鐵路，有效拉近都市與鄉村的距離","中南部的農業生產區需要將蔬果鮮食快速運送到北部消費市場","經由高速公路網絡順暢運輸，產品得以及時供應北部都市居民生活所需","例如中南部農產品透過高速公路運抵臺北市第一果菜批發市場銷售"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 高鐵串聯一日生活圈","title":"高鐵串聯一日生活圈","bullets":["高速鐵路提供高速陸上客運服務，大幅縮短城鄉間的乘車時間","因應南北商務交流、跨區工作與休閒往來的頻繁需求","列車穿梭於臺北南港與高雄左營之間，使遠距離移動更為便捷","民眾可以搭乘高鐵實現當日往返臺北與高雄，促進沿線城鄉居民互動"]},{"id":"core-5","type":"core","tag":"E 離島空運與海運網絡","title":"離島空運與海運網絡","bullets":["國內空運與海運（如澎湖輪）負責本島都市與離島鄉村之間的交通聯繫","離島受海洋阻隔，需要仰賴航空與航運維持與本島的人貨往來","空中航線以客運為主，海運船舶則具備載客與載運各式大宗貨品的功能","臺北與澎湖、金門間開立國內空運航線，高雄與澎湖間由澎湖輪載客運貨"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 國道6號開通的雙重影響","title":"國道6號開通的雙重影響","bullets":["交通建設開通能縮短行車時間，但也會帶來經濟效益與環境負擔的不同影響","國道6號開通後大幅縮短臺中前往南投日月潭、清境農場的行車時間","遊客增加帶動山上民宿生意，但同時垃圾量增加使環境髒亂","沿臺14線草屯舊路停留用餐購物遊客減少，使舊路店家生意受影響"]},{"id":"core-7","type":"core","tag":"G 都市與鄉村間的人口遷移","title":"都市與鄉村間的人口遷移","bullets":["受產業發展與交通影響，都市與鄉村間出現移入與遷出的雙向人口遷移","都市因就業機會多、教育醫療資源密集吸引人口移居；居民亦因房價高、交通擁擠遷出","人口遷移並非單向流入都市，交通串聯讓住家與工作不在同一縣市成為可能","民國112年臺北市人口遷出統計顯示有74,000人遷往其他縣市"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 臺北市人口遷出讀圖分析","title":"臺北市人口遷出讀圖分析","bullets":["內政部統計圖表以區塊面積大小表示遷出人口數量的多少","臺北市人口因生活成本與居住需求，選擇遷往周邊或鄰近縣市","圖中新北市區塊面積最大（46,741人），其次為桃園市（8,382人）與臺中市（3,413人）","呈現鄰近縣市與交通便捷度對都市人口移居選擇的顯著影響"]},{"id":"core-9","type":"core","tag":"I 跨縣市共同生活圈形成","title":"跨縣市共同生活圈形成","bullets":["都市與附近地區在居住、工作、教育、醫療、休閒上互相滿足，形成共同生活圈","臺南市、高雄市與屏東縣地理位置相近，並有國道與鐵路交通串聯","居民每日跨縣市通勤上班求學，遇到天然災害時政府會同步協調應變","例如高雄路竹居民到臺南歸仁上班、屏東居民到高雄鳳山上學，颱風時南高屏同步停班停課"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"都市能夠完全自給自足，不需要依賴鄉村提供農產品與資源。","right":"都市與鄉村的產業互相依賴，鄉村為都市提供農漁牧產品、原料與自然休閒資源。 課文強調城鄉互補，都市雖有密集的商業與醫療服務，但所需食材與農產原料仍需由鄉村供應與配送。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"交通建設開通後，沿線所有城鄉地區與店家都會獲得相同的經濟效益。","right":"交通建設帶來利益不一定平均，可能帶動新景點發達，卻使舊路線店家因遊客減少而生意變差。 國道6號開通使日月潭與清境民宿受益，但原本臺14線草屯沿線的店家卻因停留遊客變少而受損。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"人口移動永遠是單向從鄉村流入都市，都市人口只增不減。","right":"人口遷移是雙向的，雖然都市吸引人口移入，但也有都市居民因房價高、交通擁擠遷往周邊縣市。 民國112年統計顯示臺北市有74,000人遷出至新北市、桃園市等周邊地區。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"澎湖輪行駛於高雄與澎湖之間，只負責載運觀光客，不能運送貨物。","right":"澎湖輪除了載客往返外，還兼具運送高雄與澎湖兩地各式貨品的功能。 課本課文與圖片明確說明澎湖輪同時服務人員搭乘與雙向貨物運輸。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"南高屏（臺南、高雄、屏東）同步停班停課是因為宗教信仰或娛樂活動相同。","right":"南高屏同步停班停課是因為三縣市地理相近、交通串聯，居民跨區工作求學往來密切，已形成共同生活圈。 跨縣市共同生活圈內居民日常活動高度重疊，防災政策需要一致協調才能保障居民權益。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"讀人口遷移統計圖時，圖中縣市的區塊面積代表該縣市的土地真實面積。","right":"統計圖中的區塊面積代表『遷移至該縣市的人口數量多少』，非土地地理面積。 圖中新北市面積最大是因為遷入人口最多（46,741人），不能誤解為土地地理大小。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"產業互相依賴｜知識關係","chain":["都市服務業與工業高度聚集","都市將餐飲、醫療與購物服務拓展至鄉村","鄉村提供糧食原料並吸引食品加工與觀光"]},{"id":"logic-2","type":"chain","title":"交通網絡串聯城鄉｜知識關係","chain":["陸海空多元運輸拉近城鄉距離與交流時間","高鐵一日往返與國道運送農產品至北部市場","交通開通帶來觀光收益但也增加鄉村環境負擔"]},{"id":"logic-3","type":"chain","title":"人口遷移現象｜知識關係","chain":["都市就業與教育資源吸引人口移入","都市房價高與交通擁擠促使居民遷出周邊","統計顯示臺北人口遷出以鄰近的新北市最多"]},{"id":"logic-4","type":"chain","title":"跨縣市共同生活圈｜知識關係","chain":["地理位置相近與交通運輸串聯生活範圍","居民每日跨區上班求學與就醫購物","南高屏因生活往來密切而同步協調停班停課"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜城鄉交通運輸方式與功能對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜國道6號開通前後對南投沿線影響對照流程圖","breakBefore":true}]},{"id":"compare","nav":"概念 ch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>人口遷移現象\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>都市就業與教育資源吸引人口移入\u003c/p>\u003cp>\u003cb>關係：\u003c/b>都市房價高與交通擁擠促使居民遷出周邊\u003c/p>\u003cp>\u003cb>結果：\u003c/b>統計顯示臺北人口遷出以鄰近的新北市最多\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>跨縣市共同生活圈\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>地理位置相近與交通運輸串聯生活範圍\u003c/p>\u003cp>\u003cb>關係：\u003c/b>居民每日跨區上班求學與就醫購物\u003c/p>\u003cp>\u003cb>結果：\u003c/b>南高屏因生活往來密切而同步協調停班停課\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>都市與鄉村為什麼會互動交流？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">運輸方式\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">代表路線與範例\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">城鄉互動意義與影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>運輸方式\u003c/th>\u003cth>代表路線與範例\u003c/th>\u003cth>城鄉互動意義與影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>陸運（公路）\u003c/td>\u003ctd>中南部農產品經高速公路運至臺北第一果菜批發市場\u003c/td>\u003ctd>快速輸送新鮮蔬果，滿足北部都市飲食需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>陸運（鐵路）\u003c/td>\u003ctd>高速鐵路穿梭於臺北南港與高雄左營之間\u003c/td>\u003ctd>大幅縮短南北行車時間，實現當日來回商務與觀光\u003c/td>\u003c/tr>\u003ctr>\u003ctd>空運（航空）\u003c/td>\u003ctd>臺北與澎湖、金門之間的國內空中航線\u003c/td>\u003ctd>跨越海洋障礙，迅速連結臺灣本島都市與離島鄉村\u003c/td>\u003c/tr>\u003ctr>\u003ctd>海運（航運）\u003c/td>\u003ctd>行駛於高雄與澎湖之間的澎湖輪\u003c/td>\u003ctd>提供雙向客運搭乘，並運送兩地各式大宗生活貨品\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先看運輸方式類別，再對照代表路線與具體範例，最後理解其對城鄉互動的意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論海運只能載貨不能載客，或認為所有農產品都必須經由空運輸送。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>若中南部農夫欲將大量新鮮蔬菜當天運往臺北市銷售，最主要仰賴哪一種交通方式？理由為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>仰賴陸運的高速公路。因為高速公路能連接中南部農業區與北部都市市場，進行快速便利的大宗貨運配送。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">交通狀況與行車路線\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對城鄉經濟與環境之影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>交通狀況與行車路線\u003c/th>\u003cth>對城鄉經濟與環境之影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>開通前\u003c/td>\u003ctd>遊客多利用省道臺14線前往南投山區景點\u003c/td>\u003ctd>遊客中途於草屯休息用餐購物，帶動舊路沿線店家生意\u003c/td>\u003c/tr>\u003ctr>\u003ctd>路線變更\u003c/td>\u003ctd>國道6號開通，臺中至日月潭與清境行車時間大幅縮短\u003c/td>\u003ctd>多數遊客改走便捷的國道6號，不再繞經臺14線草屯舊路\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正面影響\u003c/td>\u003ctd>方便臺中與南投山區一日來回旅遊，提高旅遊意願\u003c/td>\u003ctd>南投山上景點遊客大增，帶動當地民宿與餐飲業生意\u003c/td>\u003c/tr>\u003ctr>\u003ctd>負面影響與代價\u003c/td>\u003ctd>過多遊客湧入山區景點，造成假日塞車與環境負擔\u003c/td>\u003ctd>景點垃圾量顯著增加，且草屯舊路店家因停留遊客少而生意變差\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間順序從開通前到開通後，比較交通路線改變對不同地點（新景點 vs 舊路線）的經濟與環境影響。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論交通建設開通後所有沿線居民都一定賺錢受惠，也不能推論舊路店家生意會更好。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>為什麼國道6號開通後，草屯地區店家的生意反而會變差？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>因為國道6號開通後大幅縮短行車時間，多數遊客直接走國道6號前往日月潭等景點，不再經由臺14線在草屯停留休息與消費。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u function cardHTML(c){let content='';const tag=c.tag?`<div class="tag">${esc(c.tag)}</div>`:'';let heading=`<h3>${esc(c.title)}</h3>`;

function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}
function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

const clozePlan={"core-1":{"selector":".point","terms":["延伸至周邊鄉村"]},"core-2":{"selector":".point","terms":["水產加工廠"]},"core-3":{"selector":".point","terms":["高速公路"]},"core-4":{"selector":".point","terms":["當日往返臺北與高雄"]},"core-5":{"selector":".point","terms":["澎湖輪"]},"core-6":{"selector":".point","terms":["停留用餐購物遊客減少"]},"core-7":{"selector":".point","terms":["房價高、交通擁擠"]},"core-8":{"selector":".point","terms":["新北市"]},"core-9":{"selector":".point","terms":["同步停班停課"]},"mindmap-overview":{"selector":".mind-branch p","terms":["食品加工","環境負擔","新北市","生活往來密切"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["房價高、交通擁擠"]},"trap-4":{"selector":".correct","terms":["澎湖輪"]},"trap-5":{"selector":".correct","terms":["同步停班停課"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["城鄉互動","產業依賴","水產加工廠","高速鐵路","澎湖輪","國道6號","人口遷移","人口遷移統計圖","共同生活圈","同步停班停課"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林6上3-3 生物科技為什麼需要規範管理？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-3","title":"生物科技為什麼需要規範管理？"},"questions":[{"question":"農業上運用基因改造技術的主要目的為何？","options":["改變農作物顏色以增加觀賞價值","完全替代肥料以降低農作成本","使農作物具備抗病蟲害特性以減少農藥使用","讓農作物能一年四季不需水源生長"],"answer":2,"explanation":"課本指出科學家透過基因改造技術讓農作物具備抗病蟲害特性，減少農藥使用，穩定農作物生產。","concept":"基因改造與農業應用","skill":"概念理解","review":"core-1","evidence":"現在，科學家透過基因改造技術，讓農作物具備抗病蟲害的特性，減少農藥使用，穩定農作物的生產。","id":"q1","stem":"農業上運用基因改造技術的主要目的為何？","theme":"基因改造與農業應用","explain":"課本指出科學家透過基因改造技術讓農作物具備抗病蟲害特性，減少農藥使用，穩定農作物生產。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"政府規定業者必須在豆腐或玉米罐頭包裝上清楚標示是否使用基改原料，最主要的目的為何？","options":["提高基因改造食品的市場銷售價格","強制要求所有民眾只購買非基因改造食品","證明基因改造食品絕對對人體有害","保障消費者知情權，讓民眾能做出安心合適的選擇"],"answer":3,"explanation":"課本說明政府規定基因改造食品必須清楚標示，係為了讓民眾在選購時獲得完整資訊，做出較安心、合適的選擇。","concept":"基改食品標示之目的","skill":"概念理解","review":"core-2","evidence":"規定基因改造食品必須清楚標示，讓民眾在選購時能獲得完整資訊，做出較安心、合適的選擇。","id":"q2","stem":"政府規定業者必須在豆腐或玉米罐頭包裝上清楚標示是否使用基改原料，最主要的目的為何？","theme":"基改食品標示之目的","explain":"課本說明政府規定基因改造食品必須清楚標示，係為了讓民眾在選購時獲得完整資訊，做出較安心、合適的選擇。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"當新興生物科技引發食品安全疑慮時，民間團體通常透過何種方式促使政府與社會重視？","options":["走上街頭爭取權益，要求重視基改食品安全","發動全民全面拒絕購買所有加工食品","要求政府直接廢除所有生物科技研究","私自前往食品工廠銷毀所有基改原料"],"answer":0,"explanation":"課本提及民間團體走上街頭爭取權益，要求重視基改食品安全，促使政府隨後制定法律規範業者。","concept":"民間團體與食安訴求","skill":"概念理解","review":"core-3","evidence":"像是民間團體走上街頭爭取權益，要求重視基改食品安全；政府隨後制定法律。","id":"q3","stem":"當新興生物科技引發食品安全疑慮時，民間團體通常透過何種方式促使政府與社會重視？","theme":"民間團體與食安訴求","explain":"課本提及民間團體走上街頭爭取權益，要求重視基改食品安全，促使政府隨後制定法律規範業者。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於流感疫苗對人體健康的作用，下列敘述何者正確？","options":["接種後能保證終生絕對不會感染任何感冒","能幫助身體建立對特定病毒的抵抗力，降低重症與死亡風險","能完全替代洗手與戴口罩等個人日常衛生習慣","接種疫苗後可以在染病時立刻完全消除所有疼痛"],"answer":1,"explanation":"課本指出施打流感疫苗能幫助身體產生抵抗力與免疫力，降低重症與死亡風險。","concept":"疫苗作用與免疫力","skill":"概念理解","review":"core-4","evidence":"民眾接種疫苗後，有助於提升身體免疫力，降低感染的風險。","id":"q4","stem":"關於流感疫苗對人體健康的作用，下列敘述何者正確？","theme":"疫苗作用與免疫力","explain":"課本指出施打流感疫苗能幫助身體產生抵抗力與免疫力，降低重症與死亡風險。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"為了確保疫苗施打的安全，主管機關在疫苗製造或販售前必須執行何種程序？","options":["直接強制所有國民集體進行施打測試","只要民眾聯署簽名即可不經審查直接製造","僅需由藥廠自行在網路公告即可上市銷售","必須經過長時間的試驗與嚴格審查並經主管機關許可"],"answer":3,"explanation":"課本說明疫苗在正式使用前，研發團隊與主管機關必須經過長時間的試驗與審查，經許可後才可製造販售。","concept":"疫苗安全審查機制","skill":"概念理解","review":"core-5","evidence":"在正式使用前，研發團隊與主管機關必須經過長時間的試驗與審查，確保疫苗的安全與效果。","id":"q5","stem":"為了確保疫苗施打的安全，主管機關在疫苗製造或販售前必須執行何種程序？","theme":"疫苗安全審查機制","explain":"課本說明疫苗在正式使用前，研發團隊與主管機關必須經過長時間的試驗與審查，經許可後才可製造販售。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"政府在推動疫苗接種宣導時，對於民眾的施打決策採取何種態度與原則？","options":["強制規定全體國民皆必須施打，違反者予以罰款","宣導接種好處，並尊重民眾依個人體質與需求所做的自主選擇","規定未施打疫苗者不得搭乘任何大眾運輸工具","禁止擔心副作用的民眾採取其他任何防疫措施"],"answer":1,"explanation":"課本強調疫苗能增進抵抗力但並非強制接種，民眾可依身體狀況與家人討論決定，社會應尊重個人選擇。","concept":"多元防疫與自主選擇","skill":"概念理解","review":"core-6","evidence":"同時，每個人都應落實健康自主管理，保護自己，也守護他人的健康。","id":"q6","stem":"政府在推動疫苗接種宣導時，對於民眾的施打決策採取何種態度與原則？","theme":"多元防疫與自主選擇","explain":"課本強調疫苗能增進抵抗力但並非強制接種，民眾可依身體狀況與家人討論決定，社會應尊重個人選擇。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"科學家將生物複製技術應用於生態保育的具體實例為何？","options":["複製野生黃豆以替代傳統農業種植","複製流感病毒以直接製作成殺菌劑","複製大量昆蟲以完全取代化學農藥","利用冷凍細胞複製瀕臨絕種的黑足雪貂以協助族群擴大"],"answer":3,"explanation":"課本介紹科學家利用30多年前冷凍的細胞成功複製瀕臨絕種的黑足雪貂，協助物種保育與族群擴大。","concept":"生物複製與物種保育","skill":"概念理解","review":"core-7","evidence":"科學家嘗試複製瀕臨絕種的動物，希望協助物種保育。","id":"q7","stem":"科學家將生物複製技術應用於生態保育的具體實例為何？","theme":"生物複製與物種保育","explain":"課本介紹科學家利用30多年前冷凍的細胞成功複製瀕臨絕種的黑足雪貂，協助物種保育與族群擴大。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"生物複製技術在發展過程中所面臨的健康與倫理挑戰，下列何者正確？","options":["複製技術能將過往逝去生命的記憶100%完全還原","複製動物完全不會產生任何疾病或健康風險","可能面臨複製失敗、健康風險歸屬及生命被商品化等爭議","生物複製技術已經獲得全球無異議的完全支持"],"answer":2,"explanation":"課本指出生物複製若過程失敗或出現健康問題，風險歸屬難以認定，且面臨生命被量產商品化的倫理爭議。","concept":"生物複製之風險與倫理","skill":"概念理解","review":"core-8","evidence":"如果複製過程失敗，或出現健康問題，風險該由誰承擔？生命會不會變成可以被挑選，甚至量產的商品？","id":"q8","stem":"生物複製技術在發展過程中所面臨的健康與倫理挑戰，下列何者正確？","theme":"生物複製之風險與倫理","explain":"課本指出生物複製若過程失敗或出現健康問題，風險歸屬難以認定，且面臨生命被量產商品化的倫理爭議。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"在探究複製過世寵物議題時，課本建議使用何種思考工具來整理正反面影響？","options":["地理等高線圖","圓形比例圖","T表整理法","氣溫折線圖"],"answer":2,"explanation":"課本「探究社會有絕招」單元明確指出，可以使用T表來整理生物複製技術帶來的正面與反面影響。","concept":"T表探究工具之應用","skill":"概念理解","review":"core-9","evidence":"我們想探究生物複製技術，有可能產生什麼影響？我們可以使用T表來整理資料。","id":"q9","stem":"在探究複製過世寵物議題時，課本建議使用何種思考工具來整理正反面影響？","theme":"T表探究工具之應用","explain":"課本「探究社會有絕招」單元明確指出，可以使用T表來整理生物複製技術帶來的正面與反面影響。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"日常生活中常見的包裝豆腐貼有「非基因改造黃豆」標示，這代表何種意義？","options":["該食品食後保證終生不會患有任何疾病","政府強制規定所有豆腐都不得進行販售","該產品原料並未經過基因改造技術處理","該產品絕對不含有任何蛋白質成分"],"answer":2,"explanation":"「非基因改造」標示代表該產品使用的原料（如黃豆）未經過基因改造技術，提供消費者明確的產品資訊。","concept":"食品標示意義","skill":"概念理解","review":"core-2","evidence":"清楚標示是否使用基因改造原料。","id":"q10","stem":"日常生活中常見的包裝豆腐貼有「非基因改造黃豆」標示，這代表何種意義？","theme":"食品標示意義","explain":"「非基因改造」標示代表該產品使用的原料（如黃豆）未經過基因改造技術，提供消費者明確的產品資訊。","reviewText":"核心 2","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 生物科技應用與農業發展","title":"生物科技應用與農業發展","bullets":["科學家將生物科技運用於食品基因改造、疫苗研發與生物複製等領域。","過去農民噴灑大量農藥對抗病蟲害，容易造成環境污染與農藥殘留。","運用基因改造技術讓農作物具備抗病蟲害特質，從源頭減少農藥使用。","有助於穩定農作物生產量，玉米與黃豆是常見的基因改造作物。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 基因改造食品疑慮與法規標示","title":"基因改造食品疑慮與法規標示","bullets":["基因改造技術改變農業生產，但也引發對人體健康的懷疑與疑慮。","日常生活中豆腐、玉米罐頭等食品，其原料可能來自基因改造農產品。","政府制定相關法規進行食品安全檢驗，並規定基因改造食品必須清楚標示。","清楚標示能提供完整食品資訊，保障消費者知情權並做出合適安心選擇。"]},{"id":"core-3","type":"core","tag":"C 社會爭議與公信把關","title":"社會爭議與公信把關","bullets":["當新興科技引發健康或食安疑慮時，民間團體可走上街頭爭取權益。","要求政府重視基因改造食品安全，推動制度與法律的完善。","政府制定法規強制業者標示原料，民眾購買前細心閱讀標示。","展現法規把關與個人知情選擇並重，共同維護現代食品安全。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 醫療疫苗研發與免疫力提升","title":"醫療疫苗研發與免疫力提升","bullets":["傳染病與疾病威脅人類生命健康，生物科技應用於疫苗與藥物研發。","流行性感冒傳播迅速且症狀嚴重，對長者與幼童威脅極高甚至可能致命。","民眾接種疫苗後能幫助身體產生抵抗力與免疫力，降低感染與死亡風險。","施打疫苗成為守護健康的重要屏障，有效減緩疾病傳播風險。"]},{"id":"core-5","type":"core","tag":"E 政府對疫苗安全之嚴格審查管理","title":"政府對疫苗安全之嚴格審查管理","bullets":["疫苗正式使用前，研發團隊與主管機關須經過長時間試驗與審查。","若缺乏嚴格管理規範，容易引發民眾對疫苗安全性與施打政策的疑慮。","政府規定疫苗須經主管機關許可才能製造販售，並清楚公告施打資訊。","公告內容包含適用年齡、施打對象、接種劑量及可能產生的副作用。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 健康自主管理與多元防疫選擇","title":"健康自主管理與多元防疫選擇","bullets":["政府向民眾宣導接種疫苗，民眾可與家人討論並依身體狀況決定。","疫苗雖能增進抵抗力，但並非強制接種，需尊重他人的自主選擇。","若擔心副作用選擇不打疫苗，可透過勤洗手、戴口罩及維持正常作息預防。","每個人落實健康自主管理，保護自己也守護他人的健康。"]},{"id":"core-7","type":"core","tag":"G 生物複製技術之應用與保育","title":"生物複製技術之應用與保育","bullets":["隨著生物科技突破，生物複製技術成為社會關注的焦點領域。","美國原生黑足雪貂曾因棲息地遭破壞而瀕臨絕種，甚至一度被認為絕種。","科學家利用30多年前冷凍的細胞成功複製，協助物種保育與族群擴大。","生物科技公司亦提供複製寵物服務，以滿足部分飼主的需求。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 生物複製之健康風險與倫理挑戰","title":"生物複製之健康風險與倫理挑戰","bullets":["生物複製技術在發展同時，也面臨社會不同看法的倫理與健康挑戰。","若複製過程失敗或複製動物出現健康問題，其風險歸屬與責任難以認定。","社會擔心生命可能變成可以被挑選、甚至量產商品化的倫理爭議。","政府必須即時更新法令規範，社會大眾應持續思考生命價值並做負責選擇。"]},{"id":"core-9","type":"core","tag":"I 探究社會議題：T表整理複製寵物影響","title":"探究社會議題：T表整理複製寵物影響","bullets":["探究複製過世寵物議題時，可善用T表整理資料並分類正反面影響。","正面影響包含讓傷心家人再次有陪伴，或優良品種持續保存。","反面影響包含花費高昂、可能減少流浪動物領養機會，以及潛在疾病風險。","複製出來的新個體並非原本那隻寵物，人們應珍惜現有事物並尊重生命。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"基因改造食品因為可能引發健康疑慮，政府已經全面立法禁止在市場上販售。","right":"政府並未禁止販售基因改造食品，而是進行食安檢驗，並強制規定必須清楚標示。 標示是為了提供完整食品資訊、保障消費者知情權與選擇權，並非危險宣判或禁售。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"只要標明「非基因改造」的食品，就代表完全不含化學添加物且絕對零風險。","right":"「非基因改造」僅說明原料非基改，不等於零風險或無化學添加物。 不可將「非基改標示」無限擴大解讀為全方位的健康無害保證。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"政府為了群體免疫，強制規定所有國民都必須接種流感疫苗，不得拒絕。","right":"疫苗接種並非強制，民眾可與家人討論後依身體狀況與需求自主決定。 課本強調疫苗宣導不等於強制施打，並應尊重他人不施打的自主選擇。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"只要勤洗手、戴口罩與維持正常作息，就能完全替代疫苗發揮相同免疫抗體功能。","right":"衛生習慣與疫苗能互相輔助防護，但衛生習慣無法直接使身體產生特異性抵抗力與抗體。 日常衛生是良好預防措施，但不能宣稱兩者效果完全等同或可完全互相取代。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"利用生物複製技術複製過世的寵物，可以讓寵物完全復活並帶回原有的記憶。","right":"生物複製產生的新個體具備相似基因，但並非原本那隻寵物，也不會帶有過去的記憶。 生命具備獨特性，複製技術無法複製個體過去的生活經歷與記憶。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"美國黑足雪貂能從18隻增加到650隻，完全只靠生物複製技術，不需其他保育措施。","right":"物種保育除了生物複製外，仍需要棲息地保護、環境復育與長期照顧等綜合措施。 單一科技無法解決所有生態問題，不能把棲地保護等全套保育成果全歸功於複製技術。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"農業與食品之基因改造｜知識關係","chain":["過去農藥殘留與環境污染","基因改造使作物具備天然抗病蟲害特質","穩定農作物生產量但引發健康疑慮，政府強制清楚標示"]},{"id":"logic-2","type":"chain","title":"醫療與疫苗研發管理｜知識關係","chain":["傳染病威脅人類生命健康與安全","主管機關進行長時間試驗與審查，公告劑量與副作用","提升身體免疫力降低風險，尊重個人自主選擇"]},{"id":"logic-3","type":"chain","title":"生物複製與倫理考量｜知識關係","chain":["突破技術應用於瀕危物種保育與寵物服務","過程可能失敗或生病，面臨生命商品化與風險歸屬","政府即時更新法令規範，大眾思考生命價值"]},{"id":"logic-4","type":"chain","title":"社會參與與議題探究｜知識關係","chain":["民間團體走上街頭要求重視食品安全","運用T表整理與分析複製技術之正面與反面影響","兼顧法規把關、個人知情選擇與落實健康自主管理"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜基因改造食品之社會因應與把關流程圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜生物複製技術應用於複製寵物之T表影響判讀圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["基因改造技術","生物複製技術","基因改造係透過改變生物體的特定基因性狀（如抗病蟲害），用於穩定農作物生產；生物複製係利用細胞複製出具備相同基因的生命個體，用於瀕危物種保育或複製寵物。"],["疫苗研發試驗與審查","疫苗資訊公告與宣導","疫苗試驗與審查係政府主管機關與團隊在上市前對安全與效果進行長時間把關；資訊公告與宣導係政府對施打對象、年齡、劑量及副作用進行公開透明告知，鼓勵民眾自主評估。"],["接種疫苗防護","日常衛生自主管理（勤洗手、戴口罩）","接種疫苗係透過生物科技提升身體免疫力與抵抗力，降低感染與重症風險；日常衛生自主管理係透過良好的個人衛生習慣減少接觸病毒的機會，兩者互相輔助。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","生物科技","利用生物體或其系統進行研究與應用之科技，涵蓋食品基因改造、疫苗研發與生物複製等領域。"],["2","基因改造","透過科技改變生物的基因，使其具備特定性狀（如抗病蟲害），以減少農藥使用並穩定農作物生產。"],["3","基改食品標示","政府規定業者必須在產品包裝上清楚標明是否使用基因改造原料，以保障消費者知情權與選擇權。"],["4","免疫力","人體抵抗特殊疾病、微生物或毒素侵襲的能力，可透過接種疫苗提升。"],["5","疫苗試驗與審查","疫苗正式使用前，由研發團隊與政府主管機關進行的長時間安全性與效果評估過程。"],["6","疫苗副作用公告","主管機關依規定公開疫苗可能引發之不良反應與注意事項，讓民眾在施打前充分知情。"],["7","健康自主管理","個人透過與家人討論、了解自身體質、落實勤洗手戴口罩與正常作息，主動維護健康的行為。"],["8","生物複製","利用細胞技術複製出基因相同之生物個體的科技，應用於物種保育與複製寵物等領域。"],["9","黑足雪貂","美國原生雪貂，曾因棲地遭破壞而瀕臨絕種，科學家利用冷凍細胞與複製技術協助擴大其族群。"],["10","T表探究法","劃分為正面影響與反面影響兩欄之表格，用於整理分析新興科技議題之正反觀點與理由。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"農業防護方式比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「過去農業噴灑農藥」與「現代作物基因改造」，兩者在對抗病蟲害上的主要差異為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"基改標示之因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"關於「基因改造食品標示」的因果關係，下列推論何者最符合課本觀念？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"疫苗資訊透明之因果","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"主管機關強制要求公告疫苗「適用年齡、接種劑量與副作用」的直接因果影響為何？"}]}],"cloze":{"core-1":{"selector":".point","terms":["抗病蟲害"]},"core-2":{"selector":".point","terms":["清楚標示"]},"core-3":{"selector":".point","terms":["法規把關"]},"core-4":{"selector":".point","terms":["抵抗力與免疫力"]},"core-5":{"selector":".point","terms":["試驗與審查"]},"core-6":{"selector":".point","terms":["健康自主管理"]},"core-7":{"selector":".point","terms":["物種保育"]},"core-8":{"selector":".point","terms":["更新法令規範"]},"core-9":{"selector":".point","terms":["T表"]},"mindmap-overview":{"selector":".mind-branch p","terms":["天然抗病蟲害特質","試驗與審查","生命商品化","T表整理"]},"trap-1":{"selector":".correct","terms":["清楚標示"]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["物種保育"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["生物科技","基因改造","基改食品標示","免疫力","疫苗試驗與審查","疫苗副作用公告","健康自主管理","生物複製","黑足雪貂","T表探究法"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>農業與食品之基因改造\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>過去農藥殘留與環境污染\u003c/p>\u003cp>\u003cb>關係：\u003c/b>基因改造使作物具備天然抗病蟲害特質\u003c/p>\u003cp>\u003cb>結果：\u003c/b>穩定農作物生產量但引發健康疑慮，政府強制清楚標示\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>醫療與疫苗研發管理\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>傳染病威脅人類生命健康與安全\u003c/p>\u003cp>\u003cb>關係：\u003c/b>主管機關進行長時間試驗與審查，公告劑量與副作用\u003c/p>\u003cp>\u003cb>結果：\u003c/b>提升身體免疫力降低風險，尊重個人自主選擇\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>生物複製與倫理考量\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>突破技術應用於瀕危物種保育與寵物服務\u003c/p>\u003cp>\u003cb>關係：\u003c/b>過程可能失敗或生病，面臨生命商品化與風險歸屬\u003c/p>\u003cp>\u003cb>結果：\u003c/b>政府即時更新法令規範，大眾思考生命價值\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>社會參與與議題探究\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>民間團體走上街頭要求重視食品安全\u003c/p>\u003cp>\u003cb>關係：\u003c/b>運用T表整理與分析複製技術之正面與反面影響\u003c/p>\u003cp>\u003cb>結果：\u003c/b>兼顧法規把關、個人知情選擇與落實健康自主管理\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>生物科技為什麼需要規範管理？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">角色與面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體行動與措施\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">核心意義與目的\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>角色與面向\u003c/th>\u003cth>具體行動與措施\u003c/th>\u003cth>核心意義與目的\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>民間團體\u003c/td>\u003ctd>走上街頭表達訴求，要求重視基改食品安全\u003c/td>\u003ctd>促使政府與社會關注新興科技帶來的健康與食安疑慮\u003c/td>\u003c/tr>\u003ctr>\u003ctd>立法機關\u003c/td>\u003ctd>制定相關法律，強制要求業者清楚標示原料\u003c/td>\u003ctd>建構法規把關機制，規範業者公開完整食品資訊\u003c/td>\u003c/tr>\u003ctr>\u003ctd>食品業者\u003c/td>\u003ctd>依法在豆腐、玉米罐頭等包裝上清楚標示是否基改\u003c/td>\u003ctd>落實誠實標示責任，提供透明可查的商品資訊\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般民眾\u003c/td>\u003ctd>購買食品前仔細閱讀標示，並關心相關食安新聞\u003c/td>\u003ctd>發揮知情選擇權，依個人意願做出安心、合適的選擇\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依據「民間團體訴求➔立法機關建制➔業者誠實標示➔民眾知情選擇」的社會互動順序進行判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論標示為基因改造的食品就必然對人體有害，標示係提供資訊而非危險宣判。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，政府強制要求業者在豆腐包裝上標示「非基因改造黃豆」的主要法律目的為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>目的在於提供完整透明的食品資訊，保障消費者的知情權與選擇權，讓民眾能做出安心合適的選擇。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">影響類別\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體事項與衝擊\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">背後考量與省思\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>影響類別\u003c/th>\u003cth>具體事項與衝擊\u003c/th>\u003cth>背後考量與省思\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>正面影響（陪伴）\u003c/td>\u003ctd>複製過世寵物，讓傷心的家人再次有相似寵物陪伴\u003c/td>\u003ctd>滿足部分飼主情感需求與寄託\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正面影響（保存）\u003c/td>\u003ctd>若寵物為優良品種，可透過複製技術持續保存特徵\u003c/td>\u003ctd>技術層面保存優良基因特質\u003c/td>\u003c/tr>\u003ctr>\u003ctd>反面影響（經濟與領養）\u003c/td>\u003ctd>技術花費昂貴，且可能減少流浪動物被領養的機會\u003c/td>\u003ctd>資源分配不均，影響流浪動物權益與領養機會\u003c/td>\u003c/tr>\u003ctr>\u003ctd>反面影響（健康與生態）\u003c/td>\u003ctd>複製可能失敗或產生未知疾病，亦可能衝擊生態平衡\u003c/td>\u003ctd>面臨動物健康風險、生命商品化與倫理爭議\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先閱讀正面影響與反面影響兩欄，再橫向比對具體事項與背後涉及的健康、經濟與生命倫理考量。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論複製出來的新寵物會擁有原本那隻過世寵物的記憶與生活經歷。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據T表分析，反面影響中關於流浪動物與寵物健康面臨的挑戰分別為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>複製寵物需要花費高額金錢，且可能導致流浪動物被領養的機會減少，同時複製個體可能面臨未知疾病與健康風險。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>農業與食品之基因改造\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>過去農藥殘留與環境污染\u003c/p>\u003cp>\u003cb>關係：\u003c/b>基因改造使作物具備天然抗病蟲害特質\u003c/p>\u003cp>\u003cb>結果：\u003c/b>穩定農作物生產量但引發健康疑慮，政府強制清楚標示\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>醫療與疫苗研發管理\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>傳染病威脅人類生命健康與安全\u003c/p>\u003cp>\u003cb>關係：\u003c/b>主管機關進行長時間試驗與審查，公告劑量與副作用\u003c/p>\u003cp>\u003cb>結果：\u003c/b>提升身體免疫力降低風險，尊重個人自主選擇\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>生物複製與倫理考量\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>突破技術應用於瀕危物種保育與寵物服務\u003c/p>\ function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;

function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["抗病蟲害"]},"core-2":{"selector":".point","terms":["清楚標示"]},"core-3":{"selector":".point","terms":["法規把關"]},"core-4":{"selector":".point","terms":["抵抗力與免疫力"]},"core-5":{"selector":".point","terms":["試驗與審查"]},"core-6":{"selector":".point","terms":["健康自主管理"]},"core-7":{"selector":".point","terms":["物種保育"]},"core-8":{"selector":".point","terms":["更新法令規範"]},"core-9":{"selector":".point","terms":["T表"]},"mindmap-overview":{"selector":".mind-branch p","terms":["天然抗病蟲害特質","試驗與審查","生命商品化","T表整理"]},"trap-1":{"selector":".correct","terms":["清楚標示"]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["物種保育"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["生物科技","基因改造","基改食品標示","免疫力","疫苗試驗與審查","疫苗副作用公告","健康自主管理","生物複製","黑足雪貂","T表探究法"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));

 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

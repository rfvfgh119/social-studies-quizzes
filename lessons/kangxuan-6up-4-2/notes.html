t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒6上4-2 都市化與工業化如何影響人們的生活？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"4-2","title":"都市化與工業化如何影響人們的生活？"},"questions":[{"question":"受到人口及工業、服務業往都市集中的影響，臺灣目前人口分布呈現何種主要特徵？","options":["超過九成的人口居住在離島地區","八成以上人口從事傳統農林漁牧業","人口平均均勻分布於山區與平原","近八成的人口居住在都市地區"],"answer":3,"explanation":"正解為(0)。課本明確指出受到人口及產業集中的影響，臺灣目前已有近80%（八成）的人口居住在都市地區。(1)(2)(3)皆不符合課文事實描述。","concept":"都市化現象與人口集中","skill":"概念理解","review":"core-1","evidence":"受人口及工業、服務業往都市集中的影響，臺灣目前已有近80%的人口居住在都市","id":"q1","stem":"受到人口及工業、服務業往都市集中的影響，臺灣目前人口分布呈現何種主要特徵？","theme":"都市化現象與人口集中","explain":"正解為(0)。課本明確指出受到人口及產業集中的影響，臺灣目前已有近80%（八成）的人口居住在都市地區。(1)(2)(3)皆不符合課文事實描述。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"在都市化的過程中，關於高等教育與醫療資源的分布狀況，下列哪一項敘述符合課本內容？","options":["大專校院平均均勻分布在每個鄉村聚落","都市地區完全缺乏高等教育與醫療設施","醫學中心全數設立於偏遠山區村落","大專校院與醫學中心大多集中在都市地區"],"answer":3,"explanation":"正解為(0)。課本指出代表高等教育的大專校院以及最高層級的醫學中心，大多集中在都市地區。(1)(2)(3)皆與課本所述資源集中的現況相反。","concept":"教育與醫療資源分布集中","skill":"概念理解","review":"core-2","evidence":"代表高等教育的大專校院，大多集中在都市；在醫療方面，醫療分級中最高的醫學中心也大多集中在都市","id":"q2","stem":"在都市化的過程中，關於高等教育與醫療資源的分布狀況，下列哪一項敘述符合課本內容？","theme":"教育與醫療資源分布集中","explain":"正解為(0)。課本指出代表高等教育的大專校院以及最高層級的醫學中心，大多集中在都市地區。(1)(2)(3)皆與課本所述資源集中的現況相反。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"關於醫療分級中最高層級「醫學中心」的核心功能與責任，下列敘述何者正確？","options":["專門為鄉村地區提供農業機械維修服務","只開放給特定都市官員進行健康檢查","進行精密診療、照護急重症病患及輔導區域醫療機構","僅負責製造並販售一般日常成藥"],"answer":2,"explanation":"正解為(1)。課本指出醫學中心具備進行精密診療、照護急重症病患的功能，並負有輔導與協助區域內其他醫療機構的責任。(0)(2)(3)皆非醫學中心的功能。","concept":"醫學中心的功能與社會責任","skill":"概念理解","review":"core-3","evidence":"醫學中心有進行精密診療、照護急重症病患等功能，也有輔導、協助區域內其他醫療機構的責任","id":"q3","stem":"關於醫療分級中最高層級「醫學中心」的核心功能與責任，下列敘述何者正確？","theme":"醫學中心的功能與社會責任","explain":"正解為(1)。課本指出醫學中心具備進行精密診療、照護急重症病患的功能，並負有輔導與協助區域內其他醫療機構的責任。(0)(2)(3)皆非醫學中心的功能。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"都市化過程形成住宅、休閒、商業及工業等不同生活空間，這些空間型態的分布有何特徵？","options":["這些生活空間可以單獨存在，也可能交錯在一起","工業空間只許設置於離島，都市內完全沒有工業區","法律規定所有都市空間必須嚴格隔離，絕不可交錯","都市內只許存在公園綠地，禁止任何商業與住宅空間"],"answer":0,"explanation":"正解為(1)。課本文本明確說明這些生活空間型態可以單獨存在，也可能交錯在一起。(0)(2)(3)皆曲解了都市生活空間的多元與交錯特性。","concept":"多元生活空間的交錯型態","skill":"概念理解","review":"core-4","evidence":"這些生活空間型態可以單獨存在，也可能交錯在一起","id":"q4","stem":"都市化過程形成住宅、休閒、商業及工業等不同生活空間，這些空間型態的分布有何特徵？","theme":"多元生活空間的交錯型態","explain":"正解為(1)。課本文本明確說明這些生活空間型態可以單獨存在，也可能交錯在一起。(0)(2)(3)皆曲解了都市生活空間的多元與交錯特性。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"都市內在上下班尖峰時間常出現大量車流與塞車，最主要的原因是什麼？","options":["都市居民習慣在尖峰時間將車輛永久停放在道路中央","大量人口利用汽機車與公車往返居住地與工作求學地點","農村收割機大量進入都市主要幹道進行耕作","都市內所有道路都禁止公共汽車與大眾運輸通行"],"answer":1,"explanation":"正解為(0)。課本指出都市人口密集，大量民眾利用私人汽機車與公車通勤通學，導致尖峰時間車流集中引發塞車。(1)(2)(3)非交通擁擠的真實原因。","concept":"通勤衝擊與交通擁擠違停","skill":"概念理解","review":"core-5","evidence":"大量的人口利用汽機車、公車等方式往返居住地及工作、求學地點之間，常使得都市內出現交通擁擠問題","id":"q5","stem":"都市內在上下班尖峰時間常出現大量車流與塞車，最主要的原因是什麼？","theme":"通勤衝擊與交通擁擠違停","explain":"正解為(0)。課本指出都市人口密集，大量民眾利用私人汽機車與公車通勤通學，導致尖峰時間車流集中引發塞車。(1)(2)(3)非交通擁擠的真實原因。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"行政院於民國112年推出「TPASS行政院通勤月票」，這項政策的主要目的與功能為何？","options":["限制民眾只能在單一固定縣市內步行移動","鼓勵民眾搭乘多種大眾運輸工具以減輕通勤負擔與交通塞車","強制所有民眾購買專用垃圾袋方能搭乘公車","專門補助民眾購買私人汽機車與加油費用"],"answer":1,"explanation":"正解為(0)。課文與圖示說明TPASS通勤月票係鼓勵民眾搭乘公車、捷運、鐵路及公共自行車等多種大眾運輸，減輕通勤壓力與交通壅塞。(1)(2)(3)與TPASS無關。","concept":"TPASS通勤月票與跨區運輸","skill":"概念理解","review":"core-6","evidence":"民國112年行政院推出「TPASS行政院通勤月票」，民眾可以使用這張月票，搭乘多種交通工具","id":"q6","stem":"行政院於民國112年推出「TPASS行政院通勤月票」，這項政策的主要目的與功能為何？","theme":"TPASS通勤月票與跨區運輸","explain":"正解為(0)。課文與圖示說明TPASS通勤月票係鼓勵民眾搭乘公車、捷運、鐵路及公共自行車等多種大眾運輸，減輕通勤壓力與交通壅塞。(1)(2)(3)與TPASS無關。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"當都市產生的生活垃圾過多，且掩埋場飽和、焚化廠老化時，露天堆置於暫存場地的垃圾可能帶來何種環境危害？","options":["會使周邊空氣變得極度清新且無任何異味","能永久防止任何颱風與豪雨引發的淹水","垃圾汙水極可能造成土壤與地下水汙染並影響衛生","會自動轉化為高價值的精密半導體晶圓"],"answer":2,"explanation":"正解為(0)。課本載明大量垃圾露天堆置在暫存場地會影響環境衛生，產生的垃圾汙水也可能滲入造成土壤及地下水汙染。(1)(2)(3)完全背離事實。","concept":"垃圾堆積困境與暫存場地汙染","skill":"概念理解","review":"core-7","evidence":"大量垃圾露天堆置在暫存場地，影響都市環境衛生，垃圾汙水也可能造成土壤及地下水汙染","id":"q7","stem":"當都市產生的生活垃圾過多，且掩埋場飽和、焚化廠老化時，露天堆置於暫存場地的垃圾可能帶來何種環境危害？","theme":"垃圾堆積困境與暫存場地汙染","explain":"正解為(0)。課本載明大量垃圾露天堆置在暫存場地會影響環境衛生，產生的垃圾汙水也可能滲入造成土壤及地下水汙染。(1)(2)(3)完全背離事實。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"關於臺北市與新北市實施的「垃圾費隨袋徵收」政策，下列敘述何者正確？","options":["政府免費無限量發放各式尺寸的專用垃圾袋給全臺居民","將垃圾處理費均勻附加於每戶居民的水費帳單中","強制所有戶外公園都必須使用黃色化學清潔袋","隨垃圾產生量來計算應繳的垃圾處理費，需購買專用垃圾袋"],"answer":3,"explanation":"正解為(0)。隨袋徵收是指隨垃圾量計算處理費，民眾須購買政府發行的專用垃圾袋裝垃圾。(1)為隨水費徵收方式；(2)(3)皆非隨袋徵收之做法。","concept":"垃圾費隨袋徵收政策","skill":"概念理解","review":"core-8","evidence":"「垃圾費隨袋徵收」是指隨垃圾量來計算應繳垃圾處理費的方式","id":"q8","stem":"關於臺北市與新北市實施的「垃圾費隨袋徵收」政策，下列敘述何者正確？","theme":"垃圾費隨袋徵收政策","explain":"正解為(0)。隨袋徵收是指隨垃圾量計算處理費，民眾須購買政府發行的專用垃圾袋裝垃圾。(1)為隨水費徵收方式；(2)(3)皆非隨袋徵收之做法。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"工業化發展後，工廠提供較高且穩定的工資，對原本從事農林漁畜牧業的人們產生了什麼生活作息上的改變？","options":["生活方式轉變為全天候24小時在農田採收","居民放棄所有薪資工作並全面退回原始物物交換","生活方式從傳統農耕作息轉變為上班、下班的型態","作息完全改為隨季節天氣決定是否工作"],"answer":2,"explanation":"正解為(0)。課本指出工廠較高的工資與穩定工作吸引農村人力轉業，生活作息也從傳統農耕模式轉變為固定上班、下班的型態。(1)(2)(3)皆非工業化帶來的作息改變。","concept":"工業化對農業勞動力與作息之影響","skill":"概念理解","review":"core-9","evidence":"生活方式也從傳統生活作息轉變為上班、下班的型態","id":"q9","stem":"工業化發展後，工廠提供較高且穩定的工資，對原本從事農林漁畜牧業的人們產生了什麼生活作息上的改變？","theme":"工業化對農業勞動力與作息之影響","explain":"正解為(0)。課本指出工廠較高的工資與穩定工作吸引農村人力轉業，生活作息也從傳統農耕模式轉變為固定上班、下班的型態。(1)(2)(3)皆非工業化帶來的作息改變。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"高雄煉油廠因屬於高汙染產業而於西元2015年停止運轉，經汙染整治後轉型規劃為何種園區？","options":["花蓮舞鶴茶業專區","新竹科學園區","南方澳水產加工區","楠梓產業園區"],"answer":3,"explanation":"正解為(0)。課本圖文明確記載高雄煉油廠停運整治後轉型為「楠梓產業園區」，並規劃引進半導體與電動車產業。(1)(2)(3)地點與園區名稱皆不相符。","concept":"工業發展環境問題與高雄煉油廠轉型","skill":"概念理解","review":"core-10","evidence":"已於西元2015年停止運轉，進行汙染整治……轉型為「楠梓產業園區」","id":"q10","stem":"高雄煉油廠因屬於高汙染產業而於西元2015年停止運轉，經汙染整治後轉型規劃為何種園區？","theme":"工業發展環境問題與高雄煉油廠轉型","explain":"正解為(0)。課本圖文明確記載高雄煉油廠停運整治後轉型為「楠梓產業園區」，並規劃引進半導體與電動車產業。(1)(2)(3)地點與園區名稱皆不相符。","reviewText":"核心 10","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 都市化現象與人口集中","title":"都市化現象與人口集中","bullets":["人口及工業與服務業逐漸向都市區域集中","臺灣目前已有近八成人口居住在都市地區","基礎設施與公共建築擴增提升居民生活品質","都市成為人口密集且經濟活動熱絡的聚落"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 教育與醫療資源分布集中","title":"教育與醫療資源分布集中","bullets":["都市提供較鄉村地區更豐富的生活資源","高等教育的大專校院大多集中在都市地區","醫療分級最高層級的醫學中心大多集中在都市","臺北市的大專校院與醫學中心數量皆為全臺最多"]},{"id":"core-3","type":"core","tag":"C 醫學中心的功能與社會責任","title":"醫學中心的功能與社會責任","bullets":["醫學中心為醫療體系中最高層級的醫療機構","人口集中於都市促使高階醫療機構在此設立","負責進行精密診療與照護急重症病患等核心任務","具備輔導與協助區域內其他醫療機構的責任"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 多元生活空間的交錯型態","title":"多元生活空間的交錯型態","bullets":["都市化過程中形成居住、休閒及工商業等不同空間","都市人口增加帶動各項機能與產業政策的推動","設置公園綠地滿足休閒，設立科學園區滿足工業空間","這些生活空間型態可以單獨存在，也可能交錯在一起"]},{"id":"core-5","type":"core","tag":"E 通勤衝擊與交通擁擠違停","title":"通勤衝擊與交通擁擠違停","bullets":["大量人口利用汽機車與公車在居住地與工作求學地點間往返","上下班尖峰時間大量車流導致都市交通擁擠","汽機車排放廢氣與噪音造成空氣與環境汙染","都市內停車空間不足導致違規停車與交通混亂"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F TPASS通勤月票與跨區運輸","title":"TPASS通勤月票與跨區運輸","bullets":["行政院於民國112年推行TPASS行政院通勤月票政策","鼓勵民眾搭乘大眾運輸工具以減少交通塞車","中彰投苗生活圈跨縣市整合公車、捷運、鐵路與公共自行車","提供跨縣市通勤與通學民眾便利且經濟的新選擇"]},{"id":"core-7","type":"core","tag":"G 垃圾堆積困境與暫存場地汙染","title":"垃圾堆積困境與暫存場地汙染","bullets":["都市人口密集導致每日產生的生活垃圾量極為可觀","掩埋場空間逐漸飽和且焚化廠老化導致焚燒量下降","大量垃圾露天堆置於暫存場地影響都市環境衛生","垃圾堆積產生的汙水極可能造成土壤與地下水汙染"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 垃圾費隨袋徵收政策","title":"垃圾費隨袋徵收政策","bullets":["隨垃圾量計算應繳垃圾處理費的收費機制","政府統一製作不同容量及價格的專用垃圾袋供民眾購買","民眾為節省費用會主動思考垃圾減量與加強資源回收","目前主要在臺北市與新北市實施，有效減輕垃圾過多問題"]},{"id":"core-9","type":"core","tag":"I 工業化對農業勞動力與作息之影響","title":"工業化對農業勞動力與作息之影響","bullets":["耕作方式機械化普及降低農業對勞動人口的需求","工廠提供較高且穩定的工資吸引農業人力轉從事工業","農村勞動力逐漸不足促使收割機等農業機械協助生產","居民生活方式由傳統農耕作息轉變為上班、下班的型態"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-10","type":"core","tag":"J 工業發展環境問題與高雄煉油廠轉型","title":"工業發展環境問題與高雄煉油廠轉型","bullets":["工廠若缺乏妥善管理監督會產生空氣、水及土壤汙染與爆炸外洩風險","工業區設置雖促進產業發展但會使部分農漁業用地消失","高雄煉油廠因高汙染於西元2015年停運並進行汙染整治","透過公聽會溝通政府與居民合作轉型為楠梓產業園區並引進半導體與電動車"]}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"臺北市的大專校院數量全臺最多，代表全臺灣的大專校院全部都集中在臺北市。","right":"臺北市大專校院數量（24間）最多，但新北市（20間）、高雄市（15間）、臺中市（17間）及其他縣市亦有分布。 課本統計圖明確列出新北市20間、高雄市15間、臺中市17間等，非僅集中於臺北市。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"TPASS通勤月票是全臺灣各縣市統一免費提供給所有民眾無限次免費搭乘大眾運輸的政策。","right":"TPASS是行政院推出的付費優惠月票（如中彰投苗每月999元），由各縣市依生活圈規劃不同收費方案。 課文與練習卷說明TPASS需付費購買專屬優惠方案，非免費提供。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"目前全臺灣所有縣市的垃圾處理費都是採取「垃圾費隨袋徵收」方式辦理。","right":"目前隨袋徵收主要在臺北市、新北市及少數地區實施，大部分縣市仍以隨水費徵收為主。 課本文本明確指出「大部分縣市的垃圾處理費還是以隨水費徵收為主」。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"農業機械化普及完全取代了農民，導致農村不再需要任何農業人力。","right":"耕作方式機械化降低了勞動人口需求，但因工廠吸引人力外移導致農村勞力不足，才更需要機械協助生產。 課本指出農村人力轉入工廠後勞動力不足，需要收割機等機械協助農作物生產。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"只要政府將工廠劃設於合法工業區內集中管理，就絕對不會產生任何空氣或水質汙染。","right":"工廠即使集中在工業區內，若缺乏妥善管理與監督，仍可能產生空汙、水汙、土汙與安全爆炸事故。 課文明確說明「工業區內的工廠，如果沒有妥善的管理和監督，可能產生空氣、水及土壤等方面的汙染」。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"讀「各縣市大專校院及醫學中心數量統計圖」時，圖中各縣市的顏色區塊面積代表該縣市的地理土地面積。","right":"統計圖中的區塊面積代表該縣市「大專校院或醫學中心的數量多寡」，非地理土地面積。 圖表關鍵思考明確說明「統計圖中面積愈大的顏色，代表該縣市的大專校院或醫學中心的數量愈多」。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"都市化與資源集中｜知識關係","chain":["人口與工商業向都市集中達八成","大專校院與醫學中心資源集中都市","滿足生活需求並提升居民品質"]},{"id":"logic-2","type":"chain","title":"交通問題與通勤月票｜知識關係","chain":["上下班車流密集致塞車與違規停車","行政院推動TPASS通勤月票","整合大眾運輸減輕跨縣市負擔"]},{"id":"logic-3","type":"chain","title":"垃圾處理與隨袋徵收｜知識關係","chain":["掩埋場飽和與焚化廠老化致暫存堆積","政府發行專用垃圾袋實施隨袋徵收","促使民眾減少垃圾並加強資源回收"]},{"id":"logic-4","type":"chain","title":"工業化變遷與環境整治｜知識關係","chain":["工廠高工資吸引農民轉業與機械化","工廠管理不當造成環境汙染與安全風險","高雄煉油廠停運整治轉型楠梓產業園區"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜都市化影響下生活資源與交通垃圾措施比較表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜高雄煉油廠轉型楠梓產業園區發展歷程對照圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["大專校院","醫學中心","大專校院代表高等教育機構，主要提供專業教育與人才培養；醫學中心為醫療分級中最高層級機構，主要負責精密診治、照護急重症病患並輔導區域內其他醫療機構。"],["垃圾費隨袋徵收","垃圾費隨水費徵收","隨袋徵收係隨垃圾量計費，民眾需購買政府統一製作的專用垃圾袋使用（如雙北地區）；隨水費徵收係將垃圾處理費附加於用水帳單中，非依實際垃圾量個別計費（為多數縣市現行做法）。"],["傳統農業作息","工廠上班下班作息","傳統農業作息依循日出而作、日落而息與季節農忙運作；工廠作息則依據固定工時上班下班，甚至採輪班與夜班制度。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","都市化","人口及工業、服務業逐漸向都市集中的過程與現象，使都市人口比例增加與都市規模擴大。"],["2","大專校院","代表高等教育的學校機構，大多集中在都市地區，提供高階專業人才培訓。"],["3","醫學中心","醫療分級中最高層級的醫療機構，負責精密診治、急重症照護及輔導區域醫療機構。"],["4","TPASS通勤月票","行政院於民國112年推行的交通優惠月票，整合生活圈內多種大眾運輸工具以減輕通勤負擔。"],["5","垃圾費隨袋徵收","隨垃圾產生量計算處理費的政策，民眾須購買專用垃圾袋丟棄垃圾以促進減量與回收。"],["6","專用垃圾袋","實施隨袋徵收地區（如雙北）由政府統一製作並販售的垃圾袋，具備不同容量與價格。"],["7","農業機械化","在農業生產中使用收割機等機械設備取代人力，以提高效率並彌補農村勞動力不足。"],["8","高雄煉油廠","前身為日治海軍第六燃料廠，因高汙染於西元2015年停運整治，後轉型為楠梓產業園區。"],["9","楠梓產業園區","高雄煉油廠完成整治後轉型的園區，規劃引進半導體與電動車等高科技產業。"],["10","轉型公聽會","政府在工廠轉型或園區開發時舉辦的溝通會議，邀請居民、業者與專家發表意見並進行監督。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"教育與醫療資源分布集中","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「大專校院」與「醫學中心」在都市資源集中現況下的功能差異，下列敘述何者最適當？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"都市化現象與人口集中","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"都市內公共設施與商業空間高度集中，與人口數量變化之間存在何種因果關係？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜證據判讀","clue":"教育與醫療資源分布集中","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"觀察「各縣市大專校院及醫學中心數量統計圖」，下列哪一項證據判讀是正確且合理的？"}]}],"cloze":{"core-1":{"selector":".point","terms":["近八成人口居住在都市"]},"core-2":{"selector":".point","terms":["大專校院與醫學中心"]},"core-3":{"selector":".point" \u003ch4>\u003cspan>C\u003c/span>垃圾處理與隨袋徵收\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>掩埋場飽和與焚化廠老化致暫存堆積\u003c/p>\u003cp>\u003cb>關係：\u003c/b>政府發行專用垃圾袋實施隨袋徵收\u003c/p>\u003cp>\u003cb>結果：\u003c/b>促使民眾減少垃圾並加強資源回收\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>工業化變遷與環境整治\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>工廠高工資吸引農民轉業與機械化\u003c/p>\u003cp>\u003cb>關係：\u003c/b>工廠管理不當造成環境汙染與安全風險\u003c/p>\u003cp>\u003cb>結果：\u003c/b>高雄煉油廠停運整治轉型楠梓產業園區\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>都市化與工業化如何影響人們的生活？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">生活面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體現狀與政府措施\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">社會與環境意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>生活面向\u003c/th>\u003cth>具體現狀與政府措施\u003c/th>\u003cth>社會與環境意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>高階資源分布\u003c/td>\u003ctd>大專校院（臺北24間最多）與醫學中心（臺北10間最多）集中都市\u003c/td>\u003ctd>集中高階教育與精密醫療資源，滿足都市密集人口與周邊需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>都市空間型態\u003c/td>\u003ctd>形成居住、商業、休閒（公園綠地）與工業（科學園區）空間\u003c/td>\u003ctd>因應人口增加與產業政策，提供多元生活與工作場域\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通勤交通管理\u003c/td>\u003ctd>推行TPASS通勤月票（如中彰投苗方案每月999元）\u003c/td>\u003ctd>鼓勵搭乘大眾運輸，減輕上下班塞車、違停與空氣噪音汙染\u003c/td>\u003c/tr>\u003ctr>\u003ctd>垃圾處理困境\u003c/td>\u003ctd>掩埋場飽和與焚化廠老化致堆積；雙北實施隨袋徵收\u003c/td>\u003ctd>利用專用垃圾袋隨量計費，促使居民源頭減量與加強資源回收\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先對照生活面向，再閱讀現狀與措施，最後理解其社會與環境意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論實施TPASS後私人汽機車就會完全消失，也不能推論隨袋徵收已在全國所有縣市實施。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>臺北市與新北市實施「垃圾費隨袋徵收」政策後，主要希望達到什麼社會效益？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>希望透過購買專用垃圾袋隨量計費的機制，促使民眾思考垃圾減量並加強資源分類回收，以減輕都市垃圾處理壓力。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史背景與主要事件\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對環境與社會之影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>歷史背景與主要事件\u003c/th>\u003cth>對環境與社會之影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日治至戰後擴展\u003c/td>\u003ctd>日治時期為海軍第六燃料廠，戰後逐漸擴展廠區煉油\u003c/td>\u003ctd>提供工業發展能量，但煉油高汙染長期影響當地居民健康\u003c/td>\u003c/tr>\u003ctr>\u003ctd>居民要求與停運\u003c/td>\u003ctd>地方居民強烈要求，高雄煉油廠於西元2015年停止運轉\u003c/td>\u003ctd>回應在地民意，結束高汙染煉油生產並開啟汙染整治作業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>轉型溝通階段\u003c/td>\u003ctd>政府召開轉型公聽會，邀請居民、業者、官員與學生討論\u003c/td>\u003ctd>建立多元對話管道，針對健康疑慮、再生水與太陽能進行協調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>園區轉型階段\u003c/td>\u003ctd>完成整治後轉型為楠梓產業園區，引進半導體與電動車\u003c/td>\u003ctd>促進高科技產業發展與就業，同時持續監督汙染防治與環境永續\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依照時間順序，由日治海軍燃料廠看至戰後擴建，再到2015停運整治與公聽會溝通，最後看轉型楠梓產業園區。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論轉型為楠梓產業園區引進半導體後就不需要進行任何環境監督，也不能推論日治時期就已設置楠梓產業園區。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>高雄煉油廠能在西元2015年停止運轉並進行汙染整治，其關鍵原因為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>關鍵原因在於煉油屬於高汙染產業且影響居民健康，在地方居民強烈要求下，政府決定停運並進行汙染整治。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u00 003ctbody>\u003ctr>\u003ctd>高階資源分布\u003c/td>\u003ctd>大專校院（臺北24間最多）與醫學中心（臺北10間最多）集中都市\u003c/td>\u003ctd>集中高階教育與精密醫療資源，滿足都市密集人口與周邊需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>都市空間型態\u003c/td>\u003ctd>形成居住、商業、休閒（公園綠地）與工業（科學園區）空間\u003c/td>\u003ctd>因應人口增加與產業政策，提供多元生活與工作場域\u003c/td>\u003c/tr>\u003ctr>\u003ctd>通勤交通管理\u003c/td>\u003ctd>推行TPASS通勤月票（如中彰投苗方案每月999元）\u003c/td>\u003ctd>鼓勵搭乘大眾運輸，減輕上下班塞車、違停與空氣噪音汙染\u003c/td>\u003c/tr>\u003ctr>\u003ctd>垃圾處理困境\u003c/td>\u003ctd>掩埋場飽和與焚化廠老化致堆積；雙北實施隨袋徵收\u003c/td>\u003ctd>利用專用垃圾袋隨量計費，促使居民源頭減量與加強資源回收\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先對照生活面向，再閱讀現狀與措施，最後理解其社會與環境意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論實施TPASS後私人汽機車就會完全消失，也不能推論隨袋徵收已在全國所有縣市實施。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>臺北市與新北市實施「垃圾費隨袋徵收」政策後，主要希望達到什麼社會效益？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>希望透過購買專用垃圾袋隨量計費的機制，促使民眾思考垃圾減量並加強資源分類回收，以減輕都市垃圾處理壓力。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史背景與主要事件\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對環境與社會之影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>歷史背景與主要事件\u003c/th>\u003cth>對環境與社會之影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日治至戰後擴展\u003c/td>\u003ctd>日治時期為海軍第六燃料廠，戰後逐漸擴展廠區煉油\u003c/td>\u003ctd>提供工業發展能量，但煉油高汙染長期影響當地居民健康\u003c/td>\u003c/tr>\u003ctr>\u003ctd>居民要求與停運\u003c/td>\u003ctd>地方居民強烈要求，高雄煉油廠於西元2015年停止運轉\u003c/td>\u003ctd>回應在地民意，結束高汙染煉油生產並開啟汙染整治作業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>轉型溝通階段\u003c/td>\u003ctd>政府召開轉型公聽會，邀請居民、業者、官員與學生討論\u003c/td>\u003ctd>建立多元對話管道，針對健康疑慮、再生水與太陽能進行協調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>園區轉型階段\u003c/td>\u003ctd>完成整治後轉型為楠梓產業園區，引進半導體與電動車\u003c/td>\u003ctd>促進高科技產業發展與就業，同時持續監督汙染防治與環境永續\u003c/td> function cardHTML(c){let content='';const tag=c.tag?`<div class="tag">${esc(c.tag)}</div>`:'';let heading=`<h3>${esc(c.title)}</h3>`;
if(c.type==='mindmap'||c.type==='reading')content=CUSTOM[c.id];else if(c.type==='trap'){heading=`<div class="card-title"><h3><span class="trap-n">${String(c.n).padStart(2,'0')}</span>${esc(c.title)}</h3><span class="small-label">${esc(c.label)}</span></div>`;content=`<p class="mistake"><span class="text-label">易錯</span>${fmt(c.wrong)}</p><p class="correct"><span class="text-label">破解</span>${fmt(c.right)}</p>`;}
else if(c.type==='chain')content=`<div class="flow">${c.chain.map((s,i)=>(i?'<span class="flow-arrow">→</span>':'')+`<div class="flow-step">${fmt(s)}</div>`).join('')}</div>`;
else if(c.type==='table')content=`<div class="table-wrap"><table><thead><tr>${c.headers.map(s=>`<th scope="col">${esc(s)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(s=>`<td>${fmt(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
else if(c.type==='diagram')content=`<div class="figure-visual" role="img" aria-label="${esc(c.title+'。'+c.caption)}">${diagrams[c.diagram]}</div><p class="diagram-caption">${esc(c.caption)}</p>`;
else if(c.type==='ask')content=`<p><b>題幹線索：</b>${fmt(c.clue)}</p><p><b>處理步驟：</b>${fmt(c.steps)}</p><p class="example">練習例句：「${esc(c.example)}」</p>`;
else if(c.type==='question'){const q=c.question;content=`<div class="question-head"><span>第 ${c.n} 題・主題 ${esc(q.theme)}</span><span>${q.source.length===1&&q.source[0].startsWith('課本')?'課文延伸練習':'單課知識練習'}</span></div><p class="question-stem">${esc(q.stem)}</p><div class="options">${q.options.map((s,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${i}" ${Number(answers[q.id])===i&&answers[q.id]!==undefined?'checked':''}><span>(${String.fromCharCode(65+i)}) ${esc(s)}</span></label>`).join('')}</div>`;heading='';}
else if(c.type==='answers'){content=`<div class="table-wrap"><table class="answer-table"><thead><tr><th>題號</th><th>答案</th><th>解析關鍵</th><th>回去複習</th></tr></thead><tbody>${BOOK.questions.map((q,i)=>`<tr class="answer-row" data-question="${q.id}"><td>${i+1}</td><td><b>${String.fromCharCode(65+q.answer)}</b></td><td>${esc(q.explain)}</td><td><a href="#${q.review}">${esc(q.reviewText)}</a></td></tr>`).join('')}</tbody></table></div><div class="score-box"><p><b>複習指南</b></p><p>${Math.ceil(BOOK.questions.length*.9)}～${BOOK.questions.length} 題：再說出理由，確認概念穩固。<br>${Math.ceil(BOOK.questions.length*.7)}～${Math.ceil(BOOK.questions.length*.9)-1} 題：依右欄補強錯題。<br>${Math.ceil(BOOK.questions.length*.7)-1} 題以下：先重讀核心重點，再看易錯陷阱。</p><div class="screen-only score-tools"><button id="grade">核對我的答案</button><button id="reset">清除作答</button><span class="score-text" aria-live="polite"></span></div></div>`;}
else{content=(c.intro?`<p class="intro">${fmt(c.intro)}</p>`:'')+(c.bullets||[]).map(s=>`<p class="point">${fmt(s)}</p>`).join('');}

function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}
function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}
if(e.target.id==='reset'){answers={};try{localStorage.removeItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson)}catch(e){}document.querySelectorAll('.option input').forEach(im=>im.checked=false);document.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('is-correct','is-wrong'));$('.score-text').textContent='已清除作答。';}});
new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["近八成人口居住在都市"]},"core-2":{"selector":".point","terms":["大專校院與醫學中心"]},"core-3":{"selector":".point","terms":["精密診療與照護急重症病患"]},"core-4":{"selector":".point","terms":["交錯在一起"]},"core-5":{"selector":".point","terms":["違規停車"]},"core-6":{"selector":".point","terms":["中彰投苗生活圈"]},"core-7":{"selector":".point","terms":["土壤與地下水汙染"]},"core-8":{"selector":".point","terms":["專用垃圾袋"]},"core-9":{"selector":".point","terms":["上班、下班的型態"]},"core-10":{"selector":".point","terms":["楠梓產業園區"]},"mindmap-overview":{"selector":".mind-branch p","terms":["醫學中心","TPASS通勤月票","專用垃圾袋","楠梓產業園區"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["都市化","大專校院","醫學中心","TPASS通勤月票","垃圾費隨袋徵收","專用垃圾袋","農業機械化","高雄煉油廠","楠梓產業園區","轉型公聽會"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });
 document.getElementById('mode-cloze').setAttribute('aria-pressed',String(clozeMode));document.getElementById('mode-full').setAttribute('aria-pressed',String(!clozeMode));
 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);

t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒5上3-1 史前人類如何利用環境與資源來生活？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"3-1","title":"史前人類如何利用環境與資源來生活？"},"questions":[{"question":"關於「史前時代」的定義以及考古學家研究史前人類的方法，下列敘述何者正確？","options":["臺灣直到一百多年前才開始出現史前人類活動的足跡","史前時代是指人類尚未出現文字記錄的時期，需透過遺物與遺跡推測生活","史前時代是指臺灣完全沒有任何人類居住與活動的時期","考古學家主要依靠史前人類寫下的日誌與書籍來了解當時社會"],"answer":1,"explanation":"史前時代是指人類尚未出現文字記錄的時期。因為當時沒有文字，考古學家需透過遺物（如石器、陶器）與遺跡（如建築基址）來推測史前人類的生活方式。","concept":"史前時代定義與考古學研究","skill":"概念理解","review":"core-1","evidence":"我們一般將人類尚未出現文字的時期，稱為「史前時代」。","id":"q1","stem":"關於「史前時代」的定義以及考古學家研究史前人類的方法，下列敘述何者正確？","theme":"史前時代定義與考古學研究","explain":"史前時代是指人類尚未出現文字記錄的時期。因為當時沒有文字，考古學家需透過遺物（如石器、陶器）與遺跡（如建築基址）來推測史前人類的生活方式。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"臺灣舊石器時代的代表性考古遺址為臺東縣長濱鄉的八仙洞，當時人類的主要生活特徵為何？","options":["廣泛使用玻璃與瑪瑙飾品並與東南亞大規模貿易","開始煉鐵並使用鐵鋤從事大規模農耕","居住於天然濱海岩洞，使用火並敲打石頭製作打製石器","懂得磨製石刀並定居興建大規模聚落"],"answer":2,"explanation":"舊石器時代的八仙洞人類居住於濱海天然岩洞，懂得用火，依靠採集、狩獵及捕魚維生，並敲打石頭製作打製石器。","concept":"舊石器時代與八仙洞遺址","skill":"概念理解","review":"core-2","evidence":"八仙洞考古遺址在濱海天然岩洞內，顯示當時人們選擇取水方便、能遮風避雨的地點居住。","id":"q2","stem":"臺灣舊石器時代的代表性考古遺址為臺東縣長濱鄉的八仙洞，當時人類的主要生活特徵為何？","theme":"舊石器時代與八仙洞遺址","explain":"舊石器時代的八仙洞人類居住於濱海天然岩洞，懂得用火，依靠採集、狩獵及捕魚維生，並敲打石頭製作打製石器。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"考古學家在八仙洞發現重要考古遺址後，政府為了保存遺址決定拆除洞穴內的廟宇，這項事件反映了什麼議題？","options":["文化資產保存與現代空間使用出現衝突時需要審慎權衡","政府強制禁止所有民眾進入八仙洞區域進行科學研究","舊石器時代人類已經具有興建磚造廟宇的宗教信仰","廟宇建築是舊石器時代人類留下的重要遺跡"],"answer":0,"explanation":"八仙洞洞穴內曾有居民設立廟宇，政府為保存考古遺址決定拆除廟宇，引發保存與空間使用的爭議，顯示文化資產保存與現代空間利用衝突時需要審慎思考。","concept":"八仙洞遺址保存與空間爭議","skill":"概念理解","review":"core-3","evidence":"為了保存遺址，政府決定拆除廟宇。但有些人認為，這些廟宇應該和遺址一起保存","id":"q3","stem":"考古學家在八仙洞發現重要考古遺址後，政府為了保存遺址決定拆除洞穴內的廟宇，這項事件反映了什麼議題？","theme":"八仙洞遺址保存與空間爭議","explain":"八仙洞洞穴內曾有居民設立廟宇，政府為保存考古遺址決定拆除廟宇，引發保存與空間使用的爭議，顯示文化資產保存與現代空間利用衝突時需要審慎思考。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"大約七千年前臺灣邁入新石器時代，史前人類在生活方式上出現了哪一項極為關鍵的突破？","options":["發明了文字並將歷史記錄記載於陶罐上","開始由海外引進煉鐵技術並全面淘汰石器","放棄定居生活重新回到隨季節遷徙的採集漁獵型態","開始從事農業生產與畜養動物，食物來源變穩定並開始定居形成聚落"],"answer":3,"explanation":"新石器時代人類除了採集與漁獵，開始從事農業生產和畜養動物，食物供應穩定促使人們定居下來並形成聚落。","concept":"新石器時代與農業聚落形成","skill":"概念理解","review":"core-4","evidence":"當時的人們除了漁獵與採集食物，同時會從事農業生產和畜養動物","id":"q4","stem":"大約七千年前臺灣邁入新石器時代，史前人類在生活方式上出現了哪一項極為關鍵的突破？","theme":"新石器時代與農業聚落形成","explain":"新石器時代人類除了採集與漁獵，開始從事農業生產和畜養動物，食物供應穩定促使人們定居下來並形成聚落。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"位於臺東縣的卑南考古遺址是臺灣新石器時代的代表遺址，下列哪一項不是卑南遺址出土的代表性文物或遺跡？","options":["用來高溫煉鐵的鐵渣與鐵鋤","由石頭堆疊而成的建築遺跡","造形精美的人獸形玉質耳飾","用以收割農作物的磨製石刀與儲存食物的陶罐"],"answer":0,"explanation":"卑南遺址屬於新石器時代，出土建築遺跡、磨製石刀、陶罐及人獸形玉質耳飾；煉鐵與鐵鋤是金屬器時代十三行遺址的特徵。","concept":"卑南遺址的工藝與定居生活","skill":"概念理解","review":"core-5","evidence":"卑南考古遺址出土由石頭堆疊而成的建築遺跡，可知當時已經有聚落的型態。","id":"q5","stem":"位於臺東縣的卑南考古遺址是臺灣新石器時代的代表遺址，下列哪一項不是卑南遺址出土的代表性文物或遺跡？","theme":"卑南遺址的工藝與定居生活","explain":"卑南遺址屬於新石器時代，出土建築遺跡、磨製石刀、陶罐及人獸形玉質耳飾；煉鐵與鐵鋤是金屬器時代十三行遺址的特徵。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"臺灣大約在兩千年前邁入金屬器時代，其代表性考古遺址為位於新北市八里區的十三行遺址，該遺址最具特色的技術突破為何？","options":["建造了巨大的石造金字塔作為陵墓","具備煉鐵與製作鐵器（如鐵刀、鐵鋤）的技術","首次發現敲打石頭製作打製石器的技術","發明了全世界最早的紙張與墨水印刷術"],"answer":1,"explanation":"十三行遺址出土鐵器與煉鐵留下的殘渣，推測當時已具備煉鐵與製作鐵器的技術，使臺灣邁入金屬器時代。","concept":"金屬器時代與十三行遺址","skill":"概念理解","review":"core-6","evidence":"隨著史前人類開始使用與製作各種鐵器，臺灣邁入金屬器時代。依據考古學家推測，煉鐵技術可能由海外傳入臺灣。","id":"q6","stem":"臺灣大約在兩千年前邁入金屬器時代，其代表性考古遺址為位於新北市八里區的十三行遺址，該遺址最具特色的技術突破為何？","theme":"金屬器時代與十三行遺址","explain":"十三行遺址出土鐵器與煉鐵留下的殘渣，推測當時已具備煉鐵與製作鐵器的技術，使臺灣邁入金屬器時代。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"十三行考古遺址位於觀音山和淡水河交界處的平原上，十三行人興建「架高的房屋」居住，主要目的為何？","options":["可以避免潮溼和野獸的侵襲","為了方便觀察星象與氣候變化","專門用來舉辦大型祭孔大典","作為儲存大量鐵礦原料的專用倉庫"],"answer":0,"explanation":"十三行人在河口平原興建架高的房屋（干欄式建築），能有效避免潮溼與野獸的侵襲。","concept":"十三行人的住屋與地理適應","skill":"概念理解","review":"core-7","evidence":"十三行人住在架高的房屋，可以避免潮溼和野獸的侵襲。","id":"q7","stem":"十三行考古遺址位於觀音山和淡水河交界處的平原上，十三行人興建「架高的房屋」居住，主要目的為何？","theme":"十三行人的住屋與地理適應","explain":"十三行人在河口平原興建架高的房屋（干欄式建築），能有效避免潮溼與野獸的侵襲。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"十三行考古遺址出土了造型極為特殊的「人面陶罐」，關於人面陶罐的敘述下列何者正確？","options":["是由海外歐美國家直接進口的高級陶瓷","是墓葬出土物，推測為宗教祭祀用途，日常生活中不使用","是十三行人日常生活中用來煮飯與盛水的主要容器","是用花蓮豐田玉雕刻而成的裝飾藝術品"],"answer":1,"explanation":"人面陶罐是十三行遺址墓葬中出土的特別物產，造型精美生動，推測為宗教用途，日常生活中並不會使用。","concept":"十三行陶藝工藝與人面陶罐","skill":"概念理解","review":"core-8","evidence":"人面陶罐是墓葬出土物，推測為宗教用途，日常生活中不會使用。","id":"q8","stem":"十三行考古遺址出土了造型極為特殊的「人面陶罐」，關於人面陶罐的敘述下列何者正確？","theme":"十三行陶藝工藝與人面陶罐","explain":"人面陶罐是十三行遺址墓葬中出土的特別物產，造型精美生動，推測為宗教用途，日常生活中並不會使用。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"新石器時代史前人類製作精美玉飾（如人獸形玉質耳飾），這些玉器原料大多來自現今的哪一個地區？","options":["苗栗縣出磺坑油井","花蓮縣壽豐鄉豐田一帶","臺東縣長濱鄉八仙洞","新北市八里區觀音山"],"answer":1,"explanation":"臺灣許多考古遺址發現的玉器原料，大多來自今日花蓮縣壽豐鄉豐田一帶的豐田玉。","concept":"豐田玉與新石器時代跨海交流","skill":"概念理解","review":"core-9","evidence":"臺灣許多考古遺址中都有發現玉器，這些玉器原料大多來自今日花蓮縣壽豐鄉豐田一帶。","id":"q9","stem":"新石器時代史前人類製作精美玉飾（如人獸形玉質耳飾），這些玉器原料大多來自現今的哪一個地區？","theme":"豐田玉與新石器時代跨海交流","explain":"臺灣許多考古遺址發現的玉器原料，大多來自今日花蓮縣壽豐鄉豐田一帶的豐田玉。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"考古學家在十三行遺址發現了來自亞洲其他地區的玻璃耳飾、玻璃環與瑪瑙珠飾，這說明了當時何種社會事實？","options":["十三行人已經掌握高溫熔煉玻璃與瑪瑙的本土技術","十三行人完全不與臺灣島內其他部落往來","金屬器時代島內居民與島外族群之間存在著持續的交流與貿易","這些飾品是舊石器時代八仙洞人類遺留下來的古物"],"answer":2,"explanation":"十三行遺址出土外來的玻璃與瑪瑙飾品，證明金屬器時代島內居民與島外族群之間有持續的貿易與交流。","concept":"玻璃瑪瑙與金屬器時代海外貿易","skill":"概念理解","review":"core-10","evidence":"十三行人會用獸皮、陶器，和臺灣島內、外的人，換取玻璃飾品、玉飾等，各取所需。","id":"q10","stem":"考古學家在十三行遺址發現了來自亞洲其他地區的玻璃耳飾、玻璃環與瑪瑙珠飾，這說明了當時何種社會事實？","theme":"玻璃瑪瑙與金屬器時代海外貿易","explain":"十三行遺址出土外來的玻璃與瑪瑙飾品，證明金屬器時代島內居民與島外族群之間有持續的貿易與交流。","reviewText":"核心 10","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 史前時代定義與考古學研究","title":"史前時代定義與考古學研究","bullets":["人類尚未出現文字記錄的時期稱為史前時代，臺灣早在約五萬年前已有史前人類活動。","由於當時沒有文字，考古學家主要透過考古遺址中發現的遺物與遺跡推測史前人類的生活方式。","遺物指史前人類使用的生活器物（如石器、陶器），遺跡指人類活動留下的建築與結構（如石造遺跡）。","全臺灣至今已發現兩千多處考古遺址，是幫助我們認識史前人類生活樣貌的重要文化資產。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 舊石器時代與八仙洞遺址","title":"舊石器時代與八仙洞遺址","bullets":["八仙洞考古遺址位於臺東縣長濱鄉，是臺灣舊石器時代的代表性遺址。","當時人們選擇居住在濱海天然岩洞內，具有取水方便且能遮風避雨的地理優勢。","當時人們懂得使用火來燒烤食物、照明與取暖，並靠採集野果、狩獵及捕魚維持生活。","工具製作採用敲打石頭的方式做成打製石器，這種生活方式稱為舊石器時代。"]},{"id":"core-3","type":"core","tag":"C 八仙洞遺址保存與空間爭議","title":"八仙洞遺址保存與空間爭議","bullets":["八仙洞山壁上有大大小小的天然洞穴，一百多年前開始有人在此活動並設立廟宇。","考古學家發現重要考古遺址後，政府為了保存遺址決定拆除洞穴內的廟宇。","部分人士認為廟宇應與遺址一併保存，雙方對於是否拆除廟宇曾發生衝突。","這反映出當文化資產保存與現代空間使用出現衝突時，需要審慎思考與權衡選擇。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 新石器時代與農業聚落形成","title":"新石器時代與農業聚落形成","bullets":["約七千年前臺灣邁入新石器時代，生活方式與器物製作技術發生重大轉變。","人們除了採集與漁獵，開始從事農業生產（如農耕收割）並畜養動物。","食物供應比舊石器時代更加穩定，促使人們開始定居下來並逐漸形成聚落。","器物製作除了敲打，更採用磨製石器，大幅提升工具的實用性與多樣性。"]},{"id":"core-5","type":"core","tag":"E 卑南遺址的工藝與定居生活","title":"卑南遺址的工藝與定居生活","bullets":["卑南考古遺址位於臺東縣，出土石頭堆疊的建築遺跡，證實當時已有聚落型態。","卑南人運用泥土製作陶器用以烹飪或儲存食物，並使用磨製石刀收割農作物。","懂得使用豐田玉製作精美飾品（如人獸形玉質耳飾）配戴，展現精湛的玉器工藝與審美觀。","多元遺物出土顯示新石器時代人類已具備織布、畜養動物與定居生活技能。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 金屬器時代與十三行遺址","title":"金屬器時代與十三行遺址","bullets":["約二千年前史前人類開始使用與製作鐵器，臺灣正式邁入金屬器時代。","十三行考古遺址位於新北市八里區，位在觀音山與淡水河交界處的平原上。","依考古學家推測，煉鐵技術可能由海外傳入臺灣，殘留的鐵渣證實當地具備煉鐵能力。","出土的鐵器包括生產工具（鐵鋤）與日常生活用品（鐵刀），大幅提高了生產效率。"]},{"id":"core-7","type":"core","tag":"G 十三行人的住屋與地理適應","title":"十三行人的住屋與地理適應","bullets":["十三行人選擇住在觀音山與淡水河交界平原，善用臨近河海的地理優勢發展漁獵農耕。","十三行人興建架高的房屋（干欄式建築）居住，能有效避免潮溼與野獸侵襲。","此時期鐵器使用普及使石器種類相對減少，反映鐵器逐漸取代部分石器的過程。","善用自然環境與技術改良，展現史前人類順應並利用地理環境的生存智慧。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 十三行陶藝工藝與人面陶罐","title":"十三行陶藝工藝與人面陶罐","bullets":["十三行人具有精湛的製陶技術，能製作出人面陶罐以及人形、豬形等多種造型陶偶。","生動精美的陶偶作品反映出當時十三行人獨特的審美觀與藝術創造力。","人面陶罐是墓葬中出土的特殊遺物，推測為宗教祭祀用途，日常生活中並不使用。","日常用器與宗教祭祀用器的區分，說明當時社會已具有初步的信仰與禮儀觀念。"]},{"id":"core-9","type":"core","tag":"I 豐田玉與新石器時代跨海交流","title":"豐田玉與新石器時代跨海交流","bullets":["臺灣許多考古遺址發現的玉器，原料大多來自今日花蓮縣壽豐鄉豐田一帶。","豐田玉所製成的各種飾品，不僅出土於臺灣各地遺址，也流傳至東南亞地區。","證實自新石器時代開始，史前人類就已經有頻繁的島內與島外互動交流。","說明史前人類並非封閉孤立，而是透過海洋網絡進行物產與文化的分享。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-10","type":"core","tag":"J 玻璃瑪瑙與金屬器時代海外貿易","title":"玻璃瑪瑙與金屬器時代海外貿易","bullets":["十三行遺址出土了玻璃耳飾、玻璃環以及瑪瑙珠飾等珍貴飾品。","這些玻璃與瑪瑙飾品的原料和製作技術，可能來自亞洲其他地區。","十三行人會以獸皮、陶器等在地物產，與島外族群交換外來飾品，各取所需。","證實金屬器時代島內居民與島外族群之間存在著持續且熱絡的貿易交流。"]}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"史前時代是指臺灣完全沒有人類居住與活動的歷史時期。","right":"史前時代是指「人類尚未出現文字記錄」的時期，臺灣早在約五萬年前就有史前人類居住。 劃分史前時代與歷史時代的標準是「有無文字記錄」，而非是否有人類活動。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"舊石器時代的八仙洞人類已經懂得磨製石器，並開始從事農耕與定居聚落生活。","right":"八仙洞屬於舊石器時代，使用「敲打打製石器」，靠採集、狩獵與捕魚維生；農耕與定居聚落是新石器時代才出現。 舊石器時代使用打製石器且尚無農業；磨製石器、農耕與定居聚落屬於新石器時代特徵。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"十三行遺址出土的人面陶罐造型精美，是十三行人日常生活中用來烹煮米飯的主要容器。","right":"人面陶罐是墓葬出土的遺物，推測為宗教祭祀用途，在日常生活中並不會使用。 出土情境為墓葬且造形特殊，說明其為宗教禮儀器具而非日常烹飪食器。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"金屬器時代十三行人開始煉鐵並使用鐵器後，就完全放棄並不再製作任何陶器與石器。","right":"十三行人雖然鐵器普及使石器種類相對減少，但仍會磨製石器，並持續精進製陶技術（如人面陶罐與陶偶）。 史前技術與生活技能具有「延續性」，新技術出現不會導致舊工藝立刻完全消失。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"花蓮縣壽豐鄉產出的豐田玉飾品，只有在花蓮當地的卑南遺址被考古學家發現。","right":"豐田玉製成的飾品在臺灣各地遺址以及東南亞地區的遺址中都有發現。 豐田玉的廣泛出土分布證實了新石器時代史前人類已有頻繁的島內與島外跨海交流。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"十三行遺址出土的玻璃耳飾與瑪瑙珠飾，是十三行人在淡水河邊採集礦石自行高溫煉製的物產。","right":"玻璃與瑪瑙的原料及技術來自亞洲其他地區，是十三行人用獸皮、陶器與島外族群交換而來的。 玻璃與瑪瑙是外來珍品，證實了金屬器時代島內居民與島外族群有持續的貿易互動。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"舊石器時代自然依存｜知識關係","chain":["約五萬年前人類無文字記錄並居住天然濱海岩洞","使用火燒烤照明及敲打製作打製石器","採集野果、狩獵與捕魚維生，呈現對自然環境的直接依賴"]},{"id":"logic-2","type":"chain","title":"新石器時代農業定居｜知識關係","chain":["約七千年前食物來源由採集轉為農業生產與畜養","磨製石器收割農作、泥土製陶烹煮儲存及製作豐田玉飾","食物供應穩定促使定居並形成聚落等生活型態（如卑南遺址）"]},{"id":"logic-3","type":"chain","title":"金屬器時代煉鐵貿易｜知識關係","chain":["約二千年前海外傳入煉鐵技術並製作鐵刀鐵鋤等工具","興建架高房屋防潮禦獸，精製人面陶罐與造型陶偶","以獸皮陶器與外地交換玻璃瑪瑙，深化島內外貿易交流"]},{"id":"logic-4","type":"chain","title":"史前文化資產與守護｜知識關係","chain":["生活痕跡被沙土層層埋藏成為兩千多處考古遺址","考古學家挖掘遺物與遺跡，呈現技能延續性與愈趨多樣特徵","面對八仙洞等遺址保存與現代使用衝突，重視並守護文化資產"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣史前三大時代器物與生活技能演變對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜史前時代島內與島外物產交流演變流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["打製石器","磨製石器","打製石器是用石頭相互敲打擊落石片而成，邊緣較粗糙，為舊石器時代（如八仙洞遺址）代表；磨製石器是用磨製方式加工使形狀平順具特定功能（如收割石刀），為新石器時代（如卑南遺址）代表。"],["八仙洞考古遺址","十三行考古遺址","八仙洞位於臺東縣長濱鄉，為舊石器時代代表，人類棲居天然濱海岩洞採集漁獵；十三行位於新北市八里區，為金屬器時代代表，人類具備煉鐵技術、居住架高房屋並進行海外貿易。"],["人獸形玉質耳飾","人面陶罐","人獸形玉質耳飾出自卑南遺址（新石器時代），由花蓮豐田玉磨製配戴於身上作美觀飾品；人面陶罐出自十三行遺址（金屬器時代），為墓葬出土物，推測作為宗教祭祀用途非日常烹飪食器。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","史前時代","指人類尚未出現文字記錄的歷史時期，考古學家需透過考古遺址出土的遺物與遺跡推測當時的生活樣貌。"],["2","遺物與遺跡","史前人類遺留下來的生活器物（如石器、陶器）稱為遺物；人類活動留下的建築基址、堆石結構或墓葬稱為遺跡。"],["3","八仙洞考古遺址","位於臺東縣長濱鄉，為臺灣舊石器時代代表遺址，當時人類居住於天然濱海岩洞，現因板塊推擠作用抬升至較高山壁。"],["4","打製石器","舊石器時代主要的石器製作技術，透過敲打石頭形成具備切割、敲擊功能的簡易生活工具。"],["5","卑南考古遺址","位於臺東縣，為臺灣新石器時代代表遺址，出土磨製石器、陶器、石板棺及精美豐田玉飾，顯示已形成農業定居聚落。"],["6","磨製石器","新石器時代發展出的石器製作技術，將石材打磨成平順且具特定用途（如收割稻作的石刀）的多樣化工具。"],["7","豐田玉","產於今日花蓮縣壽豐鄉豐田一帶的玉石原料，自新石器時代起被製成飾品，並流傳至臺灣各地與東南亞地區。"],["8","十三行考古遺址","位於新北市八里區淡水河口平原，為臺灣金屬器時代代表遺址，具備煉鐵技術，出土人面陶罐與外來玻璃、瑪瑙飾品。"],["9","人面陶罐","出土於十三行遺址墓葬中的特殊陶器，罐身有生動精美的人面造型，推測為宗教祭祀用途而非日常烹煮食器。"],["10","架高的房屋","十三行人在淡水河口平原上興建的住屋形式（干欄式建築），將房屋基座柱子架高離地，能有效防範潮溼與野獸侵襲。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜因果推論","clue":"舊石器時代與八仙洞遺址","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"舊石器時代的八仙洞遺址原本位於海邊，今日的洞穴卻位於較高山壁上，造成這種地形位置改變的主要自然原因為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"新石器時代與農業聚落形成","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較舊石器時代的「打製石器」與新石器時代的「磨製石器」，兩者在製作技術與工具特徵上的明確差異為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜證據判讀","clue":"卑南遺址的工藝與定居生活","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"考古學家在卑南遺址發現「由石頭堆疊而成的建築遺跡」，這項物證最能支持下列哪一個歷史推論？"}]}],"cloze":{"core-1":{"selector":".point","terms":["史前時代"]},"core-2":{"selector":".point","terms":["八仙洞"]},"core-3":{"selector":".point","terms":["文化資產保存"]},"core-4":{"selector":".point","terms":["農業生產"]},"core-5":{"selector":".point","terms":["人獸形玉質耳飾"]},"core-6":{"selector":".point","terms":["煉鐵技術"]},"core-7":{"selector":".point","terms":["架高的房屋"]},"core-8":{"selector":".point","terms":["人面陶罐"]},"core-9":{"selector":".point","terms":["豐田玉"]},"core-10":{"selector":".point","terms":["瑪瑙珠飾"]},"mindmap-overview":{"selector":".mind-branch p","terms":["打製石器","定居並形成聚落","架高房屋","文化資產"]},"trap-1":{"selector":".correct","terms":["史前時代"]},"trap-2":{"selector":".correct","terms":["八仙洞"]},"trap-3":{"selector":".correct","terms":["人面陶罐"]},"trap-4":{"selector":".correct","terms":["人面陶罐"]},"trap-5":{"selector":".correct","terms":["豐田玉"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["史前時代","遺物與遺跡","八仙洞考古遺址","打製石器","卑南考古遺址","磨製石器","豐田玉","十三行考古遺址","人面陶罐","架高的房屋"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>舊石器時代自然依存\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>約五萬年前人類無文字記錄並居住天然濱海岩洞\u003c/p>\u003cp>\u003cb>關係：\u003c/b>使用火燒烤照明及敲打製作打製石器\u003c/p>\u003cp>\u003cb>結果：\u003c/b>採集野果、狩獵與捕魚維生，呈現對自然環境的直接依賴\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>新石器時代農業定居\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>約七千年前食物來源由採集轉為農業生產與畜養\u003c/p>\u003cp>\u003cb>關係：\u003c/b>磨製石器收割農作、泥土製陶烹煮儲存及製作豐田玉飾\u003c/p>\u003cp>\u003cb>結果：\u003c/b>食物供應穩定促使定居並形成聚落等生活型態（如卑南遺址）\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>金屬器時代煉鐵貿易\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>約二千年前海外傳入煉鐵技術並製作鐵刀鐵鋤等工具\u003c/p>\u003cp>\u003cb>關係：\u003c/b>興建架高房屋防潮禦獸，精製人面陶罐與造型陶偶\u003c/p>\u003cp>\u003cb>結果：\u003c/b>以獸皮陶器與外地交換玻璃瑪瑙，深化島內外貿易交流\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>史前文化資產與守護\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>生活痕跡被沙土層層埋藏成為兩千多處考古遺址\u003c/p>\u003cp>\u003cb>關係：\u003c/b>考古學家挖掘遺物與遺跡，呈現技能延續性與愈趨多樣特徵\u003c/p>\u003cp>\u003cb>結果：\u003c/b>面對八仙洞等遺址保存與現代使用衝突，重視並守護文化資產\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>史前人類如何利用環境與資源來生活？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">時代與代表遺址\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">器物製作與技術\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">生活技能與交流型態\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>時代與代表遺址\u003c/th>\u003cth>器物製作與技術\u003c/th>\u003cth>生活技能與交流型態\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>舊石器時代（八仙洞遺址）\u003c/td>\u003ctd>敲打石頭製作打製石器、懂得使用火\u003c/td>\u003ctd>採集野果、狩獵與捕魚，居住天然濱海岩洞\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新石器時代（卑南遺址）\u003c/td>\u003ctd>磨製石器（石刀）、製作陶罐與豐田玉飾\u003c/td>\u003ctd>開始農業生產與畜養動物，定居並形成聚落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金屬器時代（十三行遺址）\u003c/td>\u003ctd>海外傳入煉鐵技術製作鐵器、製作人面陶罐\u003c/td>\u003ctd>居住架高房屋，與島外交流換取玻璃與瑪瑙飾品\u003c/td>\u003c/tr>\u003ctr>\u003ctd>時代演進總結（兩千多處遺址）\u003c/td>\u003ctd>器物從打製石器演進至磨製石器與鐵器\u003c/td>\u003ctd>技能具有延續性，越接近現代具備技能越多\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按時間軸順序（舊石器時代→新石器時代→金屬器時代），橫向比較器物製作與生活技能的演變。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論金屬器時代使用鐵器後，史前人類就完全停止使用磨製石器或不再製作陶器。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，史前人類從舊石器時代演進到新石器時代時，在「食物取得」與「居住型態」上發生了什麼關鍵轉變？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>食物取得從單純「採集漁獵」轉變為「農業生產與畜養動物」；居住型態則從隨天然岩洞遷移轉變為「定居並形成聚落」。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">交流階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">主要物產與原料\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史意義與交流範圍\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>交流階段\u003c/th>\u003cth>主要物產與原料\u003c/th>\u003cth>歷史意義與交流範圍\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>新石器時代原料開採\u003c/td>\u003ctd>產於今日花蓮縣壽豐鄉的豐田玉\u003c/td>\u003ctd>作為製作精美玉器（如人獸形耳飾）的高級原料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新石器時代跨海流傳\u003c/td>\u003ctd>豐田玉製作的各種飾品與器物\u003c/td>\u003ctd>流傳至臺灣各地及東南亞地區，證實已有島外互動\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金屬器時代物產交換\u003c/td>\u003ctd>十三行人以在地獸皮、陶器為物資\u003c/td>\u003ctd>利用臨近河海地理優勢與外地商人進行以物易物\u003c/td>\u003c/tr>\u003ctr>\u003ctd>金屬器時代外來珍品\u003c/td>\u003ctd>亞洲其他地區的玻璃耳飾、環與瑪瑙珠飾\u003c/td>\u003ctd>證實金屬器時代島內居民與島外族群有持續貿易交流\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間順序與交易歷程，由新石器時代豐田玉的外銷，看至金屬器時代十三行人跨海交換外來珍品。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論玻璃與瑪瑙飾品是十三行人在花蓮壽豐山區採礦自行高溫熔鍊出來的產物。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，考古學家在十三行遺址中發現來自亞洲其他地區的玻璃與瑪瑙飾品，這項發現最能提供什麼歷史證據？\u003c/p>   if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};

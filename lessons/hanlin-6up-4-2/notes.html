t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林6上4-2 民主社會是如何運作與維繫？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"4-2","title":"民主社會是如何運作與維繫？"},"questions":[{"question":"關於憲法在我國法律體系中的地位與作用，下列敘述何者正確？","options":["憲法是國家的根本大法，為各種法律的依據，並規範人民權利義務與政府職權","憲法係由各縣市政府依在地需求分別制定，全國沒有統一的憲法","憲法位階低於立法院通過的各種法律，地方政府可隨意修改其內容","憲法只規範政府官員的職權，與普通人民的基本權利義務完全無關"],"answer":0,"explanation":"憲法是國家的根本大法，不僅是各種法律的依據，亦明確規範人民基本權利與義務，以及各級政府的組織與職權。選項1、2、3觀念均屬錯誤。","concept":"憲法地位與規範範疇","skill":"概念理解","review":"core-1","evidence":"憲法是國家的根本大法,不僅是各種法律的依據,也是民主社會運作的重要基石。中華民國憲法明確規範人民的基本權利與義務,以及各級政府的組織與職權。","id":"q1","stem":"關於憲法在我國法律體系中的地位與作用，下列敘述何者正確？","theme":"憲法地位與規範範疇","explain":"憲法是國家的根本大法，不僅是各種法律的依據，亦明確規範人民基本權利與義務，以及各級政府的組織與職權。選項1、2、3觀念均屬錯誤。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"憲法保障人民在法律面前一律平等，學校在校園環境中如何落實平等的精神？","options":["只對考試成績優異的學生提供專屬校園學習資源與設施設備","依照學生不同需求提供適當協助，如華語補救教學與建置無障礙設施","強制要求所有學生學習完全一模一樣的語言與體育技能","規定所有學生無論身體狀況皆必須參與相同標準的體能測試"],"answer":1,"explanation":"平等係指法律面前一律平等，學校依不同需求提供協助（如華語補救教學與無障礙設施），展現尊重差異與實質平等的精神。選項0、2、3忽略了按需求提供協助的平等待遇意涵。","concept":"平等權與校園實質協助","skill":"概念理解","review":"core-2","evidence":"憲法保障人民,不論性別、族群或信仰,在法律面前一律平等。為了讓每位學生都能公平接受教育,學校會依照不同需求提供協助。","id":"q2","stem":"憲法保障人民在法律面前一律平等，學校在校園環境中如何落實平等的精神？","theme":"平等權與校園實質協助","explain":"平等係指法律面前一律平等，學校依不同需求提供協助（如華語補救教學與無障礙設施），展現尊重差異與實質平等的精神。選項0、2、3忽略了按需求提供協助的平等待遇意涵。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"關於憲法保障的人民自由權利及其行使界線，下列敘述何者符合課本概念？","options":["自由是指個人想做什麼就做什麼，完全不需要顧慮他人權利與感受","只要擁有言論自由，就可以在網路上隨意散播未經證實的謠言","宗教自由代表進行宗教活動時不受任何法律與環境品質規範限制","自由係以不侵犯他人與不違背社會公共利益為原則"],"answer":3,"explanation":"憲法規定自由以不侵犯他人、不違背社會公共利益為原則。言論自由不能散播不實內容或誹謗他人；宗教活動不可造成噪音或環境污染。選項1、2、3觀念均屬錯誤。","concept":"自由權保障與行使界線","skill":"概念理解","review":"core-3","evidence":"憲法也規定,自由以不侵犯他人、不違背社會公共利益為原則。例如:我們可以自由地談論公共議題,發表自己的想法,但是不能散播不實的內容或傷害他人。","id":"q3","stem":"關於憲法保障的人民自由權利及其行使界線，下列敘述何者符合課本概念？","theme":"自由權保障與行使界線","explain":"憲法規定自由以不侵犯他人、不違背社會公共利益為原則。言論自由不能散播不實內容或誹謗他人；宗教活動不可造成噪音或環境污染。選項1、2、3觀念均屬錯誤。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"人民依法參加國家考試招聘人才，或在政府機構工作並由政府保障其身分福利，屬於憲法保障的哪一項參政權利？","options":["參加公務人員考試與擔任公職","選舉權","創制複決權","罷免權"],"answer":0,"explanation":"參加公務人員考試（高考、普考等）與擔任公職係憲法保障人民直接參與政治事務的參政權利，且擔任我國公職需具備我國國籍。","concept":"參政權與直接參與政治","skill":"概念理解","review":"core-4","evidence":"民主國家的人民可以直接參與國家政治事務的運作,憲法保障人民有:選舉、罷免、參加公務人員考試、擔任公職等權利。要擔任我國公職,需具備我國國籍。","id":"q4","stem":"人民依法參加國家考試招聘人才，或在政府機構工作並由政府保障其身分福利，屬於憲法保障的哪一項參政權利？","theme":"參政權與直接參與政治","explain":"參加公務人員考試（高考、普考等）與擔任公職係憲法保障人民直接參與政治事務的參政權利，且擔任我國公職需具備我國國籍。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"依據憲法規定，下列哪一項同時兼具國民的「權利」與「義務」雙重性質？","options":["依法繳納稅金","依法服兵役","接受國民教育","參加公務人員國家考試"],"answer":2,"explanation":"6到15歲國民接受國民教育既是權利也是義務；服兵役與納稅為純粹義務；參加國家考試為參政權利。","concept":"三大國民義務與法律後果","skill":"概念理解","review":"core-5","evidence":"兒童到學校上課,是受教育的權利,也是義務。透過學習增長知識,未來才有能力參與民主社會的運作。","id":"q5","stem":"依據憲法規定，下列哪一項同時兼具國民的「權利」與「義務」雙重性質？","theme":"三大國民義務與法律後果","explain":"6到15歲國民接受國民教育既是權利也是義務；服兵役與納稅為純粹義務；參加國家考試為參政權利。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"關於中央政府與地方政府的組織結構與分工，下列敘述何者正確？","options":["地方政府行政機關可以直接修改憲法條文以符合在地需求","地方政府負責處理外交、國防等全國性事務，中央政府只處理地方建設","中央政府包含總統府及五院，負責處理全國性公共事務","只有中央政府設有立法機關，地方政府完全沒有立法機關之編制"],"answer":2,"explanation":"中央政府（總統府與五院）處理全國性公共事務；地方政府執行中央政策並依在地需求推動建設。中央（立法院）與地方（縣市議會）均設有立法機關。選項1、2、3敘述均錯誤。","concept":"中央與地方政府分工合作","skill":"概念理解","review":"core-6","evidence":"我國政府分為中央政府及地方政府。中央政府包含總統府及五院,負責處理全國性公共事務。地方政府由縣市長所領導的行政機關負責管理,執行中央制定的政策與法規。","id":"q6","stem":"關於中央政府與地方政府的組織結構與分工，下列敘述何者正確？","theme":"中央與地方政府分工合作","explain":"中央政府（總統府與五院）處理全國性公共事務；地方政府執行中央政策並依在地需求推動建設。中央（立法院）與地方（縣市議會）均設有立法機關。選項1、2、3敘述均錯誤。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"在中央與地方合作維護行人路權的分工中，立法院的主要職責為何？","options":["負責在各學校與車站周邊實際施工劃設行人優先區","審議並通過《行人交通安全設施條例》等相關法規與預算","負責對未禮讓行人的違規駕駛進行現場稽查與開罰","負責審判汽機車未禮讓行人導致受傷的訴訟案件"],"answer":1,"explanation":"立法院為中央立法機關，負責通過法律（如《行人交通安全設施條例》）與審議預算；施工劃設屬地方行政機關，開罰屬警察執法，審判屬司法院地方法院。","concept":"行人路權維護與跨機關權責","skill":"概念理解","review":"core-7","evidence":"立法院因應需求,通過行人優先交通安全相關法規,規範中央及地方應訂定行人交通安全推動及改善計畫。","id":"q7","stem":"在中央與地方合作維護行人路權的分工中，立法院的主要職責為何？","theme":"行人路權維護與跨機關權責","explain":"立法院為中央立法機關，負責通過法律（如《行人交通安全設施條例》）與審議預算；施工劃設屬地方行政機關，開罰屬警察執法，審判屬司法院地方法院。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"人民參與公共事務貫穿政策推動的全過程，在「政策形成或調整前」人民可以採取何種行動？","options":["只能被動接受政府公佈的最終決定，無法發表任何看法","代替政府機關直接頒布並執行新的法律條文","針對現行制度的缺失向政府提出建議或修正意見","只能在政策實施十年後才能透過集會遊行提出檢討"],"answer":2,"explanation":"在政策形成或調整前，人民可針對現行制度向政府提出建議或修正意見；執行中可進行監督，推動後可透過合法管道反映意見要求調整。選項1、2、3敘述均錯誤。","concept":"政策形成前中後的人民參與","skill":"概念理解","review":"core-8","evidence":"在政策形成或調整前,人民可以針對現行制度向政府提出建議或修正意見。例如:當酒駕造成的嚴重傷亡事件經常發生時,社會大眾呼籲應加重處罰,政府便須回應民意。","id":"q8","stem":"人民參與公共事務貫穿政策推動的全過程，在「政策形成或調整前」人民可以採取何種行動？","theme":"政策形成前中後的人民參與","explain":"在政策形成或調整前，人民可針對現行制度向政府提出建議或修正意見；執行中可進行監督，推動後可透過合法管道反映意見要求調整。選項1、2、3敘述均錯誤。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"立法院於西元2015年修訂《動物保護法》刪除撲殺條款，並於西元2017年全面實施何項重要動保政策？","options":["動物收容所全面停止安樂死（零撲殺）政策","全國全面禁止民眾在私人生育或飼養任何寵物政策","所有流浪動物一律由中央政府強制拍賣轉營利政策","流浪動物強制捕捉後立刻野放深山政策"],"answer":0,"explanation":"西元2015年立法院修《動物保護法》刪除撲殺條款，西元2017年動物收容所全面停止安樂死，實施流浪動物零撲殺政策。選項0、2、3非課本記載事實。","concept":"動物保護政策演進與零撲殺（延伸學習）","skill":"概念理解","review":"core-9","evidence":"立法院於西元2015年通過動物保護法修法,刪除撲殺條款……西元2017年動物收容所全面停止安樂死行為,我國成為亞洲第二個實施流浪動物零撲殺政策的國家。","id":"q9","stem":"立法院於西元2015年修訂《動物保護法》刪除撲殺條款，並於西元2017年全面實施何項重要動保政策？","theme":"動物保護政策演進與零撲殺（延伸學習）","explain":"西元2015年立法院修《動物保護法》刪除撲殺條款，西元2017年動物收容所全面停止安樂死，實施流浪動物零撲殺政策。選項0、2、3非課本記載事實。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"關於我國國民服兵役的規定，下列敘述何者符合憲法與課本內容？","options":["服兵役僅為個人興趣選擇，不具備憲法義務性質","女性被強制規定滿18歲必須服義務役","男女人民皆完全不需要承擔任何國防兵役責任","男性年滿18歲依法須服兵役，女性可依意願報名志願役"],"answer":3,"explanation":"男子年滿18歲依法須服兵役；女性若符合年齡、學歷及體格標準，可主動報名志願役，兩者制度不同。選項0、2、3觀念均屬錯誤。","concept":"三大國民義務與法律後果","skill":"概念理解","review":"core-5","evidence":"男性年滿十八歲後依法須服兵役,女性則可依個人意願選擇是否當兵,共同守護家園。女生若符合年齡、學歷及體格標準,可以主動報名志願役。","id":"q10","stem":"關於我國國民服兵役的規定，下列敘述何者符合憲法與課本內容？","theme":"三大國民義務與法律後果","explain":"男子年滿18歲依法須服兵役；女性若符合年齡、學歷及體格標準，可主動報名志願役，兩者制度不同。選項0、2、3觀念均屬錯誤。","reviewText":"核心 5","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 憲法地位與規範範疇","title":"憲法地位與規範範疇","bullets":["憲法是國家的根本大法，不僅是各種法律的依據，也是民主社會運作的基石","為鞏固國家體制與保障民主運作，憲法規範人民基本權利義務及政府組織職權","政府必須依據憲法行使權力，人民則透過選舉與表達意見等方式參與事務並監督政府","政府與人民共同遵守憲法規範，使國家施政以民意為準則並維持社會秩序"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 平等權與校園實質協助","title":"平等權與校園實質協助","bullets":["憲法保障人民不論性別、族群或信仰，在法律面前一律平等","為了讓每位學生都能公平接受教育，學校會依照不同需求提供適當協助","開設華語補救教學協助新住民學生，並建置無障礙斜坡道、電梯與無障礙廁所","展現民主社會重視平等與尊重差異的精神，確保身心障礙學生自由進出與學習"]},{"id":"core-3","type":"core","tag":"C 自由權保障與行使界線","title":"自由權保障與行使界線","bullets":["人民享有居住遷徙、信仰宗教、表達想法、通訊與集會等自由權利","自由並非想做什麼就能做什麼，憲法規定自由以不侵犯他人與不違背公共利益為原則","言論自由不能作為發表暴力、誹謗或侮辱他人的理由；宗教活動不可造成噪音或環境污染","尊重他人發表言論的自由，同時在法律界線內保障每個人的基本自由與社會安寧"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 參政權與直接參與政治","title":"參政權與直接參與政治","bullets":["憲法保障人民享有選舉、罷免、參加公務人員考試及擔任公職等參政權利","為了讓人民可以直接參與國家政治事務運作，並監督民選公職人員表現","透過選舉投票選出期待的政策或人物；透過罷免使不適任民選代表在任期屆滿前結束職務；通過高考普考等國家考試得擔任公職（需具國籍）","促使政府廣納人民意見，推動符合人民需求與公平正義的措施，提升國民生活品質"]},{"id":"core-5","type":"core","tag":"E 三大國民義務與法律後果","title":"三大國民義務與法律後果","bullets":["憲法規定人民應盡的三大義務包括：接受國民教育、服兵役與納稅","人民在享有權利的同時也應履行義務，才能維護社會正常運作與國家安全","6到15歲國民必須接受義務教育（無故缺課家長會被罰款）；男子滿18歲依法服兵役（女性可報名志願役）；個人收入、財產與商家消費發票均需繳納稅金","培養國民參與民主的能力，保護國家生命財產安全，並支應政府推動各項公共建設"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 中央與地方政府分工合作","title":"中央與地方政府分工合作","bullets":["我國政府分為中央政府（總統府與五院）及地方政府（縣市政府管理與執行）","中央負責處理全國性公共事務，地方則依在地發展需求執行政策並推動在地建設","中央與地方均設有由民意代表組成的立法機關（立法院、縣市議會）制定法規與監督行政","透過中央與地方分工合作，讓國家政策能在地方落實，貼近人民需求並維護社會穩定"]},{"id":"core-7","type":"core","tag":"G 行人路權維護與跨機關權責","title":"行人路權維護與跨機關權責","bullets":["政府各機關分工合作維護行人路權，解決每年約四百名行人因交通事故死亡問題","行政院提出「行人優先交通安全」政策；立法院通過《行人交通安全設施條例》；縣市政府設置行人優先區；縣市議會監督執行；各地法院依法審判車輛未禮讓致傷案件","地方政府配合中央政策，在學校周邊、醫療院所與車站周邊等人口密集區設置行人優先區","結合跨機關與中央地方力量，改善人行道設施，確保行人通行安全並降低傷亡"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 政策形成前中後的人民參與","title":"政策形成前中後的人民參與","bullets":["人民可透過多種方式參與公共事務，影響公共政策的形成、執行與調整","促進政府與人民雙向溝通，讓政府施政能傾聽民意，使政策更加完善符合需求","政策形成前提出建議（如酒駕事件頻傳呼籲加重罰則）；執行中監督進度；推動後透過集會遊行或民意代表反映訴求","促使政府提高酒駕罰鍰、實施乘客連坐罰與酒測稽查，並結合民間宣導不酒駕觀念"]},{"id":"core-9","type":"core","tag":"I 動物保護政策演進與零撲殺（延伸學習）","title":"動物保護政策演進與零撲殺（延伸學習）","bullets":["西元2013年電影《十二夜》揭露收容所流浪動物12天未被認領即遭安樂死之現象","引發社會熱烈討論，動保團體與民意代表推動立法院於西元2015年修訂《動物保護法》","刪除撲殺條款、加重虐待罰責，並於西元2017年實施零撲殺；後續衍生收容所爆籠與超收問題","政府與民間轉而推動飼主教育、植入晶片登記、宣導不棄養與鼓勵領養，從根源改善問題"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"憲法只規範人民應盡的義務與權利，政府組織與職權是由各地方政府隨意決定的。","right":"憲法是國家根本大法，不僅明確規範人民基本權利與義務，也明確界定中央與地方各級政府的組織與職權。 憲法同時包含人民權利義務與政府組織職權之規範，並非僅規範人民。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"平等權是指政府必須給予所有國民完全一模一樣的資源，因此學校不應該為新住民或身心障礙學生提供額外輔導或設施。","right":"平等係指法律面前一律平等，學校依學生不同需求提供華語補救教學或無障礙設施，是為了消除障礙、達到公平接受教育的實質平等。 實質平等強調尊重差異與按需求提供協助，而非齊頭式給予相同的資源。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"憲法保障言論自由與宗教自由，因此可以在網路社群上隨意發表侮辱他人的言語，或在進行宗教活動時發出巨大噪音干擾鄰居。","right":"憲法規定自由以不侵犯他人、不違背社會公共利益為原則；言論誹謗他人或宗教活動造成噪音污染，均屬違法行為。 自由權設有法律與公共利益界線，不得侵害他人權利。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"受國民教育只是人民享受的權利，如果學生不想上學，家長可以自由決定讓小孩輟學且不會面臨任何後果。","right":"受國民教育既是權利也是義務，6到15歲國民必須接受義務教育，若無故缺課經勸導未改善，家長會被依法處以罰款。 國民教育具備強制的義務性質，無故缺課家長需負法律責任。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"中央政府負責制定所有政策，地方政府只需完全聽命執行，且司法院法院也負責建置地方的人行道與設置行人優先區。","right":"中央與地方政府係分工合作關係，且人行道與行人優先區由地方行政機關（縣市政府）負責建置，各地法院僅負責違規致傷案件之審判。 司法機關負責法律審判，不負責公共工程或行政設施建置。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"零撲殺政策實施後，流浪動物問題就徹底解決了，民眾不需要植入晶片或承擔任何飼主責任。","right":"零撲殺上路後衍生收容所爆籠超收新課題，政府與民間必須透過飼主教育、植入晶片登記與宣導不棄養，從源頭解決流浪動物問題。 法律修訂僅是政策起點，仍需搭配後續管理、飼主教育與源頭防護。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"憲法與基本權利保障｜知識關係","chain":["憲法為國家根本大法與各種法律依據","保障人民平等權（按需求協助）、自由權（不侵犯他人）與參政權（選舉罷免考試公職）","確保主權在民，廣納民意並維護民主社會運作基石"]},{"id":"logic-2","type":"chain","title":"人民三大基本義務｜知識關係","chain":["享有權利的同時需履行憲法規定之基本義務","接受國民教育（6-15歲兼具權利義務）、服兵役（滿18歲男子/志願役女性）與納稅（個人財產及發票）","培養民主參與能力，保護國家安全並支持政府公共建設與服務"]},{"id":"logic-3","type":"chain","title":"中央地方分工與行人路權｜知識關係","chain":["中央（總統府五院）處理全國事務，地方（縣市政府議會）執行政策並推動在地建設","行政院提政策、立法院通過《行人交通安全設施條例》、地方設行人優先區、議會監督、法院審判未禮讓案件","跨機關與中央地方合作，貼近人民需求並保障行人生命安全"]},{"id":"logic-4","type":"chain","title":"人民參與與政策防制（酒駕與動保）｜知識關係","chain":["人民於政策形成前提建議、執行中監督、推動後反映訴求","酒駕議題提高懲罰連坐、加強酒測與宣導；動保修法實施零撲殺並衍生源頭管理課題","政府傾聽民意調整政策，結合民間宣導建立負責任公民社會"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜中央與地方機關維護行人路權分工合作判讀圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜人民三大基本義務之內容與國家功能對照圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["平等權","自由權","平等權旨在保障不論性別、族群或信仰在法律面前一律平等，學校並依學生不同需求提供華語補救或無障礙設施等實質協助；自由權旨在保障居住、信仰、言論與集會之自由，但以不侵犯他人與不違背公共利益為界線。"],["中央政府（總統府與五院）","地方政府（縣市政府與議會）","中央政府負責處理全國性公共事務，由立法院制定全國法律；地方政府負責執行中央政策，依在地需求推動公共建設，並由縣市議會進行質詢與預算監督。"],["權利（如受教育、參政）","義務（如國民教育、服兵役、納稅）","權利係憲法保障人民得自由行使或享受之利益與參與機會；義務係憲法規定個人應盡之強制責任，用以支持國家運作、維持秩序與保護公共安全（其中受國民教育兼具權利與義務雙重性質）。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","憲法","國家的根本大法，為各種法律之依據與民主社會運作基石，明確規範人民基本權利義務及政府組織職權。"],["2","平等權","憲法保障人民不論性別、族群或信仰在法律面前一律平等，學校並依學生不同需求提供實質協助。"],["3","自由權界線","人民享有居住、信仰、言論與集會等自由，但自由以不侵犯他人與不違背社會公共利益為原則。"],["4","參政權","人民直接參與國家政治事務之權利，包含選舉、罷免、參加公務人員考試及擔任公職。"],["5","國民教育義務","6到15歲國民必須接受之義務教育，既是權利也是義務，旨在提高國民素質以參與民主運作。"],["6","納稅義務","人民依收入財產及商家開立發票依法繳納稅金，為政府推動學校、醫療與交通建設之經費來源。"],["7","行人優先區","地方政府配合中央政策，於學校、醫院及車站等人口密集區設置之設施，以保障行人通行安全。"],["8","《行人交通安全設施條例》","立法院於西元2024年4月通過之法律，規範中央與地方訂定計畫改善人行道及設置行人優先區。"],["9","連坐罰與酒精鎖","政府為防制酒駕新增之法令措施，包含對同車乘客開罰及強制車輛加裝酒精鎖，以嚴格抑制酒駕。"],["10","《動物保護法》零撲殺","立法院於西元2015年修法刪除收容所撲殺條款、西元2017年全面停止安樂死之政策，並搭配飼主教育。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"憲法地位與規範範疇","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「憲法」與「一般法律」（如刑法、道路交通管理處罰條例）的效力關係，下列敘述何者最正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"平等權與校園實質協助","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"學校推動「華語補救教學」與建置「無障礙斜坡道、電梯」，其直接發揮的民主社會功能為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"自由權保障與行使界線","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「言論自由」與「惡意誹謗中傷」，下列界線劃分何者正確？"}]}],"cloze":{"core-1":{"selector":".point","terms":["根本大法"]},"core-2":{"selector":".point","terms":["一律平等"]},"core-3":{"selector":".point","terms":["不違背公共利益"]},"core-4":{"selector":".point","terms":["參政權"]},"core-5":{"selector":".point","terms":["接受國民教育、服兵役與納稅"]},"core-6":{"selector":".point","terms":["分工合作"]},"core-7":{"selector":".point","terms":["行人優先區"]},"core-8":{"selector":".point","terms":["參與公共事務"]},"core-9":{"selector":".point","terms":["動物保護法"]},"mindmap-overview":{"selector":".mind-branch p","terms":["根本大法","接受國民教育","行人優先區","執行中監督"]},"trap-1":{"selector":".correct","terms":["根本大法"]},"trap-2":{"selector":".correct","terms":["一律平等"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":["分工合作"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["憲法","平等權","自由權界線","參政權","國民教育義務","納稅義務","行人優先區","《行人交通安全設施條例》","連坐罰與酒精鎖","《動物保護法》零撲殺"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>憲法與基本權利保障\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>憲法為國家根本大法與各種法律依據\u003c/p>\u003cp>\u003cb>關係：\u003c/b>保障人民平等權（按需求協助）、自由權（不侵犯他人）與參政權（選舉罷免考試公職）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>確保主權在民，廣納民意並維護民主社會運作基石\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>人民三大基本義務\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>享有權利的同時需履行憲法規定之基本義務\u003c/p>\u003cp>\u003cb>關係：\u003c/b>接受國民教育（6-15歲兼具權利義務）、服兵役（滿18歲男子/志願役女性）與納稅（個人財產及發票）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>培養民主參與能力，保護國家安全並支持政府公共建設與服務\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>中央地方分工與行人路權\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>中央（總統府五院）處理全國事務，地方（縣市政府議會）執行政策並推動在地建設\u003c/p>\u003cp>\u003cb>關係：\u003c/b>行政院提政策、立法院通過《行人交通安全設施條例》、地方設行人優先區、議會監督、法院審判未禮讓案件\u003c/p>\u003cp>\u003cb>結果：\u003c/b>跨機關與中央地方合作，貼近人民需求並保障行人生命安全\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>人民參與與政策防制（酒駕與動保）\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>人民於政策形成前提建議、執行中監督、推動後反映訴求\u003c/p>\u003cp>\u003cb>關係：\u003c/b>酒駕議題提高懲罰連坐、加強酒測與宣導；動保修法實施零撲殺並衍生源頭管理課題\u003c/p>\u003cp>\u003cb>結果：\u003c/b>政府傾聽民意調整政策，結合民間宣導建立負責任公民社會\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>民主社會是如何運作與維繫？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">政府層級與機關\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">維護行人路權之具體職責\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">核心功能與角色\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>政府層級與機關\u003c/th>\u003cth>維護行人路權之具體職責\u003c/th>\u003cth>核心功能與角色\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>中央行政機關（行政院）\u003c/td>\u003ctd>召集各部會討論研究，提出「行人優先交通安全」政策\u003c/td>\u003ctd>研擬全國性政策與跨部會協調\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中央立法機關（立法院）\u003c/td>\u003ctd>審議並通過《行人交通安全設施條例》等法規與預算\u003c/td>\u003ctd>制定全國統一適用之法律規範\u003c/td>\u003c/tr>\u003ctr>\u003ctd>地方行政機關（縣市政府）\u003c/td>\u003ctd>配合中央政策，於學校、醫院與車站周邊設置行人優先區\u003c/td>\u003ctd>落實在地設施改善與貼近民意需求\u003c/td>\u003c/tr>\u003ctr>\u003ctd>地方立法機關（縣市議會）\u003c/td>\u003ctd>透過質詢與預算審查，監督地方政府執行狀況\u003c/td>\u003ctd>發揮地方民意代表監督行政之功能\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依據「中央行政研擬➔中央立法修法➔地方行政建置➔地方立法監督」的分工順序進行判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論司法院所屬法院負責劃設行人優先區，法院僅於發生車禍未禮讓致傷時進行法律審判。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，立法院與縣市政府在維護行人路權上的具體分工差別為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>立法院負責制定全國性的《行人交通安全設施條例》法律；縣市政府則負責配合政策在地方學校與車站周邊建置「行人優先區」設施。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">義務類別\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">憲法規定內容與實施細節\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對國家發展與社會之功能\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>義務類別\u003c/th>\u003cth>憲法規定內容與實施細節\u003c/th>\u003cth>對國家發展與社會之功能\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>接受國民教育\u003c/td>\u003ctd>6到15歲國民必須接受義務教育，既是權利也是義務（無故缺課家長開罰）\u003c/td>\u003ctd>提高國民素質，培養參與民主社會與經濟發展之能力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服兵役\u003c/td>\u003ctd>男子年滿18歲依法服兵役，女性可依意願報名志願役\u003c/td>\u003ctd>接受軍事訓練保衛家園，維護民眾生命與財產安全\u003c/td>\u003c/tr>\u003ctr>\u003ctd>納稅（個人與商家）\u003c/td>\u003ctd>個人依收入、財產繳稅，商家開立統一發票亦為繳納稅金證明\u003c/td>\u003ctd>提供政府重要經費來源，支應學校、醫療與交通等公共建設\u003c/td>\u003c/tr>\u003ctr>\u003ctd>整體履行意義\u003c/td>\u003ctd>人民履行三項義務，政府運用經費與資源推動各項公共事務\u003c/td>\u003ctd>促進國家社會穩定發展，增進多數人福祉並展現民主精神\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>橫向閱讀各項義務的具體內容，對比其對國家安全、教育與公共建設所產生的功能與意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論受國民教育僅是權利可以自由放棄，亦不能推論女性被強制規定服義務役。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照圖，商家開立統一發票與人民履行納稅義務有何關聯？稅金主要用途為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>發票是商家向政府繳納稅金的證明；稅金主要用於政府興建學校、提供醫療照護與改善交通設施等公共建設。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>憲法與基本權利保障\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>憲法為國家根本大法與各種法律依據\u003c/p>\u003cp>\u003cb>關係：\u003c/b>保障人民平等權（按需求協助）、自由權（不侵犯他人）與參政權（選舉罷免考試公職）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>確保主權在民，廣納民意並維護民主社會運作基石\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>人民三大基本義務\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>享有權利的同時需履行憲法規定之基本義務\u003c/p>\u003cp>\u003cb>關係：\u003c/b>接受國民教育（6-15歲兼具權利義務）、服兵役（滿18歲男子/志願役女性）與納稅（個人財產及發票）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>培養民主參與能力，保護國家安全並支持政府公共建設與服務\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>中央地方分工與行人路權\u003c/h4>\u003cp>\u003cb>線索：\u function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;

mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["根本大法"]},"core-2":{"selector":".point","terms":["一律平等"]},"core-3":{"selector":".point","terms":["不違背公共利益"]},"core-4":{"selector":".point","terms":["參政權"]},"core-5":{"selector":".point","terms":["接受國民教育、服兵役與納稅"]},"core-6":{"selector":".point","terms":["分工合作"]},"core-7":{"selector":".point","terms":["行人優先區"]},"core-8":{"selector":".point","terms":["參與公共事務"]},"core-9":{"selector":".point","terms":["動物保護法"]},"mindmap-overview":{"selector":".mind-branch p","terms":["根本大法","接受國民教育","行人優先區","執行中監督"]},"trap-1":{"selector":".correct","terms":["根本大法"]},"trap-2":{"selector":".correct","terms":["一律平等"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":["分工合作"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["憲法","平等權","自由權界線","參政權","國民教育義務","納稅義務","行人優先區","《行人交通安全設施條例》","連坐罰與酒精鎖","《動物保護法》零撲殺"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

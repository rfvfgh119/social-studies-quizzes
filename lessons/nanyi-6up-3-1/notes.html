t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>南一6上3-1 臺灣經濟的基礎</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"南一版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-1","title":"臺灣經濟的基礎"},"questions":[{"question":"日治初期，臺灣總督府為了克服財政赤字並奠定統治基礎，民政長官後藤新平首先推動了哪些基礎調查？","options":["民生工業調查與出口統計","土地調查與戶口普查","土地改革與農業普查","工商業調查與人口移入調查"],"answer":1,"explanation":"正確答案為(0)。日治初期總督府為了奠定統治基礎，進行土地與戶口調查；選項(1)的土地改革係戰後推動；選項(2)與(3)非日治初期推動的三項基礎調查項目。","concept":"日治初期的財政與三項基本調查","skill":"概念理解","review":"core-1","evidence":"臺灣總督府為了奠定統治基礎,進行土地與戶口調查","id":"q1","stem":"日治初期，臺灣總督府為了克服財政赤字並奠定統治基礎，民政長官後藤新平首先推動了哪些基礎調查？","theme":"日治初期的財政與三項基本調查","explain":"正確答案為(0)。日治初期總督府為了奠定統治基礎，進行土地與戶口調查；選項(1)的土地改革係戰後推動；選項(2)與(3)非日治初期推動的三項基礎調查項目。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"日治時期臺灣總督府為了增加財政收入，實施了專賣制度。下列哪一項屬於當時由總督府統籌專賣的物資？","options":["蔗糖與稻米","紡織品與塑膠","晶圓與半導體","鴉片與樟腦"],"answer":3,"explanation":"正確答案為(1)。課本指出總督府規定鴉片、樟腦、食鹽、菸草與酒類由總督府統籌專賣；選項(0)蔗糖與稻米非專賣物資；選項(2)為戰後民生工業產品；選項(3)為高科技產品。","concept":"專賣制度與基礎建設","skill":"概念理解","review":"core-2","evidence":"規定鴉片、樟腦、食鹽、菸草與酒類等物資由總督府統籌專賣","id":"q2","stem":"日治時期臺灣總督府為了增加財政收入，實施了專賣制度。下列哪一項屬於當時由總督府統籌專賣的物資？","theme":"專賣制度與基礎建設","explain":"正確答案為(1)。課本指出總督府規定鴉片、樟腦、食鹽、菸草與酒類由總督府統籌專賣；選項(0)蔗糖與稻米非專賣物資；選項(2)為戰後民生工業產品；選項(3)為高科技產品。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"日治時期工程師八田與一設計興建了哪一項大型水利工程，取濁水溪與曾文溪水源蓄入烏山頭水庫，使農業產量大幅增加？","options":["石門水庫","翡翠水庫","日月潭水庫","嘉南大圳"],"answer":3,"explanation":"正確答案為(1)。日治時期由工程師八田與一設計興建嘉南大圳與烏山頭水庫以增加農產量；選項(0)石門水庫為戰後美援資助興建；選項(2)、(3)非八田與一設計興建的嘉南平原水利工程。","concept":"日治農業增產與工業化基礎","skill":"概念理解","review":"core-3","evidence":"培育農產新品種與興建嘉南大圳等增加農產量措施","id":"q3","stem":"日治時期工程師八田與一設計興建了哪一項大型水利工程，取濁水溪與曾文溪水源蓄入烏山頭水庫，使農業產量大幅增加？","theme":"日治農業增產與工業化基礎","explain":"正確答案為(1)。日治時期由工程師八田與一設計興建嘉南大圳與烏山頭水庫以增加農產量；選項(0)石門水庫為戰後美援資助興建；選項(2)、(3)非八田與一設計興建的嘉南平原水利工程。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"戰後初期受戰爭破壞與物資匱乏影響，臺灣出現惡性通貨膨脹。政府於民國38年推動幣制改革，其舊臺幣與新臺幣的兌換標準為何？","options":["舊臺幣一元兌換新臺幣四萬元","舊臺幣四十元兌換新臺幣一元","舊臺幣四萬元兌換新臺幣一元","舊臺幣四千元兌換新臺幣一元"],"answer":2,"explanation":"正確答案為(1)。民國38年舊臺幣四萬元僅能兌換新臺幣一元；選項(0)兌換方向顛倒；選項(2)與(3)數值比例錯誤。","concept":"戰後通膨與四萬換一幣制改革","skill":"概念理解","review":"core-4","evidence":"舊臺幣四萬元僅能兌換新臺幣一元","id":"q4","stem":"戰後初期受戰爭破壞與物資匱乏影響，臺灣出現惡性通貨膨脹。政府於民國38年推動幣制改革，其舊臺幣與新臺幣的兌換標準為何？","theme":"戰後通膨與四萬換一幣制改革","explain":"正確答案為(1)。民國38年舊臺幣四萬元僅能兌換新臺幣一元；選項(0)兌換方向顛倒；選項(2)與(3)數值比例錯誤。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"戰後政府依序推動三項土地改革政策，下列哪一項政策的內容是規定佃農繳納的地租以全年收穫量的37.5%為上限？","options":["客廳即工廠","公地放領","耕者有其田","三七五減租"],"answer":3,"explanation":"正確答案為(2)。三七五減租規定佃農須繳納的地租以全年收穫量的37.5%為上限；選項(0)耕者有其田係徵收私有出租地轉賣農民；選項(1)公地放領係釋出公有地供農民購買；選項(3)為50年代工業政策。","concept":"戰後三項土地改革政策","skill":"概念理解","review":"core-5","evidence":"規定佃農須繳納的地租,以全年收穫量的37.5%為上限","id":"q5","stem":"戰後政府依序推動三項土地改革政策，下列哪一項政策的內容是規定佃農繳納的地租以全年收穫量的37.5%為上限？","theme":"戰後三項土地改革政策","explain":"正確答案為(2)。三七五減租規定佃農須繳納的地租以全年收穫量的37.5%為上限；選項(0)耕者有其田係徵收私有出租地轉賣農民；選項(1)公地放領係釋出公有地供農民購買；選項(3)為50年代工業政策。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"民國39年朝鮮半島爆發韓戰，美國為穩定東亞局勢開始援助臺灣。下列哪一項水利設施是美援資助提供經費與技術建設的代表項目？","options":["石門水庫","日月潭水庫","曾文水庫","烏山頭水庫"],"answer":0,"explanation":"正確答案為(1)。政府透過美援提供技術與經費建設基礎設施，代表項目為石門水庫；選項(0)為日治時期嘉南大圳設施；選項(2)、(3)非課本列出的美援水利代表建設。","concept":"韓戰爆發與美援經濟挹注","skill":"概念理解","review":"core-6","evidence":"政府透過美援興建基礎設施,像是提供灌溉、給水、發電與防洪等功能的石門水庫","id":"q6","stem":"民國39年朝鮮半島爆發韓戰，美國為穩定東亞局勢開始援助臺灣。下列哪一項水利設施是美援資助提供經費與技術建設的代表項目？","theme":"韓戰爆發與美援經濟挹注","explain":"正確答案為(1)。政府透過美援提供技術與經費建設基礎設施，代表項目為石門水庫；選項(0)為日治時期嘉南大圳設施；選項(2)、(3)非課本列出的美援水利代表建設。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"民國50年代初期民生工業出現生產過剩，政府為了拓展外銷市場並吸引外商投資，在高雄與臺中等地設立了什麼區域？","options":["加工出口區","新竹科學園區","科技產業園區","自由貿易港區"],"answer":0,"explanation":"正確答案為(1)。民國50年代政府在臺中及高雄等地設立加工出口區拓展外銷；選項(0)新竹科學園區成立於民69年；選項(2)科技產業園區為民110年更名後的名稱；選項(3)非當時設立的名稱。","concept":"民國50年代加工出口區與客廳即工廠","skill":"概念理解","review":"core-7","evidence":"在臺中及高雄等地設立加工出口區","id":"q7","stem":"民國50年代初期民生工業出現生產過剩，政府為了拓展外銷市場並吸引外商投資，在高雄與臺中等地設立了什麼區域？","theme":"民國50年代加工出口區與客廳即工廠","explain":"正確答案為(1)。民國50年代政府在臺中及高雄等地設立加工出口區拓展外銷；選項(0)新竹科學園區成立於民69年；選項(2)科技產業園區為民110年更名後的名稱；選項(3)非當時設立的名稱。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"民國62年爆發第一次石油危機重創全球經濟，臺灣政府推動「十大建設」以因應經濟危機。下列哪一項屬於十大建設中的交通建設項目？","options":["核能發電廠","石油化學工業","大煉鋼廠","中山高速公路"],"answer":3,"explanation":"正確答案為(2)。中山高速公路屬於十大建設中的交通建設；選項(0)核能發電廠為能源建設；選項(1)石化工業與選項(3)大煉鋼廠皆屬於重工業項目。","concept":"民國62年石油危機與十大建設","skill":"概念理解","review":"core-8","evidence":"建設國際機場、港口與高速公路,連結國內外的運輸","id":"q8","stem":"民國62年爆發第一次石油危機重創全球經濟，臺灣政府推動「十大建設」以因應經濟危機。下列哪一項屬於十大建設中的交通建設項目？","theme":"民國62年石油危機與十大建設","explain":"正確答案為(2)。中山高速公路屬於十大建設中的交通建設；選項(0)核能發電廠為能源建設；選項(1)石化工業與選項(3)大煉鋼廠皆屬於重工業項目。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"民國69年政府設立新竹科學園區，帶動臺灣產業轉型。臺灣產業結構在此時期產生了何種主要的轉變？","options":["由高科技產業轉向重工業","由勞力密集轉向技術密集","由農業轉向輕工業代工","由技術密集轉向勞力密集"],"answer":1,"explanation":"正確答案為(2)。近年來國內產業從勞力密集轉向技術密集發展；選項(0)方向倒置；選項(1)與(3)不符民國69年科學園區成立後的轉型方向。","concept":"民國69年新竹科學園區與高科技產業轉型","skill":"概念理解","review":"core-9","evidence":"近年來,隨著國內的產業從勞力密集轉向技術密集發展","id":"q9","stem":"民國69年政府設立新竹科學園區，帶動臺灣產業轉型。臺灣產業結構在此時期產生了何種主要的轉變？","theme":"民國69年新竹科學園區與高科技產業轉型","explain":"正確答案為(2)。近年來國內產業從勞力密集轉向技術密集發展；選項(0)方向倒置；選項(1)與(3)不符民國69年科學園區成立後的轉型方向。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"日治時期總督府推動製糖方式的革新，使得臺灣糖業逐漸邁向工業化。當時新式糖廠主要的改變為何？","options":["完全人工手壓搾取甘蔗汁","依賴太陽曝曬自然發酵製糖","運用牛隻力量轉動蔗車榨汁","運用機械榨出糖蜜並提高產量"],"answer":3,"explanation":"正確答案為(1)。日治時期新式糖廠運用機械榨出糖蜜提高效率與產量；選項(0)傳統糖廍運用牛隻力量榨汁；選項(2)與(3)非新式糖廠的工業化特徵。","concept":"日治農業增產與工業化基礎","skill":"概念理解","review":"core-3","evidence":"新式糖廠運用機械榨出糖蜜","id":"q10","stem":"日治時期總督府推動製糖方式的革新，使得臺灣糖業逐漸邁向工業化。當時新式糖廠主要的改變為何？","theme":"日治農業增產與工業化基礎","explain":"正確答案為(1)。日治時期新式糖廠運用機械榨出糖蜜提高效率與產量；選項(0)傳統糖廍運用牛隻力量榨汁；選項(2)與(3)非新式糖廠的工業化特徵。","reviewText":"核心 3","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 日治初期的財政與三項基本調查","title":"日治初期的財政與三項基本調查","bullets":["日本統治初期臺灣欠缺現代化建設且稅收有限，總督府需靠日本政府資助行政支出。","為了奠定統治基礎並釐清土地與人口狀況，民政長官後藤新平推動各項調查。","警察協助執行土地調查、戶口普查與舊慣調查，掌握社會實情與民間秩序。","三項調查順利釐清產權與人口分布，為日後財政改革與各項建設奠定基礎。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 專賣制度與基礎建設","title":"專賣制度與基礎建設","bullets":["專賣制度是由總督府統籌管控指定物資的生產、買賣與收益管理。","總督府初期面臨財源不足，將鴉片、樟腦、食鹽、菸草與酒類納入專賣。","專賣收入充實總督府財政後，進一步興建縱貫鐵路、基隆港與高雄港。","統一度量衡減少交易紛爭，發行臺灣銀行券建立貨幣制度，推動經濟現代化。"]},{"id":"core-3","type":"core","tag":"C 日治農業增產與工業化基礎","title":"日治農業增產與工業化基礎","bullets":["日治時期臺灣經濟以第一級產業為主，開採林木、礦產並推動農業增產。","政府培育農產新品種，並由工程師八田與一設計興建嘉南大圳與烏山頭水庫。","新式糖廠引進現代化機械榨汁取代傳統牛隻榨汁的糖廍，並由水力發電廠提供電力。","西元1930年代起因應戰爭需求發展機械、造船、煉鋁、石化重工業，邁向半農半工的社會。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 戰後通膨與四萬換一幣制改革","title":"戰後通膨與四萬換一幣制改革","bullets":["戰後受戰爭破壞、物資缺乏與政治經濟混亂影響，臺灣出現惡性通貨膨脹與物價飆升。","舊臺幣過度發行導致幣值嚴重貶值，人民對貨幣失去信任感。","民國38年政府推動幣制改革發行新臺幣，實施舊臺幣四萬元兌換新臺幣一元的標準。","透過重劃貨幣計價單位與貨幣控管政策，逐漸穩定戰後幣值與經濟秩序。"]},{"id":"core-5","type":"core","tag":"E 戰後三項土地改革政策","title":"戰後三項土地改革政策","bullets":["戰後多數農民為佃農，負擔高昂地租與物價壓力，影響耕作意願與生活品質。","民國38年起依序推動三七五減租、公地放領及耕者有其田三項土地改革。","三七五減租規定地租以全年收穫量37.5%為上限；耕者有其田徵收地主出租地轉賣現耕農民。","農民擁有屬於自己的耕地後生產意願大幅提高；地主獲得補償金與股票後轉向投資工業。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 韓戰爆發與美援經濟挹注","title":"韓戰爆發與美援經濟挹注","bullets":["民國39年韓戰爆發，美國為穩定東亞局勢開始對臺灣提供巨額貸款、物資與技術支援。","美援提供脫脂奶粉與麵粉等物資緩解缺糧困境，並配合推行午膳湯與麵食推廣運動。","美援經費與技術資助水利、電力及交通建設，其中指標性水利設施為石門水庫。","政府運用美援資金發展紡織、塑膠、五金等民生工業，滿足國內需求並外銷農產品賺取外匯。"]},{"id":"core-7","type":"core","tag":"G 民國50年代加工出口區與客廳即工廠","title":"民國50年代加工出口區與客廳即工廠","bullets":["民生工業出現生產過剩後，政府鼓勵廠商由進口替代轉向拓展外銷市場。","民國50年代政府在高雄、臺中設立加工出口區，提供免稅與投資環境吸引外商合作。","成衣、鞋類及家電等代工產品大量銷往全球，女性騎腳踏車進入工廠成為重要勞力。","推動客廳即工廠讓家庭主婦投入加工副業，增加家庭收入並補足勞力缺口。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 民國62年石油危機與十大建設","title":"民國62年石油危機與十大建設","bullets":["民國62年西亞爆發戰爭引發第一次石油危機，原油價格大漲重創出口導向的臺灣經濟。","政府推動十大建設以擴大內需，解決生產成本暴增、電力短缺與交通瓶頸問題。","包含交通六項、重工業三項（大煉鋼廠、大造船廠、石油化學工業）與核能發電廠。","歷史比較顯示完工後臺北到高雄車程時間：汽車由約9小時縮短為約4小時，火車由約8小時縮短為約4小時。"]},{"id":"core-9","type":"core","tag":"I 民國69年新竹科學園區與高科技產業轉型","title":"民國69年新竹科學園區與高科技產業轉型","bullets":["奠基於民國50至60年代代工家電產品獲得的電子零組件技術與製造經驗。","政府於民國69年看中新竹理工名校與技術資源，設立新竹科學園區。","引進先進製程與人才發展半導體產業，產業結構由勞力密集轉向技術密集。","在晶圓上先製作微小電路再切割切分出晶片，民國110年加工出口區更名為科技產業園區。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"耕地三七五減租規定農民每戶一律要交出收穫量的37.5%給地主，且土地直接轉為農民所有。","right":"37.5%是地租最高上限非固定繳額，佃農負擔減輕但土地在此階段仍歸地主所有。 課本明確指出地租以全年收穫量的37.5%為上限，減租政策僅減輕租金負擔，尚未轉移土地所有權。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"戰後四萬換一幣制改革是指用新臺幣一元可以換到舊臺幣四萬元現金。","right":"四萬換一是舊臺幣四萬元兌換新臺幣一元，係將貶值的舊貨幣換發為新貨幣。 幣制改革係用高額舊鈔換取1元新鈔以重劃計價單位與穩定幣值，兌換方向為舊臺幣換新臺幣。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"民國40年代美援期間，美國政府出資協助臺灣興建了曾文水庫。","right":"美援經費與技術支援興建的代表性水利基礎設施是石門水庫。 考題與課本明定美援水利建設指標為石門水庫，曾文水庫非美援資助代表項目。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"戰後臺灣的土地改革政策是由民國39年韓戰爆發後的美援資金所發起推動的。","right":"土地改革由政府於民國38年自主發起推動，早於民國39年韓戰美援的到來。 時間軸上耕地三七五減租於民國38年已開始實施，而美援係民國39年韓戰爆發後才提供援助。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"民國60年代政府推動的十大建設包含了設立新竹科學園區與中部科學園區。","right":"十大建設涵蓋重工業、交通與核電廠；科學園區係民國69年成立發展高科技，兩者範疇不同。 十大建設係因應石油危機推動的大型基礎建設，新竹科學園區成立於69年，屬技術密集導向政策。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"十大建設完工後臺北到高雄汽車約4小時、火車約4小時是現今的最新高鐵車程現況。","right":"汽車約9→4小時、火車約8→4小時是課本記載十大建設前後的歷史對比，非現今班表數據。 課本表格為中山高速公路與鐵路電氣化完工前後的歷史時間變化比較，不可拿來當成現代現況。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"日治時期經濟現代化與工業化基礎｜知識關係","chain":["日治初期財政赤字且缺少現代建設","推動三項調查、專賣制度、縱貫鐵路、度量衡與發行臺灣銀行券","興建嘉南大圳、機械化製糖與發電廠，西元1930年代發展重工業邁向半農半工"]},{"id":"logic-2","type":"chain","title":"戰後經濟重整與土地改革｜知識關係","chain":["戰爭破壞與惡性通膨導致物價飆升","發行新臺幣實施四萬換一，並推動三七五減租、公地放領與耕者有其田","穩定戰後幣值與經濟秩序，提高農民耕作意願並促成地主投資工業"]},{"id":"logic-3","type":"chain","title":"美援挹注與50年代出口導向｜知識關係","chain":["民39韓戰爆發獲美援貸款、物資與技術","發展民生工業與興建石門水庫，50年代於高雄臺中設立加工出口區","成衣鞋類家電外銷全球，客廳即工廠與女性勞動力帶動經濟起飛"]},{"id":"logic-4","type":"chain","title":"石油危機、十大建設與科技之島｜知識關係","chain":["民62石油危機致油價大漲與全球經濟受挫","推動十大建設發展重工業、核電廠與交通建設突破發展瓶頸","民69成立新竹科學園區轉型技術密集，民110年加工出口區更名科技產業園區"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜戰後臺灣土地改革三階段推動順序與政策對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜臺灣重大經濟政策因果脈絡與時代里程碑對照表","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["耕地三七五減租","耕者有其田","三七五減租僅規定地租以全年收穫量37.5%為上限，土地仍歸地主所有；耕者有其田係政府徵收地主出租耕地轉賣給現耕農民，使農民取得土地所有權成為土地主人。"],["加工出口區（民國50年代）","新竹科學園區（民國69年）","加工出口區設立於高雄與臺中，主要結合免稅與完善投資環境吸引外商，發展成衣、鞋類與家電等勞力密集代工外銷；新竹科學園區成立於新竹，結合理工人才與引進技術發展半導體晶片等技術密集高科技產業。"],["日治時期臺灣銀行券","戰後新臺幣","臺灣銀行券為日治時期總督府統一度量衡後由臺灣銀行發行的現代金融貨幣；新臺幣係戰後民國38年政府為因應惡性通貨膨脹，實施舊臺幣四萬元兌換新臺幣一元所發行的貨幣。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","專賣制度","日治總督府將鴉片、樟腦、食鹽、菸草及酒類等指定物資由官方統籌專賣，以增加政府財政收入。"],["2","臺灣銀行券","日治時期由臺灣銀行發行的貨幣，奠定臺灣現代金融與貨幣交易制度的基礎。"],["3","嘉南大圳","日治時期由工程師八田與一設計興建的大型水利工程，取濁水溪與曾文溪水源供烏山頭水庫蓄水，大幅增加水田面積與稻米產量。"],["4","四萬換一","戰後民國38年政府因應惡性通貨膨脹發行新臺幣，訂定舊臺幣四萬元兌換新臺幣一元的貨幣換發標準。"],["5","三七五減租","戰後民國38年實施的土地改革政策，規定佃農繳納地租以全年收穫量的37.5%為上限，有效減輕佃農負擔。"],["6","耕者有其田","民國42年實施的土地改革政策，政府依法徵收地主過多之出租耕地轉賣現耕農民，幫助佃農成為土地主人。"],["7","美援","民國39年韓戰爆發後美國向臺灣提供的巨額貸款、物資（如麵粉、奶粉）及技術支援，資助石門水庫等基礎建設。"],["8","加工出口區","民國50年代政府於高雄與臺中設立的工業區域，提供完善投資環境吸引外資，發展成衣、鞋類及家電外銷。"],["9","十大建設","民國60年代政府因應石油危機所推動的大型公共建設，涵蓋交通六項、重工業三項與核能發電廠。"],["10","新竹科學園區","民國69年政府於新竹成立的科技園區，結合國內外人才與家電代工累積的電子技術，帶動臺灣產業向技術密集轉型。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜因果推論","clue":"日治初期的財政與三項基本調查","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"日治初期臺灣較欠缺現代化建設且稅收有限，甚至需要日本政府資助行政支出。總督府推動各項財政改革與建設的前提因果為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜證據判讀","clue":"專賣制度與基礎建設", cp>\u003cb>關係：\u003c/b>推動三項調查、專賣制度、縱貫鐵路、度量衡與發行臺灣銀行券\u003c/p>\u003cp>\u003cb>結果：\u003c/b>興建嘉南大圳、機械化製糖與發電廠，西元1930年代發展重工業邁向半農半工\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>戰後經濟重整與土地改革\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>戰爭破壞與惡性通膨導致物價飆升\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發行新臺幣實施四萬換一，並推動三七五減租、公地放領與耕者有其田\u003c/p>\u003cp>\u003cb>結果：\u003c/b>穩定戰後幣值與經濟秩序，提高農民耕作意願並促成地主投資工業\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>美援挹注與50年代出口導向\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>民39韓戰爆發獲美援貸款、物資與技術\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展民生工業與興建石門水庫，50年代於高雄臺中設立加工出口區\u003c/p>\u003cp>\u003cb>結果：\u003c/b>成衣鞋類家電外銷全球，客廳即工廠與女性勞動力帶動經濟起飛\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>石油危機、十大建設與科技之島\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>民62石油危機致油價大漲與全球經濟受挫\u003c/p>\u003cp>\u003cb>關係：\u003c/b>推動十大建設發展重工業、核電廠與交通建設突破發展瓶頸\u003c/p>\u003cp>\u003cb>結果：\u003c/b>民69成立新竹科學園區轉型技術密集，民110年加工出口區更名科技產業園區\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>臺灣經濟的基礎\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">政策名稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">核心內容與作法\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">土地所有權與對農民影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>政策名稱\u003c/th>\u003cth>核心內容與作法\u003c/th>\u003cth>土地所有權與對農民影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>耕地三七五減租（民國38年）\u003c/td>\u003ctd>規定地租以全年收穫量的37.5%為上限\u003c/td>\u003ctd>土地仍歸地主所有，減輕佃農租金負擔與負擔壓力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公地放領（民國40年起）\u003c/td>\u003ctd>政府釋出公有出租耕地供現耕佃農購買\u003c/td>\u003ctd>農民可購買公有地，逐步擁有屬於自己的耕地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>耕者有其田（民國42年）\u003c/td>\u003ctd>政府徵收地主部分出租耕地轉賣現耕農民\u003c/td>\u003ctd>佃農成為土地主人提高生產意願，地主轉投資工業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>土地改革整體綜效\u003c/td>\u003ctd>改善農村生活品質並促進產業轉型\u003c/td>\u003ctd>農業生產增加穩定社會，地主資本轉入民生工業發展\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間順序從三七五減租（改租金上限）→ 公地放領（賣公有地）→ 耕者有其田（徵收出租私地轉賣佃農）進行判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論耕地三七五減租實施後農民就立即免費獲得地主的私有土地。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>戰後政府推動的哪一項土地改革政策，讓佃農真正獲得地主的出租土地並成為土地主人？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>耕者有其田。因為政府依法徵收地主過多之出租耕地並轉賣給現耕農民，幫助佃農成為土地主人。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">歷史時期與契機\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">面臨困境或轉型背景\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">關鍵政策措施與建設成果\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>歷史時期與契機\u003c/th>\u003cth>面臨困境或轉型背景\u003c/th>\u003cth>關鍵政策措施與建設成果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日治時期（1895-1945）\u003c/td>\u003ctd>財政赤字與物產運銷需求\u003c/td>\u003ctd>推動調查與專賣充實財政，興建縱貫鐵路、嘉南大圳與新式糖廠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國40年代（進口替代）\u003c/td>\u003ctd>戰後物資短缺與韓戰爆發\u003c/td>\u003ctd>運用美援物資與貸款，興建石門水庫，發展紡織與五金等民生工業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國50年代（出口導向）\u003c/td>\u003ctd>民生工業生產過剩需求外銷\u003c/td>\u003ctd>設立高雄與臺中加工出口區，推動客廳即工廠，外銷成衣與家電\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國60-70年代（重工業與高科技）\u003c/td>\u003ctd>石油危機油價暴漲與工資上升\u003c/td>\u003ctd>推動十大建設（核電/交通/重工業），民69成立新竹科學園區發展半導體\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按歷史時間軸自日治基礎、民國40年代美援、50年代出口導向至60-70年代十大建設與高科技進行橫向比對。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論十大建設與新竹科學園區是同一個時期為了同一目的而同時成立的建設。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>民國62年第一次石油危機爆發後，政府採取了什麼大型建設政策來突破國內工業發展瓶頸？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>推動十大建設。透過興建核能發電廠穩定電力、建設交通陸港空設施，並發展石化、鋼鐵與造船重工業以擴大內需。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>日治時期經濟現代化與工業化基礎\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>日治初期財政赤字且缺少現代建設\u003c/p>\u003cp>\u003cb>關係：\u003c/b>推動三項調查、專賣制度、縱貫鐵路、度量衡與發行臺灣銀行券\u003c/p>\u003cp>\u003cb>結果：\u003c/b>興建嘉南大圳、機械化製糖與發電廠，西元1930年代發展重工業邁向半農半工\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>戰後經濟重整與土地改革\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>戰爭破壞與惡性通膨導致物價飆升\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發行新臺幣實施四萬換一，並推動三七五減租、公地放領與耕者有其田\u003c/p>\u003cp>\u003cb>結果：\u003c/b>穩定戰後幣值與經濟秩序，提高農民耕作意願並促成地主投資工業\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>美援挹注與50年代出口導向\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>民39韓戰爆發獲美援貸款、物資與技術\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展民生工業與興建石門水庫，50年代於高雄臺中設立加工出口區\u003c/p>\u003cp>\u003cb>結果：\u003c/b>成衣鞋類家電外銷全球，客廳即工廠與女性勞動力帶動經濟起飛\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>石油危機、十大建設與科技之島\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>民62石油危機致油價大漲與全球經濟受挫\u003c/p>\u003cp>\u003cb>關係：\u003c/b>推動十大建設發展重工業、核電廠與交通建設突破發展瓶頸\u003c/p>\u003cp>\u003cb>結果：\u003c/b>民69成立新竹科學園區轉型技術密集，民110年加工出口區更名科技產業園區\u003c/p>\u003c/section>\u003cdiv class= function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;

mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["土地調查、戶口普查與舊慣調查"]},"core-2":{"selector":".point","terms":["鴉片、樟腦、食鹽、菸草與酒類"]},"core-3":{"selector":".point","terms":["半農半工的社會"]},"core-4":{"selector":".point","terms":["舊臺幣四萬元兌換新臺幣一元"]},"core-5":{"selector":".point","terms":["三七五減租、公地放領及耕者有其田"]},"core-6":{"selector":".point","terms":["石門水庫"]},"core-7":{"selector":".point","terms":["客廳即工廠"]},"core-8":{"selector":".point","terms":["十大建設"]},"core-9":{"selector":".point","terms":["技術密集"]},"mindmap-overview":{"selector":".mind-branch p","terms":["專賣制度、縱貫鐵路","耕者有其田","加工出口區","新竹科學園區"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":["舊臺幣四萬元兌換新臺幣一元"]},"trap-3":{"selector":".correct","terms":["石門水庫"]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":["十大建設"]},"trap-6":{"selector":".correct","terms":["十大建設"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["專賣制度","臺灣銀行券","嘉南大圳","四萬換一","三七五減租","耕者有其田","美援","加工出口區","十大建設","新竹科學園區"]}};

function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒5上4-1 大航海時代臺灣如何登上世界舞臺？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"4-1","title":"大航海時代臺灣如何登上世界舞臺？"},"questions":[{"question":"臺灣四面環海且位居交通樞紐，關於早期與現代臺灣的海洋交流景象，下列敘述何者正確？","options":["史前時代的臺灣完全孤立，沒有與任何島外族群有過交流","臺灣因位於亞洲西部，自古缺乏對外海運航線","高雄港是史前時代荷蘭人興建的國際貨櫃大港","東南亞遺址出土臺灣豐田玉，證實史前時代即有跨海交流"],"answer":3,"explanation":"東南亞考古遺址發現來自臺灣花蓮的豐田玉，證實史前時代住在臺灣的人們即已進行跨海交流。(0)忽視史前玉器交流事實；(2)高雄港為現代港口；(3)臺灣位於亞洲東部而非西部。","concept":"史前跨海交流與現代高雄港","skill":"概念理解","review":"core-1","evidence":"臺灣四面環海，早在史前時代，住在臺灣的人們就與島外有跨海交流。","id":"q1","stem":"臺灣四面環海且位居交通樞紐，關於早期與現代臺灣的海洋交流景象，下列敘述何者正確？","theme":"史前跨海交流與現代高雄港","explain":"東南亞考古遺址發現來自臺灣花蓮的豐田玉，證實史前時代住在臺灣的人們即已進行跨海交流。(0)忽視史前玉器交流事實；(2)高雄港為現代港口；(3)臺灣位於亞洲東部而非西部。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"十五至十七世紀歐洲人遠洋航行的知識與技術顯著提升，開啟了大航海時代，其最主要的驅動原因為何？","options":["歐洲人喜愛亞洲瓷器、絲綢與香料，欲尋找海上新航路以降低運輸成本","歐洲人為了尋找雪景旅遊與考察高山地形","歐洲各國為了響應清帝國海禁政策而開闢航線","歐洲商人為了將高鐵技術與電報引進亞洲國家"],"answer":0,"explanation":"歐洲人極為喜愛亞洲的瓷器、絲綢與香料等商品，過去經陸路運輸價格昂貴，因而發展航海技術尋找海上新航道。(0)非觀光目的；(2)當時中國尚為明帝國；(3)高鐵與電報為現代科技。","concept":"大航海時代的背景與新航路","skill":"概念理解","review":"core-2","evidence":"西元十五到十七世紀之間，歐洲人遠洋航行的知識和技術提升，開始大規模探索世界各地","id":"q2","stem":"十五至十七世紀歐洲人遠洋航行的知識與技術顯著提升，開啟了大航海時代，其最主要的驅動原因為何？","theme":"大航海時代的背景與新航路","explain":"歐洲人極為喜愛亞洲的瓷器、絲綢與香料等商品，過去經陸路運輸價格昂貴，因而發展航海技術尋找海上新航道。(0)非觀光目的；(2)當時中國尚為明帝國；(3)高鐵與電報為現代科技。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"在大航海時代，亞洲的「香料」成為歐洲商人極力尋找的高價值商品，香料在當時主要有哪些用途？","options":["作為驅動遠洋蒸汽船隻的主要燃料","作為興建城堡的建築石材與黏著劑","用來保存食物與提升食物的風味","用來製造鋼鐵武器與防禦盔甲"],"answer":2,"explanation":"香料是保存食物與提升風味的重要原料，主產於亞洲，在歐洲價格昂貴且極具商業價值。(0)、(2)、(3)皆非香料的功能與用途。","concept":"亞洲重要商品香料的價值","skill":"概念理解","review":"core-3","evidence":"香料是保存食物與提升風味的重要原料，亞洲為全球主要產區之一。","id":"q3","stem":"在大航海時代，亞洲的「香料」成為歐洲商人極力尋找的高價值商品，香料在當時主要有哪些用途？","theme":"亞洲重要商品香料的價值","explain":"香料是保存食物與提升風味的重要原料，主產於亞洲，在歐洲價格昂貴且極具商業價值。(0)、(2)、(3)皆非香料的功能與用途。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"在大航海時代，臺灣之所以吸引東亞海商與歐洲各國前來建立貿易據點，核心的地理優勢為何？","options":["位於亞洲東部航道上，介於日本與東南亞之間且接近中國市場","擁有貫穿東亞高山的現代鐵路轉運樞紐","擁有全球產量最多的天然黃金與白銀礦脈","位於太平洋中央，距離歐美各國只有數十公尺"],"answer":0,"explanation":"臺灣位於亞洲東部海上貿易航道上，介於日本和東南亞之間，非常適合建立據點以方便與中國、日本進行貿易。(1)區位與距離錯誤；(2)非黃金白銀礦區；(3)當時無鐵路。","concept":"臺灣的地理位置與貿易據點優勢","skill":"概念理解","review":"core-4","evidence":"臺灣位在日本和東南亞之間，很適合在這裡建立據點，方便與中國、日本進行貿易。","id":"q4","stem":"在大航海時代，臺灣之所以吸引東亞海商與歐洲各國前來建立貿易據點，核心的地理優勢為何？","theme":"臺灣的地理位置與貿易據點優勢","explain":"臺灣位於亞洲東部海上貿易航道上，介於日本和東南亞之間，非常適合建立據點以方便與中國、日本進行貿易。(1)區位與距離錯誤；(2)非黃金白銀礦區；(3)當時無鐵路。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"十七世紀活躍於東亞海域的大海商鄭芝龍，在當時的海上貿易中具有何種強大勢力？","options":["率領西班牙軍隊占領澎湖並興建聖薩爾瓦多城","駕駛蒸汽輪船將臺灣高山茶大量銷往英國","代表荷蘭東印度公司擔任首任臺灣總督","建立了龐大的海上商業船隊，長期經營中國東南沿海、臺灣、日本與東南亞貿易"],"answer":3,"explanation":"鄭芝龍建立了龐大的商業船隊，長期經營中國東南沿海、臺灣、日本與東南亞海域的海上貿易，後任明朝官員。(1)鄭芝龍非荷蘭總督；(2)當時無蒸汽輪船；(3)聖薩爾瓦多城為西班牙人所建。","concept":"早期中南海商與鄭芝龍海上勢力","skill":"概念理解","review":"core-5","evidence":"鄭芝龍長期經營中國東南沿海、臺灣、日本與東南亞海域的海上貿易，具有龐大勢力。","id":"q5","stem":"十七世紀活躍於東亞海域的大海商鄭芝龍，在當時的海上貿易中具有何種強大勢力？","theme":"早期中南海商與鄭芝龍海上勢力","explain":"鄭芝龍建立了龐大的商業船隊，長期經營中國東南沿海、臺灣、日本與東南亞海域的海上貿易，後任明朝官員。(1)鄭芝龍非荷蘭總督；(2)當時無蒸汽輪船；(3)聖薩爾瓦多城為西班牙人所建。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"西方世界常稱呼臺灣為「福爾摩沙」（Formosa），這個稱呼最初是如何出現並傳播開來的？","options":["鄭成功登陸安平時向全世界宣告的漢人稱號","由荷蘭東印度公司在臺灣建城時頒布的官方國名","西班牙人在馬尼拉簽署貿易協定時人工發明的稱呼","十六世紀葡萄牙人航經臺灣時讚歎「Ilha Formosa」，後被歐洲地圖繪製標記"],"answer":3,"explanation":"十六世紀葡萄牙人航經臺灣讚歎「Ilha Formosa」（美麗之島），後被歐洲地圖標記為Formosa而傳播全球。(0)非荷蘭官方國名；(2)非西班牙人發明；(3)非鄭成功宣告。","concept":"福爾摩沙名稱的由來與傳播","skill":"概念理解","review":"core-6","evidence":"十六世紀歐洲人航行經過臺灣時，讚歎臺灣為「Ilha Formosa」，意思是美麗之島","id":"q6","stem":"西方世界常稱呼臺灣為「福爾摩沙」（Formosa），這個稱呼最初是如何出現並傳播開來的？","theme":"福爾摩沙名稱的由來與傳播","explain":"十六世紀葡萄牙人航經臺灣讚歎「Ilha Formosa」（美麗之島），後被歐洲地圖標記為Formosa而傳播全球。(0)非荷蘭官方國名；(2)非西班牙人發明；(3)非鄭成功宣告。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"荷蘭人在西元1624年來到臺灣南部（大員/今臺南安平）建立貿易據點前，最初曾欲占領哪一個島嶼但遭明帝國軍隊驅逐？","options":["綠島","蘭嶼","澎湖","馬祖"],"answer":2,"explanation":"荷蘭人最初從巴達維亞出發占領澎湖，被統治澎湖的明帝國軍隊驅逐後，於西元1624年轉往臺灣南部建立據點。(1)、(2)、(3)非荷蘭人當年初攻被明朝驅離之地。","concept":"荷蘭人在臺建立據點的歷程","skill":"概念理解","review":"core-7","evidence":"荷蘭人原本占領澎湖，但被當時統治澎湖的明帝國軍隊驅逐，後來他們在西元1624年來到大員","id":"q7","stem":"荷蘭人在西元1624年來到臺灣南部（大員/今臺南安平）建立貿易據點前，最初曾欲占領哪一個島嶼但遭明帝國軍隊驅逐？","theme":"荷蘭人在臺建立據點的歷程","explain":"荷蘭人最初從巴達維亞出發占領澎湖，被統治澎湖的明帝國軍隊驅逐後，於西元1624年轉往臺灣南部建立據點。(1)、(2)、(3)非荷蘭人當年初攻被明朝驅離之地。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"西班牙人經由太平洋北上來到臺灣北部（雞籠、淡水）建立據點，其主要的目的為何？","options":["為了與荷蘭人合資興建高雄國際貨櫃港","為了競爭東亞商業利益，並將中國商品轉運至日本與菲律賓馬尼拉","為了協助鄭芝龍在宜蘭開闢水稻田","為了向明帝國申請開採花蓮的豐田玉礦"],"answer":1,"explanation":"西班牙人為競爭東亞商業利益，從其亞洲據點馬尼拉北上臺灣北部建立據點，轉運中國商品至日本與菲律賓。(0)當時無高雄貨櫃港；(2)豐田玉為史前交流；(3)非協助鄭芝龍種稻。","concept":"西班牙人在臺北部的經營航線","skill":"概念理解","review":"core-8","evidence":"西班牙人隨後經由太平洋北上，來到臺灣北部展開經營……轉運中國的商品至日本和菲律賓。","id":"q8","stem":"西班牙人經由太平洋北上來到臺灣北部（雞籠、淡水）建立據點，其主要的目的為何？","theme":"西班牙人在臺北部的經營航線","explain":"西班牙人為競爭東亞商業利益，從其亞洲據點馬尼拉北上臺灣北部建立據點，轉運中國商品至日本與菲律賓。(0)當時無高雄貨櫃港；(2)豐田玉為史前交流；(3)非協助鄭芝龍種稻。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"當臺灣進入大航海時代時，中國歷經了哪兩個政權更替的歷史時期？","options":["唐朝與宋朝","明帝國與清帝國","秦朝與漢朝","元朝與中華民國"],"answer":1,"explanation":"課文明確指出，當臺灣進入大航海時代時，中國經歷了明帝國與清帝國兩個時期。(0)、(2)、(3)皆非大航海時代對應之中國政權時期。","concept":"大航海時期中國政權更替與臺灣","skill":"概念理解","review":"core-9","evidence":"當臺灣進入大航海時代時，中國則經歷了明帝國與清帝國兩個時期。","id":"q9","stem":"當臺灣進入大航海時代時，中國歷經了哪兩個政權更替的歷史時期？","theme":"大航海時期中國政權更替與臺灣","explain":"課文明確指出，當臺灣進入大航海時代時，中國經歷了明帝國與清帝國兩個時期。(0)、(2)、(3)皆非大航海時代對應之中國政權時期。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"荷蘭人在亞洲建立的核心貿易據點「巴達維亞」，位於現今的哪一個國家境內？","options":["越南","印尼","日本","菲律賓"],"answer":1,"explanation":"巴達維亞位於今印尼（雅加達），為十七世紀荷蘭東印度公司在亞洲的總部與貿易核心據點。(0)日本為貿易對象；(1)馬尼拉位於菲律賓（西班牙據點）；(3)非越南。","concept":"荷蘭人在臺建立據點的歷程","skill":"概念理解","review":"core-7","evidence":"巴達維亞(今印尼)","id":"q10","stem":"荷蘭人在亞洲建立的核心貿易據點「巴達維亞」，位於現今的哪一個國家境內？","theme":"荷蘭人在臺建立據點的歷程","explain":"巴達維亞位於今印尼（雅加達），為十七世紀荷蘭東印度公司在亞洲的總部與貿易核心據點。(0)日本為貿易對象；(1)馬尼拉位於菲律賓（西班牙據點）；(3)非越南。","reviewText":"核心 7","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 史前跨海交流與現代高雄港","title":"史前跨海交流與現代高雄港","bullets":["史前時代臺灣人類即有跨海交流，現代高雄港則是全球重要貨櫃港。","史前受限於航海技術多為區域性交流，今日臺灣則成為亞洲東部交通樞紐。","東南亞考古遺址發現來自臺灣的豐田玉；高雄港擁有通向世界各國的海運航線。","展現臺灣四面環海、在不同時代連結島外人群與全球航運體系的重要地位。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 大航海時代的背景與新航路","title":"大航海時代的背景與新航路","bullets":["大航海時代指十五到十七世紀歐洲人提升遠洋技術並大規模探索世界的時期。","歐洲人極為喜愛亞洲的瓷器、絲綢與香料等商品，但過去經由陸路運輸昂貴且取得不易。","歐洲商人發展航運技術開啟海上貿易新航路，以海上運輸取代昂貴的陸路。","海洋成為世界各地商品交流通道，促進了歐亞貿易往來、文化交流與宗教傳播。"]},{"id":"core-3","type":"core","tag":"C 亞洲重要商品香料的價值","title":"亞洲重要商品香料的價值","bullets":["香料是保存食物與提升風味的重要原料，亞洲為全球主要產區之一。","歐洲缺乏香料，而陸路運輸被阻隔導致香料在歐洲價格極為昂貴。","歐洲商人如荷蘭人遠航至亞洲（如印尼巴達維亞）尋找並採購香料。","香料貿易直接驅動歐洲船隊航向東亞，進而注意到臺灣的地理位置。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 臺灣的地理位置與貿易據點優勢","title":"臺灣的地理位置與貿易據點優勢","bullets":["臺灣位於亞洲東部海上貿易航線上，介於日本與東南亞之間。","歐洲商人欲取得中國瓷器絲綢並與日本貿易，需要適當的海上轉運與補給據點。","歐洲各國與東亞海商選擇臺灣作為貿易據點與航運中繼站。","便利的區位使臺灣吸引多國勢力前來，逐漸登上世界貿易舞臺。"]},{"id":"core-5","type":"core","tag":"E 早期中南海商與鄭芝龍海上勢力","title":"早期中南海商與鄭芝龍海上勢力","bullets":["十六世紀以來中國與日本海商即到臺灣交易，鄭芝龍更建立了龐大的海上商業船隊。","明帝國實施海禁限制對外貿易，海商利用臺灣進行走私與補給物資。","鄭芝龍長期經營中國東南沿海、臺灣、日本與東南亞海域貿易，後招撫為明朝官員。","龐大的海商勢力奠定了臺灣在東亞海上貿易網絡中的活躍地位。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 福爾摩沙名稱的由來與傳播","title":"福爾摩沙名稱的由來與傳播","bullets":["「福爾摩沙」（Formosa）是西方世界對臺灣島的經典稱呼，意為美麗之島。","十六世紀葡萄牙人航行經過臺灣時，讚歎臺灣自然風光為「Ilha Formosa」。","歐洲人隨後繪製的地圖將臺灣標記為「Formosa」，並將此名稱傳播至全球。","使西方世界開始認識這座位於東亞航線上的美麗島嶼。"]},{"id":"core-7","type":"core","tag":"G 荷蘭人在臺建立據點的歷程","title":"荷蘭人在臺建立據點的歷程","bullets":["荷蘭人航行臺灣海峽，率先在臺灣南部（今臺南安平/大員）建立貿易據點。","荷蘭人原本從亞洲據點巴達維亞出發欲佔領澎湖，但遭明帝國武力驅趕。","西元1624年荷蘭人轉往臺灣南部登陸並建立據點，進行轉口貿易。","展開與中國、日本及東南亞之間的貿易，確認臺灣在國際貿易上的重要性。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 西班牙人在臺北部的經營航線","title":"西班牙人在臺北部的經營航線","bullets":["西班牙人經由太平洋北上，來到臺灣北部（雞籠、淡水）展開經營。","西班牙人為競爭東亞商業利益，從其亞洲據點馬尼拉北上臺灣。","西班牙人在北部建立據點，轉運中國的商品至日本和菲律賓。","形成南部荷蘭人與北部西班牙人南北對峙並存的東亞貿易競爭局勢。"]},{"id":"core-9","type":"core","tag":"I 大航海時期中國政權更替與臺灣","title":"大航海時期中國政權更替與臺灣","bullets":["臺灣進入大航海時代時，中國歷經明帝國與清帝國兩個時期。","十七世紀中葉清軍攻入福建，明帝國走向覆滅，東南沿海政局劇烈動盪。","海商鄭芝龍投降清帝國，但因其子鄭成功堅持抗清，鄭芝龍最終仍被殺害。","反映了大航海時代東亞局勢與東南沿海政局變遷的緊密交織。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"大航海時代歐洲人冒險航向亞洲，主要是為了進行雪景觀光與考察高山地形。","right":"歐洲人航向亞洲主要是為了取得高價值的瓷器、絲綢、香料與白銀等商品。 課文明確指出十五至十七世紀歐洲商人因喜愛亞洲商品且陸運昂貴，才開啟海上貿易新航路，核心動機是商業利益而非觀光。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"荷蘭人來到臺灣建立據點前，在亞洲的主要據點是馬尼拉。","right":"荷蘭人在亞洲的主要據點是巴達維亞（印尼）；馬尼拉是西班牙人的亞洲據點。 空間據點不可混淆，巴達維亞（今雅加達）為荷蘭東印度公司總部，西班牙人才以菲律賓馬尼拉為據點。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"荷蘭人最初占領澎湖作為據點時，是被清帝國的軍隊武力驅趕而轉往臺灣。","right":"荷蘭人占領澎湖時，是被當時統治澎湖的「明帝國」軍隊驅逐。 歷史年代與政權不可錯置，西元1624年荷蘭人轉往臺灣時，中國尚處於明帝國時期，清帝國尚未入主中原。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"「福爾摩沙（Formosa）」這個名稱最早是荷蘭人在臺灣建立城堡時所命名的官方國名。","right":"「福爾摩沙」源自十六世紀葡萄牙人航經臺灣時讚歎的「Ilha Formosa」（美麗之島），後被歐洲地圖沿用。 稱呼由來需對應族群，葡萄牙人航經讚歎並留名，非荷蘭人的官方城堡命名。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"在大航海時代，西班牙人率先在臺灣南部登陸，荷蘭人則隨後在臺灣北部建立據點。","right":"荷蘭人率先在臺灣「南部」建立據點；西班牙人隨後經太平洋北上在臺灣「北部」經營。 南北地理空間與先後順序不可顛倒，荷蘭在南（安平/大員）、西班牙在北（雞籠/淡水）。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"史前時代的臺灣人類因為航海技術落後，完全沒有與臺灣島外的任何族群有過交流。","right":"史前時代住在臺灣的人們已有跨海交流（如東南亞遺址出土臺灣豐田玉），但受限技術多為區域性交流。 考古證據證實史前即有跨海互動，大航海時代是將交流範圍擴大至全球，非史前完全孤立。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"海洋交流與區位優勢｜知識關係","chain":["史前時代即有區域性跨海交流且位於亞洲東部樞紐","西臨臺灣海峽繁忙航道並擁有高雄港等國際貨櫃港","奠定在全球海運體系與東亞交通上的重要地位"]},{"id":"logic-2","type":"chain","title":"歐亞新航路與商品需求｜知識關係","chain":["十五世紀歐洲人喜愛瓷器絲綢與香料但陸運昂貴","發展遠洋造船技術並開闢經好望角與印度洋的海上新航路","促進全球商品流動、歐亞貿易密切與文化宗教傳播"]},{"id":"logic-3","type":"chain","title":"東亞海商與福爾摩沙｜知識關係","chain":["十六世紀海商集結與葡萄牙人航經讚歎美麗之島","鄭芝龍建立龐大商業船隊經營東南沿海至日本東南亞貿易","歐洲地圖標記Formosa使臺灣知名度躍上國際舞臺"]},{"id":"logic-4","type":"chain","title":"歐洲勢力競逐臺灣據點｜知識關係","chain":["臺灣位於日本與東南亞之間且接近中國貿易市場","荷蘭由巴達維亞經澎湖遭明驅轉往南部；西班牙由馬尼拉北上據北部","確立臺灣在國際貿易與交通往來上的重要戰略位置"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜大航海時代外來海商與歐洲勢力在臺據點對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜臺灣登上世界舞臺之地理因果與發展流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["荷蘭人的來臺路線與據點","西班牙人的來臺路線與據點","荷蘭人從亞洲據點巴達維亞出發，經澎湖（遭明軍驅離）轉往臺灣南部（安平/大員）建據點；西班牙人則從亞洲據點馬尼拉經太平洋北上，在臺灣北部（雞籠、淡水）建立據點。"],["大航海時代以前的歐亞貿易","大航海時代的歐亞貿易","大航海時代以前商品大多經由陸上運輸，取得不易且價格極昂貴；大航海時代（15-17世紀）歐洲人遠洋技術提升，改以海上航路大量運輸，使全球商品流動與文化交流更加密切。"],["鄭芝龍的海商貿易","葡萄牙人的福爾摩沙稱呼","鄭芝龍是十七世紀建立龐大商業船隊並經營東南沿海、臺灣、日本與東南亞貿易的海商；葡萄牙人則是十六世紀航經臺灣海峽時讚歎「Ilha Formosa」（美麗之島），使臺灣以Formosa知名於歐洲地圖。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","大航海時代","西元十五到十七世紀之間，歐洲人遠洋航行知識與技術提升，大規模探索世界各地並密切開展歐亞海上貿易的時期。"],["2","香料","保存食物與提升風味的重要原料，主產於亞洲，在大航海時代是歐洲商人極欲取得的高價值亞洲商品之一。"],["3","巴達維亞","位於今印尼雅加達，為十七世紀荷蘭東印度公司在亞洲的核心貿易據點，荷蘭人即由此出發前往澎湖與臺灣。"],["4","馬尼拉","位於今菲律賓，為十七世紀西班牙人在亞洲的核心貿易據點，西班牙人即由此搭船北上來到臺灣北部。"],["5","福爾摩沙","源自葡萄牙語「Ilha Formosa」（美麗之島），為十六世紀葡萄牙航海家讚歎臺灣風光留下的稱呼，後常被西方代表臺灣。"],["6","鄭芝龍","十七世紀活躍於東亞海域的大海商，建立龐大商業船隊經營中、臺、日及東南亞貿易，後任明朝官員，為鄭成功之父。"],["7","高雄港","位於臺灣西南部的國際港口，緊鄰臺灣海峽樞紐，擁有通往全球的航線，現為全球重要的貨櫃港之一。"],["8","豐田玉","產於臺灣花蓮壽豐的優質玉石，在東南亞考古遺址中被發現，為臺灣史前人類已具備跨海區域交流的物證。"],["9","大員","位於今臺南市安平區，因地理位置優越且便於船舶停泊，西元1624年成為荷蘭人在臺灣南部建立的第一個貿易據點。"],["10","明帝國","大航海時代初中期統治中國的政權，曾派軍隊將占領澎湖的荷蘭人驅趕，迫使荷蘭人於西元1624年轉往臺灣。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"荷西來臺路線與據點比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較十七世紀「荷蘭人」與「西班牙人」在亞洲的核心據點及其在臺灣建立據點的空間分布，下列組合何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"大航海時代新航路開啟之因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"歐洲商人之所以願意冒著巨浪危險開闢遠洋新航路，其背後的核心經濟因果原因為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜證據判讀","clue":"史前跨海交流物證之證據判讀","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"東南亞地區的考古遺址中發掘出了來自臺灣花蓮的「豐田玉」飾品，這項物證最能支持下列哪一個歷史推論？"}]}],"cloze":{"core-1":{"selector":".point","terms":["高雄港"]},"core-2":{"selector":".point","terms":["新航路"]},"core-3":{"selector":".point","terms":["巴達維亞"]},"core-4":{"selector":".point","terms":["貿易據點"]},"core-5":{"selector":".point","terms":["鄭芝龍"]},"core-6":{"selector":".point","terms":["福爾摩沙"]},"core-7":{"selector":".point","terms":["巴達維亞"]},"core-8":{"selector":".point","terms":["馬尼拉"]},"core-9":{"selector":".point","terms":["明帝國"]},"mindmap-overview":{"selector":".mind-branch p","terms":["高雄港","新航路","鄭芝龍","巴達維亞"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":["巴達維亞"]},"trap-3":{"selector":".correct","terms":["明帝國"]},"trap-4":{"selector":".correct","terms":["福爾摩沙"]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["大航海時代","香料","巴達維亞","馬尼拉","福爾摩沙","鄭芝龍","高雄港","豐田玉","大員","明帝國"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>海洋交流與區位優勢\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>史前時代即有區域性跨海交流且位於亞洲東部樞紐\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西臨臺灣海峽繁忙航道並擁有高雄港等國際貨櫃港\u003c/p>\u003cp>\u003cb>結果：\u003c/b>奠定在全球海運體系與東亞交通上的重要地位\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>歐亞新航路與商品需求\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>十五世紀歐洲人喜愛瓷器絲綢與香料但陸運昂貴\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展遠洋造船技術並開闢經好望角與印度洋的海上新航路\u003c/p>\u003cp>\u003cb>結果：\u003c/b>促進全球商品流動、歐亞貿易密切與文化宗教傳播\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>東亞海商與福爾摩沙\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>十六世紀海商集結與葡萄牙人航經讚歎美麗之島\u003c/p>\u003cp>\u003cb>關係：\u003c/b>鄭芝龍建立龐大商業船隊經營東南沿海至日本東南亞貿易\u003c/p>\u003cp>\u003cb>結果：\u003c/b>歐洲地圖標記Formosa使臺灣知名度躍上國際舞臺\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>歐洲勢力競逐臺灣據點\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>臺灣位於日本與東南亞之間且接近中國貿易市場\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭由巴達維亞經澎湖遭明驅轉往南部；西班牙由馬尼拉北上據北部\u003c/p>\u003cp>\u003cb>結果：\u003c/b>確立臺灣在國際貿易與交通往來上的重要戰略位置\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>大航海時代臺灣如何登上世界舞臺？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">勢力名稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">亞洲據點與來臺路線\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">在臺活動與地理意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>勢力名稱\u003c/th>\u003cth>亞洲據點與來臺路線\u003c/th>\u003cth>在臺活動與地理意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>東亞海商（鄭芝龍）\u003c/td>\u003ctd>中國東南沿海、臺灣、日本與東南亞航網\u003c/td>\u003ctd>建立龐大商業船隊經營貿易，奠定漢人海商在東亞的龐大勢力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>葡萄牙人\u003c/td>\u003ctd>航行經過臺灣海峽之遠洋航線\u003c/td>\u003ctd>航經時讚歎「Ilha Formosa」，使「Formosa」被繪入歐洲地圖代表臺灣\u003c/td>\u003c/tr>\u003ctr>\u003ctd>荷蘭人（西元1624年）\u003c/td>\u003ctd>亞洲據點巴達維亞，經澎湖（遭明軍驅趕）轉往臺灣\u003c/td>\u003ctd>率先在臺灣南部（大員/安平）建立貿易據點，展開對中日與東南亞轉口貿易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西班牙人（西元1626年）\u003c/td>\u003ctd>亞洲據點馬尼拉，經太平洋北上來到臺灣\u003c/td>\u003ctd>在臺灣北部（雞籠、淡水）建立據點，轉運中國商品至日本與菲律賓\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按外來勢力種類（東亞海商、葡萄牙、荷蘭、西班牙），橫向比較其據點、路線與對臺灣的歷史意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論西班牙人曾占領臺灣南部，亦不能推論葡萄牙人曾在臺灣建立長期統治官署。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，荷蘭人與西班牙人在亞洲的核心據點分別為何？兩者在臺灣建立據點的空間位置有何差異？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>荷蘭人的亞洲據點為巴達維亞，建立臺灣南部據點；西班牙人的亞洲據點為馬尼拉，建立臺灣北部據點。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">核心事實與歷史情境\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">地理與歷史意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>核心事實與歷史情境\u003c/th>\u003cth>地理與歷史意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>史前與早期交流\u003c/td>\u003ctd>史前人類即有跨海交流（東南亞出土臺灣豐田玉），受限技術多為區域性\u003c/td>\u003ctd>證實臺灣四面環海的地理環境自古即具備對外連結特性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新航路開啟（15-17世紀）\u003c/td>\u003ctd>歐洲人因喜愛瓷器、絲綢與香料，提升遠洋技術開啟海上新航路\u003c/td>\u003ctd>歐洲與亞洲貿易往來日益密切，全球商品與文化交流大增\u003c/td>\u003c/tr>\u003ctr>\u003ctd>東亞轉運據點浮現\u003c/td>\u003ctd>臺灣位在日本與東南亞之間，接近中國市場，成為理想的貿易據點\u003c/td>\u003ctd>吸引中國與日本海商（如鄭芝龍）及歐洲船隊前來交易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>歐勢力進駐與名揚國際\u003c/td>\u003ctd>葡萄牙人稱Formosa；荷蘭（南部）與西班牙（北部）先後設據點\u003c/td>\u003ctd>確認臺灣在國際貿易與交通航線上的重要地位，正式登上世界舞臺\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間推移順序（史前、大航海新航路、轉運據點浮現、歐勢力進駐），閱讀臺灣如何一步步登上世界舞臺。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論臺灣是因為本土盛產大量香料才吸引歐洲人來臺，亦不能推論大航海時代前臺灣完全無人居住。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，歐洲商人之所以選擇在臺灣建立據點，核心的地理優勢原因是什麼？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>因為臺灣位於亞洲東部海上貿易航道上，介於日本和東南亞之間，非常適合建立據點以方便與中國、日本進行貿易。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>海洋交流與區位優勢\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>史前時代即有區域性跨海交流且位於亞洲東部樞紐\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西臨臺灣海峽繁忙航道並擁有高雄港等國際貨櫃港\u003c/p>\u003cp>\u003cb>結果：\u003c/b>奠定在全球海運體系與東亞交通上的重要地位\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>歐亞新航路與商品需求\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>十五世紀歐洲人喜愛瓷器絲綢與香料但陸運昂貴\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展遠洋造船技術並開闢經好望角與印度洋的海上新航路\u003c/p>\u003cp>\u003cb>結果：\u003c/b>促進全球商品流動、歐亞貿易密切與文化宗教傳播\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>東亞海商與福爾摩沙\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>十六世紀海商集結與葡萄牙人航經讚歎美麗之島\u003c/p>\u003cp>\u003cb>關係：\u003c/b>鄭芝龍建立龐大商業船隊經營東南沿海至日本東南亞貿易\u003c/p>\u003cp>\u003cb>結果：\u003c/b>歐洲地圖標記Formosa使臺灣知名度躍上國際舞臺\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>歐洲勢力競逐臺灣據點\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>臺灣位於日本與東南亞之間且接近中國貿易市場\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭由巴達維亞經澎湖遭明驅轉往南部；西班牙由馬尼拉北上據北部\u003c/p>\u003cp>\u003cb>結果：\u003c/b>確立臺灣在國際貿易與交通往來上的重要戰略位置\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/spa   if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

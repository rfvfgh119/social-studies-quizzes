t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林6上4-1 規範如何維持秩序並守護權益？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"4-1","title":"規範如何維持秩序並守護權益？"},"questions":[{"question":"人類共同生活在一起時，為了約束個人行為、減少衝突並維持社會秩序，所建立的行為準則統稱為何？","options":["個人習慣","宗教儀式","社會規範","經濟契約"],"answer":2,"explanation":"課本指出社會規範是人類共同生活時行為舉止應遵循的規範與準則，能約束個人行為、減少衝突並維持秩序。選項0、1、3非統稱。","concept":"社會規範的形成與必要性","skill":"概念理解","review":"core-1","evidence":"大家共同遵守社會規範,不僅能約束個人行為、減少衝突,也有助於維持社會秩序。","id":"q1","stem":"人類共同生活在一起時，為了約束個人行為、減少衝突並維持社會秩序，所建立的行為準則統稱為何？","theme":"社會規範的形成與必要性","explain":"課本指出社會規範是人類共同生活時行為舉止應遵循的規範與準則，能約束個人行為、減少衝突並維持秩序。選項0、1、3非統稱。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"受到自然環境與文化的影響，經過長時間流傳逐漸形成的社會行為習慣與約束，屬於哪一種社會規範？","options":["法律規範","風俗習慣","政黨黨綱","政府法令"],"answer":1,"explanation":"課本指出風俗習慣是受到自然環境與文化影響，經過長時間流傳逐漸形成的規範。選項0由立法機關制定；選項2、3非傳統流傳習慣。","concept":"風俗習慣與宗教信仰的由來","skill":"概念理解","review":"core-2","evidence":"風俗習慣受到自然環境與文化的影響,經過長時間流傳,逐漸形成規範。","id":"q2","stem":"受到自然環境與文化的影響，經過長時間流傳逐漸形成的社會行為習慣與約束，屬於哪一種社會規範？","theme":"風俗習慣與宗教信仰的由來","explain":"課本指出風俗習慣是受到自然環境與文化影響，經過長時間流傳逐漸形成的規範。選項0由立法機關制定；選項2、3非傳統流傳習慣。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"近年來隨著資訊科技發展，傳統婚禮與祭祖活動在形式上產生了何種新轉變？","options":["改由立法機關統一決定日期","強制所有人必須出國舉辦","採用電子喜帖與線上祭祖","全面禁止舉辦婚禮與祭祖"],"answer":2,"explanation":"課本提及科技發展改變了傳統活動形式，如婚禮採用電子喜帖、掃墓改以網路祭拜或線上參加法會。選項0、2、3皆非課本描述之事實。","concept":"科技對傳統風俗與信仰的改變","skill":"概念理解","review":"core-3","evidence":"近年來科技發展改變了傳統活動形式,例如:婚禮採用電子喜帖、掃墓改以網路祭拜","id":"q3","stem":"近年來隨著資訊科技發展，傳統婚禮與祭祖活動在形式上產生了何種新轉變？","theme":"科技對傳統風俗與信仰的改變","explain":"課本提及科技發展改變了傳統活動形式，如婚禮採用電子喜帖、掃墓改以網路祭拜或線上參加法會。選項0、2、3皆非課本描述之事實。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"人與人相處時自然形成、指引誠實、助人與公德心等良善行為，違反時會受良心與社會輿論譴責的規範為何？","options":["法律","商業合約","行政處分","道德"],"answer":3,"explanation":"課本說明道德是人與人相處的規範，包含誠實、助人與公德心，違反會受良心或社會輿論譴責。選項0具國家強制力，非此處定義。","concept":"道德的定義、範疇與後果","skill":"概念理解","review":"core-4","evidence":"如果違反道德,可能會受到良心或社會輿論的譴責。","id":"q4","stem":"人與人相處時自然形成、指引誠實、助人與公德心等良善行為，違反時會受良心與社會輿論譴責的規範為何？","theme":"道德的定義、範疇與後果","explain":"課本說明道德是人與人相處的規範，包含誠實、助人與公德心，違反會受良心或社會輿論譴責。選項0具國家強制力，非此處定義。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"在所有社會規範中，唯一具有「國家強制力」且由民意代表組成的立法機關依法制定的規範為何？","options":["宗教信仰","法律","道德規範","風俗習慣"],"answer":1,"explanation":"課本強調法律是唯一具有國家強制力的社會規範，由立法機關依法制定或修訂。選項0、1、2均不具備國家強制力。","concept":"法律的獨特性與強制力","skill":"概念理解","review":"core-6","evidence":"法律是唯一具有強制力的社會規範,成為維持社會秩序的必要方式。","id":"q5","stem":"在所有社會規範中，唯一具有「國家強制力」且由民意代表組成的立法機關依法制定的規範為何？","theme":"法律的獨特性與強制力","explain":"課本強調法律是唯一具有國家強制力的社會規範，由立法機關依法制定或修訂。選項0、1、2均不具備國家強制力。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"為守護用路人與行人通行安全，立法機關修訂法律，特別加重處罰駕駛人的何種違規行為？","options":["未禮讓斑馬線上的行人","未在車內放置衛生紙","開車時收聽廣播音樂","車身顏色過於鮮豔"],"answer":0,"explanation":"課本指出立法機關修訂法律，加重處罰不禮讓行人的車輛，以提供行人更安全的通行空間。選項0、2、3非法律處罰之違規事項。","concept":"交通規範與用路人權益守護","skill":"概念理解","review":"core-7","evidence":"立法機關修訂法律,加重處罰不禮讓行人的車輛,讓行人有更安全的空間。","id":"q6","stem":"為守護用路人與行人通行安全，立法機關修訂法律，特別加重處罰駕駛人的何種違規行為？","theme":"交通規範與用路人權益守護","explain":"課本指出立法機關修訂法律，加重處罰不禮讓行人的車輛，以提供行人更安全的通行空間。選項0、2、3非法律處罰之違規事項。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"政府特地制定專屬法律《兒童及少年福利與權益保障法》，最主要的背景與原因為何？","options":["兒童及少年較缺乏自我保護的力量","兒童及少年擁有最高的經濟收入","兒童及少年不需要遵守任何交通規則","兒童及少年已經完全具備成人體力"],"answer":0,"explanation":"課本說明兒童及少年較缺乏自我保護的力量，因此政府制定專屬法律加以特別保障。選項0、2、3敘述均不符合事實。","concept":"兒童及少年福利與權益保障法之專屬保護","skill":"概念理解","review":"core-8","evidence":"政府會制定專屬的法律,例如:制定兒童及少年福利與權益保障法","id":"q7","stem":"政府特地制定專屬法律《兒童及少年福利與權益保障法》，最主要的背景與原因為何？","theme":"兒童及少年福利與權益保障法之專屬保護","explain":"課本說明兒童及少年較缺乏自我保護的力量，因此政府制定專屬法律加以特別保障。選項0、2、3敘述均不符合事實。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"依據《兒童及少年福利與權益保障法》規定，店家與任何人均嚴格被禁止執行下列何種行為？","options":["販賣文具給兒童及少年","販賣體育用品給兒童及少年","提供兒童圖書給少年閱讀","販賣或供應菸酒給兒童及少年"],"answer":3,"explanation":"課本明確指出《兒少法》禁止店家販賣菸酒給兒童及少年，以保護其身心健康成長。選項0、2、3皆為合法正常的商業行為。","concept":"兒童及少年福利與權益保障法之專屬保護","skill":"概念理解","review":"core-8","evidence":"禁止店家販賣菸酒給兒童及少年","id":"q8","stem":"依據《兒童及少年福利與權益保障法》規定，店家與任何人均嚴格被禁止執行下列何種行為？","theme":"兒童及少年福利與權益保障法之專屬保護","explain":"課本明確指出《兒少法》禁止店家販賣菸酒給兒童及少年，以保護其身心健康成長。選項0、2、3皆為合法正常的商業行為。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"大眾運輸工具、博物館或遊樂園等場所提供兒童及少年優惠措施時，法律規定應統一以何者為主要判斷標準？","options":["考試成績","身高高低","體重大小","年齡"],"answer":3,"explanation":"課本指出政府規定大眾運輸工具與博物館等場所，應以「年齡」為標準提供兒少優惠措施。身高僅為未能出示年齡證明時的輔助標準。","concept":"兒少優惠措施與年齡認定標準","skill":"概念理解","review":"core-9","evidence":"應以年齡為標準提供兒童及少年優惠措施","id":"q9","stem":"大眾運輸工具、博物館或遊樂園等場所提供兒童及少年優惠措施時，法律規定應統一以何者為主要判斷標準？","theme":"兒少優惠措施與年齡認定標準","explain":"課本指出政府規定大眾運輸工具與博物館等場所，應以「年齡」為標準提供兒少優惠措施。身高僅為未能出示年齡證明時的輔助標準。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"關於現代社會中「道德」與「法律」兩種規範之間的關係，下列敘述何者最符合課本觀念？","options":["道德與法律缺一不可且相輔相成","只要遵守道德，就可以完全無視法律規範","現代社會只需要法律，道德可以完全廢除","道德與法律完全互相對立且不可共存"],"answer":0,"explanation":"課本總結在現代社會中，道德與法律是缺一不可且相輔相成的，共同維持社會秩序與運作。選項0、2、3觀念均屬極端與錯誤。","concept":"道德與法律的相輔相成與探究選擇","skill":"概念理解","review":"core-10","evidence":"在現代社會中,道德與法律是缺一不可,且相輔相成的。","id":"q10","stem":"關於現代社會中「道德」與「法律」兩種規範之間的關係，下列敘述何者最符合課本觀念？","theme":"道德與法律的相輔相成與探究選擇","explain":"課本總結在現代社會中，道德與法律是缺一不可且相輔相成的，共同維持社會秩序與運作。選項0、2、3觀念均屬極端與錯誤。","reviewText":"核心 10","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 社會規範的形成與必要性","title":"社會規範的形成與必要性","bullets":["社會規範是人類共同生活時行為舉止應遵循的規範與準則","隨著時代進步與科技發展，人們的互動、價值觀與生活方式不斷改變","為了促進個人與群體和諧相處並避免衝突，建立風俗習慣、宗教信仰、道德與法律等規範","大家共同遵守規範能約束個人行為、減少衝突並維持社會秩序"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 風俗習慣與宗教信仰的由來","title":"風俗習慣與宗教信仰的由來","bullets":["風俗習慣是受到自然環境與文化的影響，經過長時間流傳逐漸形成的規範","生活中存在多元宗教信仰，參與宗教活動時必須遵守相關規定與禮儀","例如「舉頭三尺有神明」源自宗教經典，勸誡人們遵循良知且不做虧心事","這些規範能從心靈與生活層面約束個人行為，促進社會和諧穩定"]},{"id":"core-3","type":"core","tag":"C 科技對傳統風俗與信仰的改變","title":"科技對傳統風俗與信仰的改變","bullets":["近年來科技發展改變了傳統活動形式，如婚禮採用電子喜帖、掃墓改以網路祭拜","因應長途跋涉或龐大返鄉人潮，民眾能透過電腦線上參加宗教法會或線上祭祖","科技形式雖然帶來便利並減少印刷或交通負擔，但可能減少人際間的實體互動","人們需要在便利與尊重傳統習慣之間取得平衡，逐步建立合宜的新規範"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 道德的定義、範疇與後果","title":"道德的定義、範疇與後果","bullets":["道德是人與人之間相處的規範，作為約束或鼓勵行為的標準","包含誠實、主動助人、發揮公德心等良善行為指引","日常生活中如維護環境清潔、主動讓座或不公然喧嘩均屬於道德表現","若違反道德規範，雖然不會被警察逮捕，但會受到良心或社會輿論的譴責"]},{"id":"core-5","type":"core","tag":"E 公有地白線停車與道德溝通","title":"公有地白線停車與道德溝通","bullets":["在公有地白線上停車雖然沒有違反法律規定，但若擋住他人住家出入口則涉及個人道德","此類未違法卻影響他人的生活衝突，顯示單靠法律無法完全解決所有生活紛爭","當遇到此類糾紛時，雙方應先以和善友善的態度進行溝通與協調","若雙方無法取得共識，可再請警方或相關單位介入進行後續協調處理"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 法律的獨特性與強制力","title":"法律的獨特性與強制力","bullets":["法律是社會規範中唯一具有國家強制力的規範，為維持社會秩序的必要方式","法律係由民意代表組成的立法機關依法制定或修訂，全體國民均須遵守","若有人違反法律規範，法院會依據法律做出裁判，處罰違法者如處以罰款或判刑","法律劃定社會運作的最後底線，能有效約束違法行為並保障民眾權益"]},{"id":"core-7","type":"core","tag":"G 交通規範與用路人權益守護","title":"交通規範與用路人權益守護","bullets":["為守護用路人與行人安全，立法機關修訂法律加重處罰不禮讓行人的車輛","駕駛人若未禮讓斑馬線上的行人，將面臨法律罰鍰處罰","慢車如腳踏車騎乘時也必須遵守交通號誌，不能任意闖紅燈","嚴格執行交通法律能提供行人更安全的空間，降低道路交通事故發生"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 兒童及少年福利與權益保障法之專屬保護","title":"兒童及少年福利與權益保障法之專屬保護","bullets":["兒童及少年較缺乏自我保護的力量，政府特地制定專屬法律加以特別保障","政府制定《兒童及少年福利與權益保障法》，旨在保護兒少健康與安全成長","法律明確規定店家與任何人均不得販賣或供應菸酒給兒童與少年，違者將受罰","透過專屬法律的強制限制，防止不良物質損害未成年人的身心健全發展"]},{"id":"core-9","type":"core","tag":"I 兒少優惠措施與年齡認定標準","title":"兒少優惠措施與年齡認定標準","bullets":["政府規定大眾運輸工具、博物館或遊樂園等場所應提供兒童及少年優惠措施","優惠措施包含發售兒童優待票或提供免費參觀，以減輕家庭負擔並保障兒少權益","法規規定兒少優惠措施應統一以「年齡」為主要判斷標準","若未能出示年齡證明文件時，業者方可配合身高進行輔助判斷"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-10","type":"core","tag":"J 道德與法律的相輔相成與探究選擇","title":"道德與法律的相輔相成與探究選擇","bullets":["現代社會中道德與法律缺一不可且相輔相成，共同維持社會運作","道德係人際相處自然形成的良善指引，法律則是維護秩序的最後底線","遇到生活衝突或紛爭時，公民應先以道德勸說與友善溝通為主","若道德勸說無法達到良好效果或涉及違法行為時，再訴諸法律行動處置"]}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"公有地白線只要沒有劃設紅黃線，車主停在上面就算擋住鄰居門口也完全沒有任何問題，鄰居無權干涉。","right":"停在白線雖未違反法律，但擋住住家出入口已牽涉個人道德，應友善溝通或約定時間。 不能把『未違法』等同於『合理體貼』，無違法行為仍受道德與人際規範約束。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"道德和法律是一模一樣的社會規範，兩者都是由立法機關制定且具有國家強制力。","right":"道德係人際相處自然形成的指引、無強制力；法律才是唯一由立法機關制定且具國家強制力的規範。 混淆了道德與法律的產生方式及強制力，法律才是唯一具強制力的規範。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"違反道德規範（如未在公車上讓座或公然吵架）會被警察逮捕並由法院判處罰款或坐牢。","right":"違反道德不會被警察逮捕或法院判刑，而是會受到良心或社會輿論的處分與譴責。 道德不具國家強制力與法律刑罰，違反道德承擔的是良心與輿論譴責。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"騎腳踏車不屬於汽機車，因此過馬路時不需要遵守紅綠燈號誌，闖紅燈也不會違法。","right":"腳踏車屬於道路交通規範中的慢車，騎乘時同樣必須嚴格遵守號誌，闖紅燈屬於違規行為。 腳踏車亦受道路交通管理處罰條例等法律約束，不能任意闖紅燈。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"遊樂園與博物館提供兒童優惠票時，法律規定只能以身高為唯一審查標準，超過身高就不能享優惠。","right":"《兒童及少年福利與權益保障法》規定應以『年齡』為主要標準，未能出示證明時才配合身高輔助判斷。 兒少優惠的主要法定標準是年齡，身高僅為無法出示證件時的輔助判斷。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"隨著科技發展，婚禮電子喜帖與線上祭祖完全取代了傳統實體活動，且不會產生任何負面影響。","right":"線上科技雖然帶來便利，但也可能減少人際間的實體互動，需要在便利與尊重傳統間取得平衡。 科技改變活動形式帶來便利，但無法完全替代實體互動與情感連結。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"風俗習慣與宗教信仰｜知識關係","chain":["自然環境與文化影響經長時間流傳形成習慣，多元宗教活動各具禮儀","近年結合科技發展出電子喜帖、線上祭祖與線上參加宗教法會","增加個人生活便利性，但可能減少人際間實體互動，需建立合宜新規範"]},{"id":"logic-2","type":"chain","title":"道德規範與行為指引｜知識關係","chain":["人與人相處自然形成的規範，指引誠實、助人與公德心等良善行為","作為約束或鼓勵行為的標準，無國家強制力，如公有地停車顧及住家出入","違反道德規範時，個人會受到良心或社會輿論的譴責"]},{"id":"logic-3","type":"chain","title":"法律規範與強制力｜知識關係","chain":["維護社會秩序最後底線，由民意代表組成的立法機關依法修訂","唯一具有國家強制力的規範，如修法加重處罰不禮讓行人的車輛","違反者由法院依法律裁判處罰，有效約束違法行為並保障用路人權益"]},{"id":"logic-4","type":"chain","title":"兒童及少年權益保障｜知識關係","chain":["兒少族群身心仍在發展且較缺乏自我保護能力，需要國家專屬保障","制定兒童及少年福利與權益保障法，禁止賣菸酒，並以年齡為標準給予優惠","保護未成年人健康安全成長，並減輕家庭經濟負擔與保障參與機會"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜四種社會規範之比較與特色判讀圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜道德與法律相輔相成及兒少保障比較圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["道德規範","法律規範","道德為人際相處自然形成、無國家強制力，違反受良心或社會輿論譴責；法律由立法機關制定修訂，為唯一具國家強制力的規範，違反由法院裁決罰款或判刑。"],["傳統祭祖習慣","線上祭祖科技形式","傳統祭祖需親自返鄉並準備實體祭品，過程辛苦但能促進家人實際互動與聯絡感情；線上祭祖透過網路電腦操作，能避開交通與長途跋涉，但實體互動與親自參與的意義可能變淡。"],["兒少法律限制措施（如禁售菸酒）","兒少法律優惠措施（如兒童優待票）","限制措施旨在禁止店家供應危害兒少身心健康之物品（菸酒），以保護其安全成長；優惠措施旨在以「年齡」為標準給予文教大眾運輸票價減免，以保障其參與機會並減輕家庭負擔。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","社會規範","人類共同生活時，行為舉止應遵循的規範與準則，包含風俗習慣、宗教信仰、道德與法律等。"],["2","風俗習慣","受到自然環境與文化影響，經過長時間流傳逐漸形成的社會行為習慣與規範。"],["3","宗教信仰","人們對神明或信仰對象的敬畏與崇奉，參與其活動時需遵守相應的規定與禮儀。"],["4","電子喜帖","利用網路與手機傳遞的新型喜帖形式，能省去印刷郵寄成本且便利更新，但減少了紙本觸感。"],["5","道德","人與人之間相處的規範，作為約束或鼓勵行為的標準（如誠實、助人、公德心），指引良善行為。"],["6","社會輿論","代表社會公眾意見與大眾評價的言論，違反道德規範者常會受到社會輿論的責備與譴責。"],["7","法律","由民意代表組成的立法機關依法制定，唯一具有國家強制力以維持社會秩序與保障權益的規範。"],["8","強制力","國家運用法律的力量約束與規範人民行為，對違法者能由法院裁決處以罰款或判刑的公權力。"],["9","兒童及少年福利與權益保障法","政府為保護未成年人健康安全成長、保障其發展權利所制定的專屬法律。"],["10","兒少優惠措施標準","法律規定文教設施與大眾運輸等場所，應統一以「年齡」為主要標準提供兒童及少年票價優惠。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"規範類型比較與特性辨析","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「風俗習慣」與「法律」兩種社會規範，下列關於兩者產生方式與約束力的敘述何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"科技改變傳統風俗之影響分析","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"運用電腦與網路進行「線上祭祖」或「線上法會」，主要帶來的便利與可能引發的隱憂分別為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"道德與法律後果之比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"關於「違反道德」與「違反法律」所面臨的後果對比，下列哪一組描述完全正確？"}]}],"cloze":{"core-1":{"selector":".point","terms":["約束個人行為"]},"core-2":{"selector":".point","terms":["長時間流傳"]},"core-3":{"selector":".point","terms":["實體互動"]},"core-4":{"selector":".point","terms":["社會輿論的譴責"]},"core-5":{"selector":".point","terms":["個人道德"]},"core-6":{"selector":".point","terms":["國家強制力"]},"core-7":{"selector":".point","terms":["加重處罰不禮讓行人"]}, 法機關依法修訂\u003c/p>\u003cp>\u003cb>關係：\u003c/b>唯一具有國家強制力的規範，如修法加重處罰不禮讓行人的車輛\u003c/p>\u003cp>\u003cb>結果：\u003c/b>違反者由法院依法律裁判處罰，有效約束違法行為並保障用路人權益\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>兒童及少年權益保障\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>兒少族群身心仍在發展且較缺乏自我保護能力，需要國家專屬保障\u003c/p>\u003cp>\u003cb>關係：\u003c/b>制定兒童及少年福利與權益保障法，禁止賣菸酒，並以年齡為標準給予優惠\u003c/p>\u003cp>\u003cb>結果：\u003c/b>保護未成年人健康安全成長，並減輕家庭經濟負擔與保障參與機會\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>規範如何維持秩序並守護權益？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>風俗習慣\u003c/td>\u003ctd>由自然環境與文化經長時間流傳形成，如節慶祭祖與傳統禮俗\u003c/td>\u003ctd>約束個人日常行為，促進文化傳承與群體凝聚力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宗教信仰\u003c/td>\u003ctd>參與宗教活動時需遵守相關規定與禮儀，如神明監察言行\u003c/td>\u003ctd>勸誡人們遵循良知、不做虧心事，提供心靈寄託\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道德\u003c/td>\u003ctd>人際相處自然形成的良善指引（誠實、助人、公德心），無強制力\u003c/td>\u003ctd>作為鼓勵或約束行為標準，違反受良心與社會輿論譴責\u003c/td>\u003c/tr>\u003ctr>\u003ctd>法律\u003c/td>\u003ctd>民意代表組成之立法機關制定修訂，為唯一具國家強制力規範\u003c/td>\u003ctd>劃定社會秩序底線，違反者由法院裁決處以罰款或判刑\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依據規範類型（風俗習慣、宗教信仰、道德、法律），橫向閱讀其形成由來、約束方式與法律強制力差別。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論四種規範互不相干，事實上同一行為（如不偷竊、不闖紅燈）常同時受道德與法律等多重規範約束。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表資料，四種社會規範中，唯一具備國家強制力且由立法機關制定的規範為何？違反該規範會面臨何種後果？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>唯一具國家強制力的規範為「法律」；違反法律會被警察或相關單位移送，並由法院依法做出判刑或罰款等處罰。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>產生方式\u003c/td>\u003ctd>道德為人際相處自然形成；法律由立法機關依法制定修訂\u003c/td>\u003ctd>展現社會規範自發引導與制度建構的雙軌互補性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>強制力與後果\u003c/td>\u003ctd>道德無強制力（受良心輿論譴責）；法律具強制力（法院判刑罰款）\u003c/td>\u003ctd>道德鼓勵表現良善行為，法律提供維護秩序最後底線\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生活衝突處理\u003c/td>\u003ctd>遇紛爭先以道德溝通協調（如白線停車）；無法達成共識再訴諸法律\u003c/td>\u003ctd>避免過度動用法律資源，先透過自律與友善溝通解決\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兒少權益保障\u003c/td>\u003ctd>兒少法禁止店家售菸酒（限制）；文教大眾運輸以年齡給予優惠（保障）\u003c/td>\u003ctd>針對較缺乏自我保護力量之族群提供專屬法律特別護衛\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>縱向閱讀道德與法律在產生、後果、衝突處理之對比，再閱讀兒少專屬法律保護之具體措施。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論未違反法律的行為就必然符合道德，白線停車擋門即為未違法但欠缺道德體貼的典型範例。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>當民眾遇到「在公有地白線上停車卻擋住鄰居住家出入口」的情境時，依據圖表應採取何種正確處理順序？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>應先以友善態度進行道德溝通與約定；若無法達成共識，再請警方介入並依相關法律規定協調處置。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d 內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>風俗習慣\u003c/td>\u003ctd>由自然環境與文化經長時間流傳形成，如節慶祭祖與傳統禮俗\u003c/td>\u003ctd>約束個人日常行為，促進文化傳承與群體凝聚力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宗教信仰\u003c/td>\u003ctd>參與宗教活動時需遵守相關規定與禮儀，如神明監察言行\u003c/td>\u003ctd>勸誡人們遵循良知、不做虧心事，提供心靈寄託\u003c/td>\u003c/tr>\u003ctr>\u003ctd>道德\u003c/td>\u003ctd>人際相處自然形成的良善指引（誠實、助人、公德心），無強制力\u003c/td>\u003ctd>作為鼓勵或約束行為標準，違反受良心與社會輿論譴責\u003c/td>\u003c/tr>\u003ctr>\u003ctd>法律\u003c/td>\u003ctd>民意代表組成之立法機關制定修訂，為唯一具國家強制力規範\u003c/td>\u003ctd>劃定社會秩序底線，違反者由法院裁決處以罰款或判刑\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依據規範類型（風俗習慣、宗教信仰、道德、法律），橫向閱讀其形成由來、約束方式與法律強制力差別。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論四種規範互不相干，事實上同一行為（如不偷竊、不闖紅燈）常同時受道德與法律等多重規範約束。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表資料，四種社會規範中，唯一具備國家強制力且由立法機關制定的規範為何？違反該規範會面臨何種後果？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>唯一具國家強制力的規範為「法律」；違反法律會被警察或相關單位移送，並由法院依法做出判刑或罰款等處罰。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>產生方式\u003c/td>\u003ctd>道德為人際相處自然形成；法律由立法機關依法制定修訂\u003c/td>\u003ctd>展現社會規範自發引導與制度建構的雙軌互補性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>強制力與後果\u003c/td>\u003ctd>道德無強制力（受良心輿論譴責）；法律具強制力（法院判刑罰款）\u003c/td>\u003ctd>道德鼓勵表現良善行為，法律提供維護秩序最後底線\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生活衝突處理\u003c/td>\u003ctd>遇紛爭先以道德溝通協調（如白線停車）；無法達成共識再訴諸法律\u003c/td>\u003ctd>避免過度動用法律資源，先透過自律與友善溝通解決\u003c/td>\u003c/tr>\u003ctr>\u003ctd>兒少權益保障\u003c/td>\u003ctd>兒少法禁止店家售菸酒（限制）；文教大眾運輸以年齡給予優惠（保障）\u003c/td>\u00 function cardHTML(c){let content='';const tag=c.tag?`<div class="tag">${esc(c.tag)}</div>`:'';let heading=`<h3>${esc(c.title)}</h3>`;
if(c.type==='mindmap'||c.type==='reading')content=CUSTOM[c.id];else if(c.type==='trap'){heading=`<div class="card-title"><h3><span class="trap-n">${String(c.n).padStart(2,'0')}</span>${esc(c.title)}</h3><span class="small-label">${esc(c.label)}</span></div>`;content=`<p class="mistake"><span class="text-label">易錯</span>${fmt(c.wrong)}</p><p class="correct"><span class="text-label">破解</span>${fmt(c.right)}</p>`;}
else if(c.type==='chain')content=`<div class="flow">${c.chain.map((s,i)=>(i?'<span class="flow-arrow">→</span>':'')+`<div class="flow-step">${fmt(s)}</div>`).join('')}</div>`;
else if(c.type==='table')content=`<div class="table-wrap"><table><thead><tr>${c.headers.map(s=>`<th scope="col">${esc(s)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(s=>`<td>${fmt(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
else if(c.type==='diagram')content=`<div class="figure-visual" role="img" aria-label="${esc(c.title+'。'+c.caption)}">${diagrams[c.diagram]}</div><p class="diagram-caption">${esc(c.caption)}</p>`;
else if(c.type==='ask')content=`<p><b>題幹線索：</b>${fmt(c.clue)}</p><p><b>處理步驟：</b>${fmt(c.steps)}</p><p class="example">練習例句：「${esc(c.example)}」</p>`;
else if(c.type==='question'){const q=c.question;content=`<div class="question-head"><span>第 ${c.n} 題・主題 ${esc(q.theme)}</span><span>${q.source.length===1&&q.source[0].startsWith('課本')?'課文延伸練習':'單課知識練習'}</span></div><p class="question-stem">${esc(q.stem)}</p><div class="options">${q.options.map((s,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${i}" ${Number(answers[q.id])===i&&answers[q.id]!==undefined?'checked':''}><span>(${String.fromCharCode(65+i)}) ${esc(s)}</span></label>`).join('')}</div>`;heading='';}
else if(c.type==='answers'){content=`<div class="table-wrap"><table class="answer-table"><thead><tr><th>題號</th><th>答案</th><th>解析關鍵</th><th>回去複習</th></tr></thead><tbody>${BOOK.questions.map((q,i)=>`<tr class="answer-row" data-question="${q.id}"><td>${i+1}</td><td><b>${String.fromCharCode(65+q.answer)}</b></td><td>${esc(q.explain)}</td><td><a href="#${q.review}">${esc(q.reviewText)}</a></td></tr>`).join('')}</tbody></table></div><div class="score-box"><p><b>複習指南</b></p><p>${Math.ceil(BOOK.questions.length*.9)}～${BOOK.questions.length} 題：再說出理由，確認概念穩固。<br>${Math.ceil(BOOK.questions.length*.7)}～${Math.ceil(BOOK.questions.length*.9)-1} 題：依右欄補強錯題。<br>${Math.ceil(BOOK.questions.length*.7)-1} 題以下：先重讀核心重點，再看易錯陷阱。</p><div class="screen-only score-tools"><button id="grade">核對我的答案</button><button id="reset">清除作答</button><span class="score-text" aria-live="polite"></span></div></div>`;}
else{content=(c.intro?`<p class="intro">${fmt(c.intro)}</p>`:'')+(c.bullets||[]).map(s=>`<p class="point">${fmt(s)}</p>`).join('');}

function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}
function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}
if(e.target.id==='reset'){answers={};try{localStorage.removeItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson)}catch(e){}document.querySelectorAll('.option input').forEach(im=>im.checked=false);document.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('is-correct','is-wrong'));$('.score-text').textContent='已清除作答。';}});
new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["約束個人行為"]},"core-2":{"selector":".point","terms":["長時間流傳"]},"core-3":{"selector":".point","terms":["實體互動"]},"core-4":{"selector":".point","terms":["社會輿論的譴責"]},"core-5":{"selector":".point","terms":["個人道德"]},"core-6":{"selector":".point","terms":["國家強制力"]},"core-7":{"selector":".point","terms":["加重處罰不禮讓行人"]},"core-8":{"selector":".point","terms":["兒童及少年福利與權益保障法"]},"core-9":{"selector":".point","terms":["年齡"]},"core-10":{"selector":".point","terms":["相輔相成"]},"mindmap-overview":{"selector":".mind-branch p","terms":["減少人際間實體互動","良心或社會輿論的譴責","唯一具有國家強制力","以年齡為標準"]},"trap-1":{"selector":".correct","terms":["個人道德"]},"trap-2":{"selector":".correct","terms":["國家強制力"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":["兒童及少年福利與權益保障法"]},"trap-6":{"selector":".correct","terms":["實體互動"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["社會規範","風俗習慣","宗教信仰","電子喜帖","道德","社會輿論","法律","強制力","兒童及少年福利與權益保障法","兒少優惠措施標準"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });
 document.getElementById('mode-cloze').setAttribute('aria-pressed',String(clozeMode));document.getElementById('mode-full').setAttribute('aria-pressed',String(!clozeMode));
 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);

 };

t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>南一6上4-2 世界看見臺灣</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"南一版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"4-2","title":"世界看見臺灣"},"questions":[{"question":"依據我國規定，關於中小型企業的定義基準，下列哪一項條件符合中小型企業的標準？","options":["實收資本額在新臺幣一億元以下","實收資本額在新臺幣十億元以上","經常僱用員工人數在五百人以上","必須屬於國營事業且無法開放個人創業"],"answer":0,"explanation":"正確答案為(1)。我國中小型企業定義包含：實收資本額在新臺幣1億元以下（含1億元），或經常僱用員工人數未滿200人（不含200人）；選項(0)、(2)資本額與人數過高；選項(3)非國營事業限定。","concept":"中小型企業的定義與經濟地位","skill":"概念理解","review":"core-1","evidence":"實收資本額在新臺幣1億元以下(含1億元)","id":"q1","stem":"依據我國規定，關於中小型企業的定義基準，下列哪一項條件符合中小型企業的標準？","theme":"中小型企業的定義與經濟地位","explain":"正確答案為(1)。我國中小型企業定義包含：實收資本額在新臺幣1億元以下（含1億元），或經常僱用員工人數未滿200人（不含200人）；選項(0)、(2)資本額與人數過高；選項(3)非國營事業限定。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"民國八十年代後期，臺灣傳統中小型企業在面對國外低價勞工與低價商品競爭的困境時，主要採取了何種策略來提升商品競爭力？","options":["放棄所有產品研發並全面關閉工廠","強制要求員工降低薪資並生產低價劣質品","由政府全面接管所有私營企業","透過跨國技術合作與相關企業共同提升品質"],"answer":3,"explanation":"正確答案為(1)。許多企業選擇透過跨國技術合作，與相關企業一同努力提升商品品質，生產出更具全球競爭力的商品；選項(0)、(2)、(3)皆非企業成功轉型的策略。","concept":"中小企業的競爭困境與跨國技術轉型","skill":"概念理解","review":"core-2","evidence":"有些企業則選擇透過跨國技術合作,與相關企業一同努力提升商品品質","id":"q2","stem":"民國八十年代後期，臺灣傳統中小型企業在面對國外低價勞工與低價商品競爭的困境時，主要採取了何種策略來提升商品競爭力？","theme":"中小企業的競爭困境與跨國技術轉型","explain":"正確答案為(1)。許多企業選擇透過跨國技術合作，與相關企業一同努力提升商品品質，生產出更具全球競爭力的商品；選項(0)、(2)、(3)皆非企業成功轉型的策略。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"面對國外低價自行車產品競爭時，巨大與美利達等臺灣自行車公司帶領廠商成立了哪一個團隊，成功轉型為全球高階自行車生產基地？","options":["A-Team","YouBike-Group","APEC-Group","TSMC-Team"],"answer":0,"explanation":"正確答案為(0)。臺灣自行車公司巨大、美利達共同帶領廠商組成A-Team，透過研發零件與技術合作力抗低價策略；選項(1)、(2)、(3)名稱皆非該自行車聯盟團隊名稱。","concept":"臺灣自行車產業的成功轉型實例","skill":"概念理解","review":"core-3","evidence":"臺灣自行車公司巨大、美利達共同帶領廠商組成 A-Team","id":"q3","stem":"面對國外低價自行車產品競爭時，巨大與美利達等臺灣自行車公司帶領廠商成立了哪一個團隊，成功轉型為全球高階自行車生產基地？","theme":"臺灣自行車產業的成功轉型實例","explain":"正確答案為(0)。臺灣自行車公司巨大、美利達共同帶領廠商組成A-Team，透過研發零件與技術合作力抗低價策略；選項(1)、(2)、(3)名稱皆非該自行車聯盟團隊名稱。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"臺灣多年來發展多樣化電子零件製造能力，下列哪一個領域是我國在全球具備關鍵影響力的代表性產業？","options":["石油開採與鋼鐵原物料外銷","晶圓代工與資通訊電子產品","重型卡車組裝與製造","傳統牛隻榨汁糖廍"],"answer":1,"explanation":"正確答案為(1)。我國在晶圓代工、資通訊類型的電子產品等方面具備全球關鍵影響力；選項(0)糖廍為舊時農業設施；選項(2)、(3)非我國在全球具備關鍵優勢之領域。","concept":"電子產業實力與全球關鍵影響力","skill":"概念理解","review":"core-4","evidence":"在晶圓代工、資通訊類型的電子產品等方面,具全球關鍵影響力","id":"q4","stem":"臺灣多年來發展多樣化電子零件製造能力，下列哪一個領域是我國在全球具備關鍵影響力的代表性產業？","theme":"電子產業實力與全球關鍵影響力","explain":"正確答案為(1)。我國在晶圓代工、資通訊類型的電子產品等方面具備全球關鍵影響力；選項(0)糖廍為舊時農業設施；選項(2)、(3)非我國在全球具備關鍵優勢之領域。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"關於晶圓廠在臺灣西部各地設廠所帶來的正面與潛在影響，下列敘述何者正確？","options":["會強制所有當地居民放棄農耕改為開採黃金","能增加就業機會，但也可能帶動土地及房屋價格上漲","會使當地的土地價格大幅下跌且無人居住","會導致當地所有工廠關閉並增加失業率"],"answer":1,"explanation":"正確答案為(1)。晶圓廠進駐使當地就業機會增加、帶動經濟，但也帶動工廠附近的土地及房屋價格上漲；選項(0)、(2)、(3)描述皆與課本事實相反。","concept":"晶圓廠各地設廠對在地的影響","skill":"概念理解","review":"core-5","evidence":"相關產業的進駐,也使得當地就業機會增加,帶動工廠附近的土地及房屋價格逐漸上漲","id":"q5","stem":"關於晶圓廠在臺灣西部各地設廠所帶來的正面與潛在影響，下列敘述何者正確？","theme":"晶圓廠各地設廠對在地的影響","explain":"正確答案為(1)。晶圓廠進駐使當地就業機會增加、帶動經濟，但也帶動工廠附近的土地及房屋價格上漲；選項(0)、(2)、(3)描述皆與課本事實相反。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"關於電子產業關鍵組件「晶圓」與「晶片」的製造關係，下列敘述何者正確？","options":["晶圓是由美援麵粉加工製造而成的食品","晶圓是由晶片經過焊接拼湊而成","晶片是傳統吸塵器的手動零件","晶片是由晶圓切割而成"],"answer":3,"explanation":"正確答案為(0)。課本第81頁圖④明確指出「晶片為晶圓切割而成」；選項(1)順序與結構倒置；選項(2)、(3)將晶片與晶圓誤植為傳統吸塵器零件或美援食品。","concept":"晶片技術發展與智慧型產品生活應用","skill":"概念理解","review":"core-6","evidence":"晶片為晶圓切割而成","id":"q6","stem":"關於電子產業關鍵組件「晶圓」與「晶片」的製造關係，下列敘述何者正確？","theme":"晶片技術發展與智慧型產品生活應用","explain":"正確答案為(0)。課本第81頁圖④明確指出「晶片為晶圓切割而成」；選項(1)順序與結構倒置；選項(2)、(3)將晶片與晶圓誤植為傳統吸塵器零件或美援食品。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"臺灣每年舉辦哪一項盛大的國際展覽活動，吸引全球眾多工作者與專業人才前來交流，提高臺灣國際知名度？","options":["臺北國際電腦展","吉安慶修院祭典","清境火把節展覽","澎湖文武聖殿建醮"],"answer":0,"explanation":"正確答案為(0)。我國透過舉辦國際電腦展（如臺北國際電腦展）與國際競賽，增加外國人士交流機會；選項(1)、(2)、(3)屬國內特定聚落與宗教節慶活動。","concept":"國際活動舉辦與文化傳播","skill":"概念理解","review":"core-7","evidence":"我國透過舉辦各類型國際活動,例如:國際電腦展、國際競賽等,增加外國人士來臺灣的機會","id":"q7","stem":"臺灣每年舉辦哪一項盛大的國際展覽活動，吸引全球眾多工作者與專業人才前來交流，提高臺灣國際知名度？","theme":"國際活動舉辦與文化傳播","explain":"正確答案為(0)。我國透過舉辦國際電腦展（如臺北國際電腦展）與國際競賽，增加外國人士交流機會；選項(1)、(2)、(3)屬國內特定聚落與宗教節慶活動。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"隨著來臺外國工作者與觀光旅客增加，臺灣的大眾捷運系統採取了何種國際化服務措施？","options":["增設多國文字標示及多國語言到站語音廣播","強制要求所有乘客搭車時必須使用日語溝通","全面禁止外國遊客搭乘捷運","取消所有英文與中文到站廣播"],"answer":0,"explanation":"正確答案為(1)。大眾捷運系統開始針對來臺旅客人數較多的國家，增設文字標示及語音廣播（如日語、韓語等），提供更便利的乘車體驗；選項(0)、(2)、(3)皆非捷運國際化服務作法。","concept":"觀光交流帶動的大眾運輸與多國語言服務","skill":"概念理解","review":"core-8","evidence":"大眾捷運系統開始針對來臺旅客人數較多的國家,增設文字標示及語音廣播","id":"q8","stem":"隨著來臺外國工作者與觀光旅客增加，臺灣的大眾捷運系統採取了何種國際化服務措施？","theme":"觀光交流帶動的大眾運輸與多國語言服務","explain":"正確答案為(1)。大眾捷運系統開始針對來臺旅客人數較多的國家，增設文字標示及語音廣播（如日語、韓語等），提供更便利的乘車體驗；選項(0)、(2)、(3)皆非捷運國際化服務作法。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"台積電於西元2024年在日本哪一個地區設立晶圓廠並舉行開幕，受邀前往協助當地擺脫高科技製造停滯的困境？","options":["東京","大阪","熊本","京都"],"answer":2,"explanation":"正確答案為(1)。西元2024年，台積電在日本熊本設立的晶圓廠開幕；選項(0)、(2)、(3)非台積電西元2024年設廠開幕的日本縣市地點。","concept":"台積電日本熊本設廠的異國風貌與衝擊","skill":"概念理解","review":"core-9","evidence":"西元2024年,台積電在熊本設立的晶圓廠開幕","id":"q9","stem":"台積電於西元2024年在日本哪一個地區設立晶圓廠並舉行開幕，受邀前往協助當地擺脫高科技製造停滯的困境？","theme":"台積電日本熊本設廠的異國風貌與衝擊","explain":"正確答案為(1)。西元2024年，台積電在日本熊本設立的晶圓廠開幕；選項(0)、(2)、(3)非台積電西元2024年設廠開幕的日本縣市地點。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"根據統計，西元2020年中小型企業占我國全體企業就業人口的比例大約為何？","options":["約10%以下","約50%左右","約30%左右","約80%以上"],"answer":3,"explanation":"正確答案為(3)。課本第78頁明確標示「西元2020年中小型企業占我國全體企業就業人口約80%以上」；選項(0)、(1)、(2)數據皆大幅低於課本事實。","concept":"中小型企業的定義與經濟地位","skill":"概念理解","review":"core-1","evidence":"西元2020年中小型企業占我國全體企業就業人口約 80% 以上","id":"q10","stem":"根據統計，西元2020年中小型企業占我國全體企業就業人口的比例大約為何？","theme":"中小型企業的定義與經濟地位","explain":"正確答案為(3)。課本第78頁明確標示「西元2020年中小型企業占我國全體企業就業人口約80%以上」；選項(0)、(1)、(2)數據皆大幅低於課本事實。","reviewText":"核心 1","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 中小型企業的定義與經濟地位","title":"中小型企業的定義與經濟地位","bullets":["中小型企業占我國全體企業就業人口八成以上，是臺灣經濟發展的重要基礎。","實收資本額在新臺幣一億元以下或經常僱用員工人數未滿二百人。","街道上招牌林立與鄉野間工廠製造商品外銷，展現臺灣經濟的活絡與多樣招牌景觀。","除了滿足大眾食衣住行等日常生活所需，也提供在地廣大民眾的就業場所。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 中小企業的競爭困境與跨國技術轉型","title":"中小企業的競爭困境與跨國技術轉型","bullets":["民國八十年代後期面對國外低價勞工與低價商品競爭，許多傳統企業面臨倒閉或轉移。","產業面臨外移與員工失業困境，迫使企業必須進行轉型以提高產品競爭力。","選擇透過跨國技術合作與供應鏈相關企業共同努力，提高產品品質與利潤。","企業轉型成功後提升產品全球競爭力，並提高員工薪資待遇與產業發展。"]},{"id":"core-3","type":"core","tag":"C 臺灣自行車產業的成功轉型實例","title":"臺灣自行車產業的成功轉型實例","bullets":["臺灣自行車產業面對中國大量且低價產品競爭，一度面臨極大的生存危機。","巨大與美利達等公司帶領廠商組成A-Team團隊，整合零件與技術合作。","透過共同研發零件、提升製造品質與改善營運績效，拒絕走低價量產路線。","成功轉型為全球高階自行車生產基地與研發中心，並建立國際知名品牌。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 電子產業實力與全球關鍵影響力","title":"電子產業實力與全球關鍵影響力","bullets":["臺灣多年來透過國內外技術合作與中小企業彈性特質，發展多樣化電子零件製造能力。","在晶圓代工與資通訊電子產品領域，具有全球不可或缺的關鍵影響力。","西元2020年新冠疫情蔓延，遠距科技與人工智慧發展帶動全球電子零件需求暴增。","臺灣作為關鍵生產國受到世界各國高度重視，各國紛紛邀請臺灣企業前往設廠。"]},{"id":"core-5","type":"core","tag":"E 晶圓廠各地設廠對在地的影響","title":"晶圓廠各地設廠對在地的影響","bullets":["臺灣擁有成熟的晶圓製造技術，晶圓廠主要集中於西部區域並持續擴建。","近年因全球晶片需求大幅增加，促使晶圓廠在各地陸續設廠進駐。","相關產業與工廠進駐帶動在地經濟發展，並提供大量熱門的就業機會。","周邊土地及房屋價格逐漸上漲，但也可能對當地交通與環境帶來一定壓力。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 晶片技術發展與智慧型產品生活應用","title":"晶片技術發展與智慧型產品生活應用","bullets":["晶片是由晶圓切割而成，臺灣業者掌握先進技術製造出高效能微型晶片。","廠商利用高效能晶片開發多功能商品，讓生活周遭器物邁向電子化與智慧化。","智慧型汽車整合晶片具備環境探知與自動駕駛或輔助功能；掃地機器人可自動清潔。","晶片技術的進步深刻改變現代人的生活樣貌，大幅減少打掃負擔並提升便利性。"]},{"id":"core-7","type":"core","tag":"G 國際活動舉辦與文化傳播","title":"國際活動舉辦與文化傳播","bullets":["臺灣透過舉辦各類型國際活動，提升國際知名度並增加外國人士交流機會。","每年舉辦臺北國際電腦展等科技盛事，以及舉辦國際運動競賽活動。","吸引東南亞、日韓與歐美等地的工作者、專業人才與觀光旅客來臺。","讓臺灣特色美食與熱門景點向外傳播，使世界更了解臺灣豐富的文化內涵。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 觀光交流帶動的大眾運輸與多國語言服務","title":"觀光交流帶動的大眾運輸與多國語言服務","bullets":["來臺外國員工人數與觀光旅客增加，促使大眾場所與生活設施更加國際化。","早年公共場域多僅標示中文與英文，現今配合旅客需求大幅增加多國語言服務。","大眾捷運系統在部分車站增設多國文字標示及日、韓等語言到站語音廣播。","提供外國人士便利的搭乘體驗，同時帶動國內觀光產業與周邊商店的商機。"]},{"id":"core-9","type":"core","tag":"I 台積電日本熊本設廠的異國風貌與衝擊","title":"台積電日本熊本設廠的異國風貌與衝擊","bullets":["西元2024年台積電在日本熊本設立晶圓廠開幕，係因日本邀請前往以帶動高科技製造。","因應臺灣員工及家眷移入，日本當地增設車站、國際學校並販售臺灣民生商品與小吃。","商家學習簡易中文對話，展現臺日文化交流與當地生活風貌的轉變。","大量工廠與人口進駐也帶來土地惜售、房價與物價上漲，以及交通等衝擊。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"中小型企業是指資本額在新臺幣一億元以上，且僱用員工人數超過二百人的大型企業。","right":"中小型企業定義為實收資本額在新臺幣一億元以下（含一億元），或經常僱用員工人數未滿二百人。 課本第78頁明確規定兩項指標上限，一億元以下或未滿二百人者才是中小型企業。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"民國八十年代後期面對國外低價競爭，臺灣自行車廠商全數關閉倒閉，並放棄研發產品。","right":"巨大與美利達等廠商組成A-Team，透過技術合作與研發零件成功轉型生產高階自行車。 課本第79頁指出臺灣自行車產業透過A-Team團隊提升品質與營運，轉型為全球高階自行車生產基地。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"晶片是將數百個微小的晶圓直接拼湊組合焊接後所製造出來的電子組件。","right":"晶片是由晶圓經過製作電路後切割切分出來的微小電子組件。 課本第81頁圖④標明「晶片為晶圓切割而成」，主客體與製造程序不可倒置。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"西元2020年新冠疫情期間，因為各國封城停工，導致全球對臺灣電子零件的需求完全停止。","right":"疫情期間因遠距科技與人工智慧發展，全球對電子零件需求日漸增長，使臺灣電子產業備受重視。 課本第80頁指出新冠疫情促使遠距與不接觸科技大增，電子零件需求不降反升。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"台積電於西元2024年在日本熊本設立的晶圓廠開幕，代表當天就已經完全實現大量量產。","right":"西元2024年熊本晶圓廠開幕是設廠與營運的歷史里程碑，設廠與量產需要後續製程與測試。 課本第83頁記錄西元2024年熊本晶圓廠開幕之事實，教學與考題不應誤導為開幕即瞬間滿載量產。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"早期臺灣大眾捷運系統與公共場域就已經普及日文、韓文等多國語言語音廣播服務。","right":"早年公共場域僅標示中文與英文，近年因外國觀光客與工作者增加才增設多國語言標示與廣播。 課本第82頁說明多國語言服務是近年來外國人士增加後才在大眾運輸系統逐步增設的。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"中小型企業的發展與轉型突破｜知識關係","chain":["占全體就業人口八成以上，資本額一億元以下或員工未滿二百人","民80年代後期面臨國外低價競爭，組A-Team推跨國技術合作與研發","轉型生產高單價特製化商品，成為全球高階自行車與關鍵零件供應鏈"]},{"id":"logic-2","type":"chain","title":"亮眼的電子產業與全球影響力｜知識關係","chain":["發展多樣化電子零件製造，晶圓代工與資通訊具關鍵影響力","西元2020年新冠疫情與遠距科技需求暴增，各國積極邀請臺商設廠","晶圓廠各地設廠帶動就業與在地經濟，但也引發房價上漲與環境壓力"]},{"id":"logic-3","type":"chain","title":"晶片技術進步與智慧生活應用｜知識關係","chain":["掌握先進晶圓製造技術，將晶圓切割製作高效能微型晶片","整合晶片開發智慧型汽車與掃地機器人等智慧型產品","具備環境探知與自動清潔等功能，深刻改變人們便利的生活樣貌"]},{"id":"logic-4","type":"chain","title":"國際交流互動與文化風貌轉變｜知識關係","chain":["舉辦台北國際電腦展與國際賽事，吸引全球工作者與觀光客","捷運增設多國語言標示語音廣播，推廣珍奶與九份老街等美食景點","台積電熊本設廠帶來臺灣小吃與中文對話，促進臺日交流與生活改變"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣主要產業類別發展轉型與國際競爭力對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜高科技晶圓廠設廠對在地經濟與生活風貌衝擊因果流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["晶圓（Wafer）","晶片（Chip）","晶圓係經過複雜製程刻畫微小電路的大型圓片；晶片則係將製作好電路的晶圓經過切割切分出來的小型微晶體，用於各類智慧型產品中。"],["傳統器物（如早期汽車/傳統吸塵器）","智慧型器物（如智慧型汽車/掃地機器人）","傳統器物功能基礎且高度依賴人力操作與手動控制；智慧型器物整合了高效能微型晶片，具備環境探知、自動駕駛輔助或自動清潔拖地等智慧功能。"],["傳統中小型企業","高科技半導體企業","中小型企業實收資本額在1億元以下且員工未滿200人，具備靈活調整與彈性進出市場特質；高科技半導體企業以晶圓代工與先進製程為核心，資金與技術高度密集且具全球關鍵供應鏈影響力。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","中小型企業","實收資本額在新臺幣一億元以下或經常僱用員工人數未滿二百人的企業，占臺灣就業人口八成以上。"],["2","A-Team","由巨大與美利達等臺灣自行車成車與零件廠商組成的團隊，透過技術合作與研發抗衡低價競爭並成功轉型。"],["3","晶圓代工","接受其他企業委託製造晶圓的專業分工模式，臺灣在此領域具備全球關鍵影響力與成熟技術。"],["4","晶片","由晶圓切割而成的高效能微型電子組件，為電腦、手機及智慧型汽車等智慧產品的核心大腦。"],["5","智慧型汽車","整合高效能晶片與感應器，具備環境探知與自動駕駛或輔助駕駛功能的現代汽車。"],["6","臺北國際電腦展","臺灣每年舉辦的重大國際科技展覽，近年融合AI科技，吸引廣大外國人士與專業買家前來交流。"],["7","多國語言服務","大眾捷運系統、商店與政府單位在大眾場域增設的多國文字標示與語音廣播（如英、日、韓語），提升便利性。"],["8","珍珠奶茶","發源於民國七十年代後期的臺灣特色手搖飲，現今深受國外觀光客青睞並成功推廣至全球茶飲市場。"],["9","九份老街","位於新北市，起源於清帝國時期開採金礦，因懷舊風貌與山海景色吸引大量國外觀光客前來體驗。"],["10","台積電熊本廠","西元2024年在日本熊本縣開幕的晶圓廠，由日本政府邀請設廠，帶動臺日高科技產業與文化生活交流。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜因果推論","clue":"中小企業的競爭困境與跨國技術轉型","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較民國八十年代後期臺灣傳統企業選擇「外移倒閉」與「轉型成功」兩種不同發展路線的因果影響，下列敘述何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜證據判讀","clue":"臺灣自行車產業的成功轉型實例","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"臺灣自行車產業在面對中國低價產品競爭時，其轉型策略與成功成果的證據判讀，下列何者正確？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"電子產業實力與全球關鍵影響力","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"西元2020年新冠疫情蔓延全球，各國運用遠距或不接觸科技，這項外部環境變遷對臺灣電子產業產生了何種因果影響？"}]}],"cloze":{"core-1":{"selector":".point","terms":["實收資本額在新臺幣一億元以下"]},"core-2":{"selector":".point","terms":["跨國技術合作"]},"core-3":{"selector":".point","terms":["A-Team"]},"core-4":{"selector":".point","terms":["晶圓代工"]},"core-5":{"selector":".point","terms":["房屋價格逐漸上漲"]},"core-6":{"selector":".point","terms":["晶圓切割而成"]},"core-7":{"selector":".point","terms":["臺北國際電腦展"]},"core-8":{"selector":".point","terms":["多國語言服務"]},"core-9":{"selector":".point","terms":["日本熊本"]},"mindmap-overview":{"selector":".mind-branch p","terms":["組A-Team推跨國技術合作與研發","晶圓代工與資通訊具關鍵影響力","整合晶片開發智慧型汽車","捷運增設多國語言標示語音廣播"]},"trap-1":{"selector":".correct","terms":["實收資本額在新臺幣一億元以下"]},"trap-2":{"selector":".correct","terms":["A-Team"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["中小型企業","A-Team","晶圓代工","晶片","智慧型汽車","臺北國際電腦展","多國語言服務","珍珠奶茶","九份老街","台積電熊本廠"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>中小型企業的發展與轉型突破\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>占全體就業人口八成以上，資本額一億元以下或員工未滿二百人\u003c/p>\u003cp>\u003cb>關係：\u003c/b>民80年代後期面臨國外低價競爭，組A-Team推跨國技術合作與研發\u003c/p>\u003cp>\u003cb>結果：\u003c/b>轉型生產高單價特製化商品，成為全球高階自行車與關鍵零件供應鏈\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>亮眼的電子產業與全球影響力\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>發展多樣化電子零件製造，晶圓代工與資通訊具關鍵影響力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西元2020年新冠疫情與遠距科技需求暴增，各國積極邀請臺商設廠\u003c/p>\u003cp>\u003cb>結果：\u003c/b>晶圓廠各地設廠帶動就業與在地經濟，但也引發房價上漲與環境壓力\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>晶片技術進步與智慧生活應用\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>掌握先進晶圓製造技術，將晶圓切割製作高效能微型晶片\u003c/p>\u003cp>\u003cb>關係：\u003c/b>整合晶片開發智慧型汽車與掃地機器人等智慧型產品\u003c/p>\u003cp>\u003cb>結果：\u003c/b>具備環境探知與自動清潔等功能，深刻改變人們便利的生活樣貌\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>國際交流互動與文化風貌轉變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>舉辦台北國際電腦展與國際賽事，吸引全球工作者與觀光客\u003c/p>\u003cp>\u003cb>關係：\u003c/b>捷運增設多國語言標示語音廣播，推廣珍奶與九份老街等美食景點\u003c/p>\u003cp>\u003cb>結果：\u003c/b>台積電熊本設廠帶來臺灣小吃與中文對話，促進臺日交流與生活改變\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>世界看見臺灣\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">產業類型\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">面臨衝擊或發展契機\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">轉型策略與全球影響力\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>產業類型\u003c/th>\u003cth>面臨衝擊或發展契機\u003c/th>\u003cth>轉型策略與全球影響力\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>中小型製造業（如自行車）\u003c/td>\u003ctd>民國80年代後期國外低價商品與低價勞工競爭挑戰\u003c/td>\u003ctd>籌組A-Team團隊研發零件與技術合作，成為全球高階自行車生產基地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>電子半導體產業（晶圓代工）\u003c/td>\u003ctd>西元2020年新冠疫情帶動遠距科技與AI零件需求暴增\u003c/td>\u003ctd>憑藉成熟晶圓製造技術與完整供應鏈，成為全球關鍵生產國並受邀赴國外設廠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>智慧型器物與家電產業\u003c/td>\u003ctd>傳統汽車與清潔器物功能單一且依賴人力操作\u003c/td>\u003ctd>整合高效能微型晶片，開發智慧型汽車（自動駕駛/探知）與自動掃地機器人\u003c/td>\u003c/tr>\u003ctr>\u003ctd>觀光與休閒服務產業\u003c/td>\u003ctd>各國關注臺灣，國際活動與來臺觀光人數增加\u003c/td>\u003ctd>推廣手搖飲（珍珠奶茶）、九份老街景點，捷運增設多國語言服務帶動商機\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依照產業類型自中小型製造業、電子半導體、智慧器物至觀光服務業比對其契機與轉型成果。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論臺灣自行車產業轉型成功是因為放棄了所有技術合作並改為低價量產。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>臺灣自行車產業面對國外低價競爭時，採取了什麼關鍵策略成功轉型為高階自行車生產基地？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>籌組A-Team團隊。由巨大與美利達等公司領軍，透過研發零件與技術合作提高產品品質與營運績效。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">核心事件或發展趨勢\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對在地經濟與居民生活的影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>核心事件或發展趨勢\u003c/th>\u003cth>對在地經濟與居民生活的影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>國內晶圓廠擴展設廠\u003c/td>\u003ctd>西部走廊（如新竹、臺中、臺南、高雄等）晶圓廠陸續設立\u003c/td>\u003ctd>帶動工廠附近就業機會大幅增加，吸引產業進駐並促進在地經濟繁榮\u003c/td>\u003c/tr>\u003ctr>\u003ctd>房地產與生活成本演變\u003c/td>\u003ctd>晶圓廠進駐帶來高薪就業人口與住房需求\u003c/td>\u003ctd>帶動工廠周邊土地及房屋價格逐漸上漲，增加當地居住成本與物價負擔\u003c/td>\u003c/tr>\u003ctr>\u003ctd>國外設廠（熊本廠實例）\u003c/td>\u003ctd>西元2024年台積電受邀於日本熊本設立晶圓廠開幕\u003c/td>\u003ctd>日本增設車站與國際學校，超市出現臺灣商品與小吃，商家學習中文\u003c/td>\u003c/tr>\u003ctr>\u003ctd>環境與交通潛在衝擊\u003c/td>\u003ctd>大量工廠與移入人口快速湧入在地城鄉社區\u003c/td>\u003ctd>可能對在地交通造成壅塞，並對土地、電力與水資源等環境造成一定壓力\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>從國內晶圓廠設廠、房地產變化、國外熊本設廠至環境交通衝擊進行流程與因果判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論晶圓廠在各地設廠只會帶來房屋價格上漲，完全沒有提供任何就業機會。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>晶圓廠設廠除了能促進在地經濟發展與增加就業機會之外，還可能對當地房地產產生什麼影響？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>帶動工廠附近的土地及房屋價格逐漸上漲。因為相關產業與人口進駐增加了住房與土地需求。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>中小型企業的發展與轉型突破\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>占全體就業人口八成以上，資本額一億元以下或員工未滿二百人\u003c/p>\u003cp>\u003cb>關係：\u003c/b>民80年代後期面臨國外低價競爭，組A-Team推跨國技術合作與研發\u003c/p>\u003cp>\u003cb>結果：\u003c/b>轉型生產高單價特製化商品，成為全球高階自行車與關鍵零件供應鏈\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>亮眼的電子產業與全球影響力\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>發展多樣化電子零件製造，晶圓代工與資通訊具關鍵影響力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西元2020年新冠疫情與遠距科技需求暴增，各國積極邀請臺商設廠\u003c/p>\u003cp>\u003cb>結果：\u003c/b>晶圓廠各地設廠帶動就業與在地經濟，但也引發房價上漲與環境壓力\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>晶片技術進步與智慧生活應用\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>掌握先進晶圓製造技術，將晶圓切割製作高效能微型晶片\u003c/p>\u003cp>\u003cb>關係：\u003c/b>整合晶片開發智慧型汽車與掃地機器人等智慧型產品\u003c/p>\u003cp>\u003cb>結果：\u003c/b>具備環境探知與自動清潔等功能，深刻改變人們便利的生活樣貌\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>國際交流互動與文化風貌轉變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>舉辦台北國際電腦展與國際賽事，吸引全球工作者與觀光客\u003c/p> document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cloze-slot')&&clozeMode){e.preventDefault();toggleCloze(e.target)}});
document.getElementById('mode-cloze').onclick=()=>{clozeMode=true;refreshCloze()};
document.getElementById('mode-full').onclick=()=>{clozeMode=false;refreshCloze()};
document.getElementById('mode-reset').onclick=refreshCloze;
document.body.classList.add('student-cloze');

async function addSnowNotes(all){
 const advice={
  core:{asset:'explain',title:'小雪的叮嚀｜把生活變化說出來',text:'別只背政策名稱！試著用「做了什麼 → 改變了什麼」說明這一頁，再想想不同角色的感受會不會一樣。'},
  logic:{asset:'check',title:'小雪的叮嚀｜先找線索，再下結論',text:'先圈出題目問的是背景、做法還是影響。遇到「全部、一定、只有」，記得回頭找證據，別急著選！'},
  answers:{asset:'explain',title:'小雪的叮嚀｜答對還要說得出理由',text:'核對後，挑一道錯題說說：我被哪個詞誤導？正確線索在哪裡？能解釋錯誤選項，才算真的學會了。'},
  figures:{asset:'check',title:'小雪的叮嚀｜看清楚圖在告訴你什麼',text:'先看圖名、圖例與單位。圖上沒有給的資料，就不要猜；用看得到的證據回答問題。'},
  traps:{asset:'shield',title:'小雪的叮嚀｜抓到陷阱的關鍵詞',text:'把錯誤說法改成正確句子，再說出理由。能解釋哪裡錯，比只記住答案更有用！'},
  compare:{asset:'check',title:'小雪的叮嚀｜比較同一個面向',text:'先看這一欄比較的是功能、時期，還是影響。用同一個標準對照，才不會把不同概念混在一起。'},
  keywords:{asset:'explain',title:'小雪的叮嚀｜把關鍵字變成一句話',text:'遮住說明，試著用自己的話解釋一個關鍵字，再搭配一個生活例子。說得出來，才算記得牢！'}
 };
 advice.mindmap={asset:'explain',title:'小雪的叮嚀｜把四條線連成故事',text:'先從中央主題說到四條主線，再用自己的話解釋它們如何連在一起。說得出關係，再補回關鍵詞！'};advice['question-types']={asset:'check',title:'小雪的叮嚀｜把方法帶進下一題',text:'先辨認題目問什麼，再找線索與證據。選好答案後，試著解釋其他選項為什麼不適合。'};for(const p of all){
  if(p.querySelector('.mascot-row img'))continue;
  const b=p.querySelector('.page-body'),last=b.lastElementChild;if(!last)continue;
  const free=b.getBoundingClientRect().bottom-last.getBoundingClientRect().bottom;
  let guide=advice[p.dataset.section];if(!guide||free<175)continue;
  if(p.querySelector('#core-c'))guide={asset:'explain',title:'小雪的叮嚀｜從工廠看見家庭生活',text:'想想看：工廠增加了哪些工作機會？收入能如何改變家庭生活與進修選擇？把生產、工作與生活連起來說。'};
  if(p.querySelector('#core-d'))guide={asset:'shield',title:'小雪的叮嚀｜便利與代價要一起看',text:'評估一項建設時，先找它改善了什麼，再問可能影響誰的健康、生活或生態。能看到不同立場，答案才完整。'};
  if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};
  if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

const paper=document.getElementById('paper-select');function setPaper(v){document.body.dataset.paper=['dot','ring','plain'].includes(v)?v:'dot';paper.value=document.body.dataset.paper;try{localStorage.setItem('sixuncle-paper',paper.value)}catch(e){}}try{setPaper(localStorage.getItem('sixuncle-paper')||'dot')}catch(e){setPaper('dot')}paper.onchange=()=>setPaper(paper.value);let didAnchor=false;document.addEventListener('book-ready',()=>{if(didAnchor)return;didAnchor=true;if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}))}});
window.__ready=false;document.fonts.ready.then(paginate);
</script></body></html>

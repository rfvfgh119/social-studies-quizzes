t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林6上3-1 資訊科技如何改變生活帶來挑戰？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-1","title":"資訊科技如何改變生活帶來挑戰？"},"questions":[{"question":"在資訊科技尚未廣泛運用之前，人們購物與尋找資料的主要方式為何？","options":["利用手機App預約購物，並以語音助理檢索知識","親自前往市場或商店付現，並到圖書館翻閱紙本書籍","透過社群媒體訂購商品，並在網路論壇查閱資料","透過線上電商訂購，並前往圖書館線上查詢"],"answer":1,"explanation":"課本指出過去購物必須親自前往市場或商店並以現金付款；查找資料需前往圖書館翻閱紙本書籍。其他選項包含網路、手機App、線上查詢等現代資訊科技手段，不符過去生活型態。","concept":"昔今生活方式演變","skill":"概念理解","review":"core-1","evidence":"過去，許多家務工作大多依靠人力完成；購物時，必須親自前往市場或商店，並以現金付款。","id":"q1","stem":"在資訊科技尚未廣泛運用之前，人們購物與尋找資料的主要方式為何？","theme":"昔今生活方式演變","explain":"課本指出過去購物必須親自前往市場或商店並以現金付款；查找資料需前往圖書館翻閱紙本書籍。其他選項包含網路、手機App、線上查詢等現代資訊科技手段，不符過去生活型態。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"資訊科技的廣泛發展，對於人們日常生活最大的正面影響為何？","options":["保證網路上的所有訊息皆為真實可靠","突破時間與空間限制，使吸收資訊與互動更便利","消除人際交流間所有的孤獨感與溝通障礙","徹底取代實體讀書與傳統市場購物"],"answer":1,"explanation":"課本說明資訊科技突破了時間與空間的限制，讓人們在吸收資訊與互動時更加便利。選項0過於絕對，新舊方式仍可並存；選項2與3錯誤，網路資訊可能造假且過度依賴會產生孤獨感與溝通困難。","concept":"時空限制突破","skill":"概念理解","review":"core-2","evidence":"資訊科技突破了時間與空間的限制，使人們在吸收資訊與互動時更加便利。","id":"q2","stem":"資訊科技的廣泛發展，對於人們日常生活最大的正面影響為何？","theme":"時空限制突破","explain":"課本說明資訊科技突破了時間與空間的限制，讓人們在吸收資訊與互動時更加便利。選項0過於絕對，新舊方式仍可並存；選項2與3錯誤，網路資訊可能造假且過度依賴會產生孤獨感與溝通困難。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"現今民眾結合智慧站牌與手機App搭乘公車，主要解決了過去何種搭車困境？","options":["公車車廂內沒有提供免費網路","公車路線過少無法到達目的地","公車票價過於昂貴無法負擔","無法預知時間而在站牌苦等"],"answer":3,"explanation":"課本提及過去民眾搭大眾運輸常因無法預知時間而在站牌苦等；現今結合智慧站牌與App能即時掌握公車到站動態，減少等待時間。","concept":"智慧站牌應用","skill":"概念理解","review":"core-3","evidence":"過去民眾搭乘大眾運輸時，常因無法預知時間而在站牌苦等。","id":"q3","stem":"現今民眾結合智慧站牌與手機App搭乘公車，主要解決了過去何種搭車困境？","theme":"智慧站牌應用","explain":"課本提及過去民眾搭大眾運輸常因無法預知時間而在站牌苦等；現今結合智慧站牌與App能即時掌握公車到站動態，減少等待時間。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於網路上的圖片、音樂或影音作品，法律賦予的保護與使用規範為何？","options":["基本上都受著作權法保護，使用前須獲得授權方同意","只要放在網路上供人免費瀏覽即可任意下載轉貼","只要註明圖片創作者姓名就可以直接公開圖利","非營利性質的使用完全不需要獲得原創者授權"],"answer":0,"explanation":"課本明確說明網路上的圖片或影音基本上都受著作權法保護，使用前必須獲得授權方的同意，經過授權流程才可使用。註明出處或非營利並不自動等於取得授權。","concept":"著作權法保護","skill":"概念理解","review":"core-4","evidence":"網路上的圖片或影音基本上都有受到著作權法保護，使用前必須獲得授權方的同意。","id":"q4","stem":"關於網路上的圖片、音樂或影音作品，法律賦予的保護與使用規範為何？","theme":"著作權法保護","explain":"課本明確說明網路上的圖片或影音基本上都受著作權法保護，使用前必須獲得授權方的同意，經過授權流程才可使用。註明出處或非營利並不自動等於取得授權。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"當收到來路不明的簡訊附帶不明網站連結時，最正確且安全的做法為何？","options":["切勿點選不明連結，避免個資與金融資訊遭竊","立刻點選連結確認信件或貨物狀況","直接回覆簡訊並填寫身分證字號核對資料","將簡訊轉傳給所有好友測試是否為病毒"],"answer":0,"explanation":"課本指出當收到不明網站連結時，應切記勿點選不明連結，以免個人資料或金融資訊遭到竊取或設備被植入病毒。","concept":"個人資料與網路防護","skill":"概念理解","review":"core-5","evidence":"應切記勿點選不明連結，以免個人資料或金融資訊遭到竊取。","id":"q5","stem":"當收到來路不明的簡訊附帶不明網站連結時，最正確且安全的做法為何？","theme":"個人資料與網路防護","explain":"課本指出當收到不明網站連結時，應切記勿點選不明連結，以免個人資料或金融資訊遭到竊取或設備被植入病毒。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"在網路上發表公然侮辱或侵害他人名譽的言論，會面臨何種法律與權利後果？","options":["不受言論自由保障，且可能因誹謗罪須負法律責任","僅屬於公德心問題，法律無法進行任何限制","只要事後刪除留言就不需負任何責任","屬於個人言論自由，完全受法律無條件保護"],"answer":0,"explanation":"課本強調侵害他人名譽的言論不受到言論自由的保障，還可能因誹謗罪而須負起法律責任。","concept":"網路言論界線與誹謗罪","skill":"概念理解","review":"core-6","evidence":"侵害他人名譽的言論，不但不受到言論自由的保障，還可能因誹謗罪而須負起法律責任。","id":"q6","stem":"在網路上發表公然侮辱或侵害他人名譽的言論，會面臨何種法律與權利後果？","theme":"網路言論界線與誹謗罪","explain":"課本強調侵害他人名譽的言論不受到言論自由的保障，還可能因誹謗罪而須負起法律責任。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"政府制定《著作權法》與《資通安全管理法》等相關法規，其最主要的目的為何？","options":["取代民眾個人建立上網習慣與思考的能力","嚇阻資訊科技的違法行為，保障國家安全與公共利益","規定所有網路內容都必須由政府統一審查後發表","強制全面禁止民眾使用手機與電腦上網"],"answer":1,"explanation":"課本指出政府制定著作權法、資通安全管理法等法規，係藉此嚇阻資訊科技的違法行為，保障國家安全與維護社會公共利益。","concept":"資安法規與管理","skill":"概念理解","review":"core-7","evidence":"政府制定著作權法、資通安全管理法等法規，藉此嚇阻資訊科技的違法行為。","id":"q7","stem":"政府制定《著作權法》與《資通安全管理法》等相關法規，其最主要的目的為何？","theme":"資安法規與管理","explain":"課本指出政府制定著作權法、資通安全管理法等法規，係藉此嚇阻資訊科技的違法行為，保障國家安全與維護社會公共利益。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"關於人工智慧（AI）技術在日常生活中的實際應用，下列何者不屬於課本所列舉的範疇？","options":["透過與AI互動學習語言","由AI完全替代人類進行所有道德與法律的決策","透過AI智慧客服獲得24小時即時諮詢與遺失物指引","利用智慧穿戴裝置記錄身體狀況並給予健康提醒"],"answer":1,"explanation":"課本列舉AI應用包含學習語言、記錄身體狀況與提醒健康、大眾運輸智慧客服；AI無法完全替代人類進行道德與法律決策。","concept":"人工智慧生活應用","skill":"概念理解","review":"core-8","evidence":"例如：我們可以跟人工智慧互動來學習語言，也能記錄身體狀況，提醒自己保持健康。搭乘大眾運輸遇到問題時，也能即時詢問智慧客服。","id":"q8","stem":"關於人工智慧（AI）技術在日常生活中的實際應用，下列何者不屬於課本所列舉的範疇？","theme":"人工智慧生活應用","explain":"課本列舉AI應用包含學習語言、記錄身體狀況與提醒健康、大眾運輸智慧客服；AI無法完全替代人類進行道德與法律決策。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"面對網路上可能造假或不實的AI生成資訊，課本建議民眾應落實的「智慧停看查」原則，其「停」的具體意涵為何？","options":["停止獨立思考並完全相信網路熱門討論","先停止轉傳動作，避免成為假訊息傳播者","停止使用所有電子設備與網路功能","停止向政府或公信單位求證"],"answer":1,"explanation":"課本說明「停」是指看到可疑資訊時，先停止轉傳動作，避免盲目散播錯誤訊息。","concept":"智慧停看查原則","skill":"概念理解","review":"core-9","evidence":"看到可疑資訊時，要記得「停」、「看」、「查」！停：停止轉傳動作。","id":"q9","stem":"面對網路上可能造假或不實的AI生成資訊，課本建議民眾應落實的「智慧停看查」原則，其「停」的具體意涵為何？","theme":"智慧停看查原則","explain":"課本說明「停」是指看到可疑資訊時，先停止轉傳動作，避免盲目散播錯誤訊息。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"現今人們能透過手機對家電設備進行「遠端控制」，其主要技術基礎為何？","options":["傳統家電的手動開關按鈕","透過廣播電台發送定時語音信號","透過網際網路與遙控技術進行操作與存取","利用郵局寄送紙本信件進行遠程指令"],"answer":2,"explanation":"課本定義遠端控制是指在實體距離遙遠的另一端，利用網路技術來操作、控制或存取資料或家電設備。","concept":"遠端家電控制","skill":"概念理解","review":"core-3","evidence":"指在實體距離遙遠的另一端，利用網路技術來操作、控制或存取資料。","id":"q10","stem":"現今人們能透過手機對家電設備進行「遠端控制」，其主要技術基礎為何？","theme":"遠端家電控制","explain":"課本定義遠端控制是指在實體距離遙遠的另一端，利用網路技術來操作、控制或存取資料或家電設備。","reviewText":"核心 3","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 昔今生活與學習方式的演變","title":"昔今生活與學習方式的演變","bullets":["過去購物需親自前往市場並以現金付款，查找資料需前往圖書館翻閱紙本書籍","因傳統方式依賴人與人實際接觸完成，使資訊傳遞不便且交流受到較多限制","現今可利用電腦、手機與平板等電子設備，搭配各種軟體處理資料與傳訊息","生活方式從親自到場演變成線上訂購與即時查詢，提升處理事務的便利性"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 時空限制突破與新社會問題","title":"時空限制突破與新社會問題","bullets":["資訊科技突破了時間與空間的限制，讓吸收資訊與跨國交流更加便利","隨著網路平臺與社群媒體普及，人們習慣透過網路處理日常生活事務","使用資訊科技若忽略資訊正確性，可能掉進詐騙陷阱遭受財物損失","過度依賴資訊科技而減少真實人際互動，可能產生孤獨與溝通困難等新社會問題"]},{"id":"core-3","type":"core","tag":"C 智慧站牌與遠端家電控制","title":"智慧站牌與遠端家電控制","bullets":["智慧站牌與公車App可提供預估到站時間與即時行車動態資訊","過去民眾搭大眾運輸常因無法預知時間而在站牌苦等，造成時間浪費","現今結合App技術讓民眾能有效率規劃行程，大幅減少等待不確定感","除了搭車資訊外，人們也能透過手機利用遙控技術遠端控制各項家電設備"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 網路創作與著作權法規範","title":"網路創作與著作權法規範","bullets":["網路圖片、音樂或影音基本上都受到著作權法保護，不可任意公開使用","擅自擷取、下載他人著作並公開分享或從中圖利，會侵犯創作者權益","使用網路圖影前必須獲得授權方同意，並經過相關授權流程才可合法使用","未告知對方情況下使用圖片與影音可能觸犯著作權法，註明出處不等於獲得授權"]},{"id":"core-5","type":"core","tag":"E 個人資料保護與網路防護","title":"個人資料保護與網路防護","bullets":["點擊不明連結或下載來路不明檔案可能使設備被植入病毒或惡意入侵","輕信網路陌生人說法容易落入詐騙陷阱，導致個人資料遭盜用或財物損失","填寫姓名、地址或身分證字號等隱私資料時應提高警覺，不任意洩漏個資","收到可疑簡訊或網址應切勿點選，應改從已知可信的官方管道進行確認"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 網路言論界線與誹謗罪責任","title":"網路言論界線與誹謗罪責任","bullets":["在網路上發表侵害他人名譽的不當言論，不受言論自由保障","社群網路普及讓學生容易在網路上交流，但也可能產生不當發言爭議","公然發表侮辱或抹黑他人的留言，會侵害他人名譽並破壞網路秩序","發表不當言論可能因觸犯誹謗罪而須負起相應的法律責任"]},{"id":"core-7","type":"core","tag":"G 資安法規建構與上網習慣","title":"資安法規建構與上網習慣","bullets":["政府制定著作權法與資通安全管理法等法規，以嚇阻違法行為與維護公共利益","科技變化速度極快，法律往往追不上科技演變速度，需要全民共同配合","民眾應遵守相關法規並支持正版影音，同時養成良好的個人上網習慣","上網前先確認資料來源與網站安全，不上傳或轉傳未授權內容以維護資安"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 人工智慧的多元日常生活應用","title":"人工智慧的多元日常生活應用","bullets":["人工智慧（AI）技術快速發展，能透過輸入文字、聲音或圖像指令生成內容","生成式AI可製作文章、圖片或影片，也能協助整理資料與回答問題","日常中能透過與AI互動學習語言，或利用智慧穿戴裝置記錄身體狀況與提醒健康","大眾運輸如台北捷運導入AI智慧客服，提供24小時不間斷諮詢與遺失物指引"]},{"id":"core-9","type":"core","tag":"I AI科技挑戰與智慧停看查","title":"AI科技挑戰與智慧停看查","bullets":["利用AI生成內容參加比賽可能影響公平性，製作假影音則會散播錯誤資訊","擬真影像與假語音容易造成民眾誤解受騙，若錯誤轉傳會引發社會不安混亂","面對可能造假的AI資訊，應培養獨立思考與判斷能力，不盲目相信不明訊息","遇到可疑資訊應落實「智慧停看查」：停（停止轉傳）、看（細看破綻）、查（向公信單位求證）"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"網路上的圖片與影片只要可以在螢幕上免費瀏覽，就可以下載並公開轉貼到社群平臺。","right":"網路上的圖影基本上均受著作權法保護，未獲授權不得公開使用、轉貼或圖利。 公開分享未獲授權的著作屬侵權行為，且標明出處不等於自動取得授權。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"只要是在網路上表達個人情緒或發表意見，就算言語辱罵他人也屬於言論自由保障範圍。","right":"侵害他人名譽的不當言論不受言論自由保障，可能觸犯誹謗罪而需負法律責任。 言論自由不可以侵犯他人名譽權與法律界線。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"收到含有包裹運送問題與網址連結的簡訊時，應該立刻點開連結登入帳號查詢。","right":"切勿點選簡訊中來路不明的連結，應改從已知可信的官方管道確認。 不明連結可能引導至釣魚網站或植入病毒，導致個人資料遭盜用與財物損失。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"人工智慧生成的影片如果畫面極為逼真且沒有明顯瑕疵，就可以確定是真實發生的新聞。","right":"逼真影像不等於事實，仍需經由核對來源、日期與脈絡向具公信力單位查證。 生成式AI技術能製作擬真影音，單靠外觀視覺瑕疵無法完全判斷真偽。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"只要政府制定了資通安全管理法，就能完全防範所有網路犯罪，民眾不需改變上網習慣。","right":"法律往往追不上科技變化速度，除了政府法規外，民眾必須養成良好的上網習慣。 法規具有嚇阻作用，但個人防護與良好習慣才是資訊安全的第一線防禦。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"資訊科技讓人們隨時透過網路聯繫交流，因此現實生活中不會再產生任何溝通或孤獨問題。","right":"過度依賴資訊科技而減少真實人際互動，可能產生孤獨與溝通困難等新社會問題。 虛擬互動增加不代表真實社交品質提升，缺乏面對面接觸容易引發孤獨感。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"資訊科技改變生活方式｜知識關係","chain":["過去親自前往商店購物與圖書館查找紙本資料","利用電腦手機平臺購物、獲取即時新聞與遠端控制家電","突破時間與空間限制，但也可能減少真實人際互動"]},{"id":"logic-2","type":"chain","title":"建立資訊安全意識｜知識關係","chain":["點擊不明連結、下載來路不明檔案或輕信陌生人","不任意填寫隱私資料、不點擊不明網址與不下載不明檔案","防範設備被植入病毒及個人資料遭盜用或財物損失"]},{"id":"logic-3","type":"chain","title":"智慧財產與言論規範｜知識關係","chain":["任意擷取網路圖影公開轉發或發表不當言論","政府制定著作權法與資通安全管理法，民眾遵守規範","維護創作者權益，嚇阻違法行為並保障個人名譽"]},{"id":"logic-4","type":"chain","title":"人工智慧應用與防範｜知識關係","chain":["AI技術快速發展能生成文章圖影與假訊息","培養獨立思考能力並落實「智慧停看查」原則","學會辨別資訊真偽，避免誤導受騙與社會混亂"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜資訊科技運用於昔今生活方式對比圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜AI假訊息防範機制「智慧停看查」流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["著作權法","資通安全管理法","著作權法旨在保護著作人對其創作之權利，規範未經授權不得公開使用或圖利；資通安全管理法旨在建構國家資通安全環境，防範網路惡意入侵、個資外洩與資安威脅。"],["言論自由","不當言論（誹謗罪）","言論自由保障人民表達意見的權利，但以不侵害他人權利為界線；在網路上發表侮辱或抹黑他人等侵害名譽的不當言論，不受言論自由保障，可能因誹謗罪負法律責任。"],["傳統實體互動","資訊科技互動","傳統實體互動需親自到場並透過人與人實際接觸完成，傳遞較不便但具真實情感；資訊科技互動突破時間與空間限制，處理事務便利，但過度依賴可能產生孤獨與溝通困難。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","資訊科技","指利用電腦、手機、平板等電子設備，搭配各種程式（軟體），來處理資料、查找資訊，或互相傳訊息。"],["2","遠端控制","指在實體距離遙遠的另一端，利用網路技術來操作、控制或存取資料或家電設備。"],["3","智慧站牌","結合公車App技術之站牌，能顯示預估到站時間與即時行車動態，降低候車不確定感。"],["4","著作權","法律賦予著作人對其創作之權利，創作完成即受保護，未獲授權不得公開使用或圖利。"],["5","資通安全管理法","政府為積極推動國家資通安全政策、建構資安環境、維護社會公共利益與國家安全所制定的法律。"],["6","誹謗罪","在網路上發表侵害他人名譽之不當言論所可能觸犯的法律責任，該不當言論不受言論自由保障。"],["7","人工智慧","簡稱AI，能透過輸入文字、聲音或圖像指令產生文章、影音，並能整理資料與即時解答之技術。"],["8","智慧客服","運用AI、自然語言處理與機器學習技術，模擬客服人員提供24小時不間斷諮詢指引服務。"],["9","獨立思考與判斷能力","運用自身學識與經驗自主分析評估資訊真偽，不盲從大眾或網路訊息的能力。"],["10","智慧停看查","面對可疑網路訊息時的防範步驟：停（停止轉傳）、看（細看破綻）、查（向公信單位求證）。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"昔今生活方式對比","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「過去傳統生活」與「現今資訊時代」的資訊獲取方式，下列敘述何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"科技過度依賴之影響","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"現代人過度依賴資訊科技處理日常生活事務，在現實社交層面最可能引發何種負面因果影響？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"資安風險因果鏈","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"民眾若隨意點擊簡訊中的不明網址連結，最直接導致的安全風險鏈為何？"}]}],"cloze":{"core-1":{"selector":".point","terms":["親自前往市場並以現金付款"]},"core-2":{"selector":".point","terms":["時間與空間的限制"]},"core-3":{"selector":".point","terms":["預估到站時間"]},"core-4":{"selector":".point","terms":["著作權法保護"]},"core-5":{"selector":".point","terms":["個人資料遭盜用"]},"core-6":{"selector":".point","terms":["誹謗罪"]},"core-7":{"selector":".point","terms":["資通安全管理法"]},"core-8":{"selector":".point","terms":["人工智慧"]},"core-9":{"selector":".point","terms":["獨立思考與判斷能力"]},"mindmap-overview":{"selector":".mind-branch p","terms":["突破時間與空間限制","個人資料遭盜用","著作權法","智慧停看查"]},"trap-1":{"selector":".correct","terms":["著作權法保護"]},"trap-2":{"selector":".correct","terms":["誹謗罪"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["資訊科技","遠端控制","智慧站牌","著作權","資通安全管理法","誹謗罪","人工智慧","智慧客服","獨立思考與判斷能力","智慧停看查"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>資訊科技改變生活方式\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>過去親自前往商店購物與圖書館查找紙本資料\u003c/p>\u003cp>\u003cb>關係：\u003c/b>利用電腦手機平臺購物、獲取即時新聞與遠端控制家電\u003c/p>\u003cp>\u003cb>結果：\u003c/b>突破時間與空間限制，但也可能減少真實人際互動\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>建立資訊安全意識\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>點擊不明連結、下載來路不明檔案或輕信陌生人\u003c/p>\u003cp>\u003cb>關係：\u003c/b>不任意填寫隱私資料、不點擊不明網址與不下載不明檔案\u003c/p>\u003cp>\u003cb>結果：\u003c/b>防範設備被植入病毒及個人資料遭盜用或財物損失\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>智慧財產與言論規範\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>任意擷取網路圖影公開轉發或發表不當言論\u003c/p>\u003cp>\u003cb>關係：\u003c/b>政府制定著作權法與資通安全管理法，民眾遵守規範\u003c/p>\u003cp>\u003cb>結果：\u003c/b>維護創作者權益，嚇阻違法行為並保障個人名譽\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>人工智慧應用與防範\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>AI技術快速發展能生成文章圖影與假訊息\u003c/p>\u003cp>\u003cb>關係：\u003c/b>培養獨立思考能力並落實「智慧停看查」原則\u003c/p>\u003cp>\u003cb>結果：\u003c/b>學會辨別資訊真偽，避免誤導受騙與社會混亂\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>資訊科技如何改變生活帶來挑戰？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>購物消費\u003c/td>\u003ctd>過去必須親自前往市場或商店並以現金付款；現今可透過網路平臺線上訂購\u003c/td>\u003ctd>突破實體店面與空間限制，商品現場售完仍可跨越限制上網訂購\u003c/td>\u003c/tr>\u003ctr>\u003ctd>資料查找\u003c/td>\u003ctd>過去需親自前往圖書館翻閱紙本書籍與報紙；現今透過網路隨時收看全球新聞\u003c/td>\u003ctd>大幅提升資訊獲取效率，但數位與紙本閱讀仍可依個人習慣並存選擇\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大眾運輸\u003c/td>\u003ctd>過去在站牌苦等且無法預知時間；現今結合智慧站牌與公車App掌握動態\u003c/td>\u003ctd>精準掌握預估到站時間，降低候車不確定感，讓行程規劃更有效率\u003c/td>\u003c/tr>\u003ctr>\u003ctd>家電操作\u003c/td>\u003ctd>過去必須親自前往開關處手動啟動；現今利用遙控技術透過手機遠端控制\u003c/td>\u003ctd>遠端控制各種電燈或家電設施，提供極大的生活便利性\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先觀察過去傳統作法，再對比現今科技作法，最後歸納科技帶來的突破與意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論紙本閱讀或實體購物已完全被淘汰，課本強調新舊方式仍可依個人習慣並存。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對比圖，結合智慧站牌與手機App技術對民眾搭乘公車帶來的主要改變為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>能即時掌握公車到站動態與預估時間，降低等待不確定感並能有效率規劃行程。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>停（冷靜阻斷）\u003c/td>\u003ctd>看到驚人、可疑或未經證實的訊息時，先停止轉傳動作\u003c/td>\u003ctd>中斷錯誤資訊的快速擴散鏈，避免自己成為假訊息的傳播者\u003c/td>\u003c/tr>\u003ctr>\u003ctd>看（細心觀察）\u003c/td>\u003ctd>仔細觀察影像、語音與背景是否有不協調或破綻\u003c/td>\u003ctd>提高警覺心，辨識生成式AI可能產生的擬真瑕疵與不自然之處\u003c/td>\u003c/tr>\u003ctr>\u003ctd>查（權威核對）\u003c/td>\u003ctd>向具有公信力的單位或事實查核機構進行求證\u003c/td>\u003ctd>經由可靠管道確認訊息、時間與來源脈絡的真實性與正確性\u003c/td>\u003c/tr>\u003ctr>\u003ctd>行動（負責任）\u003c/td>\u003ctd>培養獨立思考與判斷能力，負責任地使用科技\u003c/td>\u003ctd>維護社會信任與秩序，避免造成誤解、詐騙與社會混亂\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依序按照「停」停止轉傳、「看」檢查破綻、「查」權威核對的連貫步驟進行判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論畫面若看不出明顯破綻就必定是真實影片，AI生成技術日益逼真，仍需向公信單位查證。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>當在社群平臺收到看似逼真的熱門明星新聞影片時，第一時間應採取的正確步驟為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>應先落實「停」，停止轉傳動作，並細看影像破綻與向具有公信力的單位查證。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>資訊科技改變生活方式\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>過去親自前往商店購物與圖書館查找紙本資料\u003c/p>\u003cp>\u003cb>關係：\u003c/b>利用電腦手機平臺購物、獲取即時新聞與遠端控制家電\u0 function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}

all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}

BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});

let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){

 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{

}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

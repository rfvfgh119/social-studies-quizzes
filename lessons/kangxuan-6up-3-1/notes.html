重。","bullets":["政府推動**土地改革**：讓實際耕作的農民有機會購買土地，可用貸款、分期方式繳款。","**三七五減租**減輕租田負擔；公地放領讓農民購買公有土地；耕者有其田涉及徵收地主部分土地再轉賣。","有地之後，農民能安排耕作時間、選擇作物並採用新技術，提高產量與收入，改善家庭生活。","地主獲得補償，但失去部分地租收益；**有些地主**把補償資金投入工業，促進轉型。"],"tip":"減輕租金 ≠ 擁有土地；分期購買 ≠ 免費獲贈。","source":["課本66–67頁","單課卷選擇題2、活用題","期末B卷選擇題1"]},{"id":"core-b","type":"core","tag":"B 美國援助","title":"一袋麵粉，連起餐桌與建設","bullets":["民國四十至五十年代，**美國援助**棉花、麵粉、奶粉、黃豆等物資，緩解缺乏並協助穩定物價。","麵食普及來自物資供應、政府推廣與移民飲食習慣共同作用；政府希望節省稻米出口賺取**外匯**。","物資缺乏時，部分家庭把麵粉袋再做成衣物；這反映節省與再利用，並非衣料過剩。","美援也有**貸款與設備**，協助水利、電力、交通建設，為工業發展奠定基礎。","**石門水庫**具有給水、灌溉、發電、防洪功能，連結家庭、農業和工業需求。"],"tip":"美援不只有食物，也支援基礎建設。","mascot":"explain","source":["課本68–69頁","單課卷是非題3–4、選擇題3–4","期末B卷素養養成題"]},{"id":"core-c","type":"core","breakBefore":true,"tag":"C 工業與工作","title":"從田地到工廠，家庭收入怎麼變？","bullets":["民國四十年代發展**民生工業**，如紡織、塑膠、食品加工，增加日用品供應並改善生活。","民國五十、六十年代設置**加工出口區**，以完善環境吸引國內外廠商投資，生產成衣、塑膠、家電並拓展外銷。","工廠工作增加，不少勞動人口由農業轉向工業；工資成為個人與家庭的收入來源之一。","早期加工出口區以**女性工作者**占多數。她們貼補家用、存積蓄，也有人在夜間進修。","收入伴隨勞動付出，生產線有輪班與加班。不能把早期情形套成所有年代，也不以性別決定能力。"],"tip":"煉鋼、造船屬重工業；不是這裡的民生工業例子。","source":["課本70–71頁","單課卷選擇題5–6、10、讀圖題","期末A卷選擇題1、3"]},{"id":"core-d","type":"core","tag":"D 建設與生活","title":"交通更方便，也要看發展的代價","bullets":["民國六十年代初期，西亞戰爭、產油國限制出口，造成**油價上漲與能源危機**，臺灣經濟也受波及。","政府推動**十大建設**等計畫，改善基礎設施並創造就業：交通六項、重工業三項、能源一項。","中山高速公路縮短南北往來；後續國道3號、環島鐵路、高鐵持續回應交通需求，不全屬十大建設。","工業與港口帶來便利，也可能影響**健康、安全、生態**；大林煉油廠事故及水頭港區的鱟保育是例子。","延伸閱讀：雪山隧道民國95年通車，便利返鄉旅遊、帶動就業，也帶來農地開發、物價、塞車與垃圾壓力。"],"tip":"判斷建設不能只看收入，也要看誰承擔環境與生活成本。","source":["課本72–75頁","單課卷是非題6–7、9–10、選擇題7–9、勾選題"]}]},{"id":"traps","nav":"易錯陷阱","title":"02 十二個易錯陷阱","subtitle":"先辨認容易混淆的說法，再用理由破解。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"土地免費送？","wrong":"政府買下土地，免費送給農民。","right":"農民以貸款或**分期購買**取得土地，不是免費贈送。","label":"考卷改編","source":["單課卷選擇題2，題幹：下列哪一項是政府實施"]},{"id":"trap-2","type":"trap","n":2,"title":"減租就變地主？","wrong":"三七五減租後，農民立刻成為土地所有人。","right":"減租是減輕**租田負擔**；取得所有權要區分購地政策。","label":"考卷觀念整理","source":["期末B卷選擇題1，題幹：戰後臺灣透過不同的措施"]},{"id":"trap-3","type":"trap","n":3,"title":"地主毫無補償？","wrong":"土地被徵收，地主什麼也沒拿到。","right":"地主獲得**補償**，但損失部分地租收益；影響要分角色看。","label":"考卷觀念整理","source":["期末A卷土地改革題組，題幹：土地改革所產生的影響"]},{"id":"trap-4","type":"trap","n":4,"title":"美援只有食品？","wrong":"美援僅送麵粉、奶粉，沒有支援建設。","right":"也提供**貸款與設備**，協助水利、電力與交通建設。","label":"考卷觀念整理","source":["單課卷是非題4，題幹：美援的資金讓政府可以"]},{"id":"trap-5","type":"trap","n":5,"title":"麵粉袋衣物代表富足？","wrong":"把麵粉袋做衣服，表示當時布料太多。","right":"這是**物資缺乏**下的再利用；材料與美國援助相連。","label":"考卷改編","source":["期末B卷素養題，題幹：信元的媽媽昨晚幫他"]},{"id":"trap-6","type":"trap","n":6,"title":"麵食普及因日本援助？","wrong":"麵食進入更多家庭，是日本物資援助造成。","right":"本課談的是**美國援助**，也有政策推廣與飲食習慣影響。","label":"考卷改編","source":["單課卷是非題12，題幹：今日臺灣人除了以飯"]},{"id":"trap-7","type":"trap","breakBefore":true,"n":7,"title":"煉鋼也算民生工業？","wrong":"民生工業代表就是大煉鋼廠。","right":"本課民生工業是紡織、塑膠、食品加工；**煉鋼屬重工業**。","label":"考卷改編","source":["單課卷選擇題5，題幹：民國四十年代政府開始"]},{"id":"trap-8","type":"trap","n":8,"title":"加工出口區就是科學園區？","wrong":"早期吸引廠商製作成衣的地方就是科學園區。","right":"此處指**加工出口區**；不能把不同時期與產業混在一起。","label":"考卷改編","source":["期末B卷是非題2，題幹：民國五十六十年代為了"]},{"id":"trap-9","type":"trap","n":9,"title":"早期工廠只收男性？","wrong":"加工出口區只招男性，女性很少。","right":"教材中的早期加工出口區以**女性工作者占多數**。","label":"考卷改編","source":["單課卷讀圖題3，題幹：加工出口區的工廠因為"]},{"id":"trap-10","type":"trap","n":10,"title":"中日戰爭引發十大建設？","wrong":"政府因中日戰爭爆發而推動十大建設。","right":"本課背景是民國六十年代初期的**國際能源危機**。","label":"考卷改編","source":["單課卷是非題6，題幹：政府因為中日戰爭爆發"]},{"id":"trap-11","type":"trap","n":11,"title":"高鐵是十大建設之一？","wrong":"十大建設包含西部高速鐵路。","right":"**高鐵是後續建設**；十大建設的鐵路項目有電氣化與北迴鐵路。","label":"考卷改編","source":["期末A卷選擇題2，題幹：下列哪一項不屬於十大"]},{"id":"trap-12","type":"trap","n":12,"title":"建設便利，就沒有風險？","wrong":"工業與交通只帶來好處，不會影響安全與環境。","right":"要一起看**經濟效益與健康、生態、安全成本**。","label":"考卷觀念整理","source":["單課卷是非題9，題幹：工業發展雖然會為我們"]}]},{"id":"logic","nav":"脈絡秘笈","title":"03 思考脈絡與閱讀訣竅","subtitle":"每條箭頭都要說得出「為什麼」，不靠單一關鍵字猜答案。","cards":[{"id":"logic-1","type":"chain","title":"大局觀 1｜先解決生活壓力","chain":["地租負擔沉重","分期購地","耕作自主、採新技術","產量與收入改善"],"tip":"同一政策也要看地主的補償與收益變化。","source":["課本66–67頁"]},{"id":"logic-2","type":"chain","title":"大局觀 2｜先打底，才有生產條件","chain":["物資與資金不足","美援物資、貸款設備","生活穩定、水電交通改善","工業生產條件提升"],"source":["課本68–70頁"]},{"id":"logic-3","type":"chain","title":"大局觀 3｜發展需要雙向評估","chain":["交通與工業建設","交流、就業、便利增加","也有汙染與開發壓力","兼顧安全與環境"],"source":["課本72–75頁"]},{"id":"skill-1","type":"table","title":"閱讀訣竅 1｜先分背景、措施、影響","headers":["題幹線索","判斷方向"],"rows":[["生活困苦、物資不足","背景：為什麼需要改變"],["分期購地、設加工出口區","措施：做了什麼"],["收入、外銷、就業增加","影響：生活如何變"],["汙染、安全、棲地減少","代價：誰承擔風險"]],"tip":"防錯：不能把結果當成最初原因。","source":["課本66–73頁"]},{"id":"skill-2","type":"table","title":"閱讀訣竅 2｜找出題目正在比較誰","headers":["題幹線索","判斷方向"],"rows":[["農民有地後的改變","自主耕作、家庭生活"],["地主的反應","補償與地租損失"],["女性工作者","就業、收入、進修"],["建設附近居民","便利與健康安全"]],"tip":"防錯：同一政策，不同群體未必感受相同。","source":["課本67、71、73頁"]},{"id":"skill-3","type":"table","breakBefore":true,"title":"閱讀訣竅 3｜讀圖先看四件事","headers":["先確認什麼","接著怎麼判斷"],"rows":[["圖名與年代","只解釋圖中的時期"],["圖例","分清男性、女性"],["單位與數值","是人數，不是百分比"],["同年與跨年比較","分清多寡與成長變化"]],"tip":"防錯：圖例與數值看不清時，先確認，不猜精確數字。","source":["課本71頁","單課卷讀圖題"]},{"id":"skill-4","type":"table","title":"閱讀訣竅 4｜排除不符時期的選項","headers":["題目情境","檢查方向"],"rows":[["早期加工出口區產品","成衣、塑膠、家電"],["選項出現智慧型手機","與當時情境不符"],["問十大建設的交通","公路、港口、機場、鐵路"],["選項出現高鐵","屬後續建設"]],"tip":"防錯：都是交通或工業，不代表同一時期。","source":["單課卷選擇題6","期末A卷選擇題2"]},{"id":"memory-1","type":"memory","title":"口訣 1｜租輕田未必歸我","intro":"三七五減租是減輕租金，不能直接推成已取得土地所有權。","source":["期末B卷選擇題1"]},{"id":"memory-2","type":"memory","title":"口訣 2｜物資貸款助建設","intro":"美援有生活物資，也有貸款、設備；兩條路線一起看。","source":["課本68–69頁"]},{"id":"memory-3","type":"memory","title":"口訣 3｜交通六重三能一","intro":"十大建設分交通六項、重工業三項、能源一項；高鐵不在其中。","source":["課本72頁"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"先讀圖名，再看圖例、單位與方向，最後用證據回答問題。","cards":[{"id":"figure-1","type":"diagram","diagram":"land","title":"圖 1｜土地改革，兩種角色的改變","caption":"先看政策，再分農民與地主兩條支線。","tip":"購地不是贈地；補償不代表原有收益完全不變。","source":["課本66–67頁"]},{"id":"figure-2","type":"diagram","diagram":"aid","title":"圖 2｜美援，物資與建設兩條路","caption":"看到麵粉、奶粉想生活；看到貸款、設備想建設。","tip":"不能把美援縮成只有食物，也不能說麵食使米飯消失。","source":["課本68–69頁"]},{"id":"figure-3","type":"diagram","breakBefore":true,"diagram":"ten","title":"圖 3｜十大建設，6＋3＋1 完整分類","caption":"先核對分類，再逐項辨識，不看見交通工具就選。","tip":"高鐵、國道3號、雪山隧道是後續建設。","source":["課本72頁","期末B卷選擇題2"]},{"id":"figure-4","type":"diagram","diagram":"impact","title":"圖 4｜雪山隧道，便利與壓力一起來","caption":"延伸閱讀：同一項交通建設，能產生正、負兩面影響。","tip":"縮短路程不等於假日永遠不塞車。","source":["課本74–75頁（社會充電站）"]}]},{"id":"compare","nav":"名詞對照","title":"05 易混淆名詞對照","subtitle":"比較的是同一個面向，先抓差異再記共同點。","cards":[{"id":"compare-1","type":"table","title":"對照 1｜三項土地改革措施","headers":["判斷項目","三七五減租","公地放領","耕者有其田"],"rows":[["主要動作","減輕地租","出售公地","徵收後轉賣"],["辨識線索","租田負擔","公有土地","地主部分土地"],["所有權重點","減租不等於購地","農民購買","農民購買"]],"tip":"秒判：先問「調租金，還是買土地？土地原屬誰？」","source":["期末B卷選擇題1","課本66–67頁"]},{"id":"compare-2","type":"table","title":"對照 2｜民生工業與重工業","headers":["判斷項目","民生工業","重工業"],"rows":[["本課例子","紡織、塑膠、食品","煉鋼、造船、石化"],["學習脈絡","日用品與早期外銷","十大建設產業項目"],["影響判讀","供應、就業、生活","產業基礎與風險"]],"tip":"秒判：認產業名稱，不能只憑工廠大小猜。","source":["課本70、72–73頁","單課卷選擇題5"]},{"id":"compare-3","type":"table","title":"對照 3｜十大建設與後續交通建設","headers":["判斷項目","十大建設交通項目","後續建設例子"],"rows":[["道路","中山高速公路","國道3號、國道5號"],["鐵路","電氣化、北迴鐵路","環島鐵路、高鐵"],["判斷原則","核對固定清單","回應後續需求"]],"tip":"秒判：後來也有建設，不要全部收進十大建設。","source":["課本72、74–75頁","期末A卷選擇題2"]}]},{"id":"quiz","nav":"自我檢測","title":"06 考前自我檢測","subtitle":"先獨立作答，答案與解析另放下一區；用理由確認自己真的懂。","cards":[]},{"id":"answers","nav":"答案解析","title":"自我檢測｜答案與複習路線","subtitle":"錯題不是結束：沿著複習指引，找回判斷依據。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 關鍵字速查","subtitle":"用短線索叫回整個概念，不只背一個名詞。","cards":[{"id":"keyword-table","type":"table","title":"24 個關鍵字，最後掃一遍","headers":["主題","關鍵字","一句話線索"],"rows":[["A","土地改革","減輕負擔，增加購地機會"],["A","地租","農民租田的負擔"],["A","三七五減租","降低地租，不等於購地"],["A","公地放領","農民購買公有土地"],["A","耕者有其田","徵收部分地主土地再轉賣"],["A","補償","地主失地後取得，不等於地租"],["B","美援","美國支援生活與建設"],["B","麵粉袋","缺乏物資時再做衣物"],["B","外匯","稻米出口可賺取"],["B","貸款與設備","支援水利、電力、交通"],["B","石門水庫","給水、灌溉、發電、防洪"],["C","民生工業","紡織、塑膠、食品加工"],["C","加工出口區","設廠投資，拓展外銷"],["C","外銷","把產品賣向國外"],["C","女性工作者","早期加工出口區重要力量"],["C","輪班","生產線分班工作"],["D","能源危機","石油出口受限、油價上漲"],["D","西亞","本課能源危機背景地區"],["D","十大建設","交通六、重工三、能源一"],["D","中山高速公路","十大建設，便利南北往來"],["D","高鐵","後續交通，非十大建設"],["D","大林煉油廠","公共安全與健康課題"],["D","鱟","水頭港區保育課題"],["D 延伸","雪山隧道","通宜蘭，兼看便利與壓力"]],"source":["課本66–75頁","期末B卷選擇題1"]}]},{"id":"question-types","nav":"讀題方法","title":"08 題型問法辨識","subtitle":"這些問法確實出現在所選考卷；重點是怎麼讀，不是猜題。","cards":[{"id":"ask-1","type":"ask","title":"問法 1｜「哪一項是……做法？」","clue":"先辨識政策，再找正確措施。","steps":"①圈政策名稱　②找實際動作　③排除錯誤給付方式。","example":"下列哪一項是政府實施土地改革政策的做法？","tip":"本課易錯：分期購地不能變成免費送地。","source":["單課卷選擇題2"]},{"id":"ask-2","type":"ask","title":"問法 2｜「哪一項不屬於……？」","clue":"注意「不」，答案要找清單外的。","steps":"①標否定詞　②列出分類　③核對每個選項。","example":"下列哪一項不屬於十大建設的內容？","tip":"本課易錯：高鐵很重要，仍不是十大建設。","source":["期末A卷選擇題2"]},{"id":"ask-3","type":"ask","title":"問法 3｜「最可能是哪項建設？」","clue":"把用途與對象一起讀。","steps":"①抓灌溉等功能　②找對應建設　③再核對背景。","example":"上述中最可能是下列哪一項建設？","tip":"本課線索：美援、農田灌溉，指向石門水庫。","source":["單課卷選擇題4"]},{"id":"ask-4","type":"ask","title":"問法 4｜「對生活造成什麼影響？」","clue":"題目問的是結果，不是建設名稱。","steps":"①確認做了什麼　②推到生活改變　③排除無關結果。","example":"對人們生活造成什麼影響？","tip":"本課線索：交通網路改善，使往來更便利。","source":["單課卷選擇題7"]},{"id":"ask-5","type":"ask","title":"問法 5｜「根據統計圖判斷」","clue":"圖名、年代、圖例、單位缺一不可。","steps":"①辨圖例　②比同年多寡　③再看跨年變化。","example":"請根據統計圖的內容及你對當時生活的了解。","tip":"本課易錯：早期女性占多數，不代表所有年代都相同。","source":["單課卷讀圖題"]}]}],"questions":[{"id":"q1","theme":"A","stem":"土地改革中，農民取得土地的方式何者正確？","options":["貸款或分期購買","地主無條件贈送","政府全部免費送","一律到高山開墾"],"answer":0,"explain":"購地可分期；不是政府或地主免費送田。","review":"trap-1","reviewText":"陷阱 1","source":["單課卷選擇題2"]},{"id":"q2","theme":"A","stem":"土地被政府徵收後，地主的情況何者符合教材？","options":["繼續收同一筆地租","得到補償，部分收益改變","一律改行成為農民","全部沒有任何補償"],"answer":1,"explain":"地主獲補償，但損失原有部分地租收益。","review":"core-a","reviewText":"核心 A","source":["課本67頁","期末A卷土地改革題組"]},{"id":"q3","theme":"B","stem":"麵粉袋做成衣物，最能反映當時哪種生活情況？","options":["家家衣料過剩","日本大量援助衣料","物資缺乏並再利用","米飯已完全消失"],"answer":2,"explain":"美援麵粉袋再利用，反映物資不足時的節省。","review":"trap-5","reviewText":"陷阱 5","source":["期末B卷素養養成題"]},{"id":"q4","theme":"B","stem":"下列哪項完整描述美援的內容？","options":["只有食品，沒有建設","只有軍事，沒有生活","只協助科學園區研發","物資及建設貸款、設備"],"answer":3,"explain":"美援同時支援生活物資與基礎建設。","review":"figure-2","reviewText":"圖 2","source":["課本68–69頁","單課卷是非題3–4"]},{"id":"q5","theme":"B","stem":"石門水庫帶給生活與生產的助益，何者符合教材？","options":["供水、灌溉並提供電力","取代所有工廠與農田","使民眾不再需要用水","只能觀光，不能灌溉"],"answer":0,"explain":"水庫功能連結民生、農業、工業及電力。","review":"core-b","reviewText":"核心 B","source":["課本69頁","單課卷選擇題4"]},{"id":"q6","theme":"C","stem":"哪一組都是本課民生工業的例子？","options":["煉鋼、造船","紡織、食品加工","核能、北迴鐵路","高速公路、港口"],"answer":1,"explain":"民生工業例子有紡織、塑膠與食品加工。","review":"compare-2","reviewText":"對照 2","source":["期末A卷選擇題1"]},{"id":"q7","theme":"C","stem":"早期加工出口區的發展，帶來什麼改變？","options":["農民都免費取得土地","工廠只願招募男性","創造就業，部分人轉入工業","臺灣不再需要出口商品"],"answer":2,"explain":"工廠增加就業，部分勞動人口由農業轉工業。","review":"core-c","reviewText":"核心 C","source":["單課卷選擇題10","期末A卷是非題4"]},{"id":"q8","theme":"D","stem":"本課政府推動十大建設的背景是什麼？","options":["中日戰爭爆發","智慧型手機普及","所有交通需求消失","國際能源危機影響經濟"],"answer":3,"explain":"能源危機使景氣低迷，政府推動建設因應。","review":"trap-10","reviewText":"陷阱 10","source":["單課卷是非題6、勾選題1–2"]},{"id":"q9","theme":"D","stem":"下列哪一項不在十大建設清單內？","options":["西部高速鐵路","中山高速公路","鐵路電氣化","中正國際機場"],"answer":0,"explain":"高鐵屬後續交通建設，不能混入十大建設。","review":"figure-3","reviewText":"圖 3","source":["期末A卷選擇題2"]},{"id":"q10","theme":"D 延伸","stem":"評估雪山隧道通車的影響，哪種看法較完整？","options":["旅遊增加就一定沒有問題","兼看交通就業與環境壓力","縮短距離就永遠不塞車","有環境壓力就完全沒效益"],"answer":1,"explain":"便利與就業之外，也要看開發、垃圾與塞車。","review":"figure-4","reviewText":"圖 4","source":["課本74–75頁，課文延伸"]}]};const CLAY={"aid":"../../assets/media/9538e9e09f79c012.webp","ten":"../../assets/media/e3203e0ff344c59f.webp"};const ASSETS={"explain":"../../assets/media/99d332e0bc2b6d1c.webp","shield":"../../assets/media/863ddc465fe9f9d2.webp","check":"../../assets/media/561934823155712a.webp"};const READING_CHARTS={"figure-1":"<div class=\"chart-layout\"><img class=\"chart-clay\" src=\"CLAY_TEN\" alt=\"黏土風格的交通與工業建設情境\"><div class=\"pie-panel\"><svg class=\"reading-svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"十大建設項目數圓餅圖：交通6項60%，重工業3項30%，能源1項10%\" xmlns=\"http://www.w3.org/2000/svg\"><title>十大建設項目數圓餅圖：交通6項60%，重工業3項30%，能源1項10%</title><defs><filter id=\"clay-1\"><feDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"2\" flood-color=\"#263c43\" flood-opacity=\".15\"/></filter></defs><path data-count=\"6\" data-share=\"60\" d=\"M180 164 L180 42 A122 122 0 1 1 108.29019922031829 262.7000733137436 Z\" fill=\"#407e75\" stroke=\"#fffdf6\" stroke-width=\"5\" filter=\"url(#clay-1)\"/><path data-count=\"3\" data-share=\"30\" d=\"M180 164 L108.29019922031829 262.7000733137436 A122 122 0 0 1 108.29019922031826 65.29992668625643 Z\" fill=\"#dba748\" stroke=\"#fffdf6\" stroke-width=\"5\" filter=\"url(#clay-1)\"/><path data-count=\"1\" data-share=\"10\" d=\"M180 164 L108.29019922031826 65.29992668625643 A122 122 0 0 1 179.99999999999997 42 Z\" fill=\"#8677ad\" stroke=\"#fffdf6\" stroke-width=\"5\" filter=\"url(#clay-1)\"/><text x=\"180\" y=\"316\" text-anchor=\"middle\">總數＝10 項</text><rect x=\"352\" y=\"66\" width=\"24\" height=\"24\" rx=\"7\" fill=\"#407e75\" filter=\"url(#clay-1)\"/><text x=\"390\" y=\"85\" class=\"svg-major\">交通 6 項（60%）</text><rect x=\"352\" y=\"143\" width=\"24\" height=\"24\" rx=\"7\" fill=\"#dba748\" filter=\"url(#clay-1)\"/><text x=\"390\" y=\"162\" class=\"svg-major\">重工業 3 項（30%）</text><rect x=\"352\" y=\"220\" width=\"24\" height=\"24\" rx=\"7\" fill=\"#8677ad\" filter=\"url(#clay-1)\"/><text x=\"390\" y=\"239\" class=\"svg-major\">能源 1 項（10%）</text><text x=\"350\" y=\"313\" class=\"svg-small\">統計單位：建設項目數</text></svg></div></div><p class=\"data-note\">比例由項目數計算：6 ÷ 10＝60%、3 ÷ 10＝30%、1 ÷ 10＝10%。不是經費或產值占比。</p><div class=\"chart-reading\"><p><b>讀圖三步：</b>圖名看「項目數」→ 分母是 10 項 → 比較扇形大小。</p><p><b>秒殺看圖訣竅：</b>交通占六成，比重工業與能源合計的四成還多。</p><p class=\"chart-warning\"><b>最常犯錯誤：</b>扇形大，只表示項目較多；不能推論花的錢最多。</p><p class=\"chart-check\"><b>試判斷：</b>交通建設項目數是能源的幾倍？<br><b>核對：</b>6 ÷ 1＝6 倍；交通比能源多 5 項。</p></div><div class=\"chart-practice\"><h4>加深判讀｜同一張圓餅圖，換個問法也要會</h4><table><thead><tr><th>題目怎麼問</th><th>核對與理由</th></tr></thead><tbody><tr><td>非交通建設合計幾項、占多少？</td><td>3＋1＝4 項，4 ÷ 10＝40%。先合併類別，再計算占比。</td></tr><tr><td>交通占比比重工業多多少？</td><td>60%－30%＝30 個百分點；項目數則多 3 項，兩種單位不能混用。</td></tr><tr><td>能源項目最少，所以最不重要？</td><td>不能這樣判斷。項目數不等於重要性；穩定供電仍是生活與生產的基礎。</td></tr></tbody></table></div><p class=\"chart-transfer\"><b>一句話連回知識：</b>交通改善運輸、重工業支援生產、能源提供動力，三類建設能互相配合，不能只看扇形大小判斷價值。</p>","figure-2":"<div class=\"aid-chart\"><img class=\"chart-clay\" src=\"CLAY_AID\" alt=\"美援物資及水利、電力、交通的黏土情境\"><div class=\"aid-branches\"><div><h4>物資路線</h4><p>棉花、麵粉、奶粉、黃豆</p><p>↓ 緩解短缺、協助穩定物價</p><p>飲食與日常用品出現改變</p></div><div><h4>建設路線</h4><p>貸款、設備</p><p>↓ 水利、電力、交通改善</p><p>支援家庭、農業與工業生產</p></div></div></div><div class=\"chart-reading\"><p><b>讀圖三步：</b>看分支名稱 → 沿箭頭追蹤 → 找出生活與生產影響。</p><p><b>秒殺看圖訣竅：</b>麵粉袋再利用屬日常生活；建設貸款屬生產基礎。</p><p class=\"chart-warning\"><b>最常犯錯誤：</b>兩條分支不是各占 50%；這是分類圖，沒有比例資料。</p><p class=\"chart-check\"><b>試判斷：</b>只畫食品援助，能完整表達美援嗎？<br><b>核對：</b>不能，還需納入貸款、設備與基礎建設。</p></div><div class=\"chart-practice\"><h4>配對練習｜由生活線索，追到援助方式</h4><table><thead><tr><th>情境線索</th><th>援助類型</th><th>影響怎麼連</th></tr></thead><tbody><tr><td>麵粉、奶粉等物資進入日常生活</td><td>生活物資</td><td>緩解物資不足，協助穩定生活。</td></tr><tr><td>把用完的麵粉袋做成衣物</td><td>物資與再利用</td><td>節省材料；不能推論當時衣料過剩。</td></tr><tr><td>貸款、設備用於水利或電力建設</td><td>建設支援</td><td>改善供水供電，支援生活與生產。</td></tr><tr><td>水庫供水、灌溉、發電與防洪</td><td>公共建設的多種功能</td><td>同一設施可以同時連結民生、農業與工業。</td></tr></tbody></table></div><div class=\"chart-reason\"><h4>因果加一層｜為什麼物資之外還需要建設？</h4><p><b>物資援助</b>協助應付當下短缺；<b>水利、電力與交通條件</b>改善後，才更能支援持續生產與運輸。兩者影響的面向不同，可以互相配合。</p><p><b>判讀界線：</b>圖中沒有援助金額與年份數列，因此不能比較兩路線誰花錢較多，也不能畫出逐年成長率。</p></div>","figure-3":"<div class=\"map-panel\"><svg class=\"reading-svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"十大建設位置示意：西部中山高速公路、東北部北迴鐵路、桃園機場、臺中港、蘇澳港與高雄重工業\" xmlns=\"http://www.w3.org/2000/svg\"><title>十大建設位置示意：西部中山高速公路、東北部北迴鐵路、桃園機場、臺中港、蘇澳港與高雄重工業</title><defs><filter id=\"clay-2\"><feDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"2\" flood-color=\"#263c43\" flood-opacity=\".15\"/></filter></defs><rect x=\"175\" y=\"12\" width=\"252\" height=\"315\" rx=\"28\" fill=\"#edf4f2\"/><path d=\"M337 21 C355 20 371 33 369 51 C365 73 356 90 354 114 C354 137 344 161 333 181 C321 203 310 224 297 247 C284 270 272 287 260 310 L249 317 L244 299 C227 289 217 272 219 253 C214 237 220 214 227 194 C231 171 244 152 253 134 C260 115 270 98 279 84 C292 62 302 40 319 31 Z\" fill=\"#b9cda5\" stroke=\"#6d9276\" stroke-width=\"2.5\" filter=\"url(#clay-2)\"/>\n<path d=\"M322 53 C305 82 285 121 269 161 S239 222 239 252\" fill=\"none\" stroke=\"#cf8a34\" stroke-width=\"5\"/>\n<path d=\"M349 113 Q351 142 331 178\" fill=\"none\" stroke=\"#436eab\" stroke-width=\"5\"/>\n<polyline points=\"323,65 196,65 196,52 40,52\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"38\" y=\"40\" >桃園：中正國際機場</text><text x=\"38\" y=\"65\" class=\"svg-small\">（今桃園國際機場）</text><circle cx=\"323\" cy=\"65\" r=\"5\" fill=\"#407e75\" stroke=\"white\" stroke-width=\"2\"/>\n<polyline points=\"270,154 165,154 165,131 40,131\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"38\" y=\"119\" >臺中港</text><circle cx=\"270\" cy=\"154\" r=\"5\" fill=\"#407e75\" stroke=\"white\" stroke-width=\"2\"/>\n<polyline points=\"237,252 176,252 176,221 38,221\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"38\" y=\"205\" >高雄：煉鋼、造船</text><text x=\"38\" y=\"230\" >與石油化學工業</text><circle cx=\"237\" cy=\"252\" r=\"5\" fill=\"#dba748\" stroke=\"white\" stroke-width=\"2\"/>\n<polyline points=\"339,37 419,37 419,37 442,37\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"443\" y=\"43\" >北部：核能發電廠</text><circle cx=\"339\" cy=\"37\" r=\"5\" fill=\"#8677ad\" stroke=\"white\" stroke-width=\"2\"/>\n<polyline points=\"349,113 423,113 423,103 441,103\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"443\" y=\"109\" >蘇澳港</text><circle cx=\"349\" cy=\"113\" r=\"5\" fill=\"#407e75\" stroke=\"white\" stroke-width=\"2\"/>\n<polyline points=\"331,178 421,178 421,166 441,166\" fill=\"none\" stroke=\"#879a9b\" stroke-width=\"1.3\"/><text x=\"443\" y=\"172\" >北迴鐵路：蘇澳—花蓮</text>\n<path d=\"M439 230 L473 230\" stroke=\"#cf8a34\" stroke-width=\"5\"/><text x=\"484\" y=\"236\" class=\"svg-small\">中山高速公路</text><path d=\"M439 258 L473 258\" stroke=\"#436eab\" stroke-width=\"5\"/><text x=\"484\" y=\"264\" class=\"svg-small\">北迴鐵路</text>\n<path d=\"M605 124 L605 82 M599 92 L605 82 L611 92\" stroke=\"#20364a\" stroke-width=\"2\" fill=\"none\"/><text x=\"605\" y=\"75\" text-anchor=\"middle\" class=\"svg-small\">北</text><text x=\"201\" y=\"335\" class=\"svg-small\">位置與路線為示意，非等比例；未繪全數設施。</text></svg></div><p class=\"data-note\">完整清單：交通 6 項＝中山高速公路、鐵路電氣化、北迴鐵路、臺中港、蘇澳港、中正國際機場；重工業 3 項＝煉鋼、造船、石化；能源 1 項＝核能發電。</p><div class=\"chart-reading\"><p><b>讀圖三步：</b>先辨北方 → 讀圖例與標線 → 連結地點、功能和建設名稱。</p><p><b>秒殺看圖訣竅：</b>西部中山高連結南北，東北部北迴鐵路改善蘇澳—花蓮往來；港口連結海運。</p><p class=\"chart-warning\"><b>最常犯錯誤：</b>不能看到鐵路就當成高鐵；高鐵不在十大建設清單。</p><p class=\"chart-check\"><b>試判斷：</b>由蘇澳往花蓮，應找橘線還是藍線？<br><b>核對：</b>藍線：北迴鐵路；橘線代表中山高速公路。</p></div><div class=\"chart-practice\"><h4>地點 × 功能｜把地圖線索變成答案</h4><table><thead><tr><th>題幹線索</th><th>應連結的建設與理由</th></tr></thead><tbody><tr><td>貨物需要由海路進出，應找機場還是港口？</td><td>找港口，例如臺中港、蘇澳港；機場屬航空運輸。</td></tr><tr><td>高雄標出煉鋼、造船、石化，應歸哪類？</td><td>重工業。即使造船與交通工具有關，造船廠仍屬生產設施，不能直接歸入交通類。</td></tr></tbody></table></div><p class=\"chart-transfer\"><b>從圖看得到／看不到：</b>可辨認標示設施的大致方位與功能；圖上未畫出的地方，不代表沒有建設，也不能據此比較各地投資金額。</p>","figure-4":"<div class=\"map-panel\"><svg class=\"reading-svg\" viewBox=\"0 0 640 340\" role=\"img\" aria-label=\"臺北至宜蘭路線示意：山區道路、北部濱海公路與穿越雪山山脈的國道5號\" xmlns=\"http://www.w3.org/2000/svg\"><title>臺北至宜蘭路線示意：山區道路、北部濱海公路與穿越雪山山脈的國道5號</title><defs><filter id=\"clay-3\"><feDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"2\" flood-color=\"#263c43\" flood-opacity=\".15\"/></filter></defs><rect x=\"18\" y=\"12\" width=\"604\" height=\"310\" rx=\"20\" fill=\"#edf4f2\"/>\n<path d=\"M40 294 L40 73 Q126 26 231 41 Q313 48 350 101 Q403 142 478 143 Q546 154 600 223 L600 295 Z\" fill=\"#c3d2b0\" stroke=\"#8eaa87\" stroke-width=\"2\"/>\n<text x=\"490\" y=\"56\" fill=\"#547f9d\">海域</text>\n<path d=\"M223 221 L265 132 L298 206 L325 145 L371 241\" fill=\"#8ba780\" stroke=\"#789571\" stroke-width=\"2\"/><text x=\"252\" y=\"274\" class=\"svg-small\">雪山山脈</text>\n<path d=\"M138 91 Q255 -5 368 95 Q459 118 500 240\" fill=\"none\" stroke=\"#b18d5f\" stroke-width=\"5\" stroke-dasharray=\"9 5\"/>\n<path d=\"M138 91 C102 154 221 124 174 184 S279 168 270 234 S407 198 500 240\" fill=\"none\" stroke=\"#9a6a95\" stroke-width=\"4\" stroke-dasharray=\"4 4\"/>\n<path d=\"M138 91 L500 240\" fill=\"none\" stroke=\"#337e79\" stroke-width=\"6\"/>\n<path d=\"M235 131 L365 184\" fill=\"none\" stroke=\"#fff9e8\" stroke-width=\"11\"/><path d=\"M235 131 L365 184\" fill=\"none\" stroke=\"#337e79\" stroke-width=\"5\"/>\n<circle cx=\"138\" cy=\"91\" r=\"5\" fill=\"#20364a\" stroke=\"white\" stroke-width=\"2\"/><circle cx=\"500\" cy=\"240\" r=\"5\" fill=\"#20364a\" stroke=\"white\" stroke-width=\"2\"/><text x=\"72\" y=\"80\" class=\"svg-major\">臺北</text><text x=\"512\" y=\"246\" class=\"svg-major\">宜蘭</text>\n<text x=\"183\" y=\"29\" class=\"svg-small\">北部濱海公路：沿海繞行</text><text x=\"51\" y=\"211\" class=\"svg-small\">北宜公路</text><text x=\"51\" y=\"232\" class=\"svg-small\">山區彎繞</text><text x=\"322\" y=\"113\" class=\"svg-major\">國道 5 號</text><text x=\"322\" y=\"135\" class=\"svg-small\">含雪山隧道</text><text x=\"53\" y=\"313\" class=\"svg-small\">路線為概念示意，非等比例；不能用圖上線長估算里程或行車時間。</text></svg></div><div class=\"route-legend\"><span style=\"--route:#337e79\">實線：國道 5 號</span><span style=\"--route:#9a6a95\">點線：北宜公路</span><span style=\"--route:#b18d5f\">虛線：北部濱海公路</span></div><div class=\"chart-reading\"><p><b>讀圖三步：</b>先找臺北、宜蘭 → 對照線型圖例 → 比較穿山、沿山與沿海。</p><p><b>秒殺看圖訣竅：</b>雪山隧道穿越山脈，縮短往來時間，帶動返鄉、觀光及就業。</p><p class=\"chart-warning\"><b>最常犯錯誤：</b>示意圖不能量出實際里程；通車也不等於假日永遠不塞車。</p><p class=\"chart-check\"><b>試判斷：</b>交通變便利，就能只看觀光收益嗎？<br><b>核對：</b>不能，還要評估農地過度開發、物價上漲、假日塞車與垃圾問題。</p></div><div class=\"chart-practice\"><h4>路線 × 影響｜選出有證據的推論</h4><table><thead><tr><th>情境或說法</th><th>判讀與理由</th></tr></thead><tbody><tr><td>「地圖實線最短，所以一定只要半小時。」</td><td>不能推論。概念圖沒有比例尺與速度資料，不能計算實際行車時間。</td></tr><tr><td>「通車後飯店、餐廳增加，居民一定都受益。」</td><td>說法過度。觀光可能增加就業，也可能伴隨物價上漲、農地過度開發與垃圾問題。</td></tr></tbody></table></div><p class=\"chart-transfer\"><b>把因果說完整：</b>地形阻隔 → 興建穿山交通 → 往來更便利 → 觀光與就業機會增加；同時要評估開發壓力與環境承載，不能只列好處。</p>"};BOOK.sections.find(s=>s.id==='figures').cards=[{"id":"figure-1","type":"diagram","diagram":"ten","title":"圖 1｜十大建設：圓餅圖看項目占比"},{"id":"figure-2","type":"diagram","diagram":"aid","title":"圖 2｜美援：分類圖追蹤兩條影響路線","breakBefore":true},{"id":"figure-3","type":"diagram","diagram":"ten","title":"圖 3｜臺灣建設分布：位置與功能一起看","breakBefore":true},{"id":"figure-4","type":"diagram","diagram":"impact","title":"圖 4｜臺北—宜蘭：地形與交通路線判讀","breakBefore":true}];const MINDMAP_HTML="<div class=\"mind-guide\">讀圖任務：從中央出發，沿四條主線說出「背景 → 措施 → 影響」，再補回 8 個關鍵詞。</div>\n<div class=\"mind-network\">\n<svg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/><path d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/><path d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/><path d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/></svg>\n<section class=\"mind-branch mind-land\"><h4><span>A</span> 土地改革</h4><p class=\"mind-relation\">回應地租負擔 → 改善農民生活</p><p><b>措施：</b>三七五減租減輕租田負擔；公地放領、耕者有其田增加購地機會。</p><p><b>農民：</b>可分期購地 → 耕作更自主、採用新技術 → 產量與收入提高。</p><p><b>地主：</b>獲得補償，但失去部分地租；有些人將資金投入工業。</p></section>\n<section class=\"mind-branch mind-aid\"><h4><span>B</span> 美國援助</h4><p class=\"mind-relation\">緩解短缺 → 支援生活與生產</p><p><b>物資：</b>棉花、麵粉、奶粉、黃豆 → 協助穩定生活；麵粉袋可再利用。</p><p><b>建設：</b>提供貸款與設備 → 改善水利、電力、交通條件。</p><p><b>連結：</b>石門水庫具供水、灌溉、發電及防洪功能，支援家庭與產業。</p></section>\n<div class=\"mind-center\"><span>全課探索主題</span><strong>戰後經濟發展<br>如何影響人們生活？</strong></div>\n<section class=\"mind-branch mind-industry\"><h4><span>C</span> 民生工業與加工出口區</h4><p class=\"mind-relation\">生產與外銷 → 就業與生活改變</p><p><b>產品：</b>紡織、塑膠、食品加工等民生工業，增加生活用品供應。</p><p><b>措施：</b>設立加工出口區，鼓勵廠商投資、生產與外銷。</p><p><b>影響：</b>就業機會增加，部分勞動人口從農業轉向工業；女性工作者成為重要力量，收入支援家庭與進修。</p></section>\n<section class=\"mind-branch mind-build\"><h4><span>D</span> 公共建設</h4><p class=\"mind-relation\">因應景氣衝擊 → 同看效益與代價</p><p><b>背景：</b>國際能源危機衝擊經濟 → 政府推動十大建設。</p><p><b>分類：</b>交通 6 項、重工業 3 項、能源 1 項；高鐵是後續建設。</p><p><b>評估：</b>交通、就業與生活便利增加，也要考量汙染、健康、安全及生態問題。</p></section>\n</div><p class=\"mind-connection\"><b>跨分支連起來：</b>水利、電力與交通條件改善，可支援工業生產；產業與建設發展帶來機會，也需要持續評估環境及生活影響。</p>";BOOK.sections.splice(BOOK.sections.findIndex(s=>s.id==='core')+1,0,{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把四條主線連起來","subtitle":"先看關係，再補關鍵詞；用自己的話說出措施為何能影響生活。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"一張圖串起背景、措施與影響"}]});const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');

function cardHTML(c){let content='';const tag=c.tag?`<div class="tag">${esc(c.tag)}</div>`:'';let heading=`<h3>${esc(c.title)}</h3>`;
if(c.type==='mindmap')content=MINDMAP_HTML;else if(c.type==='trap'){heading=`<div class="card-title"><h3><span class="trap-n">${String(c.n).padStart(2,'0')}</span>${esc(c.title)}</h3><span class="small-label">${esc(c.label)}</span></div>`;content=`<p class="mistake"><span class="text-label">易錯</span>${fmt(c.wrong)}</p><p class="correct"><span class="text-label">破解</span>${fmt(c.right)}</p>`;}
else if(c.type==='chain')content=`<div class="flow">${c.chain.map((s,i)=>(i?'<span class="flow-arrow">→</span>':'')+`<div class="flow-step">${fmt(s)}</div>`).join('')}</div>`;
else if(c.type==='table')content=`<div class="table-wrap"><table><thead><tr>${c.headers.map(s=>`<th scope="col">${esc(s)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map(s=>`<td>${fmt(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
else if(c.type==='diagram')content=READING_CHARTS[c.id]?.replace(/CLAY_(TEN|AID)/g,(_,key)=>CLAY[key.toLowerCase()])||`<div class="figure-visual" role="img" aria-label="${esc(c.title+'。'+c.caption)}">${diagrams[c.diagram]}</div><p class="diagram-caption">${esc(c.caption)}</p>`;
else if(c.type==='ask')content=`<p><b>題幹線索：</b>${fmt(c.clue)}</p><p><b>處理步驟：</b>${fmt(c.steps)}</p><p class="example">考卷例句：「${esc(c.example)}」</p>`;
else if(c.type==='question'){const q=c.question;content=`<div class="question-head"><span>第 ${c.n} 題・主題 ${esc(q.theme)}</span><span>${q.source.length===1&&q.source[0].startsWith('課本')?'課文延伸練習':'考卷觀念改編'}</span></div><p class="question-stem">${esc(q.stem)}</p><div class="options">${q.options.map((s,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${i}" ${Number(answers[q.id])===i&&answers[q.id]!==undefined?'checked':''}><span>(${String.fromCharCode(65+i)}) ${esc(s)}</span></label>`).join('')}</div>`;heading='';}
else if(c.type==='answers'){content=`<div class="table-wrap"><table class="answer-table"><thead><tr><th>題號</th><th>答案</th><th>解析關鍵</th><th>回去複習</th></tr></thead><tbody>${BOOK.questions.map((q,i)=>`<tr class="answer-row" data-question="${q.id}"><td>${i+1}</td><td><b>${String.fromCharCode(65+q.answer)}</b></td><td>${esc(q.explain)}</td><td><a href="#${q.review}">${esc(q.reviewText)}</a></td></tr>`).join('')}</tbody></table></div><div class="score-box"><p><b>複習指南</b></p><p>${Math.ceil(BOOK.questions.length*.9)}～${BOOK.questions.length} 題：再說出理由，確認概念穩固。<br>${Math.ceil(BOOK.questions.length*.7)}～${Math.ceil(BOOK.questions.length*.9)-1} 題：依右欄補強錯題。<br>${Math.ceil(BOOK.questions.length*.7)-1} 題以下：先重讀核心重點，再看易錯陷阱。</p><div class="screen-only score-tools"><button id="grade">核對我的答案</button><button id="reset">清除作答</button><span class="score-text" aria-live="polite"></span></div></div>`;}
else{content=(c.intro?`<p class="intro">${fmt(c.intro)}</p>`:'')+(c.bullets||[]).map(s=>`<p class="point">${fmt(s)}</p>`).join('');}
if(c.tip)content+=c.mascot?`<div class="mascot-row"><img alt="小雪拿著教材介紹" src="${ASSETS[c.mascot]}"><p class="tip">${fmt(c.tip)}</p></div>`:`<p class="tip">${fmt(c.tip)}</p>`;
const el=document.createElement('article');el.id=c.id;el.className='card card-'+c.type;el.dataset.card=c.id;el.innerHTML=tag+heading+`<div class="card-content">${content}</div>`;markCloze(el);return el;}
function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}
function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
const logic=BOOK.sections.find(s=>s.id==='logic');const logicMap=Object.fromEntries(logic.cards.map(c=>[c.id,c]));logic.cards=['logic-1','logic-2','logic-3','memory-1','memory-2','memory-3','skill-1','skill-2','skill-3','skill-4'].map(id=>logicMap[id]);logic.cards.forEach(c=>c.breakBefore=['skill-1','skill-3'].includes(c.id));logicMap['skill-3'].tip='防錯：圖例與數值看不清時，先確認，不猜精確數字。';
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}
if(e.target.id==='reset'){answers={};try{localStorage.removeItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson)}catch(e){}document.querySelectorAll('.option input').forEach(im=>im.checked=false);document.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('is-correct','is-wrong'));$('.score-text').textContent='已清除作答。';}});
new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));

const clozePlan={
 'mindmap-overview':{selector:'.mind-branch p:not(.mind-relation)',terms:['分期購地','補償','貸款與設備','石門水庫','加工出口區','轉向工業','能源危機','後續建設']},
 'core-a':{selector:'.point',terms:['土地改革','三七五減租','分期','補償']},
 'core-b':{selector:'.point',terms:['美國援助','外匯','貸款與設備','石門水庫']},
 'core-c':{selector:'.point',terms:['加工出口區','女性','民生工業']},
 'core-d':{selector:'.point',terms:['能源危機','十大建設','國道3號']},
 'trap-1':{selector:'.correct',terms:['分期購買']},'trap-2':{selector:'.correct',terms:['租田負擔']},'trap-3':{selector:'.correct',terms:['補償']},'trap-4':{selector:'.correct',terms:['貸款與設備']},'trap-5':{selector:'.correct',terms:['物資缺乏']},'trap-6':{selector:'.correct',terms:['美國援助']},'trap-7':{selector:'.correct',terms:['重工業']},'trap-8':{selector:'.correct',terms:['加工出口區']},'trap-9':{selector:'.correct',terms:['女性工作者占多數']},'trap-10':{selector:'.correct',terms:['國際能源危機']},'trap-11':{selector:'.correct',terms:['後續建設']},'trap-12':{selector:'.correct',terms:['健康、生態、安全成本']},
 'logic-1':{selector:'.flow-step',terms:['分期購地','產量與收入改善']},'logic-2':{selector:'.flow-step',terms:['美援物資、貸款設備','工業生產條件提升']},'logic-3':{selector:'.flow-step',terms:['汙染與開發壓力','安全與環境']},
 'figure-1':{selector:'.chart-practice td:nth-child(2)',terms:['40%','30 個百分點','重要性']},

 'compare-3':{selector:'tbody td',terms:['十大建設','後續建設']}
};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });
 document.getElementById('mode-cloze').setAttribute('aria-pressed',String(clozeMode));document.getElementById('mode-full').setAttribute('aria-pressed',String(!clozeMode));
 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);
document.addEventListener('click',e=>toggleCloze(e.target.closest('#pages .cloze-slot')));
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cloze-slot')&&clozeMode){e.preventDefault();toggleCloze(e.target)}});
document.getElementById('mode-cloze').onclick=()=>{clozeMode=true;refreshCloze()};
document.getElementById('mode-full').onclick=()=>{clozeMode=false;refreshCloze()};
document.getElementById('mode-reset').onclick=refreshCloze;
document.body.classList.add('student-cloze');

async function addSnowNotes(all){
 const advice={
  core:{asset:'explain',title:'小雪的叮嚀｜把生活變化說出來',text:'別只背政策名稱！試著用「做了什麼 → 改變了什麼」說明這一頁，再想想不同角色的感受會不會一樣。'},
  logic:{asset:'check',title:'小雪的叮嚀｜先找線索，再下結論',text:'先圈出題目問的是背景、做法還是影響。遇到「全部、一定、只有」，記得回頭找證據，別急著選！'},
  answers:{asset:'explain',title:'小雪的叮嚀｜答對還要說得出理由',text:'核對後，挑一道錯題說說：我被哪個詞誤導？正確線索在哪裡？能解釋錯誤選項，才算真的學會了。'},
  figures:{asset:'check',title:'小雪的叮嚀｜看清楚圖在告訴你什麼',text:'先看圖名、圖例與單位。圖上沒有給的資料，就不要猜；用看得到的證據回答問題。'},
  traps:{asset:'shield',title:'小雪的叮嚀｜抓到陷阱的關鍵詞',text:'把錯誤說法改成正確句子，再說出理由。能解釋哪裡錯，比只記住答案更有用！'},
  compare:{asset:'check',title:'小雪的叮嚀｜比較同一個面向',text:'先看這一欄比較的是功能、時期，還是影響。用同一個標準對照，才不會把不同概念混在一起。'},
  keywords:{asset:'explain',title:'小雪的叮嚀｜把關鍵字變成一句話',text:'遮住說明，試著用自己的話解釋一個關鍵字，再搭配一個生活例子。說得出來，才算記得牢！'}
 };
 for(const p of all){
  if(p.querySelector('.mascot-row img'))continue;
  const b=p.querySelector('.page-body'),last=b.lastElementChild;if(!last)continue;
  const free=b.getBoundingClientRect().bottom-last.getBoundingClientRect().bottom;
  let guide=advice[p.dataset.section];if(!guide||free<175)continue;
  if(p.querySelector('#core-c'))guide={asset:'explain',title:'小雪的叮嚀｜從工廠看見家庭生活',text:'想想看：工廠增加了哪些工作機會？收入能如何改變家庭生活與進修選擇？把生產、工作與生活連起來說。'};
  if(p.querySelector('#core-d'))guide={asset:'shield',title:'小雪的叮嚀｜便利與代價要一起看',text:'評估一項建設時，先找它改善了什麼，再問可能影響誰的健康、生活或生態。能看到不同立場，答案才完整。'};
  if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};
  if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

繁榮，使虎尾鎮有「糖都」之稱。(0)米倉常用於形容主要稻米產區；(2)茶鄉形容茶葉產區；(3)蘭花之鄉非虎尾之美稱，故其餘選項皆不正確。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"十九世紀時，英國商人約翰·陶德鼓勵臺灣茶農種茶，並將臺灣茶葉直接開船運往紐約銷售，當時是以哪一個名稱打入國際市場？","options":["福爾摩沙烏龍茶","凍頂烏龍茶","阿里山高山茶","日月潭紅茶"],"answer":0,"explanation":"正確答案為(2)福爾摩沙烏龍茶。課本指出臺灣茶葉首次出現在國際市場時，以福爾摩沙烏龍茶（Formosa Oolong Tea）為名外銷紐約。(0)、(1)、(3)皆非當時首次直接運往國外販售所使用的國際品牌名稱，故不正確。","concept":"氣候地形與多元農作物外銷","skill":"概念理解","review":"core-2","evidence":"臺灣茶葉首次出現在國際市場時，以福爾摩沙烏龍茶(Formosa Oolong Tea)為名。","id":"q2","stem":"十九世紀時，英國商人約翰·陶德鼓勵臺灣茶農種茶，並將臺灣茶葉直接開船運往紐約銷售，當時是以哪一個名稱打入國際市場？","theme":"氣候地形與多元農作物外銷","explain":"正確答案為(2)福爾摩沙烏龍茶。課本指出臺灣茶葉首次出現在國際市場時，以福爾摩沙烏龍茶（Formosa Oolong Tea）為名外銷紐約。(0)、(1)、(3)皆非當時首次直接運往國外販售所使用的國際品牌名稱，故不正確。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"約一百多年前，日本因國內糧食短缺問題，派專家來臺灣研究並大量生產稻米，培育出的哪一種稻米品種？","options":["在來米","黑米","糯米","蓬萊米"],"answer":3,"explanation":"正確答案為(1)蓬萊米。課本記載大約一百多年前，日本為解決國內糧食短缺，派專家來臺研究培育出黏性較高且軟的蓬萊米。(0)在來米是大約四百多年前由中國東南沿海漢人引入；(2)、(3)非當時日本專家為解決糧食短缺所特別培育的主要推廣品種，故不正確。","concept":"稻米品種演變與特色","skill":"概念理解","review":"core-3","evidence":"大約一百多年前，日本國內為了因應糧食短缺的問題，派專家來臺灣研究並大量生產稻米，培育出符合日本民眾喜好的「蓬萊米」。","id":"q3","stem":"約一百多年前，日本因國內糧食短缺問題，派專家來臺灣研究並大量生產稻米，培育出的哪一種稻米品種？","theme":"稻米品種演變與特色","explain":"正確答案為(1)蓬萊米。課本記載大約一百多年前，日本為解決國內糧食短缺，派專家來臺研究培育出黏性較高且軟的蓬萊米。(0)在來米是大約四百多年前由中國東南沿海漢人引入；(2)、(3)非當時日本專家為解決糧食短缺所特別培育的主要推廣品種，故不正確。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"過去在山坡地上若砍伐陡峭山坡樹木，改種單一、低矮的農作物，容易對土地造成下列哪一種嚴重的後果？","options":["土壤肥力永久倍增","地層大幅下陷","土地裸露與嚴重水土流失","空氣品質迅速改善"],"answer":2,"explanation":"正確答案為(0)土地裸露與嚴重水土流失。課文指出砍伐陡峭山坡地樹木改種單一低矮作物，會使土地裸露造成水土流失。(1)土壤肥力不會因此倍增反而易失養分；(2)地層下陷主因多為超抽地下水；(3)砍伐樹木無法改善空氣品質，故其餘選項錯誤。","concept":"傳統農業的環境挑戰與水土保持","skill":"概念理解","review":"core-4","evidence":"砍伐陡峭山坡地上的樹木，來種植單一、低矮的農作物，使土地裸露，造成土壤流失。","id":"q4","stem":"過去在山坡地上若砍伐陡峭山坡樹木，改種單一、低矮的農作物，容易對土地造成下列哪一種嚴重的後果？","theme":"傳統農業的環境挑戰與水土保持","explain":"正確答案為(0)土地裸露與嚴重水土流失。課文指出砍伐陡峭山坡地樹木改種單一低矮作物，會使土地裸露造成水土流失。(1)土壤肥力不會因此倍增反而易失養分；(2)地層下陷主因多為超抽地下水；(3)砍伐樹木無法改善空氣品質，故其餘選項錯誤。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"宜蘭縣三星鄉推廣有機農業，採用「魚茭共生」的做法，主要是利用魚在田裡發揮下列哪一種作用？","options":["協助茭白筍授粉","清除田間雜草樹枝","代替農夫耕耘土壤","吃掉害蟲福壽螺"],"answer":3,"explanation":"正確答案為(0)吃掉害蟲福壽螺。課本載明三星鄉魚茭共生是將魚放在茭白筍田裡吃福壽螺，從而免噴農藥與施化肥。(1)魚無法幫茭白筍授粉；(2)魚不能耕耘土壤；(3)吃福壽螺非清除樹枝雜草，故其餘選項不正確。","concept":"現代農業轉型與創生","skill":"概念理解","review":"core-5","evidence":"宜蘭縣三星鄉的魚茭共生，將魚放在茭白筍田裡吃福壽螺，茭白筍不用噴灑農藥或施加化肥，還能增加漁獲。","id":"q5","stem":"宜蘭縣三星鄉推廣有機農業，採用「魚茭共生」的做法，主要是利用魚在田裡發揮下列哪一種作用？","theme":"現代農業轉型與創生","explain":"正確答案為(0)吃掉害蟲福壽螺。課本載明三星鄉魚茭共生是將魚放在茭白筍田裡吃福壽螺，從而免噴農藥與施化肥。(1)魚無法幫茭白筍授粉；(2)魚不能耕耘土壤；(3)吃福壽螺非清除樹枝雜草，故其餘選項不正確。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"關於早期臺灣農村社會飼養禽畜的型態與目的，下列敘述何者符合課本描述？","options":["完全依賴國外進口飼料進行自動化養殖","在自家空地利用廚餘養豬養雞，多供家戶食用","大規模專業集中經營且大量外銷","由政府統一興建大農場集中養殖"],"answer":1,"explanation":"正確答案為(1)在自家空地利用廚餘養豬養雞，多供家戶食用。課本記載早期農村社會多為小規模家庭副業，利用廚餘飼養並主要供自家食用。(0)專業集中經營為現代轉型型態；(2)、(3)均非早期農村小規模副業之特徵，故不正確。","concept":"畜牧業型態轉變與挑戰","skill":"概念理解","review":"core-6","evidence":"早期農村社會，人們也會在自家空地利用廚餘養豬、養雞等……多只供應家戶內食用。","id":"q6","stem":"關於早期臺灣農村社會飼養禽畜的型態與目的，下列敘述何者符合課本描述？","theme":"畜牧業型態轉變與挑戰","explain":"正確答案為(1)在自家空地利用廚餘養豬養雞，多供家戶食用。課本記載早期農村社會多為小規模家庭副業，利用廚餘飼養並主要供自家食用。(0)專業集中經營為現代轉型型態；(2)、(3)均非早期農村小規模副業之特徵，故不正確。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"在養雞業的友善飼養轉型中，相較於空間狹小的「格子籠」，「室內飼養（平飼）」具有下列哪一種優點？","options":["完全不需要管理人力與成本","能在極小面積下圈養最多數量的母雞","貼近禽畜福祉並提供較大的活動空間","能完全防止所有外來傳染病發生"],"answer":2,"explanation":"正確答案為(1)貼近禽畜福祉並提供較大的活動空間。課本指出室內大空間飼養能讓雞隻自由活動，增進動物福祉。(0)平飼需要較多管理人力與成本；(2)極小面積圈養更多母雞是格子籠的特點；(3)平飼無法保證完全防止所有傳染病，故其餘選項錯誤。","concept":"友善飼養與科技畜牧","skill":"概念理解","review":"core-7","evidence":"友善飼養關注禽畜的福祉……現在也有室內大空間飼養的方式唷！增進動物福祉，友善雞隻生活環境。","id":"q7","stem":"在養雞業的友善飼養轉型中，相較於空間狹小的「格子籠」，「室內飼養（平飼）」具有下列哪一種優點？","theme":"友善飼養與科技畜牧","explain":"正確答案為(1)貼近禽畜福祉並提供較大的活動空間。課本指出室內大空間飼養能讓雞隻自由活動，增進動物福祉。(0)平飼需要較多管理人力與成本；(2)極小面積圈養更多母雞是格子籠的特點；(3)平飼無法保證完全防止所有傳染病，故其餘選項錯誤。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"民國86年臺灣曾爆發嚴重傳染病造成大量豬隻病死與撲殺，經過多年防疫努力後，臺灣於民國109年成功從哪一種疾病的疫區除名？","options":["口蹄疫","登革熱","狂犬病","禽流感"],"answer":0,"explanation":"正確答案為(2)口蹄疫。課本載明民國86年爆發口蹄疫造成豬隻重大損失與外銷中斷，經多年防治於民國109年成功從口蹄疫疫區除名。(0)禽流感主要影響禽類；(1)狂犬病非民國86年重創豬肉外銷之主因；(3)登革熱為蚊子傳播之人類傳染病，故其餘選項不正確。","concept":"豬隻傳染病防治與成果","skill":"概念理解","review":"core-8","evidence":"臺灣曾經在民國86年爆發口蹄疫……讓臺灣在民國109年成功從口蹄疫的疫區除名。","id":"q8","stem":"民國86年臺灣曾爆發嚴重傳染病造成大量豬隻病死與撲殺，經過多年防疫努力後，臺灣於民國109年成功從哪一種疾病的疫區除名？","theme":"豬隻傳染病防治與成果","explain":"正確答案為(2)口蹄疫。課本載明民國86年爆發口蹄疫造成豬隻重大損失與外銷中斷，經多年防治於民國109年成功從口蹄疫疫區除名。(0)禽流感主要影響禽類；(1)狂犬病非民國86年重創豬肉外銷之主因；(3)登革熱為蚊子傳播之人類傳染病，故其餘選項不正確。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"每年冬至前後會順著海流南下至臺灣西南部沿海產卵，因而被漁民稱為「信魚」的是哪一種魚類？","options":["鮪魚","鰹魚","飛魚","烏魚"],"answer":3,"explanation":"正確答案為(1)烏魚。課本指出烏魚每年冬至前後順海流南下產卵，故又稱「信魚」，其卵可加工製成烏魚子。(0)飛魚多於春夏隨海流北上；(2)、(3)為春夏黑潮帶來的其他經濟魚類，無冬至信魚之稱，故其餘選項錯誤。","concept":"海洋資源與漁業發展轉型","skill":"概念理解","review":"core-9","evidence":"烏魚在每年冬至前後順海流南下，在臺灣西南部沿海產卵，又稱「信魚」。","id":"q9","stem":"每年冬至前後會順著海流南下至臺灣西南部沿海產卵，因而被漁民稱為「信魚」的是哪一種魚類？","theme":"海洋資源與漁業發展轉型","explain":"正確答案為(1)烏魚。課本指出烏魚每年冬至前後順海流南下產卵，故又稱「信魚」，其卵可加工製成烏魚子。(0)飛魚多於春夏隨海流北上；(2)、(3)為春夏黑潮帶來的其他經濟魚類，無冬至信魚之稱，故其餘選項錯誤。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"日治時期臺灣蔗糖產量大幅提升，產糖量曾躍居世界第三，這對當時日本國內的哪一項產業產生了顯著的促進作用？","options":["造船工業","甜點與和菓子產業","紡織工業","陶瓷器製造業"],"answer":1,"explanation":"正確答案為(1)甜點與和菓子產業。課本說明在使用臺灣糖後，日本和菓子產業逐漸成熟，並促進巧克力、牛奶糖、長崎蛋糕等甜點發展。(0)、(2)、(3)皆非蔗糖直接促進發展的主要產業，故不正確。","concept":"蔗糖產業的興起與發展","skill":"概念理解","review":"core-1","evidence":"過去，日本的砂糖產量不足，在使用臺灣糖後，發展出許多甜食產品。","id":"q10","stem":"日治時期臺灣蔗糖產量大幅提升，產糖量曾躍居世界第三，這對當時日本國內的哪一項產業產生了顯著的促進作用？","theme":"蔗糖產業的興起與發展","explain":"正確答案為(1)甜點與和菓子產業。課本說明在使用臺灣糖後，日本和菓子產業逐漸成熟，並促進巧克力、牛奶糖、長崎蛋糕等甜點發展。(0)、(2)、(3)皆非蔗糖直接促進發展的主要產業，故不正確。","reviewText":"核心 1","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 蔗糖產業的興起與發展","title":"蔗糖產業的興起與發展","bullets":["荷蘭人於四百多年前引入漢人種植甘蔗並出口蔗糖；日治時期建立現代化糖廠，產糖量曾居世界第三。","蔗糖帶動了臺灣早期出口貿易與城鎮繁榮，曾是日本進口糖與製作甜點的主要原料。","雲林縣虎尾鎮因糖業發達有「糖都」之稱，虎尾糖廠至今仍以五分車載運甘蔗運作。","糖業歷史使虎尾保留糖業文化，近年更開發第一道榨汁製作的虎尾糖以提升價值。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 氣候地形與多元農作物外銷","title":"氣候地形與多元農作物外銷","bullets":["臺灣溫暖氣候與豐沛雨量適合農作物生長，平原適合稻米甘蔗，涼爽水氣足的丘陵適合茶樹。","早期臺灣茶葉以福爾摩沙烏龍茶為名，由淡水港直銷紐約，打開國際市場。","臺灣蔬果花卉品質優良，蝴蝶蘭享譽國際稱為「蘭花王國」，香蕉與鳳梨獲東京奧運選用食材肯定。","農產品外銷成功展現自然條件優勢與栽培技術改良的成果。"]},{"id":"core-3","type":"core","tag":"C 稻米品種演變與特色","title":"稻米品種演變與特色","bullets":["臺灣在新石器時期遺址中已有大量稻作痕跡，證實早期便有稻米栽培。","四百多年前漢人引入「在來米」（秈米），黏性較低且硬，常做成碗粿、米粉與米苔目。","一百多年前日本因糧食短缺派專家來臺研究，培育出「蓬萊米」（粳米），黏性高且軟，適合煮飯與壽司。","稻米品種從在來米轉為蓬萊米，反映了歷史背景與市場飲食需求的轉變。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 傳統農業的環境挑戰與水土保持","title":"傳統農業的環境挑戰與水土保持","bullets":["過去為提升產量不當噴灑農藥，造成空氣、土壤與水源汙染並影響人體健康。","陡峭山坡地砍伐樹木種植單一低矮作物，導致土地裸露與嚴重水土流失。","推行「混農林業」結合農作物與森林，減少雨水沖刷並保持土壤養分。","未來可大量採用科技儀器監控山坡地水土流失，保護土地永續。"]},{"id":"core-5","type":"core","tag":"E 現代農業轉型與創生","title":"現代農業轉型與創生","bullets":["農業面臨國際貿易競爭、勞動力缺乏、飲食習慣改變及食安環保意識抬頭等挑戰。","推廣不使用化學農藥與化肥的有機農業，如宜蘭三星鄉「魚茭共生」讓魚吃福壽螺。","發展休閒農業如臺南白河區採蓮子與乘坐大王蓮體驗，結合體驗與產地認識。","屏東可可利用檳榔樹下遮蔭種植並加入在地風味，帶動青年回流與地方創生。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 畜牧業型態轉變與挑戰","title":"畜牧業型態轉變與挑戰","bullets":["史前遺址已有畜養牲畜痕跡，早期農村在自家空地利用廚餘小規模養豬養雞供自家食用。","現代畜牧業由家庭副業轉型為專業集中式經營的農牧場。","面臨生產成本偏高、畜牧汙染及傳染病等挑戰。","現正朝向友善飼養、科技化經營及多元經營目標轉型。"]},{"id":"core-7","type":"core","tag":"G 友善飼養與科技畜牧","title":"友善飼養與科技畜牧","bullets":["友善飼養關注禽畜福祉，例如養雞從空間狹小的「格子籠」改為通風良好的「室內大空間飼養」。","乳牛配戴智慧監控體感裝置，掌握反芻、體溫等健康情形。","使用無人駕駛自動化飼料車精準配送，並設置電動按摩刷背機放鬆乳牛身心以增加牛乳產量。","科技設備改善畜牧效率並提升動物福利與經營品質。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 豬隻傳染病防治與成果","title":"豬隻傳染病防治與成果","bullets":["民國86年臺灣爆發口蹄疫，造成大量豬隻病死撲殺，豬肉外銷市場幾乎中斷。","政府實施豬隻接種疫苗、保持豬舍通風、防外來病源及廚餘經高溫蒸煮（90℃以上至少1小時）等防治措施。","民國109年臺灣成功從口蹄疫疫區除名，恢復豬肉產品國際競爭力。","宣導入境旅客不可攜帶疫區肉品，以防範口蹄疫與非洲豬瘟再次入侵。"]},{"id":"core-9","type":"core","tag":"I 海洋資源與漁業發展轉型","title":"海洋資源與漁業發展轉型","bullets":["西部海底平坦寬廣、東部落差大斜坡；春夏黑潮帶來飛魚與鮪魚，秋冬中國沿岸流帶來烏魚（冬至前後南下產卵稱信魚，卵製成烏金）。","臺灣漁業以遠洋捕撈及養殖漁業為主，技術發達有「養殖王國」之稱。","全球過度捕撈導致海洋漁獲逐漸枯竭，野生烏魚捕獲量極不穩定。","積極復育資源、轉型觀光漁業，並導入海面箱網養殖、自動餵食與水質監測科技。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"臺灣丘陵地形涼爽且水氣豐沛，最適宜大量種植甘蔗。","right":"丘陵地形適合種植茶樹；平原地形才適合種植甘蔗與稻米。 地形與氣候條件對應農作物不同，平原宜蔗稻，丘陵宜茶樹。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"早期日治時期臺灣所使用的蔗糖，主要由日本本土進口至臺灣。","right":"臺灣蔗糖曾大量出口至日本，是日本製作巧克力與甜點的主要原料。 歷史出口方向切勿顛倒，臺灣曾是外銷日本糖的重要產地。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"蓬萊米是由中國東南沿海移民引入臺灣的早期稻米品種。","right":"中國移民引入的是「在來米」；「蓬萊米」是一百多年前日本專家在臺培育改進的品種。 在來米（中國移民引入、硬黏低）與蓬萊米（日本專家培育、軟黏高）來源與特徵不可混淆。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"早期農村社會在自家空地利用廚餘養豬養雞，屬於專業集中式的經營模式。","right":"早期農村飼養屬於小規模、家庭副業式經營，現代農牧場才是專業集中式經營。 經營規模與性質隨時代轉變，家庭副業不等於現代專業農場。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"海洋中的魚類資源豐富且繁殖快速，因此過度捕撈不會導致漁獲枯竭。","right":"過度捕撈與氣候變遷已造成海洋漁獲逐漸枯竭，需靠復育、養殖與科技管理。 海洋資源並非取之不盡，過度捕撈會破壞生態平衡。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"山坡地開發時，將陡峭山坡樹木砍伐改種單一、低矮作物最有利於水土保持。","right":"砍伐山坡樹木種植單一低矮作物會使土地裸露造成嚴重水土流失；應採用混農林業。 單一低矮作物缺乏深根與植被覆蓋，反而加劇土石流與水土流失風險。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"農業的多樣與轉型｜知識關係","chain":["溫暖多雨平原丘陵地形與農藥濫用水土流失挑戰","推廣有機農業如魚茭共生及休閒農業體驗與屏東可可混農林","提升農產品附加價值並促進環境永續與地方創生"]},{"id":"logic-2","type":"chain","title":"蔗糖與稻米產業演變｜知識關係","chain":["荷蘭引種外銷日治建現代糖廠及日本糧食短缺背景","虎尾糖廠五分車運蔗與在來米轉為蓬萊米育種","創下產糖世界第三並改善國人與外銷糧食品質"]},{"id":"logic-3","type":"chain","title":"畜牧業科技與友善經營｜知識關係","chain":["早期家庭副業面臨生產成本高與口蹄疫傳染病衝擊","轉型專業集中式經營推行格子籠改室內大空間平飼與乳牛智慧監控","成功從口蹄疫疫區除名並提升動物福祉與國際競爭力"]},{"id":"logic-4","type":"chain","title":"漁業資源利用與永續｜知識關係","chain":["東西部海底地形差異與海流帶來飛魚與信魚烏魚資源","發展遠洋捕撈與養殖漁業並導入海面箱網養殖與科技自動化檢測","減緩野生漁獲枯竭危機並奠定養殖王國地位"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣稻米與蔗糖產業發展歷史對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜臺灣畜牧與漁業永續經營對照表","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["在來米","蓬萊米","在來米是由四百多年前中國移民引入，米質較硬、黏性低，適合做碗粿與米粉；蓬萊米是一百多年前日本專家在臺培育，米質軟、黏性高，適合煮飯、粥與壽司。"],["早期家庭副業畜牧","現代專業集中式畜牧","早期為小規模利用自家空地與廚餘飼養，產品多供家戶食用；現代為大規模專業農牧場集中經營，以商品販售為主並導入科技與友善飼養。"],["有機農業","休閒農業","有機農業著重於生產過程不使用化學農藥與化肥（如魚茭共生）；休閒農業著重於結合農村景觀、生活與體驗活動（如採蓮子、乘坐大王蓮）。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","五分車","載運甘蔗前往糖廠的小火車，因軌距只有762mm（約國際標準軌距一半）而得名。"],["2","糖都","雲林縣虎尾鎮因早期糖業極為發達、建有東洋第一大糖廠且至今仍在運作製糖而獲得的美稱。"],["3","在來米","大約四百多年前由中國東南沿海漢人移民引入臺灣的秈稻品種，黏性較低，常用於製作米粉、碗粿等。"],["4","蓬萊米","大約一百多年前日本專家在臺灣培育成功的粳稻品種，黏性較高且口感軟，現為臺灣人主食米飯。"],["5","混農林業","在山坡地或農田結合樹木與農作物種植的開墾方式，能減少雨水沖刷土地、保持土壤養分並防止水土流失。"],["6","魚茭共生","宜蘭縣三星鄉有機農業的實例，將魚放養於茭白筍田吃害蟲福壽螺，不需噴藥化肥又能增加漁獲。"],["7","友善飼養","注重動物福祉的畜養方式，盡量貼近禽畜野生生活習慣並減少人為傷害，如將格子籠改為室內大空間平飼。"],["8","口蹄疫","偶蹄類動物的嚴重病毒性傳染病，臺灣於民國86年爆發造成大量豬隻被撲殺外銷中斷，經過多年防治於民國109年成功除名。"],["9","信魚","烏魚的別稱，因每年冬至前後會順著冬季海流準時南下至臺灣西南部沿海產卵而得名。"],["10","海面箱網養殖","利用固定圍網結構在海洋水面進行的養殖技術，免用陸地空間且水質純淨，能產出品質穩定的海鮮。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"稻米品種演變與特色","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較四百多年前傳入的「在來米」與一百多年前培育的「蓬萊米」，兩者在米質特徵與常見飲食用途上的主要差別為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"傳統農業的環境挑戰與水土保持","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"推行「混農林業」之所以能有效改善傳統山坡地開發引發的水土流失問題，其核心原因為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"現代農業轉型與創生","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較現代農業轉型的「有機農業」與「休閒農業」，兩者在主要目標與做法上的主要差異為何？"}]}],"cloze":{"core-1":{"selector":".point","terms":["糖都"]},"core-2":{"selector":".point","terms":["福爾摩沙烏龍茶"]},"core-3":{"selector":".point","terms":["蓬萊米"]},"core-4":{"selector":".point","terms":["混農林業"]},"core-5":{"selector":".point","terms":["魚茭共生"]},"core-6":{"selector":".point","terms":["專業集中式"]},"core-7":{"selector":".point","terms":["友善飼養"]},"core-8":{"selector":".point","terms":["口蹄疫"]},"core-9":{"selector":".point","terms":["信魚"]},"mindmap-overview":{"selector":".mind-branch p","terms":["魚茭共生","五分車","口蹄疫","海面箱網養殖"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["蓬萊米"]},"trap-4":{"selector":".correct","terms":["專業集中式"]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["混農林業"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["五分車","糖都","在來米","蓬萊米","混農林業","魚茭共生","友善飼養","口蹄疫","信魚","海面箱網養殖"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>農業的多樣與轉型\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>溫暖多雨平原丘陵地形與農藥濫用水土流失挑戰\u003c/p>\u003cp>\u003cb>關係：\u003c/b>推廣有機農業如魚茭共生及休閒農業體驗與屏東可可混農林\u003c/p>\u003cp>\u003cb>結果：\u003c/b>提升農產品附加價值並促進環境永續與地方創生\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>蔗糖與稻米產業演變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭引種外銷日治建現代糖廠及日本糧食短缺背景\u003c/p>\u003cp>\u003cb>關係：\u003c/b>虎尾糖廠五分車運蔗與在來米轉為蓬萊米育種\u003c/p>\u003cp>\u003cb>結果：\u003c/b>創下產糖世界第三並改善國人與外銷糧食品質\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>畜牧業科技與友善經營\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>早期家庭副業面臨生產成本高與口蹄疫傳染病衝擊\u003c/p>\u003cp>\u003cb>關係：\u003c/b>轉型專業集中式經營推行格子籠改室內大空間平飼與乳牛智慧監控\u003c/p>\u003cp>\u003cb>結果：\u003c/b>成功從口蹄疫疫區除名並提升動物福祉與國際競爭力\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>漁業資源利用與永續\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>東西部海底地形差異與海流帶來飛魚與信魚烏魚資源\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展遠洋捕撈與養殖漁業並導入海面箱網養殖與科技自動化檢測\u003c/p>\u003cp>\u003cb>結果：\u003c/b>減緩野生漁獲枯竭危機並奠定養殖王國地位\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>豐饒的土地\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>蔗糖（荷蘭至日治）\u003c/td>\u003ctd>四百多年前荷蘭引種外銷；日治時期建現代糖廠，虎尾鎮被稱為糖都\u003c/td>\u003ctd>產糖量曾居世界第三，外銷占出口總值一半，為日本甜點重要原料\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在來米（四百多年前）\u003c/td>\u003ctd>中國東南沿海漢人移民引入之米種（秈米），米質較硬\u003c/td>\u003ctd>黏性較低，適合製作碗粿、米粉、米苔目與河粉等傳統米食\u003c/td>\u003c/tr>\u003ctr>\u003ctd>蓬萊米（一百多年前）\u003c/td>\u003ctd>日本因國內糧食短缺派專家來臺研發培育之米種（粳米）\u003c/td>\u003ctd>米質軟且黏性高，適合煮飯、粥及做壽司，成為現今主要食用米\u003c/td>\u003c/tr>\u003ctr>\u003ctd>農業轉型（現代）\u003c/td>\u003ctd>面對國際競爭與食安環保，推動有機農業、休閒農業與屏東可可混農林\u003c/td>\u003ctd>提升農產品附加價值，保護水土資源並促進地方創生\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按時間順序由歷史物產（蔗糖、在來米、蓬萊米）看至現代農業永續轉型。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論蓬萊米是史前或中國移民帶來的原始米種，亦不能推論虎尾糖廠目前已完全停工。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，日治時期引進專家培育「蓬萊米」的主要背景原因為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>主要背景為一百多年前日本國內面臨糧食短缺問題，因而派專家至臺灣研究培育符合日本喜好的稻米品種。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>畜牧業（飼養型態）\u003c/td>\u003ctd>由早期小規模家庭副業（利用廚餘養家禽家畜），轉為現代專業集中式農牧場\u003c/td>\u003ctd>推行友善飼養（關注動物福祉，如格子籠改為室內大空間平飼）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>畜牧業（科技與防疫）\u003c/td>\u003ctd>面臨高成本與傳染病（民國86年爆發口蹄疫，造成豬隻外銷中斷）\u003c/td>\u003ctd>乳牛智慧體感監控與自動飼料車；成功於民國109年從口蹄疫疫區除名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>漁業（海洋資源）\u003c/td>\u003ctd>西部平坦與東部深陡地形，夏季黑潮帶飛魚、冬季沿岸流帶烏魚（信魚）\u003c/td>\u003ctd>面對過度捕撈導致野生漁獲枯竭，推動資源復育與觀光漁業轉型\u003c/td>\u003c/tr>\u003ctr>\u003ctd>漁業（養殖技術）\u003c/td>\u003ctd>遠洋捕撈與養殖漁業為主力，養殖技術聞名國際被譽為養殖王國\u003c/td>\u003ctd>發展海面箱網養殖、自動化定時餵食與水質檢測科技，穩定產量品質\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>比較畜牧業與漁業由傳統生產面臨衝擊，轉型至科技永續經營的具體做法。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論早期家庭廚餘養豬即屬於專業集中式經營，亦不能推論海洋野生漁獲可無限採集不至枯竭。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>臺灣漁業在面對全球過度捕撈導致野生漁獲枯竭的困境時，採取了哪些主要的永續應對措施？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>採取復育漁業資源、轉型觀光漁業，並發展養殖漁業（如海面箱網養殖）與自動化科技監測以穩定水產供應。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>農業的多樣與轉型\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>溫暖多雨平原丘陵地形與農藥濫用水土流失挑戰\u003c/p>\u003cp>\u003cb>關係：\u003c/b>推廣有機農業如魚茭共生及休閒農業體驗與屏東可可混農林\u003c/p>\u003cp>\u003cb>結果：\u003c/b>提升農產品附加價值並促進環境永續與地方創生\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>蔗糖與稻米產業演變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭引種外銷日治建現代糖廠及日本糧食短缺背景\u003c/p>\u003cp>\u003cb>關係：\u003c/b>虎尾糖廠五分車運蔗與在來米轉為蓬萊米育種\u003c/p>\u003cp>\u003cb>結果：\u003c/b>創下產糖世界第三並改善國人與外銷糧食品質\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>畜牧業科技與友善經營\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>早期家庭副業面臨生產成本高與口蹄疫傳染病衝擊\u003c/p>\u003cp>\u003cb>關係：\u003c/b>轉型專業集中式經營推行格子籠改室內大空間平飼與乳牛智慧監控\u003c/p>\u003cp>\u003cb>結果：\u003c/b>成功從口蹄疫疫區除名並提升動物福祉與國際競爭力\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>漁業資源利用與永續\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>東西部海底地形差異與海流帶來飛魚與信魚烏魚資源\u003c/p>\u003cp>\u003cb>關係：\u003c/b>發展遠洋捕撈與養殖漁業並導入海面箱網養殖與科技自動化檢測\u003c/p>\u003cp>\u003cb>結果：\u003c/b>減緩野生漁獲枯竭危機並奠定養殖王國地位\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));

 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){

 }}

  if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

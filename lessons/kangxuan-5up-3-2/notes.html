t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒5上3-2 原住民族如何與環境共存？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"3-2","title":"原住民族如何與環境共存？"},"questions":[{"question":"居住於臺灣西部平原或丘陵地區的原住民族，目前統稱為下列哪一個族群名稱？","options":["達悟族群","阿美族群","平埔族群","高砂族群"],"answer":2,"explanation":"課文指出居住在西部平原或丘陵地區的原住民族，目前稱為平埔族群。(0)、(3)為單一原住民族名稱；(2)非課本目前採用之正名名稱。","concept":"平埔族群的分布與定義","skill":"概念理解","review":"core-1","evidence":"住在西部平原或丘陵地區的原住民族(目前稱這些原住民族為平埔族群)","id":"q1","stem":"居住於臺灣西部平原或丘陵地區的原住民族，目前統稱為下列哪一個族群名稱？","theme":"平埔族群的分布與定義","explain":"課文指出居住在西部平原或丘陵地區的原住民族，目前稱為平埔族群。(0)、(3)為單一原住民族名稱；(2)非課本目前採用之正名名稱。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"關於住在山地地區、東部平原或周邊島嶼的原住民族，其傳統語言與文化保存較多的主因是什麼？","options":["平原地區土壤肥沃，不適合人類居住","政府過去禁止漢人進入任何島嶼","受到地形與交通的阻隔，較晚接觸島外人群","族人完全不上岸，長期居住於船隻上"],"answer":2,"explanation":"山地、東部與離島原住民族因為地形與交通阻隔，較晚與漢人等島外人群接觸，因而保存較多傳統語言與文化。(0)、(2)、(3)皆非課本記載之事實。","concept":"山地東部與離島族群的文化保存","skill":"概念理解","review":"core-2","evidence":"因為交通的阻隔，較晚與漢人等島外來的人群接觸，因而保存較多傳統的語言與文化。","id":"q2","stem":"關於住在山地地區、東部平原或周邊島嶼的原住民族，其傳統語言與文化保存較多的主因是什麼？","theme":"山地東部與離島族群的文化保存","explain":"山地、東部與離島原住民族因為地形與交通阻隔，較晚與漢人等島外人群接觸，因而保存較多傳統語言與文化。(0)、(2)、(3)皆非課本記載之事實。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"為保障原住民族的權利與文化，政府將哪一天訂為「原住民族日」？目前政府認定之原住民族共有幾族？","options":["七月七日，共有十二族","九月二十八日，共有十族","八月一日，共有十六族","十二月二十五日，共有二十族"],"answer":2,"explanation":"政府將八月一日訂為「原住民族日」，目的在保障原住民族的權利與文化；目前政府認定的原住民族共有十六族。","concept":"原住民族正名與原住民族日","skill":"概念理解","review":"core-3","evidence":"政府也將八月一日訂為「原住民族日」，目的在保障原住民族的權利與文化。目前，政府認定的原住民族共有十六族。","id":"q3","stem":"為保障原住民族的權利與文化，政府將哪一天訂為「原住民族日」？目前政府認定之原住民族共有幾族？","theme":"原住民族正名與原住民族日","explain":"政府將八月一日訂為「原住民族日」，目的在保障原住民族的權利與文化；目前政府認定的原住民族共有十六族。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"在史前時代沒有文字記錄的情況下，原住民族主要透過何種方式傳播族群傳說與生活規範？","options":["以口耳相傳與歌謠吟唱方式流傳","利用電報與報紙印製傳播","在石頭上刻寫英文字母","透過網際網路社群軟體發布"],"answer":0,"explanation":"在文字尚未出現的史前時代，世界各地的人們大多以口耳相傳與歌謠吟唱等方式將族群傳說流傳下來。(0)、(2)、(3)出現文字或現代科技，均非史前時代傳播方式。","concept":"口傳故事與生活智慧規範","skill":"概念理解","review":"core-4","evidence":"在文字尚未出現的史前時代，世界各地的人們大多以口耳相傳與歌謠吟唱等方式，將族群的傳說流傳下來。","id":"q4","stem":"在史前時代沒有文字記錄的情況下，原住民族主要透過何種方式傳播族群傳說與生活規範？","theme":"口傳故事與生活智慧規範","explain":"在文字尚未出現的史前時代，世界各地的人們大多以口耳相傳與歌謠吟唱等方式將族群傳說流傳下來。(0)、(2)、(3)出現文字或現代科技，均非史前時代傳播方式。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"魯凱族流傳的鬼湖傳說中，主角巴冷公主所喜愛的鬼湖主人「阿達里歐」，在族人眼中看到的真實型態是什麼？","options":["臺灣黑熊","梅花鹿","綠頭鴨","百步蛇"],"answer":3,"explanation":"魯凱族鬼湖傳說中，巴冷眼裡的阿達里歐是英俊男子，但族人看到的阿達里歐則是「百步蛇」，魯凱族因而相信鬼湖是百步蛇神賜予的聖地。","concept":"魯凱族鬼湖傳說內容","skill":"概念理解","review":"core-5","evidence":"巴冷眼裡的阿達里歐是位英俊的男子，但族人看到的阿達里歐卻是百步蛇。","id":"q5","stem":"魯凱族流傳的鬼湖傳說中，主角巴冷公主所喜愛的鬼湖主人「阿達里歐」，在族人眼中看到的真實型態是什麼？","theme":"魯凱族鬼湖傳說內容","explain":"魯凱族鬼湖傳說中，巴冷眼裡的阿達里歐是英俊男子，但族人看到的阿達里歐則是「百步蛇」，魯凱族因而相信鬼湖是百步蛇神賜予的聖地。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"花蓮縣光復鄉馬太鞍溼地的阿美族人，打造何種稱為「巴拉告」的設施來進行捕魚？","options":["用發電機驅動的高壓電魚機","用化學塑膠製成的單層集魚網","用鋼筋水泥建造的深海大壩","用竹子、樹木打造的三層魚屋"],"answer":3,"explanation":"阿美族打造稱為「巴拉告」的三層魚屋（竹子、樹木材料），讓魚蝦可以在裡面生活與成長繁衍。(0)、(2)、(3)非巴拉告之天然構造。","concept":"阿美族巴拉告生態捕魚法","skill":"概念理解","review":"core-6","evidence":"打造的魚屋稱為「巴拉告」，讓小魚可以在巴拉告內成長，使自然資源生生不息。","id":"q6","stem":"花蓮縣光復鄉馬太鞍溼地的阿美族人，打造何種稱為「巴拉告」的設施來進行捕魚？","theme":"阿美族巴拉告生態捕魚法","explain":"阿美族打造稱為「巴拉告」的三層魚屋（竹子、樹木材料），讓魚蝦可以在裡面生活與成長繁衍。(0)、(2)、(3)非巴拉告之天然構造。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"賽德克族為了維護生態平衡與資源永續，嚴格禁止族人在哪一個季節進行狩獵活動？","options":["颱風過境的秋季深夜","全年十二個月皆禁止","動物繁殖的春、夏季","雪花飄落的嚴冬季節"],"answer":2,"explanation":"賽德克族規範族人只能在自己獵區狩獵，並禁止族人在動物繁殖的春、夏季進行狩獵，以維持生態平衡。","concept":"賽德克族獵區規範與禁獵季節","skill":"概念理解","review":"core-7","evidence":"禁止族人在動物繁殖的春、夏季進行狩獵，以維持生態的平衡。","id":"q7","stem":"賽德克族為了維護生態平衡與資源永續，嚴格禁止族人在哪一個季節進行狩獵活動？","theme":"賽德克族獵區規範與禁獵季節","explain":"賽德克族規範族人只能在自己獵區狩獵，並禁止族人在動物繁殖的春、夏季進行狩獵，以維持生態平衡。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"西元1980年位於臺東縣的卑南考古遺址被發掘出來，當時主要的歷史起因是什麼？","options":["為了開闢新的鐵路路線與火車站施工","民間企業興建大型高爾夫球場","政府專程開鑿深層石油井探勘","農夫開墾水稻田時挖出鑽石"],"answer":0,"explanation":"卑南考古遺址是在西元1980年為了開闢新的鐵路路線與火車站進行施工時意外發掘出來的。","concept":"卑南遺址發掘背景","skill":"概念理解","review":"core-8","evidence":"西元1980年，這裡為了開闢新的鐵路路線與火車站而進行施工，發掘出豐富的史前文物","id":"q8","stem":"西元1980年位於臺東縣的卑南考古遺址被發掘出來，當時主要的歷史起因是什麼？","theme":"卑南遺址發掘背景","explain":"卑南考古遺址是在西元1980年為了開闢新的鐵路路線與火車站進行施工時意外發掘出來的。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"卑南考古遺址的地理位置位於山腳下的平地且鄰近河流，這種環境對史前人類生活有何優點？","options":["能完全隔離所有陽光與空氣","能自動產生高溫電能進行工業煉鐵","方便興建大型百貨公司與地下鐵路","方便採集果實、獵捕動物、種植農作與取水捕魚"],"answer":3,"explanation":"平地適合移動採集果實、獵捕動物與種植農作；鄰近河流則水源充足，方便取水與捕撈魚貝類。","concept":"考古遺址探究與自然環境關係","skill":"概念理解","review":"core-8","evidence":"這附近是平地，適合史前人類移動採集果實、獵捕動物，也可種植農作物。而且又鄰近河流，水源充足，方便取水與捕撈魚、貝類。","id":"q9","stem":"卑南考古遺址的地理位置位於山腳下的平地且鄰近河流，這種環境對史前人類生活有何優點？","theme":"考古遺址探究與自然環境關係","explain":"平地適合移動採集果實、獵捕動物與種植農作；鄰近河流則水源充足，方便取水與捕撈魚貝類。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"現代都市開發或鐵路工程施工時，若意外發掘出埋藏地下的考古遺址，大眾與政府常面臨何種課題？","options":["完全無視遺址並繼續用爆破法加速施工","強制禁止周邊所有國民使用任何交通工具","省思與評估遺址保存與地方建設需求之間的取捨","將所有出土文物試圖拋棄至深海中"],"answer":2,"explanation":"當開發建設意外發現考古遺址時，社會大眾需要省思與思考如何在文化資產保存與地方建設需求間做出適當取捨或兼顧。","concept":"考古遺址保存與地方建設衝突省思","skill":"概念理解","review":"core-9","evidence":"當面對遺址的保存與建設的需求，要如何取捨？可以兼顧嗎？","id":"q10","stem":"現代都市開發或鐵路工程施工時，若意外發掘出埋藏地下的考古遺址，大眾與政府常面臨何種課題？","theme":"考古遺址保存與地方建設衝突省思","explain":"當開發建設意外發現考古遺址時，社會大眾需要省思與思考如何在文化資產保存與地方建設需求間做出適當取捨或兼顧。","reviewText":"核心 9","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 平埔族群的分布與文化變遷","title":"平埔族群的分布與文化變遷","bullets":["住在西部平原或丘陵地區的原住民族，目前稱為平埔族群。","自十七世紀以來因地理位置關係，平埔族群較早接觸到漢人等島外人群。","日常生活的語言與傳統文化很早就受到外來人群影響或改變，較早開始種植水稻。","平埔族群早期會捕鹿作為食物並用鹿皮製作衣服，呈現與西部平原環境互動的特色。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 山地東部與離島族群的文化保存","title":"山地東部與離島族群的文化保存","bullets":["住在山地地區、東部平原、海岸附近或周邊島嶼的原住民族保存較多傳統文化。","因為地形與交通的阻隔，較晚與漢人等島外人群接觸。","傳統語言、祭典與生活習俗得以較完整地留存並世代傳承。","形成現今分布於山地、東部與周邊島嶼（如蘭嶼雅美族/達悟族）的多樣原住民族文化貌。"]},{"id":"core-3","type":"core","tag":"C 原住民族正名與原住民族日","title":"原住民族正名與原住民族日","bullets":["政府將八月一日訂為「原住民族日」，目的在保障原住民族的權利與文化。","過去不同來臺人群給予帶有歧視或不尊重的稱呼，四十多年前在各方努力爭取下獲得正名。","經過長期的正名運動，社會建立對原住民族歷史主體性與多元文化的尊重。","目前政府認定的原住民族共有十六族，定期舉辦紀念活動促進文化傳承。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 口傳故事與生活智慧規範","title":"口傳故事與生活智慧規範","bullets":["在文字尚未出現的史前時代，原住民族以口耳相傳與歌謠吟唱等方式流傳傳說。","透過口傳故事將族群傳說、禁忌與生活智慧世代相傳。","傳說中常蘊含約束行為的禁忌，形成群體規範（相當於風俗習慣或法律）。","展現原住民族尊重萬物、學習與自然共存的精神。"]},{"id":"core-5","type":"core","tag":"E 魯凱族鬼湖傳說與生態維護","title":"魯凱族鬼湖傳說與生態維護","bullets":["魯凱族流傳著巴冷公主與百步蛇神阿達里歐的鬼湖傳說。","魯凱族相信鬼湖是百步蛇神賜予的聖地，必須恪守神聖規範。","族人規定不得在鬼湖周邊捕殺獵物、大聲喧譁，否則會受到上天的懲罰。","鬼湖地區（如小鬼湖）至今仍保有乾淨的水源與珍貴的自然山林。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 阿美族巴拉告生態捕魚法","title":"阿美族巴拉告生態捕魚法","bullets":["花蓮縣光復鄉馬太鞍溼地的阿美族人打造「巴拉告」進行生態捕魚。","為了提供魚蝦生活與繁衍空間，實現水產資源的永續採集。","用竹子與樹木打造三層魚屋：上層覆樹葉、中層樹枝藏小魚蝦、底層竹筒供鰻魚泥鰍棲息。","讓小魚在巴拉告內安心成長，等長大後才捕捉食用，使自然資源生生不息。"]},{"id":"core-7","type":"core","tag":"G 賽德克族獵區規範與禁獵季節","title":"賽德克族獵區規範與禁獵季節","bullets":["賽德克族嚴格規範族人只能在自己的獵區狩獵，並遵守獵區與季節禁忌。","為了維護山林生態平衡與資源永續，避免過度獵捕造成物種滅絕。","獵物若逃離獵區不能再追捕，且禁止族人在動物繁殖的春、夏季進行狩獵。","適度獵捕的狩獵方式保護了生態環境，確保山林資源世代延續。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 考古遺址探究與自然環境關係","title":"考古遺址探究與自然環境關係","bullets":["史前人類選擇居住地點與當地的自然環境條件密切相關。","史前人類需要選擇容易取得食物來源與方便生活的自然環境。","卑南考古遺址位於山腳下平地且有河流經過，方便採集、漁獵、農耕與取水。","透過探究遺址與自然環境的關係，幫助我們理解史前人類順應並利用自然的生存智慧。"]},{"id":"core-9","type":"core","tag":"I 考古遺址保存與地方建設衝突省思","title":"考古遺址保存與地方建設衝突省思","bullets":["在進行現代開發建設時，常意外發現埋藏地下的考古遺址。","例如鐵路開闢或工程施作時，地下文化資產保護與現代建設產生空間衝突。","考古學家發掘史前文物與石板棺，政府與社會面對遺址保存與建設需求必須評估取捨。","促使大眾省思如何在推動地方發展的同時，兼顧史前文化資產的珍貴保存。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"平埔族群是因為本身不喜歡傳統文化，所以主動放棄傳統語言改種水稻。","right":"平埔族群住在西部平原或丘陵，自十七世紀以來因地理位置較早接觸漢人等島外人群，生活與文化才逐漸受到影響與改變。 文化變遷係因地理位置與外來人群接觸較早的客觀歷史環境所致，而非主動厭棄自身文化。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"目前政府認定的十六族原住民族，自古至今都叫作『原住民族』，名稱完全沒有變過。","right":"『原住民族』係四十多年前經各方努力爭取後才開始正式使用的尊稱，過去曾被外來人群給予不尊重或歧視性的稱呼。 正名運動經歷長年爭取，政府將八月一日訂為『原住民族日』以保障其權益與文化。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"魯凱族的鬼湖傳說只是一則可怕的鬼怪故事，與生態環境保育沒有任何關係。","right":"鬼湖傳說蘊含神聖禁忌，規範族人不得在湖邊捕殺獵物或大聲喧譁，展現尊重萬物、與自然共存的精神，使鬼湖至今保有乾淨水源與山林。 傳說禁忌發揮了群體規範功能，有效減少人為干擾，達到維護自然生態的效果。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"阿美族的『巴拉告』是一種一次把溪流中所有大小魚蝦全部抓光的絕殺網具。","right":"『巴拉告』是用竹子、樹木打造的三層魚屋，提供魚蝦棲息與繁衍空間，等小魚長大後才適度捕捉。 巴拉告是『先營造繁衍環境，再永續利用』的生態捕魚智慧，而非一次性獵絕。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"賽德克族人在狩獵時，只要看到獵物就可以一路跨越山頭追捕到底，且一年四季都可以隨時獵捕。","right":"賽德克族規範族人只能在自己的獵區狩獵，獵物逃離獵區不可追捕，且禁止在動物繁殖的春、夏季進行狩獵。 嚴格的獵區界線與繁殖期禁獵規定，能維護生態平衡並防止資源枯竭。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"卑南考古遺址會出現在臺東卑南，只是史前人類隨機亂選的地方，與當地地形河流完全無關。","right":"卑南遺址位於山腳下平地且有河流經過，方便取水、捕魚、採集、狩獵與農耕，係史前人類選擇易取得食物的環境所致。 考古遺址分布與地形、水源及食物來源等自然環境條件有密不可分的關係。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"平埔族群與山地離島族群文化變遷｜知識關係","chain":["平埔族群位於西部平原丘陵，山地東部離島族群受地形與交通的阻隔","平埔族群十七世紀起較早接觸漢人，山地離島族群較晚接觸外來人群","平埔族群語言文化較早改變並種植水稻，山地離島族群保存較多傳統文化"]},{"id":"logic-2","type":"chain","title":"原住民族正名與權利保障｜知識關係","chain":["過去外來人群給予帶有歧視或不尊重的稱呼","四十多年前各方努力爭取正名，政府訂定八月一日為原住民族日","保障原住民族權利與文化，目前政府認定共有十六族原住民族"]},{"id":"logic-3","type":"chain","title":"魯凱鬼湖傳說與生態禁忌｜知識關係","chain":["巴冷公主與百步蛇神阿達里歐傳說流傳於魯凱族","將鬼湖視為聖地，規範不得在湖邊捕殺獵物或大聲喧譁","保護鬼湖周邊自然山林與乾淨水源，展現尊重萬物共存智慧"]},{"id":"logic-4","type":"chain","title":"永續漁獵智慧與生態平衡｜知識關係","chain":["面對自然資源採集需要維護生態平衡與永續","阿美族打造巴拉告三層魚屋，賽德克族劃分獵區並於春夏季禁獵","讓動物與水產繁衍成長，展現與自然和諧共存的生存智慧"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜原住民族地理分布與文化保存比較表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜原住民族傳統漁獵生態智慧對照表","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["平埔族群","山地與東部原住民族","平埔族群居住於西部平原或丘陵，十七世紀起較早接觸漢人，語言與傳統文化較早受到影響改變；山地與東部族群因地形交通阻隔較晚接觸外來人群，保存較多傳統語言與文化。"],["魯凱族鬼湖禁忌","賽德克族狩獵規範","魯凱族鬼湖禁忌源於巴冷公主與百步蛇神的聖地傳說，禁止在湖邊捕獵與喧譁以保護水源山林；賽德克族狩獵規範則是劃定獵區界線（逃離不可追）並於動物繁殖的春夏季禁獵，以維持生態平衡。"],["巴拉告生態魚屋","一般竭澤而漁捕撈","巴拉告是以天然材料建三層魚屋提供魚蝦繁衍庇護，等長大後適度採集；一般竭澤而漁則是一次性將大魚小魚濫捕光，會破壞棲地並導致資源枯竭。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","平埔族群","指早期居住於臺灣西部平原或丘陵地區的原住民族，因地理位置較早接觸漢人等島外人群，語言與傳統文化較早發生變遷。"],["2","原住民族日","政府訂於八月一日的紀念日，旨在紀念原住民族正名運動的努力，並保障原住民族的權利與文化。"],["3","十六族","指目前由中華民國政府官方正式認定保障的原住民族族群數量。"],["4","口耳相傳","史前時代原住民族在沒有文字的情況下，透過口頭講述與歌謠吟唱將族群歷史、傳說與規範代代相傳的方式。"],["5","鬼湖傳說","魯凱族流傳關於巴冷公主與百步蛇神阿達里歐的傳說，帶出禁止在鬼湖周邊捕獵與喧譁的聖地規範。"],["6","巴拉告","花蓮馬太鞍阿美族利用竹子、樹木打造的三層生態魚屋捕魚法，讓小魚小蝦棲息生長，達成本地水產資源永續。"],["7","賽德克族獵區","賽德克族傳統社會中劃定的狩獵範圍規範，族人僅能在自己獵區活動，逃離獵區的獵物不可繼續追捕。"],["8","繁殖季禁獵","賽德克族等原住民族禁止族人在動物繁殖的春、夏季進行狩獵的傳統規範，以維護物種繁衍與生態平衡。"],["9","卑南考古遺址","位於臺東縣的史前遺址，位於山腳平地且鄰近河流，適合採集、漁獵與農耕，反映史前人類對自然環境的選擇。"],["10","遺址保存與建設","指現代推動鐵路或交通開發時發現地下史前遺址，需要在地方建設發展與文化資產保存之間進行評估與取捨。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"平埔與山地東部族群接觸史比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較平埔族群與山地東部原住民族在傳統文化與語言保存上的差異，其核心的因果原因為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"原住民族正名的歷史意義","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"四十多年前在各方努力下推動正名運動，將「原住民族」作為正式稱呼，這項改變背後的最主要意義為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"魯凱鬼湖禁忌與環境保護之因果關係","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"魯凱族族人至今仍恪守「不得在鬼湖周邊捕殺獵物或大聲喧譁」的禁忌，這項社會規範對當地自然環境產生了什麼直接的正面影響？"}]}],"cloze":{"core-1":{"selector":".point","terms":["平埔族群"]},"core-2":{"selector":".point","terms":["交通的阻隔"]},"core-3":{"selector":".point","terms":["原住民族日"]},"core-4":{"selector":".point","terms":["口耳相傳"]},"core-5":{"selector":".point","terms":["鬼湖傳說"]},"core-6" 百步蛇神阿達里歐傳說流傳於魯凱族\u003c/p>\u003cp>\u003cb>關係：\u003c/b>將鬼湖視為聖地，規範不得在湖邊捕殺獵物或大聲喧譁\u003c/p>\u003cp>\u003cb>結果：\u003c/b>保護鬼湖周邊自然山林與乾淨水源，展現尊重萬物共存智慧\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>永續漁獵智慧與生態平衡\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>面對自然資源採集需要維護生態平衡與永續\u003c/p>\u003cp>\u003cb>關係：\u003c/b>阿美族打造巴拉告三層魚屋，賽德克族劃分獵區並於春夏季禁獵\u003c/p>\u003cp>\u003cb>結果：\u003c/b>讓動物與水產繁衍成長，展現與自然和諧共存的生存智慧\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>原住民族如何與環境共存？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">族群分類\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">地理分布與環境\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">文化與語言保存狀況\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>族群分類\u003c/th>\u003cth>地理分布與環境\u003c/th>\u003cth>文化與語言保存狀況\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>平埔族群\u003c/td>\u003ctd>西部平原或丘陵地區\u003c/td>\u003ctd>自十七世紀起較早接觸漢人，語言與傳統文化較早受影響改變（如種水稻）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>山地與東部族群\u003c/td>\u003ctd>山地地區、東部平原或海岸附近\u003c/td>\u003ctd>受地形與交通阻隔較晚接觸漢人，保存較多傳統語言與文化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>周邊島嶼族群\u003c/td>\u003ctd>臺灣周邊島嶼（如蘭嶼雅美族/達悟族）\u003c/td>\u003ctd>遠離本島且海洋阻隔，保存極豐富之傳統海洋文化與語言\u003c/td>\u003c/tr>\u003ctr>\u003ctd>正名與現況\u003c/td>\u003ctd>全臺灣各地（政府認定十六族）\u003c/td>\u003ctd>八月一日原住民族日保障權利，展現尊重多元文化主體性\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按族群分布區域（西部平原→山地東部→周邊島嶼→正名現況），比較接觸外來人群時間與文化保存差異。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論平埔族群完全沒有自己的傳統文化，亦不能推論山地族群完全未受現代社會影響。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據比較表，造成平埔族群與山地東部族群在傳統語言文化保存程度上有顯著差異的核心原因為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>核心原因為地理位置與交通阻隔：平埔族群位於西部平原較早接觸漢人，而山地東部族群因地形交通阻隔較晚接觸外來人群。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">族群與文化\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">傳統做法與規範\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">生態永續意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>族群與文化\u003c/th>\u003cth>傳統做法與規範\u003c/th>\u003cth>生態永續意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>魯凱族（鬼湖傳說）\u003c/td>\u003ctd>相信鬼湖為百步蛇神聖地，禁止在湖邊捕殺獵物或大聲喧譁\u003c/td>\u003ctd>減少人為干擾，保護鬼湖周邊乾淨水源與珍貴自然山林\u003c/td>\u003c/tr>\u003ctr>\u003ctd>阿美族（巴拉告）\u003c/td>\u003ctd>以竹子樹木打造三層魚屋（上層樹葉、中層樹枝、底層竹筒）\u003c/td>\u003ctd>提供小魚小蝦棲息繁衍空間，等長大後才適度捕捉，使資源生生不息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>賽德克族（獵區規範）\u003c/td>\u003ctd>規範族人只能在自己的獵區狩獵，獵物逃離獵區不可追捕\u003c/td>\u003ctd>尊重群體傳統領域界線，避免無限制濫捕與族群衝突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>賽德克族（季節禁忌）\u003c/td>\u003ctd>嚴格禁止族人在動物繁殖的春、夏季進行狩獵\u003c/td>\u003ctd>保護繁殖期母獸與幼獸，維護野生動物數量與生態平衡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按族群與傳統文化做法，分析其對自然環境與生態永續所產生的積極意義。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論原住民族完全不獵捕動物或不吃魚肉，亦不能推論賽德克族春夏季可以自由追捕逃離獵區的動物。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，阿美族的『巴拉告』與賽德克族的『春夏季禁獵』在生態保育原則上有何共同點？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>兩者皆強調『給予生物繁衍成長的時間與空間』，不進行一次性掠奪，以達成自然資源永續利用。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M3 function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["平埔族群"]},"core-2":{"selector":".point","terms":["交通的阻隔"]},"core-3":{"selector":".point","terms":["原住民族日"]},"core-4":{"selector":".point","terms":["口耳相傳"]},"core-5":{"selector":".point","terms":["鬼湖傳說"]},"core-6":{"selector":".point","terms":["巴拉告"]},"core-7":{"selector":".point","terms":["繁殖的春、夏季"]},"core-8":{"selector":".point","terms":["自然環境條件"]},"core-9":{"selector":".point","terms":["考古遺址"]},"mindmap-overview":{"selector":".mind-branch p","terms":["交通的阻隔","原住民族日","百步蛇神","巴拉告"]},"trap-1":{"selector":".correct","terms":["平埔族群"]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["鬼湖傳說"]},"trap-4":{"selector":".correct","terms":["巴拉告"]},"trap-5":{"selector":".correct","terms":["繁殖的春、夏季"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["平埔族群","原住民族日","十六族","口耳相傳","鬼湖傳說","巴拉告","賽德克族獵區","繁殖季禁獵","卑南考古遺址","遺址保存與建設"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

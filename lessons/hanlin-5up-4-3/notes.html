t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林5上4-3 土地開發與環境保護該如何抉擇？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"4-3","title":"土地開發與環境保護該如何抉擇？"},"questions":[{"question":"早期原住民族無論是進行農耕還是狩獵活動，都展現了何種重要的生活原則？","options":["全面興建水泥建物","與環境共生","大規模開採山林資源","大量抽取地下水"],"answer":1,"explanation":"課文明確指出早期原住民族學習祖先傳遞的山林知識，無論農耕或狩獵都與環境共生。(0)、(2)、(3)皆非原住民族傳統共生方式。","concept":"山林知識與水土保持","skill":"概念理解","review":"core-1","evidence":"早期原住民族學習祖先傳遞的山林知識,無論是農耕或是狩獵,都與環境共生。","id":"q1","stem":"早期原住民族無論是進行農耕還是狩獵活動，都展現了何種重要的生活原則？","theme":"山林知識與水土保持","explain":"課文明確指出早期原住民族學習祖先傳遞的山林知識，無論農耕或狩獵都與環境共生。(0)、(2)、(3)皆非原住民族傳統共生方式。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"不當開發山坡地破壞植被與水土保持後，遇到強降雨或地震時最容易引發下列哪一種嚴重災害？","options":["沙塵暴與乾旱","火山爆發與地裂","海水倒灌與鹽化","山崩與土石流"],"answer":3,"explanation":"課文指出不當開發山坡地影響水土保持，遇到強降雨或地震時更易引發山崩與土石流。(1)、(2)、(3)皆非山坡地不當開發與強降雨直接引發的災害。","concept":"山林知識與水土保持","skill":"概念理解","review":"core-1","evidence":"若遇上強降雨或地震時,更容易引發山崩和土石流,造成生命與財產損失。","id":"q2","stem":"不當開發山坡地破壞植被與水土保持後，遇到強降雨或地震時最容易引發下列哪一種嚴重災害？","theme":"山林知識與水土保持","explain":"課文指出不當開發山坡地影響水土保持，遇到強降雨或地震時更易引發山崩與土石流。(1)、(2)、(3)皆非山坡地不當開發與強降雨直接引發的災害。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"南投縣廬山溫泉區在民國97年遭受辛樂克颱風重創後，經調查發現當地仍存在何種地質安全隱憂？","options":["海底火山持續噴發","地層滑動現象","嚴重的海水倒灌","大規模沙漠化"],"answer":1,"explanation":"課文記載辛樂克颱風重創廬山溫泉區後，經調查發現近年廬山仍有地層滑動的現象。(0)、(2)、(3)皆不符合當地地質問題。","concept":"南投廬山溫泉區開發與遷建","skill":"概念理解","review":"core-2","evidence":"經調查後發現近年廬山仍有地層滑動的現象。","id":"q3","stem":"南投縣廬山溫泉區在民國97年遭受辛樂克颱風重創後，經調查發現當地仍存在何種地質安全隱憂？","theme":"南投廬山溫泉區開發與遷建","explain":"課文記載辛樂克颱風重創廬山溫泉區後，經調查發現近年廬山仍有地層滑動的現象。(0)、(2)、(3)皆不符合當地地質問題。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"南投縣政府為了廬山溫泉區的永續發展與地質安全，規劃輔導當地業者遷移至何處進行重建？","options":["埔里福興農場","南投清境農場","彰化八卦山農場","臺南白河蓮花園"],"answer":0,"explanation":"課文指出南投縣政府規劃保育土地永續發展計畫，輔導當地業者遷移至鄰近的埔里福興農場重建。(0)、(1)、(3)皆非課本記載之遷移重建地點。","concept":"南投廬山溫泉區開發與遷建","skill":"概念理解","review":"core-2","evidence":"輔導當地業者遷移至鄰近的埔里福興農場重建。","id":"q4","stem":"南投縣政府為了廬山溫泉區的永續發展與地質安全，規劃輔導當地業者遷移至何處進行重建？","theme":"南投廬山溫泉區開發與遷建","explain":"課文指出南投縣政府規劃保育土地永續發展計畫，輔導當地業者遷移至鄰近的埔里福興農場重建。(0)、(1)、(3)皆非課本記載之遷移重建地點。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"臺灣西南沿海部分地區為了發展養殖漁業或農作灌溉，長期過度抽取地下水，最容易導致下列哪一種嚴重的地質災害？","options":["土地受沙塵暴侵襲","地層下陷","山崩與土石流","火山噴發"],"answer":1,"explanation":"課文指出西南沿海因養殖漁業等過度抽取地下水，容易導致嚴重的地層下陷問題。(0)、(2)、(3)非超抽地下水直接導致的核心災害。","concept":"過度抽取地下水與地層下陷","skill":"概念理解","review":"core-3","evidence":"臺灣西南沿海因養殖漁業而超抽地下水,容易導致地層下陷。","id":"q5","stem":"臺灣西南沿海部分地區為了發展養殖漁業或農作灌溉，長期過度抽取地下水，最容易導致下列哪一種嚴重的地質災害？","theme":"過度抽取地下水與地層下陷","explain":"課文指出西南沿海因養殖漁業等過度抽取地下水，容易導致嚴重的地層下陷問題。(0)、(2)、(3)非超抽地下水直接導致的核心災害。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"政府為了減緩西南沿海超抽地下水引發的地層下陷，鼓勵補助農民改種哪一種用水量較少的農作物？","options":["蓮霧","甘蔗","水稻","高粱"],"answer":3,"explanation":"課本明確指出政府為了減緩地層下陷，鼓勵農民改種用水量較少的高粱並提供補助。(0)、(1)、(3)皆非課本特別提及之補助省水作物。","concept":"過度抽取地下水與地層下陷","skill":"概念理解","review":"core-3","evidence":"政府為了減緩地層下陷,鼓勵民眾改種用水量較少的高粱,還能獲得補助。","id":"q6","stem":"政府為了減緩西南沿海超抽地下水引發的地層下陷，鼓勵補助農民改種哪一種用水量較少的農作物？","theme":"過度抽取地下水與地層下陷","explain":"課本明確指出政府為了減緩地層下陷，鼓勵農民改種用水量較少的高粱並提供補助。(0)、(1)、(3)皆非課本特別提及之補助省水作物。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"為減緩溼地陸化並保護候鳥等生物棲地，政府劃設特別區域以維持土地永續發展，此區域統稱為何者？","options":["工業觀光園區","高爾夫球渡假區","自然保護區或自然保留區","商業徒步街"],"answer":2,"explanation":"課文載明採取對環境影響較低的耕作方式或設置自然保護區/自然保留區，讓土地能永續發展。(0)、(2)、(3)皆非生態保護區域。","concept":"土地永續耕作與自然保護區設置","skill":"概念理解","review":"core-4","evidence":"採取對環境影響較低的耕作方式,或是設置保護區等,讓土地能永續發展。","id":"q7","stem":"為減緩溼地陸化並保護候鳥等生物棲地，政府劃設特別區域以維持土地永續發展，此區域統稱為何者？","theme":"土地永續耕作與自然保護區設置","explain":"課文載明採取對環境影響較低的耕作方式或設置自然保護區/自然保留區，讓土地能永續發展。(0)、(2)、(3)皆非生態保護區域。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"農地過度噴灑農藥以及工廠排放未經處理的廢水，直接對自然環境造成了何種嚴重危害？","options":["汙染環境、水源及農作物並影響生態","造成空氣中含氧量倍增","促使河川魚類體型無限變大","引發高山大範圍降雪"],"answer":0,"explanation":"課文指出過度噴灑農藥與工廠未處理廢水，不僅汙染環境、水源及農作物，也嚴重影響生態。(0)、(2)、(3)敘述皆不符事實。","concept":"農藥廢水汙染與河川生態衝擊","skill":"概念理解","review":"core-5","evidence":"農地過度噴灑農藥,以及工廠未經處理排放的廢水,不僅汙染環境、水源及農作物,也影響了生態。","id":"q8","stem":"農地過度噴灑農藥以及工廠排放未經處理的廢水，直接對自然環境造成了何種嚴重危害？","theme":"農藥廢水汙染與河川生態衝擊","explain":"課文指出過度噴灑農藥與工廠未處理廢水，不僅汙染環境、水源及農作物，也嚴重影響生態。(0)、(2)、(3)敘述皆不符事實。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"聯合國自西元2009年起將每年的哪一天訂為「世界海洋日」，以提醒人類重視海洋資源與改善全球汙染？","options":["9月21日","6月8日","12月25日","4月22日"],"answer":1,"explanation":"課文指出聯合國自西元2009年起，將6月8日訂為「世界海洋日」。(0)、(2)、(3)皆非世界海洋日日期。","concept":"海岸保育行動與世界海洋日","skill":"概念理解","review":"core-8","evidence":"聯合國自西元2009年起,將6月8日訂為「世界海洋日」。","id":"q9","stem":"聯合國自西元2009年起將每年的哪一天訂為「世界海洋日」，以提醒人類重視海洋資源與改善全球汙染？","theme":"海岸保育行動與世界海洋日","explain":"課文指出聯合國自西元2009年起，將6月8日訂為「世界海洋日」。(0)、(2)、(3)皆非世界海洋日日期。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"臺北市海洋教育資源中心設於關渡國小，其成立的主要推廣目的為何？","options":["訓練學生大量捕捉保育類候鳥","指導學生興建海岸水泥大樓","培養學生開採深海石油的技術","提升學生對海洋的認識與保護觀念"],"answer":3,"explanation":"課文指出臺北市海洋教育資源中心設置於關渡國小，以教育推廣方式提升學生對海洋的認識與保護觀念。(0)、(2)、(3)均背離海洋教育宗旨。","concept":"海洋教育推廣與環境保護觀念","skill":"概念理解","review":"core-9","evidence":"臺北市海洋教育資源中心設置於關渡國小,以教育推廣的方式,提升學生對海洋的認識與保護的觀念。","id":"q10","stem":"臺北市海洋教育資源中心設於關渡國小，其成立的主要推廣目的為何？","theme":"海洋教育推廣與環境保護觀念","explain":"課文指出臺北市海洋教育資源中心設置於關渡國小，以教育推廣方式提升學生對海洋的認識與保護觀念。(0)、(2)、(3)均背離海洋教育宗旨。","reviewText":"核心 9","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 山林知識與水土保持","title":"山林知識與水土保持","bullets":["早期原住民族學習祖先傳遞的山林知識，無論是農耕或是狩獵，都與環境共生。","近年來由於人們不當開發山坡地，影響當地的水土保持，造成水土流失。","若遇上強降雨或地震時，更容易引發山崩和土石流，造成生命與財產損失。","開墾山坡地應避免不當開發，並做好水土保持以維持土地的永續發展。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 南投廬山溫泉區開發與遷建","title":"南投廬山溫泉區開發與遷建","bullets":["南投縣廬山溫泉區水質好，當地塔羅灣溪兩側的溫泉飯店林立。","民國97年辛樂克颱風襲臺，塔羅灣溪暴漲重創廬山溫泉區，飯店倒塌在河床上。","經調查後發現近年廬山仍有地層滑動的現象。","南投縣政府規劃保育土地永續發展計畫，輔導當地業者遷移至鄰近的埔里福興農場重建。"]},{"id":"core-3","type":"core","tag":"C 過度抽取地下水與地層下陷","title":"過度抽取地下水與地層下陷","bullets":["人們開發土地是為了追求更好的生活，但過度重視經濟利益或缺乏整體規劃會引發問題。","臺灣西南沿海部分地區為了灌溉農作物或發展養殖漁業而過度抽取地下水。","過度抽取地下水容易導致嚴重的地層下陷問題。","政府為了減緩地層下陷，鼓勵民眾改種用水量較少的高粱，還能獲得補助。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 土地永續耕作與自然保護區設置","title":"土地永續耕作與自然保護區設置","bullets":["在滿足現在人們對土地利用的需求時，應採取積極的做法讓土地能永續發展。","種植作物時，採取對環境影響較低的耕作方式（如有機耕作、不使用農藥）。","設置自然保護區或自然保留區，例如為減緩溼地陸化將候鳥棲息溼地劃為保留區。","兼顧經濟開發與生態保育，避免為了短期效益而造成不可逆的環境破壞。"]},{"id":"core-5","type":"core","tag":"E 農藥廢水汙染與河川生態衝擊","title":"農藥廢水汙染與河川生態衝擊","bullets":["工業化與都市化改變環境，但也引發了嚴重的環境問題。","農地過度噴灑農藥，以及工廠未經處理排放的廢水，不僅汙染環境、水源及農作物，也影響了生態。","水源與農作物遭受汙染，連帶嚴重影響了河川及海洋的生物棲地與生態。","應共同重視河川保育工作，守護溪流環境，讓生物棲地復育。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 高雄愛河的歷史變遷與整治","title":"高雄愛河的歷史變遷與整治","bullets":["100多年前日本人將高雄愛河拓寬並在岸邊裝設路燈、設置公園，打造具有交通運輸及休憩功能的城市景觀。","隨著都市發展、人口增加及工廠林立，地下汙水道尚未普及，工廠及家庭廢水排入愛河造成嚴重汙染。","政府投入經費興建汙水下水道工程，解決廢水直接排放問題。","改造河畔景觀並打造成親水環境，讓愛河再度成為高雄市的熱門景點之一。"]},{"id":"core-7","type":"core","tag":"G 海岸地區面臨的環境破壞與威脅","title":"海岸地區面臨的環境破壞與威脅","bullets":["臺灣四面環海，但部分海岸地區正面臨許多環境破壞與挑戰。","隨意丟棄廢棄物導致海岸垃圾汙染嚴重。","海岸人工化及過度開發等，都可能對沿海的天然資源與生態環境造成難以復原的破壞。","破壞沿海天然棲地會影響海洋生物生存與觀光資源永續。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 海岸保育行動與世界海洋日","title":"海岸保育行動與世界海洋日","bullets":["聯合國自西元2009年起將6月8日訂為世界海洋日，向人類賴以生存的海洋致敬。","世界海洋日希望讓人們了解海洋蘊含的豐富價值，並改善全球性汙染和魚類資源過度消耗問題。","民眾可配合政府推動海岸整體管理與永續規劃，並自發性參與淨灘活動。","日常生活落實減塑行動（如自備環保杯、不亂丟垃圾、資源回收），珍惜海岸資源。"]},{"id":"core-9","type":"core","tag":"I 海洋教育推廣與環境保護觀念","title":"海洋教育推廣與環境保護觀念","bullets":["保護海洋與海岸資源需要從教育紮根與全民參與。","臺北市海洋教育資源中心設置於關渡國小。","以教育推廣的方式，提升學生對海洋的認識與保護觀念。","讓下一代從小建立永續發展與愛護海洋環境的意識與行動。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"山坡地開發時只要興建大量鋼筋水泥建物，就能徹底避免強降雨引發的山崩與土石流。","right":"不當開發山坡地與破壞植被會嚴重破壞水土保持，遇到強降雨或地震時反而更易引發山崩和土石流。 鋼筋水泥無法替代水土保持，過度不當開發會大幅增加土石流風險。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"南投縣政府處理辛樂克颱風受創的廬山溫泉區時，決定在原址塔羅灣溪兩側原地重建更大型的溫泉飯店。","right":"經調查發現廬山仍有地層滑動現象，南投縣政府規劃永續計畫並輔導當地業者遷移至埔里福興農場重建。 因地層滑動風險高，政府係輔導業者「遷移」至埔里福興農場重建，非原址重建。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"西南沿海地區過度抽取地下水主要會造成火山爆發與河流乾涸，對地層結構沒有影響。","right":"養殖漁業或農業過度抽取地下水會導致嚴重的「地層下陷」，對土地造成難以逆轉的破壞。 超抽地下水的核心災害是地層下陷，非火山爆發。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"農地過度噴灑農藥只會留在蔬菜表面，完全不會滲入土壤或造成河川水源與生態汙染。","right":"過度噴灑農藥與未經處理的工廠廢水會滲透汙染土壤、河川水源及農作物，嚴重破壞生態環境。 農藥與廢水會隨水循環汙染河川、土壤及生物棲地。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"高雄愛河自古以來就是嚴重汙染的臭水溝，從未具備任何交通運輸或公園休憩功能。","right":"100多年前日本人即將愛河拓寬並設路燈公園作為交通與休憩景觀，後來因都市化廢水未處理才造成嚴重汙染。 愛河早期曾具交通與公園休憩功能，後因工廠與家庭廢水未處理排入才汙染，經興建汙水下水道後成功整治。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"平常用來擦嘴巴的餐巾紙或衛生紙屬於可分解材質，因此淨灘或在海岸遊玩時可以隨便丟棄。","right":"所有垃圾都應該妥善棄置與回收，隨意丟棄廢棄物都會對海岸與海洋生態造成難以復原的破壞。 即便可分解垃圾也不應隨意丟棄，海洋保育需從日常減塑與妥善處理垃圾做起。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"山坡地開發與水土保持｜知識關係","chain":["早期原住民族傳承山林知識與環境共生，近年人們不當開發山坡地破壞水土保持","強降雨與地震引發南投塔羅灣溪山崩土石流，辛樂克颱風重創廬山溫泉區且有地層滑動","南投縣政府輔導業者遷移至埔里福興農場重建，落實土地永續發展與風險避讓"]},{"id":"logic-2","type":"chain","title":"地下水抽取與地層下陷治理｜知識關係","chain":["西南沿海因發展養殖漁業或農作灌溉過度抽取地下水","地層下陷造成土地永久性破壞與海岸低窪地區淹水危機","政府獎勵改種省水作物高粱並提供補助，兼顧農民收益與減緩地層下陷"]},{"id":"logic-3","type":"chain","title":"河川保育與愛河整治歷程｜知識關係","chain":["百年前愛河具交通與公園休憩功能，後因人口工廠增加及污水管未普及致嚴重汙染","農藥與工廠廢水未經處理排放，同時汙染水源、農作物與河川生態棲地","政府投入經費興建汙水下水道工程並打造親水景觀，成功讓愛河重現新風貌"]},{"id":"logic-4","type":"chain","title":"海岸保護與永續海洋行動｜知識關係","chain":["海岸面臨廢棄物汙染、海岸人工化及過度開發等難以復原的破壞","聯合國訂定6月8日世界海洋日，關渡國小設立臺北市海洋教育資源中心推廣教育","民眾自發參與淨灘活動，並在日常落實減塑、自備環保杯與資源回收"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣土地開發問題與永續應對策略對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜高雄愛河歷史變遷與整治流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["山坡地不當開發","山坡地水土保持","山坡地不當開發是指砍伐樹木、過度興建建物破壞原生地貌，遇到強降雨或地震易引發山崩土石流；山坡地水土保持是指透過種植植被、限制開發規模與順應自然環境，以維持土地永續發展與居住安全。"],["過度抽取地下水","推廣改種高粱","過度抽取地下水是沿海養殖或農業過度耗用地下水資源，導致地層下陷的環境破壞行為；推廣改種高粱是政府為減緩地層下陷所推行的省水替代作法，提供補助鼓勵農民節約用水。"],["淨灘行動","日常減塑","淨灘行動是民眾自發性前往海岸清除已經產生的垃圾與廢棄物，屬於「末端清理」的海岸保護措施；日常減塑是民眾在生活中自備環保杯、減少使用一次性塑膠製品，屬於「源頭減量」的海洋保育行動。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","與環境共生","早期原住民族傳承祖先山林知識所採行的生活原則，無論農耕或狩獵皆順應自然，不進行破壞性開墾。"],["2","土石流","山坡地不當開發破壞水土保持後，遇到強降雨或地震時，泥沙土石與水混合快速滾落所引發的嚴重自然災害。"],["3","埔里福興農場","南投縣政府為因應廬山溫泉區辛樂克颱風受創及地層滑動風險，所規劃輔導當地溫泉業者遷移重建的預定地點。"],["4","地層下陷","沿海地區為了發展養殖漁業或農作灌溉而過度抽取地下水，導致地層結構受損下沉的土地災害。"],["5","高粱","一種用水量較少的農作物，政府為減緩西南沿海超抽地下水造成地層下陷，鼓勵並補助農民改種此作物。"],["6","自然保留區","政府為保護特殊自然生態、減緩溼地陸化或維持候鳥棲地而劃設的土地保護區域，以達到土地永續發展。"],["7","汙水下水道","政府為解決河川汙染所興建的公共工程，用來收集並處理家庭與工廠廢水，避免污水直接排放入河川（如高雄愛河整治）。"],["8","海岸人工化","在海岸線過度興建人工水泥設施或進行不當開發，破壞沿海天然地形與生物棲地的現象。"],["9","世界海洋日","聯合國自西元2009年起將每年6月8日訂立的紀念日，旨在提醒全球重視海洋價值、改善海洋汙染及魚類過度消耗問題。"],["10","關渡國小","臺北市海洋教育資源中心設於此學校，透過教育推廣活動提升學生對海洋生態的認識與保護觀念。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"山林知識與水土保持","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「山坡地不當開發」與「做好水土保持」對山林環境產生的不同結果，下列敘述何者完全正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜證據判讀","clue":"南投廬山溫泉區開發與遷建","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"南投廬山溫泉區經歷辛樂克颱風重創後，政府最終決定輔導業者「遷移至埔里福興農場重建」的最關鍵地質證據為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"過度抽取地下水與地層下陷","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"臺灣西南沿海地區過度抽取地下水，對當地環境土地造成了難以逆轉的嚴重影響，其直接因果關係鏈為下列何者？"}]}],"cloze":{"core-1":{"selector":".point","terms":["與環境共生"]},"core-2":{"selector":".point","terms":["埔里福興農場"]},"core-3":{"selector":".point","terms":["地層下陷"]},"core-4":{"selector":".point","terms":["自然保留區"]},"core-5":{"selector":".point","terms":["河川保育"]},"core-6":{"selector":".point","terms":["汙水下水道"]},"core-7":{"selector":".point","terms":["海岸人工化"]},"core-8":{"selector":".point","terms":["世界海洋日"]},"core-9":{"selector":".point","terms":["關渡國小"]},"mindmap-overview":{"selector":".mind-branch p","terms":["埔里福興農場","高粱","汙水下水道","世界海洋日"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":["埔里福興農場"]},"trap-3":{"selector":".correct","terms":["地層下陷"]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["與環境共生","土石流","埔里福興農場","地層下陷","高粱","自然保留區","汙水下水道","海岸人工化","世界海洋日","關渡國小"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>山坡地開發與水土保持\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>早期原住民族傳承山林知識與環境共生，近年人們不當開發山坡地破壞水土保持\u003c/p>\u003cp>\u003cb>關係：\u003c/b>強降雨與地震引發南投塔羅灣溪山崩土石流，辛樂克颱風重創廬山溫泉區且有地層滑動\u003c/p>\u003cp>\u003cb>結果：\u003c/b>南投縣政府輔導業者遷移至埔里福興農場重建，落實土地永續發展與風險避讓\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>地下水抽取與地層下陷治理\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>西南沿海因發展養殖漁業或農作灌溉過度抽取地下水\u003c/p>\u003cp>\u003cb>關係：\u003c/b>地層下陷造成土地永久性破壞與海岸低窪地區淹水危機\u003c/p>\u003cp>\u003cb>結果：\u003c/b>政府獎勵改種省水作物高粱並提供補助，兼顧農民收益與減緩地層下陷\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>河川保育與愛河整治歷程\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>百年前愛河具交通與公園休憩功能，後因人口工廠增加及污水管未普及致嚴重汙染\u003c/p>\u003cp>\u003cb>關係：\u003c/b>農藥與工廠廢水未經處理排放，同時汙染水源、農作物與河川生態棲地\u003c/p>\u003cp>\u003cb>結果：\u003c/b>政府投入經費興建汙水下水道工程並打造親水景觀，成功讓愛河重現新風貌\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>海岸保護與永續海洋行動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>海岸面臨廢棄物汙染、海岸人工化及過度開發等難以復原的破壞\u003c/p>\u003cp>\u003cb>關係：\u003c/b>聯合國訂定6月8日世界海洋日，關渡國小設立臺北市海洋教育資源中心推廣教育\u003c/p>\u003cp>\u003cb>結果：\u003c/b>民眾自發參與淨灘活動，並在日常落實減塑、自備環保杯與資源回收\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>土地開發與環境保護該如何抉擇？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">開發環境類型\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">不當開發引發之環境危機\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">永續發展應對策略與實例\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>開發環境類型\u003c/th>\u003cth>不當開發引發之環境危機\u003c/th>\u003cth>永續發展應對策略與實例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>山坡地開發\u003c/td>\u003ctd>不當開發破壞植被水土流失；強降雨地震致土石流（如辛樂克重創廬山溫泉）\u003c/td>\u003ctd>避開地層滑動區，輔導業者遷移至安全地點（如埔里福興農場）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>平原與沿海地下水\u003c/td>\u003ctd>養殖漁業與灌溉過度抽取地下水，引發地層下陷與地質危機\u003c/td>\u003ctd>管理水資源，政府鼓勵補助改種用水量較少之省水作物（如高粱）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>河川與溪流環境\u003c/td>\u003ctd>農藥過量、工廠與家庭廢水直接排放，汙染水源、農作物與生態棲地\u003c/td>\u003ctd>推動河川保育，興建汙水下水道工程與整治親水環境（如高雄愛河）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>海岸與海洋生態\u003c/td>\u003ctd>隨意棄置廢棄物、海岸人工化與過度開發破壞天然資源與生態\u003c/td>\u003ctd>推動海岸整體管理，劃設自然保護區、參與淨灘與日常減塑行動\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>橫向比較山坡地、平原沿海、河川溪流與海岸海洋四種環境類型面臨的開發危機與永續策略。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論興建水泥堤防即可完全取代水土保持，亦不能推論地層下陷可藉由灌入海水恢復原狀。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，南投廬山溫泉區與高雄愛河在「環境危機原因」與「永續應對策略」上有何主要差異？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>廬山溫泉區危機為山坡地開發與地層滑動風險，策略為「輔導遷移至埔里福興農場」；愛河危機為家庭與工廠廢水汙染，策略為「興建汙水下水道與親水整治」。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">歷史時期與階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">環境特徵與土地利用\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">重要事件與治理措施\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>歷史時期與階段\u003c/th>\u003cth>環境特徵與土地利用\u003c/th>\u003cth>重要事件與治理措施\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日治時期（100多年前）\u003c/td>\u003ctd>具有交通運輸及公園休憩功能之城市景觀\u003c/td>\u003ctd>日本人拓寬河道、裝設岸邊路燈並設置公園\u003c/td>\u003c/tr>\u003ctr>\u003ctd>都市化與工業化時期\u003c/td>\u003ctd>人口暴增、工廠林立，地下汙水道尚未普及\u003c/td>\u003ctd>家庭與工廠未經處理之廢水排入愛河，造成嚴重汙染\u003c/td>\u003c/tr>\u003ctr>\u003ctd>政府整治時期\u003c/td>\u003ctd>推動河川保育，解決廢水直接排放問題\u003c/td>\u003ctd>政府投入經費興建汙水下水道工程，攔截汙水\u003c/td>\u003c/tr>\u003ctr>\u003ctd>現今轉型時期\u003c/td>\u003ctd>河畔景觀改造，轉型為親水環境與熱門景點\u003c/td>\u003ctd>恢復生態與休憩價值，成為兼具景觀與觀光的亮點\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間先後順序（日治時期 -&gt; 都市化時期 -&gt; 整治時期 -&gt; 現今轉型），閱讀愛河的環境變遷與治理歷程。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論愛河從日治時期開始就一直是廢水充斥的臭水溝，亦不能推論僅靠美化河岸景觀即可完全解決水質汙染。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，愛河從「嚴重汙染」轉變為「親水熱門景點」的最關鍵工程措施為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>最關鍵工程措施為「興建汙水下水道工程」，阻絕未經處理的家庭與工廠廢水排入河中。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\"   if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

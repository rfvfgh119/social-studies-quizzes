t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林6上3-2 能源科技如何兼顧用電與環保？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-2","title":"能源科技如何兼顧用電與環保？"},"questions":[{"question":"觀察臺灣歷年總發電量折線圖，統計數量自民國幾年開始大幅增加，且該年份與哪一重大經濟事件直接相關？","options":["民國89年：太陽能模組全面裝設","民國69年：新竹科學園區成立","民國109年：火力發電廠全面停運","民國39年：工業化全面啟動"],"answer":1,"explanation":"課本折線圖顯示臺灣發電量自民國69年開始大幅增加，主因是新竹科學園區成立，高科技產業發達帶動經濟快速成長與龐大用電需求。","concept":"臺灣用電需求與歷史成長","skill":"概念理解","review":"core-1","evidence":"民國69年新竹科學園區成立，高科技產業發達帶動經濟快速成長，產品製造過程需消耗大量電力，導致發電量大幅增加。","id":"q1","stem":"觀察臺灣歷年總發電量折線圖，統計數量自民國幾年開始大幅增加，且該年份與哪一重大經濟事件直接相關？","theme":"臺灣用電需求與歷史成長","explain":"課本折線圖顯示臺灣發電量自民國69年開始大幅增加，主因是新竹科學園區成立，高科技產業發達帶動經濟快速成長與龐大用電需求。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"根據經濟部能源署民國113年的統計資料，臺灣用電需求占比最高的部門為何？","options":["工業部門","農業部門","服務業部門","住宅部門"],"answer":0,"explanation":"根據課本圓形圖資料，工業部門用電比例高達55.2%，超過全臺用電量的一半，為用電需求最高的部門。","concept":"部門用電比例與工業用電","skill":"概念理解","review":"core-2","evidence":"工業部門使用最多(55.2%)，因為工廠生產過程中需耗費大量電力來製造產品。","id":"q2","stem":"根據經濟部能源署民國113年的統計資料，臺灣用電需求占比最高的部門為何？","theme":"部門用電比例與工業用電","explain":"根據課本圓形圖資料，工業部門用電比例高達55.2%，超過全臺用電量的一半，為用電需求最高的部門。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"關於興建發電廠與能源政策的爭議，下列敘述何者最適當？","options":["能源政策涉及全民溝通與價值取捨，屬於重要的社會議題","主張興建電廠者主要希望降低環境汙染與破壞","興建電廠只是工程技術問題，不需要全民參與溝通","主張減少電廠者主要擔心電力不足衝擊經濟"],"answer":0,"explanation":"課本指出能源政策並非單純的技術問題，而是需要全民溝通與價值取捨的社會議題。主張減少電廠者係希望降低汙染；主張興建者係擔心電力不足影響經濟。","concept":"興建電廠爭議與社會溝通","skill":"概念理解","review":"core-3","evidence":"反映出能源政策並非單純的技術問題，更是需要全民溝通與價值取捨的社會議題。","id":"q3","stem":"關於興建發電廠與能源政策的爭議，下列敘述何者最適當？","theme":"興建電廠爭議與社會溝通","explain":"課本指出能源政策並非單純的技術問題，而是需要全民溝通與價值取捨的社會議題。主張減少電廠者係希望降低汙染；主張興建者係擔心電力不足影響經濟。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於火力發電的運作原料與環境負擔，下列敘述何者符合課本事實？","options":["使用太陽能與風力，發電過程完全不排放任何氣體","使用煤、天然氣、石油，燃燒會排放汙染物致空汙與地球暖化","使用水流落差位能，屬於永續不耗竭的再生資源","使用少量鈾燃料即可發電，但有輻射外洩與核廢料問題"],"answer":1,"explanation":"火力發電使用煤、天然氣、石油等化石燃料，燃燒時會排放汙染物造成空氣汙染與地球暖化，且有資源耗竭疑慮。","concept":"火力發電之運作與環境負擔","skill":"概念理解","review":"core-4","evidence":"使用煤、天然氣、石油等能源時，會排放大量汙染物，造成空氣汙染與地球暖化，也有資源耗竭的疑慮。","id":"q4","stem":"關於火力發電的運作原料與環境負擔，下列敘述何者符合課本事實？","theme":"火力發電之運作與環境負擔","explain":"火力發電使用煤、天然氣、石油等化石燃料，燃燒時會排放汙染物造成空氣汙染與地球暖化，且有資源耗竭疑慮。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"關於核能發電的特性與發展挑戰，下列敘述何者正確？","options":["只需少量原料即可提供大量電力，但有核輻射外洩風險與核廢料爭議","設備使用年限屆滿後，可以直接當作一般垃圾傾倒進入大海","屬於天然可循環再生的自然能源，不會面臨任何耗竭風險","運轉時會排放大量二氧化碳，加重地球暖化現象"],"answer":0,"explanation":"課本說明核能優點為少量原料即可提供大量電力，但若電廠受損可能引發核輻射外洩浩劫，且核廢料儲放至今仍存在高度爭議。","concept":"核能發電之優點與安全爭議","skill":"概念理解","review":"core-5","evidence":"核能雖然只需少量原料，就可提供大量電力，但是當核電廠遭到損害時，核輻射如果外洩將造成生態浩劫，且核廢料的儲放至今仍存在爭議。","id":"q5","stem":"關於核能發電的特性與發展挑戰，下列敘述何者正確？","theme":"核能發電之優點與安全爭議","explain":"課本說明核能優點為少量原料即可提供大量電力，但若電廠受損可能引發核輻射外洩浩劫，且核廢料儲放至今仍存在高度爭議。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"政府為了減少能源科技帶來的環境汙染，主要採取了哪些管理與推動措施？","options":["強制規定所有住宅部門每天只能在夜間使用電力","針對發電廠進行稽查、規範能源研究使用並鼓勵推動能源轉型","全面禁止工廠運作並關閉所有商業服務場所","將所有傳統火力發電廠一夜之間全部拆除"],"answer":1,"explanation":"課本指出政府針對各能源發電廠進行不定期稽查，規範能源的研究與使用，並鼓勵推動能源轉型發展再生能源。","concept":"政府行動與能源轉型推動","skill":"概念理解","review":"core-6","evidence":"政府針對各能源發電廠進行稽查，規範能源的研究與使用，並鼓勵推動能源轉型。","id":"q6","stem":"政府為了減少能源科技帶來的環境汙染，主要採取了哪些管理與推動措施？","theme":"政府行動與能源轉型推動","explain":"課本指出政府針對各能源發電廠進行不定期稽查，規範能源的研究與使用，並鼓勵推動能源轉型發展再生能源。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"臺灣具備發展太陽能發電的何種優良自然條件？常見的公共設施設置地點包含下列何者？","options":["全臺地形平坦無山坡地；常見安裝於地底鐵路隧道內","日照充足；常見安裝於學校風雨球場與公車站牌","年降雨量全球最高；常見安裝於深海海底平原","東北季風非常強勁；常見安裝於高山密林樹冠頂部"],"answer":1,"explanation":"臺灣日照充足適合發展太陽能發電，發電過程不產生廢氣；常見公共設施安裝地點包含學校風雨球場、公車站牌等。","concept":"太陽能發電之條件、設置與挑戰","skill":"概念理解","review":"core-7","evidence":"臺灣的日照充足，適合發展太陽能發電……許多公共設施在建設時會設置太陽能板，例如：學校的風雨球場、公車站的站牌等。","id":"q7","stem":"臺灣具備發展太陽能發電的何種優良自然條件？常見的公共設施設置地點包含下列何者？","theme":"太陽能發電之條件、設置與挑戰","explain":"臺灣日照充足適合發展太陽能發電，發電過程不產生廢氣；常見公共設施安裝地點包含學校風雨球場、公車站牌等。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"政府選擇在臺灣西部沿海設置大量白色風力發電機的主要原因為何？","options":["西部沿海風力穩定適合風力發電","西部沿海地勢起伏最大適合水流落差發電","西部沿海日照時間為全臺灣最長","西部沿海鄰近地熱溫泉露頭資源豐富"],"answer":0,"explanation":"課本與單元卷明確說明，臺灣西部沿海風力穩定，適合發展風力發電。","concept":"風力發電之地區優勢與環境衝擊","skill":"概念理解","review":"core-8","evidence":"臺灣西部沿海風力穩定，適合發展風力發電。","id":"q8","stem":"政府選擇在臺灣西部沿海設置大量白色風力發電機的主要原因為何？","theme":"風力發電之地區優勢與環境衝擊","explain":"課本與單元卷明確說明，臺灣西部沿海風力穩定，適合發展風力發電。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"下列何者屬於民眾在日常生活中落實節能減碳的具體做法？","options":["將冷氣溫度設定為16℃並開啟強風運轉","為了省電，直接關閉醫療院所的所有急救設備","選用節能產品，並養成隨手關燈的習慣","將教室所有燈具更換為耗電量較高的傳統白熾燈泡"],"answer":2,"explanation":"課本與教專指出選用節能產品（如LED燈泡）並養成隨手關燈、冷氣設定28℃搭配電風扇等習慣，能落實節能減碳。","concept":"個人與學校之日常生活節能實踐","skill":"概念理解","review":"core-9","evidence":"在日常生活中，我們可以選用節能產品，並養成節約能源的習慣。","id":"q9","stem":"下列何者屬於民眾在日常生活中落實節能減碳的具體做法？","theme":"個人與學校之日常生活節能實踐","explain":"課本與教專指出選用節能產品（如LED燈泡）並養成隨手關燈、冷氣設定28℃搭配電風扇等習慣，能落實節能減碳。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"根據課本列舉的例子，下列哪一組能源屬於政府鼓勵推動的「再生能源」？","options":["天然氣、核能、煤","太陽能、風力、水力","核能、煤、石油","煤、天然氣、石油"],"answer":1,"explanation":"課本P.67明確列出再生能源例如：太陽能、風力、水力等，相較傳統能源對環境產生的汙染較少。","concept":"政府行動與能源轉型推動","skill":"概念理解","review":"core-6","evidence":"鼓勵推動能源轉型。例如：太陽能、風力、水力等，雖然部分再生能源在發電時，仍有需要克服的技術，但相較傳統能源，對環境產生的汙染較少。","id":"q10","stem":"根據課本列舉的例子，下列哪一組能源屬於政府鼓勵推動的「再生能源」？","theme":"政府行動與能源轉型推動","explain":"課本P.67明確列出再生能源例如：太陽能、風力、水力等，相較傳統能源對環境產生的汙染較少。","reviewText":"核心 6","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 臺灣用電需求與歷史成長","title":"臺灣用電需求與歷史成長","bullets":["隨著經濟發展與生活便利，臺灣的用電量呈現逐年攀升的趨勢。","民國69年新竹科學園區成立後，高科技產業發達帶動經濟成長，晶圓製造等產品生產需消耗大量電力。","總發電量折線圖顯示發電數量從民國69年開始大幅增加，展現經濟發展對能源供應的龐大依賴。","若發生突然停電或電力不足，會造成冰箱停止運作致食物腐壞，並影響醫療救護儀器運作。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 部門用電比例與工業用電","title":"部門用電比例與工業用電","bullets":["根據經濟部能源署民國113年資料，臺灣各部門用電需求以工業部門占比最高。","工業部門用電占比達55.2%，超過全臺用電量的一半，主因工廠生產製造需耗費大量電力。","住宅部門占18.8%、服務業占17.6%，顯示除了產業生產，日常生活與商業活動也消耗電力。","當電力供應不足而實施限電措施時，不僅影響工廠運作，也會造成商家營業與民眾生活不便。"]},{"id":"core-3","type":"core","tag":"C 興建電廠爭議與社會溝通","title":"興建電廠爭議與社會溝通","bullets":["社會對於是否持續興建更多發電廠存在不同立場與價值取捨。","支持減少興建者希望降低對環境的汙染與破壞；支持持續興建者擔憂電力不足影響經濟成長與民生用電。","民眾針對工業電價凍漲或能源政策走上街頭表達立場，顯示能源問題不只是技術問題。","能源政策是需要全民充分溝通、理性評估與共同承擔責任的社會議題。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 火力發電之運作與環境負擔","title":"火力發電之運作與環境負擔","bullets":["火力發電使用煤、天然氣與石油等化石燃料作為發電原料。","燃燒過程會排放大量汙染物，造成空氣汙染與氣溫上升的地球暖化現象。","化石燃料屬於無法再生的資源，長期大量開採與使用存在資源耗竭的疑慮。","民國113年台灣電力公司統計中，火力發電占整體電力來源達82%，為現階段供電主力。"]},{"id":"core-5","type":"core","tag":"E 核能發電之優點與安全爭議","title":"核能發電之優點與安全爭議","bullets":["核能發電的優點在於只需使用少量原料，即可提供大量的電力。","核電廠若遭到損害而引發核輻射外洩，將對周邊生態環境造成嚴重浩劫。","核能發電產生的核廢料具備放射性，其貯存與最終處置問題至今仍存在高度爭議。","民國113年數據顯示核能發電占比約為5%，在使用時必須嚴格注意核能安全管理。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 政府行動與能源轉型推動","title":"政府行動與能源轉型推動","bullets":["政府針對各發電廠進行不定期稽查，加強空氣汙染與環境安全管理。","政府訂定法規規範能源的研究與使用，並積極鼓勵推動能源轉型。","能源轉型係指推動太陽能、風力、水力等再生能源，以減少對傳統化石燃料的依賴與汙染。","民國113年再生能源發電占比為12%，政府目標為持續提升再生能源比重。"]},{"id":"core-7","type":"core","tag":"G 太陽能發電之條件、設置與挑戰","title":"太陽能發電之條件、設置與挑戰","bullets":["臺灣具備日照充足的自然條件，非常適合發展太陽能光電。","太陽能發電利用陽光運轉，發電過程完全不會排放廢氣或造成空氣汙染。","常見設置地點包含學校風雨球場、公車站牌、農田、魚塭、水圳與山坡地等。","設置太陽能板可能破壞山坡地自然景觀與生態，且使用年限屆滿後面臨回收處理問題。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 風力發電之地區優勢與環境衝擊","title":"風力發電之地區優勢與環境衝擊","bullets":["臺灣西部沿海具備穩定的風力資源，適合興建風力發電機組。","風力發電運轉時不需燃燒燃料，因此不會排放廢氣造成空氣汙染。","巨大的風力發電機可能影響鳥類生存與候鳥遷徙路徑，造成生態衝擊。","風機運轉時產生的低頻噪音會干擾社區居民生活，影響睡眠與健康。"]},{"id":"core-9","type":"core","tag":"I 個人與學校之日常生活節能實踐","title":"個人與學校之日常生活節能實踐","bullets":["民眾在日常生活中選用節能產品並養成省電習慣，能協助改善發電帶來的環境負擔。","學校推動節能範例包含將教室燈具改換為高效率的LED省電燈泡。","家庭與個人節能做法包含隨手關燈、冷氣設定28℃並搭配電風扇使用。","透過個人生活中的節能減碳行動，能在享受便利的同時，共同為環境永續盡心力。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"隨著經濟發展與科技進步，臺灣的用電量呈現逐年下降的趨勢。","right":"隨著經濟發展與高科技產業發達，臺灣的用電量呈現逐年攀升的趨勢。 生活便利與工廠高科技產品製造都需要大量電力，因此總發電量與用電量長期均顯著增加而非下降。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"當電力供應不足採取限電措施時，只會影響工廠生產，不會影響民眾生活。","right":"限制用電不僅會影響工廠生產，也會對商家營業活動與民眾日常生活造成不便。 電網涵蓋工業、住宅與服務業，停電或限電會使家用冰箱停轉、店家無法營業，甚至影響醫療設備運作。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"石油與天然氣屬於再生能源，源源不絕且可以一直使用不會耗盡。","right":"石油、煤與天然氣屬於化石燃料，資源有限且無法再生，長期大量使用有資源耗竭的疑慮。 化石燃料生成需要地質漫長時間，不屬於太陽能、風力或水力這種可循環更新的再生能源。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"太陽能與風力發電在運轉時不排放廢氣，因此對自然環境完全沒有任何負面影響。","right":"再生能源雖不排廢氣，但太陽能板可能破壞山坡景觀與面臨廢板回收問題，風機則有候鳥鳥擊與噪音干擾。 綠能發展仍需考慮選址生態、棲地破壞、低頻噪音與退役廢棄物回收等生命週期環境挑戰。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"核能發電完全不會產生任何環境風險或安全問題，是絕對完美的能源。","right":"核能發電雖原料少電力大且運轉不排碳，但存在核輻射外洩風險與核廢料貯存爭議。 核電廠若遭受災害損傷可能引發輻射浩劫，高放射性核廢料的處置至今在社會上仍具高度爭議。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"一般民眾在日常生活中的隨手關燈與節能行為，無法對改善發電環境問題產生實質幫助。","right":"民眾透過選用節能家電與養成節電習慣，能降低總電力需求，減輕發電帶來的環境負擔。 需求端的節能減碳與供應端的能源轉型同樣重要，個人省電能減少電廠發電壓力與汙染排放。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"經濟發展與用電挑戰｜知識關係","chain":["用電需求逐年攀升","民國69年新竹科學園區成立帶動總發電量大增","工業部門用電占比高達55.2%居各部門之冠","供電不足將衝擊經濟成長、商家營業與醫療生活"]},{"id":"logic-2","type":"chain","title":"傳統能源與核能困境｜知識關係","chain":["火力發電占比82%為主要電力來源","煤與天然氣燃燒排放汙染物致空汙與地球暖化","化石燃料無法再生且面臨資源耗竭疑慮","核能發電電力大但存在輻射外洩風險與核廢料爭議"]},{"id":"logic-3","type":"chain","title":"再生能源發展與挑戰｜知識關係","chain":["政府推動能源轉型發展太陽能、風力與水力","太陽能利用充足日照且不排廢氣但面臨山坡景觀破壞與廢板回收問題","風力利用西部沿海穩定風場但存在候鳥鳥擊與低頻噪音干擾","發展綠能仍需妥善評估生態衝擊與社區生活品質"]},{"id":"logic-4","type":"chain","title":"政府管理與全民永續行動｜知識關係","chain":["政府不定期稽查發電廠排放並規範能源使用","學校推動教室更換高效率LED省電燈泡","家庭落實隨手關燈與冷氣設定28度搭配電風扇","全民透過社會溝通與生活節能共同承擔環境永續責任"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣電力需求結構與發電演變判讀圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜主要發電方式優缺點與環境影響比較圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["火力發電","再生能源發電（太陽能、風力）","火力發電使用煤、石油、天然氣等會耗竭的化石燃料，燃燒會排放空氣汙染物與二氧化碳；太陽能與風力發電利用可循環再生的自然資源，運轉過程不會排放廢氣。"],["火力發電","核能發電","火力發電需大量燃燒化石燃料並排放大量空汙與溫室氣體；核能發電只需少量燃料即可產生大電力且運轉不排廢氣，但面臨核輻射外洩風險與高放射性核廢料貯存爭議。"],["太陽能發電環境挑戰","風力發電環境挑戰","太陽能發電主要挑戰為山坡地設置破壞自然景觀、影響農地耕種及廢光電模組回收；風力發電主要挑戰為巨大風機干擾候鳥遷徙生存及運轉低頻噪音干擾居民睡眠健康。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","工業部門用電","指工廠與高科技產業在產品製造生產過程中所消耗的電力，占全臺總用電比例達55.2%，為用電量最多的部門。"],["2","新竹科學園區","成立於民國69年，帶動臺灣高科技產業快速發展，其晶圓製程等生產需要龐大電力，使臺灣總發電量自該年起大幅攀升。"],["3","火力發電","使用煤、天然氣、石油等化石燃料燃燒發電的方式，為臺灣目前最主要的供電來源（占82%），但會產生空氣汙染與地球暖化問題。"],["4","核能發電","利用核燃料進行發電的方式，優點為少量原料即可提供大量電力，但存在核輻射外洩風險與核廢料貯存爭議。"],["5","再生能源","指取自自然界且能循環再生的能源，如太陽能、風力、水力等，相較傳統化石燃料對環境產生的汙染較少。"],["6","太陽能發電","利用充足日照照射太陽能板進行發電，過程不排放廢氣，常見於學校風雨球場、公車站牌等，但需注意設置景觀與板材回收。"],["7","風力發電","利用穩定的風力推動風力發電機旋轉發電，臺灣多設置於風力穩定的西部沿海，運轉不排廢氣但需關注候鳥與低頻噪音影響。"],["8","能源轉型","政府為減少環境汙染與避免資源耗竭，積極推動降低傳統化石燃料比例、提高再生能源發電占比的政策與行動。"],["9","節能減碳","民眾在日常生活中透過選用節能產品（如LED燈泡）、養成省電習慣（隨手關燈、冷氣設28度）以減少能源消耗與碳排放。"],["10","能源政策","國家針對電力供應、發電廠興建、電價調整與環境保護所制定的規劃，需要全民共同溝通與進行價值取捨的社會議題。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"部門用電比例與工業用電","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較課本中「臺灣總發電量折線圖」與「各部門用電比例圓形圖」，兩者的主要判讀重點有何差別？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"火力發電之運作與環境負擔","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"關於傳統「火力發電」與「核能發電」在發電特性與環境影響上的比較，下列敘述何者正確？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"太陽能發電之條件、設置與挑戰","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「太陽能發電」與「風力發電」在設置過程所面臨的環境衝擊，下列敘述何者最符合課本記載？"}]}],"cloze":{"core-1":{"selector":".point","terms":["新竹科學園區成立"]},"core-2":{"selector":".point","terms":["工業部門"]},"core-3":{"selector":".poin 03c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>再生能源發展與挑戰\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>政府推動能源轉型發展太陽能、風力與水力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>太陽能利用充足日照且不排廢氣但面臨山坡景觀破壞與廢板回收問題\u003c/p>\u003cp>\u003cb>結果：\u003c/b>風力利用西部沿海穩定風場但存在候鳥鳥擊與低頻噪音干擾\u003c/p>\u003cp>\u003cb>連結：\u003c/b>發展綠能仍需妥善評估生態衝擊與社區生活品質\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>政府管理與全民永續行動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>政府不定期稽查發電廠排放並規範能源使用\u003c/p>\u003cp>\u003cb>關係：\u003c/b>學校推動教室更換高效率LED省電燈泡\u003c/p>\u003cp>\u003cb>結果：\u003c/b>家庭落實隨手關燈與冷氣設定28度搭配電風扇\u003c/p>\u003cp>\u003cb>連結：\u003c/b>全民透過社會溝通與生活節能共同承擔環境永續責任\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>能源科技如何兼顧用電與環保？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cfigure style=\"margin:8px 0 14px;padding:10px;background:#fffaf1;border:1px solid #ddcfa7;border-radius:14px;break-inside:avoid\">\u003cfigcaption style=\"font-weight:700;font-size:15px;color:#635079\">臺灣各部門用電比例\u003c/figcaption>\u003cdiv style=\"display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap\">\u003csvg width=\"140\" height=\"140\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"工業55.2%，住宅18.8%，服務業17.6%，能源6.5%，農業1.2%，運輸0.7%\" style=\"flex-shrink:0;filter:drop-shadow(0 3px 1px #8b819633)\">\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ad85cd\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"55.2 44.8\" stroke-dashoffset=\"0\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#7ca9d0\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"18.8 81.2\" stroke-dashoffset=\"-55.2\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ecc35c\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"17.6 82.4\" stroke-dashoffset=\"-74\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#e8a091\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"6.5 93.5\" stroke-dashoffset=\"-91.6\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#80b9aa\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"1.2 98.8\" stroke-dashoffset=\"-98.1\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#b4a5c7\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"0.7 99.3\" stroke-dashoffset=\"-99.3\" transform=\"rotate(-90 80 80)\"/>\u003ctext x=\"80\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#61536e\">合計\u003c/text>\u003ctext x=\"80\" y=\"99\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#61536e\">100%\u003c/text>\u003c/svg>\u003cdiv style=\"font-size:13px;min-width:145px\">\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ad85cd;border-radius:4px\">\u003c/span>\u003cspan>工業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">55.2%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#7ca9d0;border-radius:4px\">\u003c/span>\u003cspan>住宅\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">18.8%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ecc35c;border-radius:4px\">\u003c/span>\u003cspan>服務業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">17.6%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#e8a091;border-radius:4px\">\u003c/span>\u003cspan>能源\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">6.5%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#80b9aa;border-radius:4px\">\u003c/span>\u003cspan>農業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">1.2%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#b4a5c7;border-radius:4px\">\u003c/span>\u003cspan>運輸\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">0.7%\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:11px;margin:4px 0 0;color:#756b61\">民國 113 年（西元 2024 年）教材示例資料，非即時統計。\u003c/p>\u003c/figure>\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\" style=\"display:none\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>總發電量歷史趨勢\u003c/td>\u003ctd>民國39年至113年總發電量折線呈長期上升\u003c/td>\u003ctd>反映臺灣經濟成長與生活現代化對電力依賴加深\u003c/td>\u003c/tr>\u003ctr>\u003ctd>關鍵歷史轉折事件\u003c/td>\u003ctd>民國69年總發電量開始大幅急劇攀升\u003c/td>\u003ctd>新竹科學園區成立帶動高科技晶圓製造大量耗電\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大用電需求部門\u003c/td>\u003ctd>工業部門用電占比達55.2%位居第一\u003c/td>\u003ctd>展現高科技與工業產值背後需龐大能源供應支撐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民生與服務用電占比\u003c/td>\u003ctd>住宅部門占18.8%、服務業部門占17.6%\u003c/td>\u003ctd>說明日常生活與商業運作亦為能源消費重要組成\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先看圓形圖的部門、數值與大小，找出最大用電部門；再對照表中的歷史趨勢與民國 69 年轉折，連結產業發展與能源需求。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能僅憑總發電量折線圖上升就推論全臺各年份每戶家庭用電量均等速增加，亦不能把發電量等同於單一部門用電。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據上表與圓形圖資料，民國69年臺灣發電量大幅增加的主因為何？用電比例最高的部門又是哪一個？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>民國69年發電量大幅增加主因是新竹科學園區成立帶動高科技產業發展；用電比例最高的是工業部門（55.2%）。\u003c/p>\u003c/div>","figure-2":"\u003cfigure style=\"margin:8px 0 14px;padding:10px;background:#fffaf1;border:1px solid #ddcfa7;border-radius:14px;break-inside:avoid\">\u003cfigcaption style=\"font-weight:700;font-size:15px;color:#635079\">臺灣發電來源比例\u003c/figcaption>\u003cdiv style=\"display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap\">\u003csvg width=\"140\" height=\"140\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"火力82%，再生能源12%，核能5%，其他1%\" style=\"flex-shrink:0;filter:drop-shadow(0 3px 1px #8b819633)\">\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ad85cd\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"82 18\" stroke-dashoffset=\"0\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#7ca9d0\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"12 88\" stroke-dashoffset=\"-82\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ecc35c\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"5 95\" stroke-dashoffset=\"-94\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#e8a091\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"1 99\" stroke-dashoffset=\"-99\" transform=\"rotate(-90 80 80)\"/>\u003ctext x=\"80\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#61536e\">合計\u003c/text>\u003ctext x=\"80\" y=\"99\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#61536e\">100%\u003c/text>\u003c/svg>\u003cdiv style=\"font-size:13px;min-width:145px\">\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ad85cd;border-radius:4px\">\u003c/span>\u003cspan>火力\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">82%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#7ca9d0;border-radius:4px\">\u003c/span>\u003cspan>再生能源\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">12%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ecc35c;border-radius:4px\">\u003c/span>\u003cspan>核能\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">5%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#e8a091;border-radius:4px\">\u003c/span>\u003cspan>其他\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">1%\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:11px;margin:4px 0 0;color:#756b61\">民國 113 年（西元 2024 年）教材示例資料，非即時統計。\u003c/p>\u003c/figure>\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\" style=\"display:none\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>火力發電（占82%）\u003c/td>\u003ctd>使用煤、天然氣、石油，發電穩定但排放空汙與溫室氣體\u003c/td>\u003ctd>現階段供電主力，但面臨空氣品質惡化與資源耗竭壓力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>核能發電（占5%）\u003c/td>\u003ctd>原料少即可產生大量電力，但有輻射外洩與核廢料爭議\u003c/td>\u003ctd>具備高效供電特性，仍須兼顧安全管理與核廢料長期處置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>太陽能發電（再生）\u003c/td>\u003ctd>利用日照不排廢氣，惟山坡地設置破壞景觀且有回收問題\u003c/td>\u003ctd>綠能轉型主軸之一，但選址需避免生態衝突與處理退役廢板\u003c/td>\u003c/tr>\u003ctr>\u003ctd>風力發電（再生）\u003c/td>\u003ctd>利用西部沿海穩定風力不排廢氣，但干擾候鳥與產生噪音\u003c/td>\u003ctd>善用自然風場，但設置需保持社區距離與保護生物多樣性\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依發電類型分類，橫向對比其發電原料來源、供電優勢以及對生態與社區產生的環境挑戰。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論再生能源（太陽能、風力）因運轉不排廢氣就完全沒有任何生態衝擊或土地開發爭議。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>比較火力發電與太陽能發電在環境影響上的最大差異，以及太陽能發展面臨的獨特挑戰為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>火力發電運轉會排放空汙與二氧化碳；太陽能發電過程不排廢氣，但面臨山坡景觀破壞、生態衝突及太陽能板退役回收的挑戰。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>經濟發展與用電挑戰\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>用電需求逐年攀升\u003c/p>\u003cp>\u003cb>關係：\u003c/b>民國69年新竹科學園區成立帶動總發電量大增\u003c/p>\u003cp>\u003cb>結果：\u003c/b>工業部門用電占比高達55.2%居各部門之冠\u003c/p>\u003cp>\u003cb>連結：\u003c/b>供電不足將衝擊經濟成長、商家營業與醫療生活\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>傳統能源與核能困境\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>火力發電占比82%為主要電力來源\u003c/p>\u003cp>\u003cb>關係：\u003c/b>煤與天然氣燃燒排放汙染物致空汙與地球暖化\u003c/p>\u003cp>\u003cb>結果：\u003c/b>化石燃料無法再生且面臨資源耗竭疑慮\u003c/p>\u003cp>\u003cb>連結：\u003c/b>核能發電電力大但存在輻射外洩風險與核廢料爭議\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>再生能源發展與挑戰\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>政府推動能源轉型發展太陽能、風力與水力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>太陽能利用充足日照且不排廢氣但面臨山坡景觀破壞與廢板回收問題\u003c/p>\u003cp>\u003cb>結果：\u003c/b>風力利用西部沿海穩定風場但存在候鳥鳥擊與低頻噪音干擾\u003c/p>\u003cp>\u003cb>連結：\u003c/b>發展綠能仍需妥善評估生態衝擊與社區生活品質\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>政府管理與全民永續行動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>政府不定期稽查發電廠排放並規範能源使用\u003c/p>\u003cp>\u003cb>關係：\u003c/b>學校推動教室更換高效率LED省電燈泡\u003c/p>\u003cp>\u003cb>結果：\u003c/b>家庭落實隨手關燈與冷氣設定28度搭配電風扇\u003c/p>\u003cp>\u003cb>連結：\u003c/b>全民透過社會溝通與生活節能共同承擔環境永續責任\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>能源科技如何兼顧用電與環保？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cfigure style=\"margin:8px 0 14px;padding:10px;background:#fffaf1;border:1px solid #ddcfa7;border-radius:14px;break-inside:avoid\">\u003cfigcaption style=\"font-weight:700;font-size:15px;color:#635079\">臺灣各部門用電比例\u003c/figcaption>\u003cdiv style=\"display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap\">\u003csvg width=\"140\" height=\"140\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"工業55.2%，住宅18.8%，服務業17.6%，能源6.5%，農業1.2%，運輸0.7%\" style=\"flex-shrink:0;filter:drop-shadow(0 3px 1px #8b819633)\">\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ad85cd\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"55.2 44.8\" stroke-dashoffset=\"0\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#7ca9d0\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"18.8 81.2\" stroke-dashoffset=\"-55.2\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ecc35c\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"17.6 82.4\" stroke-dashoffset=\"-74\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#e8a091\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"6.5 93.5\" stroke-dashoffset=\"-91.6\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#80b9aa\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"1.2 98.8\" stroke-dashoffset=\"-98.1\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#b4a5c7\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"0.7 99.3\" stroke-dashoffset=\"-99.3\" transform=\"rotate(-90 80 80)\"/>\u003ctext x=\"80\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#61536e\">合計\u003c/text>\u003ctext x=\"80\" y=\"99\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#61536e\">100%\u003c/text>\u003c/svg>\u003cdiv style=\"font-size:13px;min-width:145px\">\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ad85cd;border-radius:4px\">\u003c/span>\u003cspan>工業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">55.2%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#7ca9d0;border-radius:4px\">\u003c/span>\u003cspan>住宅\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">18.8%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ecc35c;border-radius:4px\">\u003c/span>\u003cspan>服務業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">17.6%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#e8a091;border-radius:4px\">\u003c/span>\u003cspan>能源\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">6.5%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#80b9aa;border-radius:4px\">\u003c/span>\u003cspan>農業\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">1.2%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#b4a5c7;border-radius:4px\">\u003c/span>\u003cspan>運輸\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">0.7%\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:11px;margin:4px 0 0;color:#756b61\">民國 113 年（西元 2024 年）教材示例資料，非即時統計。\u003c/p>\u003c/figure>\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\" style=\"display:none\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>總發電量歷史趨勢\u003c/td>\u003ctd>民國39年至113年總發電量折線呈長期上升\u003c/td>\u003ctd>反映臺灣經濟成長與生活現代化對電力依賴加深\u003c/td>\u003c/tr>\u003ctr>\u003ctd>關鍵歷史轉折事件\u003c/td>\u003ctd>民國69年總發電量開始大幅急劇攀升\u003c/td>\u003ctd>新竹科學園區成立帶動高科技晶圓製造大量耗電\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大用電需求部門\u003c/td>\u003ctd>工業部門用電占比達55.2%位居第一\u003c/td>\u003ctd>展現高科技與工業產值背後需龐大能源供應支撐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民生與服務用電占比\u003c/td>\u003ctd>住宅部門占18.8%、服務業部門占17.6%\u003c/td>\u003ctd>說明日常生活與商業運作亦為能源消費重要組成\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先看圓形圖的部門、數值與大小，找出最大用電部門；再對照表中的歷史趨勢與民國 69 年轉折，連結產業發展與能源需求。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能僅憑總發電量折線圖上升就推論全臺各年份每戶家庭用電量均等速增加，亦不能把發電量等同於單一部門用電。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據上表與圓形圖資料，民國69年臺灣發電量大幅增加的主因為何？用電比例最高的部門又是哪一個？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>民國69年發電量大幅增加主因是新竹科學園區成立帶動高科技產業發展；用電比例最高的是工業部門（55.2%）。\u003c/p>\u003c/div>","figure-2":"\u003cfigure style=\"margin:8px 0 14px;padding:10px;background:#fffaf1;border:1px solid #ddcfa7;border-radius:14px;break-inside:avoid\">\u003cfigcaption style=\"font-weight:700;font-size:15px;color:#635079\">臺灣發電來源比例\u003c/figcaption>\u003cdiv style=\"display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap\">\u003csvg width=\"140\" height=\"140\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"火力82%，再生能源12%，核能5%，其他1%\" style=\"flex-shrink:0;filter:drop-shadow(0 3px 1px #8b819633)\">\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ad85cd\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"82 18\" stroke-dashoffset=\"0\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#7ca9d0\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"12 88\" stroke-dashoffset=\"-82\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#ecc35c\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"5 95\" stroke-dashoffset=\"-94\" transform=\"rotate(-90 80 80)\"/>\u003ccircle cx=\"80\" cy=\"80\" r=\"51\" fill=\"none\" stroke=\"#e8a091\" stroke-width=\"30\" pathLength=\"100\" stroke-dasharray=\"1 99\" stroke-dashoffset=\"-99\" transform=\"rotate(-90 80 80)\"/>\u003ctext x=\"80\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" fill=\"#61536e\">合計\u003c/text>\u003ctext x=\"80\" y=\"99\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#61536e\">100%\u003c/text>\u003c/svg>\u003cdiv style=\"font-size:13px;min-width:145px\">\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ad85cd;border-radius:4px\">\u003c/span>\u003cspan>火力\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">82%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#7ca9d0;border-radius:4px\">\u003c/span>\u003cspan>再生能源\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">12%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#ecc35c;border-radius:4px\">\u003c/span>\u003cspan>核能\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">5%\u003c/strong>\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:8px;margin:5px 0\">\u003cspan style=\"width:12px;height:12px;background:#e8a091;border-radius:4px\">\u003c/span>\u003cspan>其他\u003c/span>\u003cstrong style=\"margin-left:auto;padding-left:10px\">1%\u003c/strong>\u003c/div>\u003c/div>\u003c/div>\u003cp style=\"font-size:11px;margin:4px 0 0;color:#756b61\">民國 113 年（西元 2024 年）教材示例資料，非即時統計。\u003c/p>\u003c/figure>\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\" style=\"display:none\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>火力發電（占82%）\u003c/td>\u003ctd>使用煤、天然氣、石油，發電穩定但排放空汙與溫室氣體\u003c/td>\u003ctd>現階段供電主力，但面臨空氣品質惡化與資源耗竭壓力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>核能發電（占5%）\u003c/td>\u003ctd>原料少即可產生大量電力，但有輻射外洩與核廢料爭議\u003c/td>\u003ctd>具備高效供電特性，仍須兼顧安全管理與核廢料長期處置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>太陽能發電（再生）\u003c/td>\u003ctd>利用日照不排廢氣，惟山坡地設置破壞景觀且有回收問題\u003c/td>\u003ctd>綠能轉型主軸之一，但選址需避免生態衝突與處理退役廢板\u003c/td>\u003c/tr>\u003ctr>\u003ctd>風力發電（再生）\u003c/td>\u003ctd>利用西部沿海穩定風力不排廢氣，但干擾候鳥與產生噪音\u003c/td>\u003ctd>善用自然風場，但設置需保持社區距離與保護生物多樣性\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依發電類型分類，橫向對比其發電原料來源、供電優勢以及對生態與社區產生的環境挑戰。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論再生能源（太陽能、風力）因運轉不排廢氣就完全沒有任何生態衝擊或土地開發爭議。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>比較火力發電與太陽能發電在環境影響上的最大差異，以及太陽能發展面臨的獨特挑戰為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>火力發電運轉會排放空汙與二氧化碳；太陽能發電過程不排廢氣，但面臨山坡景觀破壞、生態衝突及太陽能板退役回收的挑戰。\u003c/p>\u003c/div>"};const ASSETS={"explain":"../../assets/xiaoxue.webp","check":"../../assets/media/561934823155712a.webp","shield":"../../assets/media/863ddc465fe9f9d2.webp"};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<mark>$1</mark>');

else{content=(c.intro?`<p class="intro">${fmt(c.intro)}</p>`:'')+(c.bullets||[]).map(s=>`<p class="point">${fmt(s)}</p>`).join('');}

function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}
function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["新竹科學園區成立"]},"core-2":{"selector":".point","terms":["工業部門"]},"core-3":{"selector":".point","terms":["社會議題"]},"core-4":{"selector":".point","terms":["火力發電"]},"core-5":{"selector":".point","terms":["核廢料"]},"core-6":{"selector":".point","terms":["能源轉型"]},"core-7":{"selector":".point","terms":["回收處理"]},"core-8":{"selector":".point","terms":["西部沿海"]},"core-9":{"selector":".point","terms":["節能減碳"]},"mindmap-overview":{"selector":".mind-branch p","terms":["工業部門","火力發電","太陽能、風力與水力","環境永續責任"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":["核廢料"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["工業部門用電","新竹科學園區","火力發電","核能發電","再生能源","太陽能發電","風力發電","能源轉型","節能減碳","能源政策"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));

 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

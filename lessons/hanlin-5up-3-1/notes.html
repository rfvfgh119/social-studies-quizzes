生反叛事件，頒布了下列哪一項限制政策？","theme":"移民渡海背景與渡臺禁令","explain":"西元1684年清廷將臺灣納入版圖後，為防止漢人移入反叛，頒布限制人民渡海來臺的渡臺禁令。(0)海禁令非1684年針對臺灣防範漢人移入反叛之主因政策；(2)、(3)皆非歷史上頒布的法規名稱。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"清代彰化八堡圳興建時遇到引水困難，幸得一位神秘人士教導使用竹綁石筍升高水位的工法順利導水。這位人士被稱為：","options":["林先生","郭錫瑠","曹謹","施世榜"],"answer":0,"explanation":"八堡圳由施世榜投資興建，引水困難時獲得林先生教導將竹子綁成石筍置石塊於溪中升高水位的工法。(0)施世榜為投資開發者；(1)郭錫瑠開鑿瑠公圳；(2)曹謹開鑿曹公圳。","concept":"水利設施興建與八堡圳","skill":"概念理解","review":"core-2","evidence":"有一位「林先生」教導大家將竹子綁成石筍的形狀,裡面裝入石塊置於溪中,藉以升高水位","id":"q2","stem":"清代彰化八堡圳興建時遇到引水困難，幸得一位神秘人士教導使用竹綁石筍升高水位的工法順利導水。這位人士被稱為：","theme":"水利設施興建與八堡圳","explain":"八堡圳由施世榜投資興建，引水困難時獲得林先生教導將竹子綁成石筍置石塊於溪中升高水位的工法。(0)施世榜為投資開發者；(1)郭錫瑠開鑿瑠公圳；(2)曹謹開鑿曹公圳。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"清代臺灣由北到南開鑿了許多大型水圳灌溉農田，關於「瑠公圳、八堡圳、曹公圳」的地理區域分布，下列敘述何者正確？","options":["瑠公圳位於中部、八堡圳位於南部、曹公圳位於北部","瑠公圳位於北部、八堡圳位於中部、曹公圳位於南部","瑠公圳位於南部、八堡圳位於北部、曹公圳位於中部","三條水圳皆集中於東部花蓮地區"],"answer":1,"explanation":"清代水圳地理分布：瑠公圳位於北部（臺北）、八堡圳位於中部（彰化）、曹公圳位於南部（高雄）。其餘選項區域對應皆錯誤。","concept":"三大水圳分布與區域效益","skill":"概念理解","review":"core-3","evidence":"各地積極興建水圳,例如:瑠公圳、八堡圳和曹公圳等","id":"q3","stem":"清代臺灣由北到南開鑿了許多大型水圳灌溉農田，關於「瑠公圳、八堡圳、曹公圳」的地理區域分布，下列敘述何者正確？","theme":"三大水圳分布與區域效益","explain":"清代水圳地理分布：瑠公圳位於北部（臺北）、八堡圳位於中部（彰化）、曹公圳位於南部（高雄）。其餘選項區域對應皆錯誤。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"清代臺灣農業生產豐富，民間常以「一府二鹿三艋舺」稱呼三大貿易港口。這三個港口由南到北的空間排列順序為何？","options":["艋舺 → 鹿港 → 府城","鹿港 → 府城 → 艋舺","府城 → 艋舺 → 鹿港","府城（臺南） → 鹿港（彰化） → 艋舺（萬華）"],"answer":3,"explanation":"「一府二鹿三艋舺」由南到北排列依序為府城（今臺南）、鹿港（今彰化）、艋舺（今臺北萬華）。(0)排序由北到南；(2)、(3)地理順序混亂。","concept":"對外貿易與一府二鹿三艋舺","skill":"概念理解","review":"core-4","evidence":"西部地區的府城(今臺南市)、鹿港、艋舺(今臺北市萬華區),逐漸發展成臺灣三大貿易港口","id":"q4","stem":"清代臺灣農業生產豐富，民間常以「一府二鹿三艋舺」稱呼三大貿易港口。這三個港口由南到北的空間排列順序為何？","theme":"對外貿易與一府二鹿三艋舺","explain":"「一府二鹿三艋舺」由南到北排列依序為府城（今臺南）、鹿港（今彰化）、艋舺（今臺北萬華）。(0)排序由北到南；(2)、(3)地理順序混亂。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"清代鹿港五福街商家為了方便顧客採買、擋風避雨，在街道上方加蓋涼亭頂棚，形成下列哪一種特色的商業街景？","options":["五條港觀光園區","不見天街","剝皮寮老街","九份山城"],"answer":1,"explanation":"鹿港五福街商家在街道上方興建頂棚擋風避雨，形成著名的「不見天街」特色街景。(0)剝皮寮位於艋舺；(2)五條港位於府城臺南；(3)九份位於新北山區。","concept":"港市商業街景與歷史線索","skill":"概念理解","review":"core-5","evidence":"鹿港五福街的商家為了擋風避雨……在街道上方興建頂棚,形成「不見天街」","id":"q5","stem":"清代鹿港五福街商家為了方便顧客採買、擋風避雨，在街道上方加蓋涼亭頂棚，形成下列哪一種特色的商業街景？","theme":"港市商業街景與歷史線索","explain":"鹿港五福街商家在街道上方興建頂棚擋風避雨，形成著名的「不見天街」特色街景。(0)剝皮寮位於艋舺；(2)五條港位於府城臺南；(3)九份位於新北山區。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"清代臺灣移民激增，因清朝官員存在貪汙與不當管理等問題，導致民眾不滿政府而集體發起的武裝反抗事件，在歷史上統稱指定為何？","options":["民變","械鬥","屯墾","通商"],"answer":0,"explanation":"民眾因不滿政府官員貪汙與不當管理而集體發起反抗政府的事件稱為「民變」。(1)械鬥係民間不同族群間之武力衝突；(2)、(3)非衝突事件。","concept":"官員管理不當與民變爆發","skill":"概念理解","review":"core-6","evidence":"因貪汙和不當管理等問題,導致民眾不滿政府,因此頻繁發生集體反抗的事件,稱為「民變」。","id":"q6","stem":"清代臺灣移民激增，因清朝官員存在貪汙與不當管理等問題，導致民眾不滿政府而集體發起的武裝反抗事件，在歷史上統稱指定為何？","theme":"官員管理不當與民變爆發","explain":"民眾因不滿政府官員貪汙與不當管理而集體發起反抗政府的事件稱為「民變」。(1)械鬥係民間不同族群間之武力衝突；(2)、(3)非衝突事件。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"清代移民來臺後大多與同鄉聚居，不同族群團體之間為了保護土地、爭奪水源或利益所爆發的集體武裝衝突稱為：","options":["械鬥","劃界","民變","開墾"],"answer":0,"explanation":"民間不同同鄉族群團體之間為爭奪土地、水源或利益爆發的武裝衝突稱為「械鬥」。(0)民變係反抗官府；(2)、(3)非族群武力衝突名稱。","concept":"同鄉聚居、利益爭奪與械鬥","skill":"概念理解","review":"core-7","evidence":"為了保護土地、爭奪水源或追求利益,不同族群之間也時常爆發集體衝突,稱為「械鬥」。","id":"q7","stem":"清代移民來臺後大多與同鄉聚居，不同族群團體之間為了保護土地、爭奪水源或利益所爆發的集體武裝衝突稱為：","theme":"同鄉聚居、利益爭奪與械鬥","explain":"民間不同同鄉族群團體之間為爭奪土地、水源或利益爆發的武裝衝突稱為「械鬥」。(0)民變係反抗官府；(2)、(3)非族群武力衝突名稱。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"清代漢人吳沙招募各籍移民前往宜蘭開墾，導致當地哪一個平埔族群因生活空間受侵犯而與漢人發生衝突，部分族人被迫遷居花蓮？","options":["泰雅族","噶瑪蘭族","西拉雅族","達悟族"],"answer":1,"explanation":"吳沙招募漢人開墾宜蘭，侵犯了噶瑪蘭族生活空間，部分噶瑪蘭族人與漢人衝突後被迫遷居花蓮等地。(0)、(2)、(3)非宜蘭地區受吳沙開墾影響遷花蓮之平埔族群。","concept":"漢人土地擴張與噶瑪蘭族遷移","skill":"概念理解","review":"core-8","evidence":"吳沙招募各籍漢人移民至宜蘭開墾。部分噶瑪蘭族人為保護居住地,與漢人發生衝突……部分遷居花蓮等地。","id":"q8","stem":"清代漢人吳沙招募各籍移民前往宜蘭開墾，導致當地哪一個平埔族群因生活空間受侵犯而與漢人發生衝突，部分族人被迫遷居花蓮？","theme":"漢人土地擴張與噶瑪蘭族遷移","explain":"吳沙招募漢人開墾宜蘭，侵犯了噶瑪蘭族生活空間，部分噶瑪蘭族人與漢人衝突後被迫遷居花蓮等地。(0)、(2)、(3)非宜蘭地區受吳沙開墾影響遷花蓮之平埔族群。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"清帝國為了避免漢人侵犯山地原住民，曾在地圖上劃設界線隔離。圖中紅線代表較早劃設的界線，藍線則代表何種界線？","options":["清帝國與日本國界","水圳灌溉邊界","沿海防禦線","較晚期靠近山區的界線"],"answer":3,"explanation":"清廷劃設界線隔離，紅線代表較早期劃設，藍線代表較晚期靠近山區的界線，反映界線因漢人越界開墾不斷向山區推移。(0)、(2)、(3)皆不符課本繪製藍線定義。","concept":"清廷劃設界線與原住民空間縮減","skill":"概念理解","review":"core-9","evidence":"紅線代表較早期劃設的界線,藍線代表較晚期靠近山區的界線","id":"q9","stem":"清帝國為了避免漢人侵犯山地原住民，曾在地圖上劃設界線隔離。圖中紅線代表較早劃設的界線，藍線則代表何種界線？","theme":"清廷劃設界線與原住民空間縮減","explain":"清廷劃設界線隔離，紅線代表較早期劃設，藍線代表較晚期靠近山區的界線，反映界線因漢人越界開墾不斷向山區推移。(0)、(2)、(3)皆不符課本繪製藍線定義。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"清領時期平埔族群因為與漢人長期接觸，加上清廷辦理學校採取何種措施，導致平埔族群的語言與傳統文化快速流失？","options":["禁止平埔族人從事農業耕作","規定平埔族人只能使用羅馬字簽約","鼓勵平埔族群讀漢文、使用漢姓","強制平埔族人遷居日本"],"answer":2,"explanation":"清廷辦理學校鼓勵平埔族群讀漢文、使用漢姓，加上通婚買賣，造成平埔族群語言與文化快速流失（漢化）。(0)、(2)、(3)皆非清廷辦理學校之措施。","concept":"漢文化成為主流與平埔族群漢化","skill":"概念理解","review":"core-10","evidence":"清帝國辦理學校,鼓勵平埔族群讀漢文、使用漢姓,造成他們的語言與社會文化快速流失。","id":"q10","stem":"清領時期平埔族群因為與漢人長期接觸，加上清廷辦理學校採取何種措施，導致平埔族群的語言與傳統文化快速流失？","theme":"漢文化成為主流與平埔族群漢化","explain":"清廷辦理學校鼓勵平埔族群讀漢文、使用漢姓，加上通婚買賣，造成平埔族群語言與文化快速流失（漢化）。(0)、(2)、(3)皆非清廷辦理學校之措施。","reviewText":"核心 10","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 移民渡海背景與渡臺禁令","title":"移民渡海背景與渡臺禁令","bullets":["清帝國統治初期中國福建與廣東沿海人口增加且耕地不足。","西元1684年清廷將臺灣納入版圖，為防止漢人移入反叛頒布渡臺禁令。","規定來臺須向官府提出申請並取得驗票單，且嚴格禁止攜帶家眷。","臺灣環境適合水稻生長，原鄉生活困頓促使部分人民選擇偷渡來臺。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 水利設施興建與八堡圳","title":"水利設施興建與八堡圳","bullets":["清代開墾土地持續擴大，各地積極興建水圳以獲得穩定水源。","彰化八堡圳由施世榜投資開發，提高稻米產量與土地價格。","林先生教導將竹子綁成石筍置石塊入溪中升高水位成功引水。","水圳興建吸引大量移民開墾，帶動員林仔街（今員林）聚落形成。"]},{"id":"core-3","type":"core","tag":"C 三大水圳分布與區域效益","title":"三大水圳分布與區域效益","bullets":["清代臺灣南北各地陸續開鑿大型水圳灌溉廣大農田。","北部開鑿瑠公圳、中部開鑿八堡圳、南部開鑿曹公圳。","水圳提供穩定灌溉水源，大幅增加農業耕地面積與稻米產量。","水利設施帶動周邊土地開發與商業交易，促進區域街市繁榮。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 對外貿易與一府二鹿三艋舺","title":"對外貿易與一府二鹿三艋舺","bullets":["清代臺灣農產豐富，與中國東南沿海展開頻繁的貨物貿易。","主要輸出稻米與蔗糖至中國，並輸入藥材、布匹等民生日常用品。","由南到北發展出府城（臺南）、鹿港與艋舺（萬華）三大貿易港口。","民間因而形成「一府二鹿三艋舺」的稱呼，反映西部港市榮景。"]},{"id":"core-5","type":"core","tag":"E 港市商業街景與歷史線索","title":"港市商業街景與歷史線索","bullets":["三大貿易港口憑藉優越水運條件，發展出繁榮的商業街市。","艋舺因水運位置優越成為臺北盆地對外港口，剝皮寮保存清代街景。","鹿港五福街商家興建涼亭擋風避雨，形成特色「不見天街」。","臺南五條港為早期重要商用河港，今日已轉型為觀光文化園區。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 官員管理不當與民變爆發","title":"官員管理不當與民變爆發","bullets":["移民激增使清廷官員難以有效維護秩序，且存在貪汙管理問題。","民眾因不滿官員欺壓與不當管理，發起集體反抗政府的民變事件。","主要民變包括朱一貴事件、戴潮春事件，以及規模最大的林爽文事件。","林爽文事件引發全臺動亂，清廷調兵鎮壓並立碑記錄，反映統治薄弱。"]},{"id":"core-7","type":"core","tag":"G 同鄉聚居、利益爭奪與械鬥","title":"同鄉聚居、利益爭奪與械鬥","bullets":["漢人移民來臺大多與同鄉聚居，互相照顧並共同開發土地。","為保護土地、爭奪水源或追求利益，不同族群間常爆發集體衝突（械鬥）。","士林漳州人建隘門防範泉州人，並將械鬥無名罹難者合葬於同歸所。","民變與械鬥造成社會動亂與族群遷徙，開墾完成後社會秩序漸趨穩定。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 漢人土地擴張與噶瑪蘭族遷移","title":"漢人土地擴張與噶瑪蘭族遷移","bullets":["漢人開墾過程中侵犯平埔族群生活空間，導致平埔族群被迫遷移。","吳沙招募漢人至宜蘭開墾，與噶瑪蘭族發生土地衝突與交易。","部分噶瑪蘭族人留下與漢人通婚租地，部分族人則遷居花蓮等地。","說明漢人土地需求擴張對東部原住民族居住地造成深刻衝擊。"]},{"id":"core-9","type":"core","tag":"I 清廷劃設界線與原住民空間縮減","title":"清廷劃設界線與原住民空間縮減","bullets":["清廷為防漢人侵犯山地原住民，曾劃設界線（紅線與藍線）隔離。","紅線代表較早期劃設界線，藍線代表較晚期靠近山區的界線。","隨著漢人人數增加與土地需求持續，常發生越界開墾與衝突。","界線不斷向山區推移，導致山區原住民的生活空間持續縮減。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-10","type":"core","tag":"J 漢文化成為主流與平埔族群漢化","title":"漢文化成為主流與平埔族群漢化","bullets":["漢人來臺增加使漢文化風俗成為主流，主導政治與經濟活動。","漢人與平埔族群通婚、租地耕作與買賣土地，平埔族融入漢人生活。","清廷辦理學校鼓勵平埔族群讀漢文、用漢姓，使其語言文化快速流失。","深山原住民因受漢化影響較少，至今仍保存較多原有的傳統文化。"]}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"清帝國將臺灣納入版圖後，為了快速開發臺灣土地，主動鼓勵中國沿海居民攜帶全家大小移民來臺。","right":"清廷為防止過多漢人移入發生反叛，頒布渡臺禁令，規定須先申請許可，且嚴格不准攜帶家眷。 渡臺禁令限制極嚴格且禁帶家眷，非主動鼓勵全家移民。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"八堡圳是由清代官員曹謹投資興建，並由郭錫瑠教導使用石筍工法引水灌溉北部農田。","right":"八堡圳位於彰化，由施世榜投資開發，並由林先生教導石筍工法；曹謹開鑿的是南部曹公圳。 人名、地區與水圳不可混淆：施世榜與林先生築八堡圳（彰化），曹謹築曹公圳（高雄），郭錫瑠築瑠公圳（臺北）。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"清代臺灣對外貿易興盛，主要將中國生產的稻米與蔗糖進口到臺灣，並將臺灣的布匹與藥材外銷至中國。","right":"臺灣是輸出稻米與蔗糖至中國，並從中國進口藥材、布匹等日常民生用品。 進出口方向不可顛倒：臺灣輸出農產（米、糖），輸入民生用品（藥材、布匹）。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"「民變」是指來自漳州與泉州等不同地方的移民，為了搶奪水源與土地而發生的武裝族群集體衝突。","right":"民眾反抗政府官員欺壓或不當管理的事件稱為「民變」；移民群體之間搶奪土地水源的衝突稱為「械鬥」。 對象不同：民變係「反抗政府」（如林爽文事件）；械鬥係「民間族群衝突」（如漳泉械鬥）。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"吳沙招募漢人前往宜蘭開墾時，所有的噶瑪蘭族人皆選擇留在原地並完全接受漢化。","right":"噶瑪蘭族人有的與漢人發生衝突，有的留下通婚租地，有的則選擇遷居至花蓮等地生活。 原住民族因應方式多元，非單一全數留下，部分族人選擇遷居花蓮。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"平埔族群在清代會使用漢字記錄與溝通，證明平埔族群本來就是從中國渡海來臺的漢人後代。","right":"平埔族群係因為清廷辦理學校鼓勵讀漢文、使用漢姓以及與漢人長期接觸後才學會使用漢字。 漢字係後天漢化教育與接觸的結果，平埔族群為臺灣原住民族，非漢人後代。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"移民背景與渡臺限制｜知識關係","chain":["中國東南沿海人口激增且耕地不足，臺灣自然環境適合種植水稻","1684年清廷頒布渡臺禁令，須向官府申請許可且不准攜帶家眷","原鄉生活困頓促使人民冒險偷渡，漢人移民數量仍持續增加"]},{"id":"logic-2","type":"chain","title":"水利開發與貿易港市｜知識關係","chain":["興建瑠公圳、八堡圳（施世榜投資、林先生石筍工法）與曹公圳","農業產量提升，輸出稻米蔗糖至中國，輸入藥材布匹等民生用品","形成「一府二鹿三艋舺」三大貿易港口，帶動剝皮寮與不見天街發展"]},{"id":"logic-3","type":"chain","title":"社會動亂民變與械鬥｜知識關係","chain":["官員貪汙不當管理引發民變反抗政府，以林爽文事件規模最大","同鄉聚居為爭水源利益引發族群械鬥，建隘門防衛並合葬於同歸所","造成社會動亂與人口遷徙，開墾完成後社會秩序漸趨穩定"]},{"id":"logic-4","type":"chain","title":"土地擴張與原住民族漢化｜知識關係","chain":["漢人開墾侵犯平埔族空間，吳沙開墾宜蘭致噶瑪蘭族部分遷花蓮","清廷劃設界線（紅線與藍線）隔離，但漢人越界開墾使山區原住民空間縮減","學校推廣漢文漢姓與通婚買賣，平埔族文化快速流失，深山族群保存較多"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜清代臺灣三大水圳與重要貿易港口對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜清代臺灣社會衝突型態（民變與械鬥）比較流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["民變","械鬥","民變是民眾因不滿清廷官員貪汙或不當管理而集體反抗官府的事件（如林爽文事件）；械鬥則是民間移民同鄉團體之間，為了爭奪土地、水源或利益所發生的武裝集體衝突（如漳泉械鬥）。"],["八堡圳","瑠公圳","八堡圳位於臺灣中部彰化地區，由施世榜投資、林先生指導石筍工法引水；瑠公圳則位於臺灣北部臺北地區，由郭錫瑠等人開鑿，兩者皆為清代提供穩定灌溉的重要水利設施。"],["渡臺禁令下的合法移民","渡臺禁令下的偷渡移民","合法移民須事先向清廷官府提出申請並取得驗票單（渡臺許可），且嚴格不准攜帶家眷；偷渡移民則係因原鄉貧困、臺灣適合種稻，未經申請冒險搭船渡海登陸的移民。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","渡臺禁令","西元1684年清廷將臺灣納入版圖後頒布的限制移民政策，規定須事先申請許可且不准攜帶家眷，以防過多漢人移入反叛。"],["2","八堡圳","清代位於彰化地區的重要水利設施，由施世榜投資開發，並由林先生教導石筍工法引水，大幅提升稻米產量並帶動員林仔街發展。"],["3","一府二鹿三艋舺","清代臺灣三大貿易港口的俗稱，由南到北分別為府城（今臺南）、鹿港（今彰化鹿港）與艋舺（今臺北萬華），反映清代臺灣西部盛極一時的商貿榮景。"],["4","民變","清代臺灣民眾因不滿官員貪汙、壓迫或管理不當，集體武力反抗清朝官府統治的事件，代表事件為林爽文事件、朱一貴事件與戴潮春事件。"],["5","林爽文事件","清代臺灣規模最大的民變事件，漳州人林爽文因官員欺壓率眾反抗，演變成全臺動亂，清廷調兵鎮壓後立御龜碑紀念。"],["6","械鬥","清代移民來臺後，不同族群或同鄉團體之間為了保護土地、爭奪水源或追求利益所發生的集體武裝衝突。"],["7","芝山岩同歸所","位於臺北市士林芝山岩的史蹟，為清代漳泉械鬥後，當地居民將無法辨認身分的罹難者屍骨合葬的墓塚（俗稱大墓公）。"],["8","噶瑪蘭族","原居住於宜蘭地區的平埔族群，清代因吳沙招募漢人開墾宜蘭爆發土地衝突，部分族人留下通婚租地，部分族人被迫遷居花蓮。"],["9","劃設界線","清廷為避免漢人侵犯山地原住民所繪製的分界線（地圖上紅線為早期、藍線為晚期），但因漢人越界開墾使原住民生活空間持續縮減。"],["10","漢化","平埔族群因與漢人長期接觸、通婚、租地買賣，以及清廷辦理學校鼓勵讀漢文、用漢姓，導致其傳統語言與社會文化快速流失的過程。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"渡臺禁令合法與偷渡比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較清代渡臺禁令下「合法移民」與「偷渡移民」的條件與背景，下列敘述何者完全正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"民變與械鬥之比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較清代臺灣社會動亂中的「民變」與「械鬥」，兩者在「對抗對象」與「爆發原因」上的核心差別為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"八堡圳興建效益之因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"彰化八堡圳順利建成通水後，對當地聚落發展與經濟產生了何種連貫的因果影響？"}]}],"cloze":{"core-1":{"selector":".point","terms":["渡臺禁令"]},"core-2":{"selector":".point","terms":["八堡圳"]},"core-3":{"selector":".point","terms":["瑠公圳"]},"core-4":{"selector":".point","terms":["一府二鹿三艋舺"]},"core-5":{"selector":".point","terms":["剝皮寮"]},"core-6":{"selector":".point","terms":["林爽文事件"]},"core-7":{"selector":".point","terms":["械鬥"]},"core-8":{"selector":".point","terms":["噶瑪蘭族"]},"core-9":{"selector":".point","terms":["越界開墾"]},"core-10":{"selector":".point","terms":["漢化"]},"mindmap-overview":{"selector":".mind-branch p","terms":["渡臺禁令","一府二鹿三艋舺","林爽文事件","噶瑪蘭族"]},"trap-1":{"selector":".correct","terms":["渡臺禁令"]},"trap-2":{"selector":".correct","terms":["八堡圳"]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":["械鬥"]},"trap-5":{"selector":".correct","terms":["噶瑪蘭族"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["渡臺禁令","八堡圳","一府二鹿三艋舺","民變","林爽文事件","械鬥","芝山岩同歸所","噶瑪蘭族","劃設界線","漢化"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>移民背景與渡臺限制\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>中國東南沿海人口激增且耕地不足，臺灣自然環境適合種植水稻\u003c/p>\u003cp>\u003cb>關係：\u003c/b>1684年清廷頒布渡臺禁令，須向官府申請許可且不准攜帶家眷\u003c/p>\u003cp>\u003cb>結果：\u003c/b>原鄉生活困頓促使人民冒險偷渡，漢人移民數量仍持續增加\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>水利開發與貿易港市\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>興建瑠公圳、八堡圳（施世榜投資、林先生石筍工法）與曹公圳\u003c/p>\u003cp>\u003cb>關係：\u003c/b>農業產量提升，輸出稻米蔗糖至中國，輸入藥材布匹等民生用品\u003c/p>\u003cp>\u003cb>結果：\u003c/b>形成「一府二鹿三艋舺」三大貿易港口，帶動剝皮寮與不見天街發展\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>社會動亂民變與械鬥\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>官員貪汙不當管理引發民變反抗政府，以林爽文事件規模最大\u003c/p>\u003cp>\u003cb>關係：\u003c/b>同鄉聚居為爭水源利益引發族群械鬥，建隘門防衛並合葬於同歸所\u003c/p>\u003cp>\u003cb>結果：\u003c/b>造成社會動亂與人口遷徙，開墾完成後社會秩序漸趨穩定\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>土地擴張與原住民族漢化\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>漢人開墾侵犯平埔族空間，吳沙開墾宜蘭致噶瑪蘭族部分遷花蓮\u003c/p>\u003cp>\u003cb>關係：\u003c/b>清廷劃設界線（紅線與藍線）隔離，但漢人越界開墾使山區原住民空間縮減\u003c/p>\u003cp>\u003cb>結果：\u003c/b>學校推廣漢文漢姓與通婚買賣，平埔族文化快速流失，深山族群保存較多\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>早期移民如何在臺灣建立家園？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">類別與名稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">分布區域與代表人物或舊稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史影響與街市發展\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>類別與名稱\u003c/th>\u003cth>分布區域與代表人物或舊稱\u003c/th>\u003cth>歷史影響與街市發展\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>瑠公圳（水圳）\u003c/td>\u003ctd>位於臺灣北部（臺北地區），由郭錫瑠等開鑿\u003c/td>\u003ctd>提供北部穩定灌溉水源，增加稻米耕地面積\u003c/td>\u003c/tr>\u003ctr>\u003ctd>八堡圳（水圳）\u003c/td>\u003ctd>位於臺灣中部（彰化地區），施世榜投資、林先生導水\u003c/td>\u003ctd>提高稻米產量與地價，吸引移民並形成員林仔街\u003c/td>\u003c/tr>\u003ctr>\u003ctd>曹公圳（水圳）\u003c/td>\u003ctd>位於臺灣南部（高雄地區），由鳳山知縣曹謹開鑿\u003c/td>\u003ctd>改善南部灌溉系統，奠定南部農業生產基礎\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一府二鹿三艋舺（港口）\u003c/td>\u003ctd>由南到北為府城（臺南）、鹿港（彰化）、艋舺（萬華）\u003c/td>\u003ctd>輸出米糖、輸入藥材布匹，留有剝皮寮與不見天街等遺構\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>橫向比較三大水圳（北、中、南）與三大貿易港口的區域分布、關鍵人物與歷史影響。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論曹公圳位於北部臺北地區，亦不能推論鹿港是位於臺南的港口。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，八堡圳在興建過程中有何關鍵特色？對當地聚落發展產生了什麼影響？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>八堡圳由施世榜投資開發，並由林先生提供石筍工法引水，穩定灌溉後提高了稻米產量與地價，促成了員林仔街的形成。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">衝突類型\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">爆發原因與對抗對象\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史代表事件與遺跡\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>衝突類型\u003c/th>\u003cth>爆發原因與對抗對象\u003c/th>\u003cth>歷史代表事件與遺跡\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>民變（反抗政府）\u003c/td>\u003ctd>官員貪汙、不當管理與壓迫，民眾集體反抗清廷官府\u003c/td>\u003ctd>朱一貴事件、戴潮春事件、規模最大的林爽文事件（赤嵌樓御龜碑）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>械鬥（民間衝突）\u003c/td>\u003ctd>同鄉移民為保護土地、爭奪水源或追求利益，武裝族群互鬥\u003c/td>\u003ctd>漳泉械鬥，芝山岩建隘門防衛，無名罹難者合葬於芝山岩同歸所\u003c/td>\u003c/tr>\u003ctr>\u003ctd>原漢土地衝突\u003c/td>\u003ctd>漢人移民開墾擴張侵犯原住民族生活空間與資源\u003c/td>\u003ctd>吳沙開墾宜蘭致噶瑪蘭族衝突與遷徙；清廷劃界但漢人仍越界開墾\u003c/td>\u003c/tr>\u003ctr>\u003ctd>社會秩序趨穩\u003c/td>\u003ctd>衝突導致族群遷徙與分居，隨著開墾完成社會秩序日趨穩定\u003c/td>\u003ctd>興建廟宇（褒忠亭義民廟、開漳聖王廟）凝聚族群與社會秩序\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>縱向區分民變、械鬥與原漢衝突的不同性質，並閱讀其代表事件與社會影響。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論械鬥是民眾集體推翻清朝官府的政治革命，亦不能推論林爽文事件是漳泉兩派移民爭奪水源的衝突。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據比較表，「民變」與「械鬥」在對抗對象與爆發原因上有何本質區別？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>民變是民眾因官員貪汙管理不當而集體「反抗政府」；械鬥則是民間不同同鄉族群之間為「爭奪土地、水源或利益」發生的武裝衝突。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>移民背景與渡臺限制\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>中國東南沿海人口激增且耕地不足，臺灣自然環境適合種植水稻\u003c/p>\u003cp>\u003cb>關係：\u003c/b>1684年清廷頒布渡臺禁令，須向官府申請許可且不准攜帶家眷\u003c/p>\u003cp>\u003cb>結果：\u003c/b>原鄉生活困頓促使人民冒險偷渡，漢人移民數量仍持續增加\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>水利開發與貿易港市\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>興建瑠公圳、八堡圳（施世榜投資、林先生石筍工法）與曹公圳\u003c/p>\u003cp>\u003cb>關係：\u003c/b>農業產量提升，輸出稻米蔗糖至中國，輸入藥材布匹等民生用品\u003c/p>\u003cp>\u003cb>結果：\u003c/b>形成「一府二鹿三艋舺」三大貿易港口，帶動剝皮寮與不見天街發展\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>社會動亂民變與械鬥\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>官員貪汙不當管理引發民變反抗政府，以林爽文事件規模最大\u003c/p>\u003cp>\u003cb>關係：\u003c/b>同鄉聚居為爭水源利益引發族群械鬥，建隘門防衛並合葬於同歸所\u003c/p>\u003cp>\u003cb>結果：\u003c/b>造成社會動亂與人口遷徙，開墾完成後社會秩序漸趨穩定\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>土地擴張與原住民族漢化\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>漢人開墾侵犯平埔族空間，吳沙開墾宜蘭致噶瑪蘭族部分遷花蓮\u003c/p>\u003cp>\u003cb>關係：\u003c/b>清廷劃設界線（紅線與藍線）隔離，但漢人越界開墾使山區原住民空間縮減\u003c/p>\u003cp>\u003cb>結果：\u003c/b>學校推廣漢文漢姓與通婚買賣，平埔族文化快速流失，深山族群保存較多\u003c   if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};

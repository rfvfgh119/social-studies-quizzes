t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>南一5上4-3 大航海時期對臺的影響</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"南一版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"4-3","title":"大航海時期對臺的影響"},"questions":[{"question":"荷蘭人將臺灣作為東亞貿易據點時，主要對外輸出臺灣本地產出的哪兩項重要物產？","options":["蔗糖與鹿皮","茶葉與樟腦","香料與黃金","稻米與大理石"],"answer":0,"explanation":"荷蘭人以臺灣為貿易據點，主要對外輸出臺灣本地產的蔗糖與鹿皮，並轉賣中國絲綢瓷器、日本白銀及東南亞香料。","concept":"荷蘭與鄭氏的東亞貿易網絡","skill":"概念理解","review":"core-1","evidence":"荷蘭人將臺灣作為貿易據點，對外輸出蔗糖與鹿皮","id":"q1","stem":"荷蘭人將臺灣作為東亞貿易據點時，主要對外輸出臺灣本地產出的哪兩項重要物產？","theme":"荷蘭與鄭氏的東亞貿易網絡","explain":"荷蘭人以臺灣為貿易據點，主要對外輸出臺灣本地產的蔗糖與鹿皮，並轉賣中國絲綢瓷器、日本白銀及東南亞香料。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"荷蘭人為了發展蔗糖與稻米產業，除了招募中國沿海漢人來臺開墾外，還特別引進了哪一種動物協助耕作？","options":["耕牛","大象","戰馬","駱駝"],"answer":0,"explanation":"荷蘭人招募漢人開墾南部平原，並引進耕牛協助耕作，同時帶入豌豆（荷蘭豆）、芒果等作物與「甲」等土地面積單位。","concept":"荷蘭人的招墾與農業引進","skill":"概念理解","review":"core-2","evidence":"荷蘭人為了發展蔗糖貿易……開始種植稻米，並引進耕牛協助耕作。","id":"q2","stem":"荷蘭人為了發展蔗糖與稻米產業，除了招募中國沿海漢人來臺開墾外，還特別引進了哪一種動物協助耕作？","theme":"荷蘭人的招墾與農業引進","explain":"荷蘭人招募漢人開墾南部平原，並引進耕牛協助耕作，同時帶入豌豆（荷蘭豆）、芒果等作物與「甲」等土地面積單位。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"西元1652年，漢人開墾領袖郭懷一率眾發起反抗荷蘭人的武力事件，其最主要的爆發原因為何？","options":["荷蘭人阻止漢人舉辦祭孔大典","荷蘭人禁止漢人種植稻米","荷蘭人強迫漢人改信天主教","荷蘭人對漢人徵收重稅與剝削"],"answer":3,"explanation":"郭懷一事件爆發的主因是荷蘭東印度公司對漢人加重徵收人頭稅等高額稅負與剝削，引發漢人集體武力反抗。","concept":"郭懷一事件與普羅民遮城","skill":"概念理解","review":"core-3","evidence":"荷蘭人為了獲得更多利潤，對招募來臺開墾的漢人徵稅，導致郭懷一為首的漢人，在西元1652年大規模反抗","id":"q3","stem":"西元1652年，漢人開墾領袖郭懷一率眾發起反抗荷蘭人的武力事件，其最主要的爆發原因為何？","theme":"郭懷一事件與普羅民遮城","explain":"郭懷一事件爆發的主因是荷蘭東印度公司對漢人加重徵收人頭稅等高額稅負與剝削，引發漢人集體武力反抗。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"鄭氏政權來臺後，為了因應數萬軍民龐大的糧食需求，主要採取了哪一項土地開墾政策？","options":["將平原全部改為養魚池","強制所有原住民族繳交鹿肉","實施軍隊駐守農墾（屯墾）","向外國大量進口稻米"],"answer":2,"explanation":"鄭氏政權為解決軍民糧食不足問題，實施軍隊駐守開墾（屯墾），並將荷蘭王田改為官田，逐步擴大耕地。","concept":"鄭氏政權的軍隊屯墾與地名","skill":"概念理解","review":"core-4","evidence":"鄭氏政權為了解決軍民糧食不足的問題，因此在軍隊駐紮的地方開墾。","id":"q4","stem":"鄭氏政權來臺後，為了因應數萬軍民龐大的糧食需求，主要採取了哪一項土地開墾政策？","theme":"鄭氏政權的軍隊屯墾與地名","explain":"鄭氏政權為解決軍民糧食不足問題，實施軍隊駐守開墾（屯墾），並將荷蘭王田改為官田，逐步擴大耕地。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"荷蘭人為了管理原住民族，定期召集各部落長老舉行地方會議，並會頒發何種物品作為長老權力的象徵？","options":["鐵製獵槍","羅馬字聖經","權杖","黃金皇冠"],"answer":2,"explanation":"荷蘭人規定原住民族各社需推派長老參與定期地方會議，並頒授帶有荷蘭東印度公司標誌的權杖象徵權力與要求效忠。","concept":"荷蘭與西班牙的族群治理與傳教","skill":"概念理解","review":"core-5","evidence":"荷蘭人還規定原住民族各社需要推派長老參與定期集會……頒授權杖。","id":"q5","stem":"荷蘭人為了管理原住民族，定期召集各部落長老舉行地方會議，並會頒發何種物品作為長老權力的象徵？","theme":"荷蘭與西班牙的族群治理與傳教","explain":"荷蘭人規定原住民族各社需推派長老參與定期地方會議，並頒授帶有荷蘭東印度公司標誌的權杖象徵權力與要求效忠。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"荷蘭傳教士早期為了傳播基督教，使用哪一種文字工具來拼寫原住民族（如西拉雅族）的語言？","options":["梵文拼音","日文假名","漢字楷書","羅馬字母"],"answer":3,"explanation":"荷蘭傳教士使用羅馬字母拼寫西拉雅等原住民族語言，用於翻譯聖經與傳教，後來被原住民族用於土地契約（新港文書）。","concept":"羅馬字母與新港文書","skill":"概念理解","review":"core-6","evidence":"荷蘭人為了傳播基督教……使用羅馬字母拼寫原住民族的語言","id":"q6","stem":"荷蘭傳教士早期為了傳播基督教，使用哪一種文字工具來拼寫原住民族（如西拉雅族）的語言？","theme":"羅馬字母與新港文書","explain":"荷蘭傳教士使用羅馬字母拼寫西拉雅等原住民族語言，用於翻譯聖經與傳教，後來被原住民族用於土地契約（新港文書）。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"大航海時期由臺灣中部臺中、彰化與南投一帶原住民族部落組成的聯合政權，在歷史上被稱為：","options":["熱蘭遮王國","高山國","卑南王國","大肚王國"],"answer":3,"explanation":"大肚王國是中部平原臺中、彰化、南投一帶由平埔原住民族部落組成的聯盟，先後遭到荷蘭與鄭氏勢力的衝擊與攻打。","concept":"外來勢力對大肚王國的衝擊","skill":"概念理解","review":"core-7","evidence":"其中一個被後人稱為「大肚王國」的部落聯盟","id":"q7","stem":"大航海時期由臺灣中部臺中、彰化與南投一帶原住民族部落組成的聯合政權，在歷史上被稱為：","theme":"外來勢力對大肚王國的衝擊","explain":"大肚王國是中部平原臺中、彰化、南投一帶由平埔原住民族部落組成的聯盟，先後遭到荷蘭與鄭氏勢力的衝擊與攻打。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"鄭經統治時期，在何人的建議與規劃下，積極興建孔廟、設立學校並制定科舉考試制度？","options":["鄭芝龍","施琅","郭懷一","陳永華"],"answer":3,"explanation":"鄭經統治時期採納重臣陳永華的建議，積極推展文化與教育事業，興建臺南孔廟並建立官學與科舉考試選拔人才。","concept":"鄭氏政權建官制與陳永華推文教","skill":"概念理解","review":"core-8","evidence":"在大臣陳永華的建議下，積極推展文化與教育事業，除了在臺南興建全臺第一座孔廟，設立學校，還制定考試制度。","id":"q8","stem":"鄭經統治時期，在何人的建議與規劃下，積極興建孔廟、設立學校並制定科舉考試制度？","theme":"鄭氏政權建官制與陳永華推文教","explain":"鄭經統治時期採納重臣陳永華的建議，積極推展文化與教育事業，興建臺南孔廟並建立官學與科舉考試選拔人才。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"被譽為「全臺首學」的臺南孔廟中，古代學生上課、聽講與研讀儒家經典的主殿空間稱為：","options":["承天府","赤崁樓","明倫堂","大成殿"],"answer":2,"explanation":"臺南孔廟設計中，「大成殿」為祭祀孔子的主殿，「明倫堂」則是學生上課、講習儒家經典的場所。","concept":"臺南孔廟的建築與儒家思想","skill":"概念理解","review":"core-9","evidence":"學生上課的地方，以「明倫堂」為主，因此臺南孔廟也被稱為是「全臺首學」。","id":"q9","stem":"被譽為「全臺首學」的臺南孔廟中，古代學生上課、聽講與研讀儒家經典的主殿空間稱為：","theme":"臺南孔廟的建築與儒家思想","explain":"臺南孔廟設計中，「大成殿」為祭祀孔子的主殿，「明倫堂」則是學生上課、講習儒家經典的場所。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"臺灣東北角著名的地名「三貂角」，其名稱由來與十七世紀哪一個外來勢力的語言稱呼密切相關？","options":["葡萄牙語","西班牙語","荷蘭語","英國語"],"answer":1,"explanation":"三貂角地名源自西元1626年西班牙船隻來到臺灣東北角時，將該地以西班牙聖地「Santiago」命名，後經本地先民語音轉譯而成。","concept":"大航海時期歷史遺跡與名稱線索","skill":"概念理解","review":"core-10","evidence":"現今臺灣東北方的三貂角，名稱是由西班牙語 SANTIAGO 轉譯而來。","id":"q10","stem":"臺灣東北角著名的地名「三貂角」，其名稱由來與十七世紀哪一個外來勢力的語言稱呼密切相關？","theme":"大航海時期歷史遺跡與名稱線索","explain":"三貂角地名源自西元1626年西班牙船隻來到臺灣東北角時，將該地以西班牙聖地「Santiago」命名，後經本地先民語音轉譯而成。","reviewText":"核心 10","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 荷蘭與鄭氏的東亞貿易網絡","title":"荷蘭與鄭氏的東亞貿易網絡","bullets":["荷蘭人以臺灣為據點輸出蔗糖與鹿皮，並轉賣中國瓷器絲綢、日本白銀及東南亞香料；鄭氏政權亦透過走私與海外貿易獲利。","大航海時代東亞海域商業利益龐大，各方勢力皆欲拓展貿易航路與貨物轉運基地。","清帝國實施海禁，鄭氏政權仍透過走私自中國獲得生絲瓷器，並與英國商人合作對抗荷蘭經貿競爭。","奠定了臺灣作為東亞貿易轉運中繼站的國際經濟地位，讓臺灣物產邁向國際市場。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 荷蘭人的招墾與農業引進","title":"荷蘭人的招墾與農業引進","bullets":["荷蘭人為了發展蔗糖貿易招募漢人種植甘蔗，並因應漢人糧食需求開始種植稻米，引進耕牛與新作物。","國際市場對蔗糖需求大增，且早期臺灣缺少高經濟價值作物，荷蘭人需積極開發土地資源。","招募來自中國沿海的漢人移民開墾南部平原，引進耕牛協助耕作，並引進豌豆（荷蘭豆）、芒果等作物與「甲」等算面積單位。","促進臺灣南部農業大量開墾，蔗糖成為外銷主力、稻米供本地食用，吸引大量漢人移民來臺。"]},{"id":"core-3","type":"core","tag":"C 郭懷一事件與普羅民遮城","title":"郭懷一事件與普羅民遮城","bullets":["西元1652年郭懷一率領漢人反抗荷蘭人的重稅與剝削，遭荷蘭軍隊武力鎮壓，事後荷蘭人興建普羅民遮城加強防備。","荷蘭東印度公司在臺行政軍事花費增加，對漢人加重徵收人頭稅，加上前一年蝗災導致漢人生活困苦。","郭懷一號召三、四千名漢人起義反抗，因武器劣勢遭到鎮壓與屠殺；荷蘭人隨後於赤崁興建普羅民遮城加強防守。","爆發了荷治時期最大的荷漢衝突事件，普羅民遮城（今赤崁樓）成為歷史防禦遺構與古跡。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 鄭氏政權的軍隊屯墾與地名","title":"鄭氏政權的軍隊屯墾與地名","bullets":["鄭成功與鄭經為解決數萬軍民糧食短缺問題，實施軍隊駐守開墾（屯墾），並將荷蘭王田改為官田。","鄭氏政權來臺時瞬間湧入三萬多名士兵與大批移民，面對清廷海禁封鎖，糧食自給成為政權生存關鍵。","將軍隊分配至各地進行軍事駐守與農業農墾，並將荷蘭王田改為官田，逐步擴大耕地面積。","在中南部留下許多與軍隊編制相關的地名，如臺南的新營、左鎮，以及高雄的左營、前鎮等。"]},{"id":"core-5","type":"core","tag":"E 荷蘭與西班牙的族群治理與傳教","title":"荷蘭與西班牙的族群治理與傳教","bullets":["荷蘭人透過武力、傳教（基督教）與結盟管理原住民族並舉辦地方會議；西班牙人則進行糧食硫磺交易與傳播天主教。","外來政權為維護貿易利益、開發資源與鞏固統治，對原住民族採取不同的互動策略。","荷蘭人頒授權杖給長老要求效忠，設立教堂學校傳教；西班牙人在北部與原住民族交易硫磺（製造火藥原料）並傳天主教。","改變了原住民族部落間的傳統權力關係，同時留下西方宗教與北部三貂角（Santiago）等地名線索。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 羅馬字母與新港文書","title":"羅馬字母與新港文書","bullets":["荷蘭傳教士使用羅馬字母拼寫原住民族語言（如西拉雅語），用於傳教與翻譯聖經，後被用於原漢土地契約（新港文書）。","為了向不識漢字的原住民族傳播基督教，並建立溝通與文字記錄系統。","傳教士編寫羅馬字聖經（如馬太福音），原住民族學會後用於日常生活與契約簽署，清代原漢交易時仍持續使用。","這些雙語契約被稱為「新港文書」，成為研究早期原住民族語言、歷史與土地交易極為珍貴的史料。"]},{"id":"core-7","type":"core","tag":"G 外來勢力對大肚王國的衝擊","title":"外來勢力對大肚王國的衝擊","bullets":["中部原住民族部落聯盟「大肚王國」原本掌握肥沃土地與梅花鹿物產，先後遭到荷蘭人征服結盟與鄭氏政權多次兵攻。","大肚王國控制臺中、彰化、南投一帶平原台地與交通要道，荷蘭與鄭氏皆欲掌控該區經濟資源與軍糧。","荷蘭人以武力征服後簽約結盟並要求參加地方會議；鄭氏政權則為了擴大屯墾多次強攻占領土地糧食，屠殺沙轆社等部落。","致使大肚王國的人口與生存條件受到重創，倖存族人被迫遷往山區，大肚王國逐漸在歷史上消失。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 鄭氏政權建官制與陳永華推文教","title":"鄭氏政權建官制與陳永華推文教","bullets":["鄭經統治時期制定中央與地方官制，並採納陳永華建議興建全臺首座孔廟、設立學校與考試制度培育人才。","為了鞏固在臺灣的治理基業、延續漢人文化正統，並培育管理地方事務的行政人才。","陳永華提議並推動屯田、製糖、精鹽（淋滷晒鹽）與文教事業，興建臺南孔廟並建立官學與科舉考試。","奠定了臺灣漢人社會制度、文化與教育發展的基礎，陳永華後被供奉於臺南永華宮紀念。"]},{"id":"core-9","type":"core","tag":"I 臺南孔廟的建築與儒家思想","title":"臺南孔廟的建築與儒家思想","bullets":["臺南孔廟為「全臺首學」，以「大成殿」為祭祀孔子中心，以「明倫堂」為講習儒家經典與漢人文化的學校。","鄭氏政權引進儒家思想（仁義禮智信、修身齊家治國平天下），作為社會倫理道德與官員選拔的標準。","孔廟入口設有下馬碑，大成殿前露臺於教師節表演六佾舞，明倫堂前有「入德之門」，清代稱「臺灣府學」。","成為臺灣最早的最高學府與漢人文化重鎮，將儒家思想倫理融入臺灣傳統社會生活中。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-10","type":"core","tag":"J 大航海時期歷史遺跡與名稱線索","title":"大航海時期歷史遺跡與名稱線索","bullets":["現今臺灣仍保留許多大航海時期的遺跡與名稱，如安平古堡（熱蘭遮城外牆）、赤崁樓、嘉義紅毛井及三貂角地名。","歷代外來勢力在臺灣興建城堡、水井、教堂，並留下繪圖與文字紀錄（如《東西印度驚奇旅行記》）。","荷蘭開鑿紅毛井解決飲水問題；西班牙語Santiago音譯為三貂角；熱蘭遮城牆以糯米汁、糖水與蚵殼灰接合。","提供後人透過古蹟遺構與歷史文獻，重建並理解大航海時期臺灣多元族群交會的歷史樣貌。"]}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"荷蘭人在臺灣招募漢人開墾，主要是為了種植稻米外銷到歐洲賺取利潤。","right":"荷蘭人招募漢人主要是為了種植高經濟價值的「甘蔗」外銷蔗糖；種植稻米則是為了供本地漢人與軍民食用。 蔗糖才是對外輸出的主力經濟作物，稻米主要供本地食用，兩者用途與外銷方向不可混淆。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"西元1652年爆發的郭懷一事件，是漢人因為不滿荷蘭人強迫傳播基督教而發起的宗教戰爭。","right":"郭懷一事件是漢人因不滿荷蘭人「加重徵稅與高額剝削」（人頭稅等）而發起的武力反抗抗稅事件。 衝突核心原因是徵稅與經濟負擔過重，並非宗教信仰傳播衝突。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"鄭成功渡海攻打臺灣，主要是為了在安平地區設立觀光勝地並捕撈烏魚。","right":"鄭成功攻打臺灣的主要目的是為了尋求穩固的「反清基地」，並取得糧食自給與貿易財源。 鄭氏來臺是基於政治與軍事戰略考量（反清復明基地），非為了觀光或季節性捕魚。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"臺南的新營、左鎮，高雄的左營、前鎮等地名，是因為荷蘭人建立貿易城堡而得名。","right":"這些帶有「營」、「鎮」的地名，是鄭氏政權時期實施「軍隊駐守與農墾（屯墾）」所留下的歷史痕跡。 新營、左鎮、左營、前鎮皆與鄭氏軍隊屯田制度相關，非荷蘭人的貿易城堡。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"荷蘭人使用羅馬字母拼寫西拉雅等原住民族語言，是用來傳播天主教並教原住民族講英文。","right":"荷蘭人是用羅馬字母拼寫原住民族語言來傳播「基督教（新教）」，並非天主教或英文；契約文書俗稱「新港文書」。 荷蘭人傳播的是基督教（新教），西班牙人才是傳播天主教；羅馬字母是拼音工具而非英文。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"被尊稱為「全臺首學」的臺南孔廟，是由鄭成功親自下令興建，且學生上課的主殿稱為大成殿。","right":"臺南孔廟是在「鄭經」統治時期採納大臣「陳永華」建議興建；學生上課的地方是「明倫堂」，「大成殿」是祭祀孔子的主殿。 興建者為鄭經與陳永華（非鄭成功）；講習上課處為明倫堂，大成殿為祭祀主殿。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"經貿與農業開墾｜知識關係","chain":["大航海時代東亞貿易競爭與清廷海禁封鎖背景","荷蘭招漢人種甘蔗外銷與種稻引耕牛；鄭氏實施軍隊駐守屯墾及走私貿易","蔗糖與鹿皮成為出口主力，促進南部平原開發並留有新營、左鎮等屯墾地名"]},{"id":"logic-2","type":"chain","title":"反抗衝突與據點防禦｜知識關係","chain":["荷蘭東印度公司加重徵人頭稅及1651年蝗災饑荒","西元1652年郭懷一率漢人起義抗稅，遭荷蘭軍隊武力鎮壓","事後荷蘭人在赤崁興建普羅民遮城（今赤崁樓）加強防備"]},{"id":"logic-3","type":"chain","title":"外來勢力與族群互動｜知識關係","chain":["荷蘭、西班牙與鄭氏政權陸續進入臺灣拓展勢力","荷蘭以武力、傳教、頒權杖與地方會議管理原住民；西班牙交易硫磺傳天主教；鄭氏侵土地兵攻大肚王國","羅馬字新港文書成為土地契約史料，大肚王國勢力衰退瓦解"]},{"id":"logic-4","type":"chain","title":"漢人文教與制度建立｜知識關係","chain":["鄭氏政權欲鞏固臺灣治理基業並延續漢人文化正統","鄭經採納陳永華建議建立中央地方官制，興建臺南孔廟、設學校與科舉考試制度","開創全臺首學（大成殿祭孔、明倫堂授課），奠定臺灣漢人社會制度與文教基礎"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜荷蘭人與鄭氏政權在臺經營策略比較表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜大航海時期臺灣重大歷史事件與建築演變流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["荷蘭人的農業開墾","鄭氏政權的農業開墾","荷蘭人是以商業貿易為導向，招募漢人移民種植甘蔗外銷並種稻米與引進耕牛；鄭氏政權則是以軍事生存為導向，實施軍隊駐守開墾（屯墾），並在中南部留下新營、左鎮、前鎮等軍事相關地名。"],["新港文書（羅馬字母）","臺南孔廟（明倫堂）","新港文書是荷蘭傳教士用羅馬字母拼寫原住民族（西拉雅族）語言所留下的聖經與土地契約史料；臺南孔廟則是鄭經與陳永華建立的漢人儒家文化教育機構，明倫堂為講習儒家經典與培育人才的場所。"],["熱蘭遮城","普羅民遮城","熱蘭遮城（今安平古堡殘蹟）是西元1624年荷蘭人在大員建立的第一座貿易與防禦城堡；普羅民遮城（今赤崁樓）則是西元1652年郭懷一事件後，荷蘭人在赤崁興建用以防備漢人的第二座城堡。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","郭懷一事件","西元1652年發生於荷治時期的漢人反抗事件，因不滿荷蘭人加重徵稅與剝削而爆發，遭荷蘭軍隊武力鎮壓，事後荷蘭人興建普羅民遮城加強防備。"],["2","普羅民遮城","西元1653年荷蘭人在郭懷一事件後於赤崁興建的城堡，用以防備漢人，鄭氏時期改為承天府，現今基座上建有赤崁樓。"],["3","屯墾","鄭氏政權為解決數萬軍民糧食不足問題所實施的農業政策，讓軍隊在駐紮處開墾農田，在中南部留有新營、左鎮、前鎮等地名。"],["4","新港文書","荷蘭傳教士利用羅馬字母拼寫原住民族（西拉雅族）語言所產生的文本與契約，清代原漢土地交易時仍使用，為研究早期原住民族語言的關鍵史料。"],["5","大肚王國","大航海時期由臺灣中部臺中、彰化、南投一帶10至20個原住民族部落組成的聯盟，先後遭荷蘭人簽約結盟與鄭氏政權多次兵攻，最終勢力衰退瓦解。"],["6","陳永華","鄭氏政權重臣，輔佐鄭經治理臺灣，提議屯田、製糖、精鹽（瓦盤鹽田）並建議興建臺南孔廟與設立學校科舉，被尊稱為臺灣的諸葛孔明。"],["7","全臺首學","指西元1665年鄭氏政權在大臣陳永華建議下於臺南興建的全臺第一座孔廟，為當時臺灣傳授儒家思想與漢人文化的最高學府。"],["8","明倫堂","臺南孔廟內古代官方設立的學校講堂，專門講習儒家經典與培育地方行政人才，清代稱為臺灣府學。"],["9","大成殿","臺南孔廟內祭祀至聖先師孔子的主殿，露臺為每年教師節舉行祭孔大典表演六佾舞的場所。"],["10","三貂角","位於臺灣東北角的岬角，名稱源自十六世紀西班牙船艦來到該海域時以家鄉聖地牙哥（Santiago）命名，後經本地先民閩南語音譯而成。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"荷蘭與鄭氏農業開墾動機比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較荷蘭東印度公司與鄭氏政權在臺灣發展農業開墾的因果動機，下列敘述何者最符合歷史事實？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"郭懷一事件與普羅民遮城築城因果","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"西元1652年郭懷一事件平息後，荷蘭東印度公司在赤崁地區採取了哪一項具體的防禦措施？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜證據判讀","clue":"鄭氏屯墾與地名遺跡判讀","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"現今中南部有許多帶有「營」與「鎮」字的地名（如新營、左鎮、左營、前鎮），這些地名留下了什麼歷史證據？"}]}],"cloze":{"core-1":{"selector":".point","terms":["蔗糖與鹿皮"]},"core-2":{"selector":".point","terms":["耕牛"]},"core-3":{"selector":".point","terms":["普羅民遮城"]},"core-4":{"selector":".point","terms":["屯墾"]},"core-5":{"selector":".point","terms":["權杖"]},"core-6":{"selector":".point","terms":["新港文書"]},"core-7":{"selector":".point","terms":["大肚王國"]},"core-8":{"selector":".point","terms":["陳永華"]},"core-9":{"selector":".point","terms":["大成殿"]},"core-10":{"selector":".point","terms":["紅毛井"]},"mindmap-overview":{"selector":".mind-branch p","terms":["屯墾","普羅民遮城","新港文書","全臺首學"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":["屯墾"]},"trap-5":{"selector":".correct","terms":["新港文書"]},"trap-6":{"selector":".correct","terms":["陳永華"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["郭懷一事件","普羅民遮城","屯墾","新港文書","大肚王國","陳永華","全臺首學","明倫堂","大成殿","三貂角"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>經貿與農業開墾\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>大航海時代東亞貿易競爭與清廷海禁封鎖背景\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭招漢人種甘蔗外銷與種稻引耕牛；鄭氏實施軍隊駐守屯墾及走私貿易\u003c/p>\u003cp>\u003cb>結果：\u003c/b>蔗糖與鹿皮成為出口主力，促進南部平原開發並留有新營、左鎮等屯墾地名\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>反抗衝突與據點防禦\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭東印度公司加重徵人頭稅及1651年蝗災饑荒\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西元1652年郭懷一率漢人起義抗稅，遭荷蘭軍隊武力鎮壓\u003c/p>\u003cp>\u003cb>結果：\u003c/b>事後荷蘭人在赤崁興建普羅民遮城（今赤崁樓）加強防備\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>外來勢力與族群互動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭、西班牙與鄭氏政權陸續進入臺灣拓展勢力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭以武力、傳教、頒權杖與地方會議管理原住民；西班牙交易硫磺傳天主教；鄭氏侵土地兵攻大肚王國\u003c/p>\u003cp>\u003cb>結果：\u003c/b>羅馬字新港文書成為土地契約史料，大肚王國勢力衰退瓦解\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>漢人文教與制度建立\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>鄭氏政權欲鞏固臺灣治理基業並延續漢人文化正統\u003c/p>\u003cp>\u003cb>關係：\u003c/b>鄭經採納陳永華建議建立中央地方官制，興建臺南孔廟、設學校與科舉考試制度\u003c/p>\u003cp>\u003cb>結果：\u003c/b>開創全臺首學（大成殿祭孔、明倫堂授課），奠定臺灣漢人社會制度與文教基礎\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>大航海時期對臺的影響\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">荷蘭東印度公司（1624-1662）\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">鄭氏政權（1662-1683）\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>荷蘭東印度公司（1624-1662）\u003c/th>\u003cth>鄭氏政權（1662-1683）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>主要目的\u003c/td>\u003ctd>建立東亞貿易據點，獲取蔗糖、鹿皮與轉口貿易利潤\u003c/td>\u003ctd>尋求反清復明基地，追求糧食自給與維持海外貿易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>農業措施\u003c/td>\u003ctd>招募中國漢人移民來臺種甘蔗與稻米，引進耕牛與豌豆等作物\u003c/td>\u003ctd>實施軍隊駐紮開墾（屯墾），將荷蘭王田改為官田，鼓勵走私貿易\u003c/td>\u003c/tr>\u003ctr>\u003ctd>族群互動\u003c/td>\u003ctd>以武力、傳教（基督教）、頒授權杖及地方會議要求原住民族長老效忠\u003c/td>\u003ctd>派兵侵入原住民族生活範圍奪取土地糧食，多次攻打大肚王國致其瓦解\u003c/td>\u003c/tr>\u003ctr>\u003ctd>文化設施\u003c/td>\u003ctd>設立教堂與學校，用羅馬字母拼寫原住民族語言（新港文書）\u003c/td>\u003ctd>建立官制與科舉，採納陳永華建議於臺南興建全臺第一座孔廟（明倫堂、大成殿）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>由經營目的、農業措施、族群互動至文化設施，橫向比較荷蘭與鄭氏政權的政策異同。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論荷蘭人來臺是為了建立永久漢人政權，亦不能推論鄭氏政權完全沒有進行對外貿易。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，荷蘭人與鄭氏政權在發展農業開墾時，其核心動機有何最主要的差別？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>荷蘭人主要為了發展蔗糖外銷貿易與解決漢人糧食；鄭氏政權則主要為了提供龐大軍隊與移民所需的軍糧與生存基業。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">時間與事件\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史背景與過程細節\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">建築或地名遺跡影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>時間與事件\u003c/th>\u003cth>歷史背景與過程細節\u003c/th>\u003cth>建築或地名遺跡影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>西元1624年（荷蘭建堡）\u003c/td>\u003ctd>荷蘭人遭明朝驅逐離開澎湖，轉至大員建立貿易防禦據點\u003c/td>\u003ctd>興建熱蘭遮城（今安平古堡園區保留之熱蘭遮城外牆殘蹟）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1652-1653年（郭懷一事件）\u003c/td>\u003ctd>漢人因不滿荷蘭人徵稅太重爆發反抗遭鎮壓，荷蘭人隨後加強赤崁防禦\u003c/td>\u003ctd>興建普羅民遮城（清代大地震倒塌後改建為今赤崁樓）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1661-1662年（鄭成功驅荷）\u003c/td>\u003ctd>鄭成功為尋求反清基地率軍攻臺，荷蘭人投降退出臺灣\u003c/td>\u003ctd>將熱蘭遮城改稱「安平鎮」，普羅民遮城設為「承天府」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1665年起（鄭經與陳永華推文教）\u003c/td>\u003ctd>鄭經採納陳永華建議建立官制、學校與科舉考試制度\u003c/td>\u003ctd>興建臺南孔廟（包含祭祀大成殿與授課明倫堂，譽為全臺首學）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間順序從荷蘭建立熱蘭遮城、郭懷一事件、鄭成功驅荷至鄭經興建孔廟閱讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論普羅民遮城是荷蘭人在臺灣建立的第一座城堡，亦不能推論臺南孔廟是荷蘭人所建造。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，荷蘭人興建「普羅民遮城」（今赤崁樓）直接的歷史近因是什麼？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>西元1652年爆發郭懷一事件後，荷蘭人為了加強對赤崁地區漢人的防備與控制而興建。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>經貿與農業開墾\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>大航海時代東亞貿易競爭與清廷海禁封鎖背景\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭招漢人種甘蔗外銷與種稻引耕牛；鄭氏實施軍隊駐守屯墾及走私貿易\u003c/p>\u003cp>\u003cb>結果：\u003c/b>蔗糖與鹿皮成為出口主力，促進南部平原開發並留有新營、左鎮等屯墾地名\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>反抗衝突與據點防禦\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭東印度公司加重徵人頭稅及1651年蝗災饑荒\u003c/p>\u003cp>\u003cb>關係：\u003c/b>西元1652年郭懷一率漢人起義抗稅，遭荷蘭軍隊武力鎮壓\u003c/p>\u003cp>\u003cb>結果：\u003c/b>事後荷蘭人在赤崁興建普羅民遮城（今赤崁樓）加強防備\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>外來勢力與族群互動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>荷蘭、西班牙與鄭氏政權陸續進入臺灣拓展勢力\u003c/p>\u003cp>\u003cb>關係：\u003c/b>荷蘭以武力、傳教、頒權杖與地方會議管理原住民；西班牙交易硫磺傳天主教；鄭氏侵土地兵攻大肚王國\u003c/p>\u003cp>\u003cb>結果：\u003c/b>羅馬字新港文書成為土地契約史料，大肚王國勢力衰退瓦解\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>漢人文教與制度建立\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>鄭氏政權欲鞏固臺灣治理基業並延續漢人文化正統\u003c/p>\u003cp>\u003cb>關係：\u003c/b>鄭經採納陳永華建議建立中央地方官制，興建臺南孔廟、設學校與科舉考試制度\u003c/p>\u003cp>\u003cb>結果：\u003c/b>開創全臺首學（大成殿祭孔、明倫堂授課），奠定臺 async function addSnowNotes(all){
 const advice={
  core:{asset:'explain',title:'小雪的叮嚀｜把生活變化說出來',text:'別只背政策名稱！試著用「做了什麼 → 改變了什麼」說明這一頁，再想想不同角色的感受會不會一樣。'},
  logic:{asset:'check',title:'小雪的叮嚀｜先找線索，再下結論',text:'先圈出題目問的是背景、做法還是影響。遇到「全部、一定、只有」，記得回頭找證據，別急著選！'},
  answers:{asset:'explain',title:'小雪的叮嚀｜答對還要說得出理由',text:'核對後，挑一道錯題說說：我被哪個詞誤導？正確線索在哪裡？能解釋錯誤選項，才算真的學會了。'},
  figures:{asset:'check',title:'小雪的叮嚀｜看清楚圖在告訴你什麼',text:'先看圖名、圖例與單位。圖上沒有給的資料，就不要猜；用看得到的證據回答問題。'},
  traps:{asset:'shield',title:'小雪的叮嚀｜抓到陷阱的關鍵詞',text:'把錯誤說法改成正確句子，再說出理由。能解釋哪裡錯，比只記住答案更有用！'},
  compare:{asset:'check',title:'小雪的叮嚀｜比較同一個面向',text:'先看這一欄比較的是功能、時期，還是影響。用同一個標準對照，才不會把不同概念混在一起。'},
  keywords:{asset:'explain',title:'小雪的叮嚀｜把關鍵字變成一句話',text:'遮住說明，試著用自己的話解釋一個關鍵字，再搭配一個生活例子。說得出來，才算記得牢！'}
 };
 advice.mindmap={asset:'explain',title:'小雪的叮嚀｜把四條線連成故事',text:'先從中央主題說到四條主線，再用自己的話解釋它們如何連在一起。說得出關係，再補回關鍵詞！'};advice['question-types']={asset:'check',title:'小雪的叮嚀｜把方法帶進下一題',text:'先辨認題目問什麼，再找線索與證據。選好答案後，試著解釋其他選項為什麼不適合。'};for(const p of all){
  if(p.querySelector('.mascot-row img'))continue;
  const b=p.querySelector('.page-body'),last=b.lastElementChild;if(!last)continue;
  const free=b.getBoundingClientRect().bottom-last.getBoundingClientRect().bottom;
  let guide=advice[p.dataset.section];if(!guide||free<175)continue;
  if(p.querySelector('#core-c'))guide={asset:'explain',title:'小雪的叮嚀｜從工廠看見家庭生活',text:'想想看：工廠增加了哪些工作機會？收入能如何改變家庭生活與進修選擇？把生產、工作與生活連起來說。'};
  if(p.querySelector('#core-d'))guide={asset:'shield',title:'小雪的叮嚀｜便利與代價要一起看',text:'評估一項建設時，先找它改善了什麼，再問可能影響誰的健康、生活或生態。能看到不同立場，答案才完整。'};
  if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};
  if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

const paper=document.getElementById('paper-select');function setPaper(v){document.body.dataset.paper=['dot','ring','plain'].includes(v)?v:'dot';paper.value=document.body.dataset.paper;try{localStorage.setItem('sixuncle-paper',paper.value)}catch(e){}}try{setPaper(localStorage.getItem('sixuncle-paper')||'dot')}catch(e){setPaper('dot')}paper.onchange=()=>setPaper(paper.value);let didAnchor=false;document.addEventListener('book-ready',()=>{if(didAnchor)return;didAnchor=true;if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}))}});
window.__ready=false;document.fonts.ready.then(paginate);
</script></body></html>

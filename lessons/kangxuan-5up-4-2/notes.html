t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒5上4-2 大航海時代有哪些人經營臺灣？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"4-2","title":"大航海時代有哪些人經營臺灣？"},"questions":[{"question":"西元1624年荷蘭人來到臺灣，選擇從今臺南安平一帶登陸並建立城堡，其最主要的商業考量為何？","options":["為了開採高山的大理石外銷歐洲","為了建立大型工業區製造高鐵列車","為了將臺灣作為與中國、日本貿易的轉運據點","為了向當地原住民族推廣觀光休閒農業"],"answer":2,"explanation":"課文明確指出西元1624年荷蘭人為了將臺灣作為和中國、日本貿易的轉運據點，因而從今臺南安平一帶登陸並興建熱蘭遮城。","concept":"荷蘭人登陸大員與興建熱蘭遮城","skill":"概念理解","review":"core-1","evidence":"西元1624年,荷蘭人為了將臺灣作為和中國、日本貿易的轉運據點,從今臺南安平一帶登陸。","id":"q1","stem":"西元1624年荷蘭人來到臺灣，選擇從今臺南安平一帶登陸並建立城堡，其最主要的商業考量為何？","theme":"荷蘭人登陸大員與興建熱蘭遮城","explain":"課文明確指出西元1624年荷蘭人為了將臺灣作為和中國、日本貿易的轉運據點，因而從今臺南安平一帶登陸並興建熱蘭遮城。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"西元1652年爆發了漢人郭懷一率領農民反抗荷蘭統治的武力事件，導致這場抗爭爆發的主要導火線為何？","options":["荷蘭人強迫漢人放棄傳統信仰改信天主教","荷蘭人禁止漢人種植稻米與甘蔗","荷蘭士兵態度強硬欺壓漢人且對漢人徵收重稅","荷蘭人阻止漢人舉辦祭孔大典"],"answer":2,"explanation":"課文載明荷蘭士兵態度強硬欺壓漢人，加上乾旱減產難負擔重稅，積怨下引發郭懷一率領數千農民反抗。","concept":"荷蘭招墾、重稅與郭懷一事件","skill":"概念理解","review":"core-2","evidence":"荷蘭士兵態度強硬欺壓漢人，加上遇到乾旱減產，難以負擔重稅，西元1652年,漢人郭懷一率領數千農民反抗荷蘭人。","id":"q2","stem":"西元1652年爆發了漢人郭懷一率領農民反抗荷蘭統治的武力事件，導致這場抗爭爆發的主要導火線為何？","theme":"荷蘭招墾、重稅與郭懷一事件","explain":"課文載明荷蘭士兵態度強硬欺壓漢人，加上乾旱減產難負擔重稅，積怨下引發郭懷一率領數千農民反抗。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"西元1626年西班牙人登陸臺灣北部雞籠（今基隆）的社寮島（今和平島），興建了哪一座城堡作為貿易據點？","options":["普羅民遮城","承天府","聖薩爾瓦多城","熱蘭遮城"],"answer":2,"explanation":"西班牙人於西元1626年登陸雞籠社寮島，興建聖薩爾瓦多城作為經營北部貿易的城堡據點。","concept":"西班牙人占領北部與城堡建設","skill":"概念理解","review":"core-3","evidence":"西班牙人也在西元1626年登陸臺灣北部雞籠(基隆)的社寮島(今和平島)，建立聖薩爾瓦多城","id":"q3","stem":"西元1626年西班牙人登陸臺灣北部雞籠（今基隆）的社寮島（今和平島），興建了哪一座城堡作為貿易據點？","theme":"西班牙人占領北部與城堡建設","explain":"西班牙人於西元1626年登陸雞籠社寮島，興建聖薩爾瓦多城作為經營北部貿易的城堡據點。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"西元1642年荷蘭人派兵北上將西班牙人驅逐出臺灣，並接收淡水的聖多明哥城加以重建，這座城堡後來被俗稱為什麼？","options":["億載金城","赤崁樓","安平古堡","紅毛城"],"answer":3,"explanation":"荷蘭人驅逐西班牙人後重建淡水城堡，因漢人稱荷蘭人為「紅毛」，其城堡因而被稱為「紅毛城」。","concept":"荷蘭北上驅逐西班牙人與紅毛城","skill":"概念理解","review":"core-4","evidence":"因漢人稱荷蘭人為「紅毛」，其城堡被稱為「紅毛城」","id":"q4","stem":"西元1642年荷蘭人派兵北上將西班牙人驅逐出臺灣，並接收淡水的聖多明哥城加以重建，這座城堡後來被俗稱為什麼？","theme":"荷蘭北上驅逐西班牙人與紅毛城","explain":"荷蘭人驅逐西班牙人後重建淡水城堡，因漢人稱荷蘭人為「紅毛」，其城堡因而被稱為「紅毛城」。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"西元1661年鄭成功率軍從福建渡海攻打臺灣的荷蘭人，他選擇臺灣作為根據地最核心的戰略目的為何？","options":["受日本幕府全權委託前來建立高爾夫球場","為了取得反清復明的基地、維持貿易據點並解決軍糧不足","為了響應清帝國的招撫並開採石油","專程前來向原住民族傳播天主教"],"answer":1,"explanation":"課本記載鄭成功為了取得反清復明的基地、維持海上商業貿易據點及解決軍隊糧食不足，選擇渡海攻臺。","concept":"鄭成功渡海攻臺的原因與過程","skill":"概念理解","review":"core-5","evidence":"為了取得反清復明的基地、維持海上商業貿易的據點,以及解決軍隊糧食不足的問題,他選擇距離福建不遠的臺灣作為根據地","id":"q5","stem":"西元1661年鄭成功率軍從福建渡海攻打臺灣的荷蘭人，他選擇臺灣作為根據地最核心的戰略目的為何？","theme":"鄭成功渡海攻臺的原因與過程","explain":"課本記載鄭成功為了取得反清復明的基地、維持海上商業貿易據點及解決軍隊糧食不足，選擇渡海攻臺。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"西元1662年鄭成功擊敗荷蘭人後，在赤崁設立了哪一個行政機構，標誌著臺灣第一個漢人政權的建立？","options":["臺灣府","臺北府","承天府","總督府"],"answer":2,"explanation":"鄭成功在西元1662年於赤崁設立承天府，建立臺灣第一個漢人政權。","concept":"鄭氏第一個漢人政權與鄭經繼位經營","skill":"概念理解","review":"core-6","evidence":"西元1662年,鄭成功在赤崁(今臺南市中西區)設立承天府,成為第一個在臺灣建立的漢人政權。","id":"q6","stem":"西元1662年鄭成功擊敗荷蘭人後，在赤崁設立了哪一個行政機構，標誌著臺灣第一個漢人政權的建立？","theme":"鄭氏第一個漢人政權與鄭經繼位經營","explain":"鄭成功在西元1662年於赤崁設立承天府，建立臺灣第一個漢人政權。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"鄭氏政權統治時期，主要對外輸出哪些臺灣本地物產以賺取利潤並維持政權運作？","options":["香料與黃金","茶葉與煤礦","蔗糖與鹿皮","大理石與樟腦"],"answer":2,"explanation":"課文載明鄭經繼位後，輸出蔗糖與鹿皮，並與日本、中國及東南亞進行貿易賺取利潤。","concept":"鄭氏政權的東亞轉口貿易網絡","skill":"概念理解","review":"core-7","evidence":"輸出蔗糖與鹿皮，並與日本、中國及東南亞進行貿易，賺取利益。","id":"q7","stem":"鄭氏政權統治時期，主要對外輸出哪些臺灣本地物產以賺取利潤並維持政權運作？","theme":"鄭氏政權的東亞轉口貿易網絡","explain":"課文載明鄭經繼位後，輸出蔗糖與鹿皮，並與日本、中國及東南亞進行貿易賺取利潤。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"民間與歷史上常尊稱鄭成功為「國姓爺」，這個特別稱呼的主要由來為何？","options":["因其發明了用姓氏劃分貿易區域的制度","因其對明帝國忠心，獲明朝皇帝賜予國姓「朱」並改名成功","因荷蘭人賜予他國籍與皇室姓氏","因他是第一個在臺灣進行全島人口普查的人"],"answer":1,"explanation":"鄭成功因對明帝國忠心耿耿，獲明朝皇帝賜國姓「朱」並改名成功，後人因而尊稱他為「國姓爺」。","concept":"鄭成功尊稱國姓爺與開臺聖王由來","skill":"概念理解","review":"core-8","evidence":"明帝國皇帝對他賞識有加,賜國姓「朱」,並改名「成功」……因此後人常用「成功」、「延平」與「國姓爺」來稱呼或代表他。","id":"q8","stem":"民間與歷史上常尊稱鄭成功為「國姓爺」，這個特別稱呼的主要由來為何？","theme":"鄭成功尊稱國姓爺與開臺聖王由來","explain":"鄭成功因對明帝國忠心耿耿，獲明朝皇帝賜國姓「朱」並改名成功，後人因而尊稱他為「國姓爺」。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"關於宜蘭「龜山島」由來的民間傳說與歷史事實，下列敘述何者符合歷史學的正確觀念？","options":["龜山島是西班牙人在西元1626年開採大理石後形成的廢渣山","龜山島確實是鄭成功親自用大炮射擊烏龜精留下的真實歷史遺跡","龜山島是荷蘭人在西元1624年用人工堆石建造的防禦要塞","龜山島由來的炮擊傳說是先民流傳故事，歷史記載鄭成功並未去過宜蘭"],"answer":3,"explanation":"課本強調傳說是早期先民流傳的故事，可能與歷史事實不同；史料記載鄭成功未曾去過宜蘭，炮擊烏龜精純屬民間傳說。","concept":"歷史事實與龜山島傳說的辨析","skill":"概念理解","review":"core-9","evidence":"傳說是早期先民流傳下來的故事,這些故事可能與歷史事實不同,也可能沒有發生。","id":"q9","stem":"關於宜蘭「龜山島」由來的民間傳說與歷史事實，下列敘述何者符合歷史學的正確觀念？","theme":"歷史事實與龜山島傳說的辨析","explain":"課本強調傳說是早期先民流傳的故事，可能與歷史事實不同；史料記載鄭成功未曾去過宜蘭，炮擊烏龜精純屬民間傳說。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"西元1653年荷蘭人在赤崁興建了「普羅民遮城」（今赤崁樓），其興建的直接背景與事件為何？","options":["為了招募中國農民來臺種植茶樹","為了歡迎鄭成功軍隊來臺設立承天府","為了驅逐占領北部的西班牙人","在平息西元1652年郭懷一事件後，為了加強對赤崁地區的防備"],"answer":3,"explanation":"西元1652年爆發郭懷一事件，荷蘭人鎮壓後，於次年（1653年）在赤崁興建普羅民遮城以擴大防衛。","concept":"荷蘭招墾、重稅與郭懷一事件","skill":"概念理解","review":"core-2","evidence":"西元1653年,荷蘭人在赤崁興建普羅民遮城(現址為赤崁樓),以擴大防衛。","id":"q10","stem":"西元1653年荷蘭人在赤崁興建了「普羅民遮城」（今赤崁樓），其興建的直接背景與事件為何？","theme":"荷蘭招墾、重稅與郭懷一事件","explain":"西元1652年爆發郭懷一事件，荷蘭人鎮壓後，於次年（1653年）在赤崁興建普羅民遮城以擴大防衛。","reviewText":"核心 2","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 荷蘭人登陸大員與興建熱蘭遮城","title":"荷蘭人登陸大員與興建熱蘭遮城","bullets":["西元1624年荷蘭人從臺南安平（大員）一帶登陸並建立熱蘭遮城。","為了將臺灣作為與中國、日本貿易的轉運據點及確保安全。","登陸後建立熱蘭遮城（今安平古堡區域內），並逐步向外擴張統治原住民。","確立了荷蘭人在臺灣南部的貿易與防衛中心，開啟荷治時期。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 荷蘭招墾、重稅與郭懷一事件","title":"荷蘭招墾、重稅與郭懷一事件","bullets":["西元1652年爆發漢人郭懷一率領農民反抗荷蘭統治的郭懷一事件。","荷蘭士兵態度強硬欺壓漢人，加上乾旱減產難負擔稅金。","郭懷一率數千農民手持竹杖農具反抗火槍，戰死失敗收場。","荷蘭人隨後於西元1653年興建普羅民遮城（今赤崁樓）以擴大防衛。"]},{"id":"core-3","type":"core","tag":"C 西班牙人占領北部與城堡建設","title":"西班牙人占領北部與城堡建設","bullets":["西元1626年西班牙人登陸雞籠（基隆）社寮島（今和平島）建立聖薩爾瓦多城。","為了經營東亞貿易，向中國商人購買瓷器與絲綢等商品。","建立社寮島聖薩爾瓦多城與淡水聖多明哥城（今紅毛城前身）。","形成大航海時代南部荷蘭人與北部西班牙人南北對峙的局勢。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 荷蘭北上驅逐西班牙人與紅毛城","title":"荷蘭北上驅逐西班牙人與紅毛城","bullets":["西元1642年荷蘭人派兵北上成功將西班牙人驅逐出臺灣。","荷蘭人為了獨占臺灣的商業與經濟利益。","荷蘭勢力擴張至臺灣北部，接收並重建淡水聖多明哥城。","因漢人稱荷蘭人為「紅毛」，其城堡被稱為「紅毛城」，荷蘭人成為當時唯一歐洲統治勢力。"]},{"id":"core-5","type":"core","tag":"E 鄭成功渡海攻臺的原因與過程","title":"鄭成功渡海攻臺的原因與過程","bullets":["西元1661年鄭成功從福建率軍經澎湖渡海攻打臺灣的荷蘭人。","為尋求反清復明基地、維持海上商業據點及解決軍隊糧食不足。","先攻取普羅民遮城，再圍攻熱蘭遮城，西元1662年獲勝驅逐荷蘭人。","結束荷蘭人38年統治，開啟鄭氏政權經營臺灣時期。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 鄭氏第一個漢人政權與鄭經繼位經營","title":"鄭氏第一個漢人政權與鄭經繼位經營","bullets":["西元1662年鄭成功在赤崁設立承天府，建立第一個漢人政權。","鄭成功同年病逝，由兒子鄭經繼承並繼續經營臺灣。","鄭經輸出蔗糖與鹿皮，並與日本、中國及東南亞進行貿易賺取利益。","奠定了臺灣漢人社會基礎，直到西元1683年清帝國攻臺、1684年納入清版圖。"]},{"id":"core-7","type":"core","tag":"G 鄭氏政權的東亞轉口貿易網絡","title":"鄭氏政權的東亞轉口貿易網絡","bullets":["鄭氏政權利用臺灣優越地理位置，成為東亞貿易重要轉運站。","臺灣位於亞洲東部海航必經之地，便利連接中日與東南亞。","輸出蔗糖與鹿皮，轉運中國瓷器與絲綢；輸入軍需品、藥材、布匹、香料與銀。","維持了鄭氏政權的經濟命脈與軍事財源。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 鄭成功尊稱國姓爺與開臺聖王由來","title":"鄭成功尊稱國姓爺與開臺聖王由來","bullets":["鄭成功原名森，獲明帝國皇帝賜國姓「朱」並改名「成功」。","因對明帝國忠心，獲賜國姓並受封延平郡王。","後人常用「國姓爺」、「延平」、「開山王」或「開臺聖王」尊稱他。","在臺南設有延平郡王祠等廟宇，表達後人對其開臺事蹟的紀念。"]},{"id":"core-9","type":"core","tag":"I 歷史事實與龜山島傳說的辨析","title":"歷史事實與龜山島傳說的辨析","bullets":["宜蘭龜山島流傳著鄭成功軍隊砲擊烏龜精變石島的傳說故事。","傳說為早期先民流傳故事，可能與歷史事實不同或未發生。","歷史記載鄭成功並未去過宜蘭，炮擊烏龜精純屬民間傳說。","提醒人們研讀歷史時，應明確區分真實歷史事實與民間傳說。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"西元1624年荷蘭人登陸臺灣時，最先建造的城堡是位於赤崁的普羅民遮城（今赤崁樓）。","right":"荷蘭人西元1624年最先建造的是位於安平的熱蘭遮城；普羅民遮城是西元1653年郭懷一事件後才建造的。 熱蘭遮城（1624年）早於普羅民遮城（1653年），兩座城堡建造的時間與地點不可混淆。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"西元1652年爆發的郭懷一事件，是漢人因為不滿荷蘭人強迫傳播基督教而發起的宗教戰爭。","right":"郭懷一事件是因荷蘭士兵態度強硬欺壓漢人，加上乾旱減產難負擔重稅而引發的抗稅反抗。 事件主因是士兵欺壓與重稅剝削，並非宗教信仰衝突。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"淡水紅毛城最初是由荷蘭人於西元1626年登陸淡水時所建造的城堡。","right":"淡水紅毛城的前身是西班牙人於西元1626年建造的聖多明哥城，1642年荷蘭人驅逐西班牙人後才重建。 西班牙人先建造聖多明哥城，荷蘭人驅逐西班牙人後接管重建，因漢人稱荷蘭人為紅毛而俗稱紅毛城。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"鄭成功因為率軍將荷蘭人驅逐出臺灣，深得清帝國皇帝賞識而獲賜國姓「朱」與延平郡王封號。","right":"賜國姓「朱」與封延平郡王是「明帝國」皇帝所賜予，當時鄭成功是堅持「反清復明」抗擊清帝國。 鄭成功忠於明帝國並抗擊清帝國，賜姓封爵皆來自明帝國皇帝，非清帝國。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"鄭成功在西元1662年擊敗荷蘭人後，在赤崁設立承天府並親自治理臺灣長達二十多年。","right":"鄭成功於西元1662年設立承天府後不久（同年六月）即病逝，後續經營主要由其子鄭經繼承管理。 鄭成功建立政權同年即病逝，長期經營臺灣的是其子鄭經。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"宜蘭著名的龜山島是因為鄭成功率軍經過宜蘭時，親自下令用大炮射擊烏龜精而變成的真實歷史事實。","right":"這是民間流傳的傳說故事，歷史記載鄭成功根本沒有去過宜蘭，不能當作真實發生的歷史事實。 歷史記載鄭成功未去過宜蘭，龜山島由來屬於民間傳說而非歷史事實。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"荷蘭人在臺統治與轉變｜知識關係","chain":["1624年登陸安平建熱蘭遮城作為中日貿易轉運據點","招漢人種稻種糖出口獲利，重稅與士兵欺壓引發1652年郭懷一事件，1653年建普羅民遮城","1642年北上驅逐西班牙人獨占臺灣，1662年遭鄭成功擊敗撤離"]},{"id":"logic-2","type":"chain","title":"西班牙人北部經營與撤離｜知識關係","chain":["1626年登陸雞籠社寮島（和平島）建聖薩爾瓦多城","淡水建聖多明哥城（紅毛城前身），向中國商人購買瓷器絲綢","1642年遭荷蘭人派兵北上驅逐，勢力退出臺灣"]},{"id":"logic-3","type":"chain","title":"鄭成功渡海攻臺與建政｜知識關係","chain":["明清交替之際尋求反清復明基地、貿易據點與軍糧來源","1661年由福建經澎湖攻臺，1662年擊敗荷蘭人設承天府","建立第一個漢人政權，同年病逝由子鄭經繼承經營"]},{"id":"logic-4","type":"chain","title":"鄭氏貿易與清領轉折｜知識關係","chain":["利用臺灣地理位置優勢作為東亞貿易轉運站","輸出蔗糖與鹿皮，轉運瓷器絲綢；輸入軍需品、藥材、香料與銀","1683年清帝國派兵攻打，1684年臺灣正式納入清帝國版圖"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜大航海時代臺灣主要經營者據點與活動對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜大航海時代臺灣經營者年代演變流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["熱蘭遮城","普羅民遮城","熱蘭遮城（今安平古堡）是荷蘭人西元1624年登陸安平建立的第一座防禦與貿易城堡；普羅民遮城（今赤崁樓）則是荷蘭人於西元1652年郭懷一事件後，在西元1653年於赤崁興建以擴大防衛區域的城堡。"],["聖薩爾瓦多城","聖多明哥城（紅毛城）","聖薩爾瓦多城是西班牙人西元1626年在雞籠社寮島（今和平島）建立的北部貿易據點城堡；聖多明哥城則是西班牙人在淡水建立的據點，後經荷蘭人重建與歷代修築稱為紅毛城。"],["歷史事實","民間傳說","歷史事實是實際發生且有明確史料記錄的事件（如鄭成功1662年擊敗荷蘭人設承天府）；民間傳說則是先民口耳流傳的故事，可能與事實不符或未曾發生（如鄭成功炮擊烏龜精變龜山島）。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","熱蘭遮城","西元1624年荷蘭人在臺南安平（大員）興建的城堡，為其在臺貿易與統治中心，現址為安平古堡。"],["2","普羅民遮城","西元1653年荷蘭人在郭懷一事件後於赤崁興建的城堡，用以擴大防衛，現址為赤崁樓。"],["3","郭懷一事件","西元1652年漢人郭懷一因不滿荷蘭士兵欺壓及重稅負擔，率數千農民持竹杖農具起義反抗，最終失敗戰死。"],["4","聖薩爾瓦多城","西元1626年西班牙人在雞籠社寮島（今基隆和平島）興建的城堡，為經營北部的貿易據點。"],["5","紅毛城","位於淡水，前身為西班牙人建造的聖多明哥城，後經荷蘭人重建，因漢人稱荷蘭人為「紅毛」而得名。"],["6","承天府","西元1662年鄭成功擊敗荷蘭人後於赤崁（今臺南市中西區）設立的行政中心，為臺灣第一個漢人政權。"],["7","鄭經","鄭成功之子，西元1662年繼位治理臺灣，積極拓展對日本、中國及東南亞的轉口貿易。"],["8","延平郡王","明帝國皇帝賜予鄭成功的封號，臺南設有延平郡王祠以紀念其開臺功績。"],["9","國姓爺","鄭成功的尊稱，因其對明帝國忠心，獲明朝皇帝賜國姓「朱」並改名成功，民間因而尊稱為國姓爺。"],["10","龜山島傳說","民間流傳鄭成功軍隊砲擊烏龜精使其沉海化為龜山島的故事，但歷史記載鄭成功並未去過宜蘭，屬於民間傳說。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"熱蘭遮城與普羅民遮城之比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較荷蘭人在臺興建的「熱蘭遮城」與「普羅民遮城」，兩座城堡在建立時間與歷史背景上的明確差異為何？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"荷蘭驅逐西班牙之因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"西元1642年荷蘭人派兵北上驅逐西班牙人，這項軍事行動背後的最主要因果動機為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"荷蘭與西班牙據點之比較分類","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較大航海時代「荷蘭人」與「西班牙人」在臺灣建立據點的地理位置與城堡，下列組合何者正確？"}]}],"cloze":{"core-1":{"selector":".point","terms":["熱蘭遮城"]},"core-2":{"selector":".point","terms":["郭懷一事件"]},"core-3":{"selector":".point","terms":["聖薩爾瓦多城"]},"core-4":{"selector":".point","terms":["紅毛城"]},"core-5":{"selector":".point","terms":["反清復明"]},"core-6":{"selector":".point","terms":["承天府"]},"core-7":{"selector":".point","terms":["轉運站"]},"core-8":{"selector":".point","terms":["國姓爺"]},"core-9":{"selector":".point", 03csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>鄭氏貿易與清領轉折\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>利用臺灣地理位置優勢作為東亞貿易轉運站\u003c/p>\u003cp>\u003cb>關係：\u003c/b>輸出蔗糖與鹿皮，轉運瓷器絲綢；輸入軍需品、藥材、香料與銀\u003c/p>\u003cp>\u003cb>結果：\u003c/b>1683年清帝國派兵攻打，1684年臺灣正式納入清帝國版圖\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>大航海時代有哪些人經營臺灣？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">經營者\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">來臺時間與據點建築\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">主要活動與歷史意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>經營者\u003c/th>\u003cth>來臺時間與據點建築\u003c/th>\u003cth>主要活動與歷史意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>荷蘭人\u003c/td>\u003ctd>西元1624年登陸安平建熱蘭遮城；1653年建普羅民遮城\u003c/td>\u003ctd>招漢人種甘蔗稻米外銷蔗糖；1642年驅逐西班牙人；1662年敗離\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西班牙人\u003c/td>\u003ctd>西元1626年登陸雞籠建聖薩爾瓦多城；淡水建聖多明哥城\u003c/td>\u003ctd>經營北部貿易購買瓷器絲綢；西元1642年遭荷蘭人派兵驅逐離臺\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鄭成功\u003c/td>\u003ctd>西元1661年渡海，1662年設承天府（赤崁）\u003c/td>\u003ctd>擊敗荷蘭人建立第一個漢人政權，作為反清復明與貿易基地\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鄭經\u003c/td>\u003ctd>西元1662年繼位至1683年降清\u003c/td>\u003ctd>積極與日本、中國、東南亞貿易，輸出蔗糖鹿皮賺取利潤\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>橫向比較荷蘭人、西班牙人、鄭成功與鄭經等經營者的年代、據點城堡與主要活動。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論西班牙人曾占領臺灣南部，亦不能推論鄭成功親自治理臺灣二十年以上。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，荷蘭人與西班牙人在臺灣建立的最初城堡據點分別位於何處？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>荷蘭人最初據點為南部安平的熱蘭遮城；西班牙人最初據點為北部雞籠（基隆）社寮島的聖薩爾瓦多城。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">年代年份\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">關鍵歷史事件\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史影響與政權轉變\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>年代年份\u003c/th>\u003cth>關鍵歷史事件\u003c/th>\u003cth>歷史影響與政權轉變\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>西元1624年\u003c/td>\u003ctd>荷蘭人登陸安平建熱蘭遮城\u003c/td>\u003ctd>開啟荷蘭人在臺灣南部的貿易與殖民統治\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1626年\u003c/td>\u003ctd>西班牙人登陸雞籠建聖薩爾瓦多城\u003c/td>\u003ctd>形成南部荷蘭人與北部西班牙人南北對峙局勢\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1642年\u003c/td>\u003ctd>荷蘭人派兵北上驅逐西班牙人\u003c/td>\u003ctd>荷蘭人成為當時唯一在臺灣經營據點的歐洲勢力\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1662年\u003c/td>\u003ctd>鄭成功擊敗荷蘭人建立承天府\u003c/td>\u003ctd>荷蘭人撤離，臺灣出現第一個漢人政權（鄭氏政權）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間先後順序（1624→1626→1642→1662）梳理大航海時代臺灣經營者的更替歷程。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論西元1624年前臺灣就已有歐洲政權建立城堡統治。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，西元1642年臺灣的歐洲勢力發生了什麼重大轉變？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>荷蘭人派兵北上將西班牙人驅逐出臺灣，使荷蘭人成為當時唯一在臺灣經營據點的歐洲勢力。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>荷蘭人在臺統治與轉變\u003c/h4>\u003cp>\u003cb>線 function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}
if(e.target.id==='reset'){answers={};try{localStorage.removeItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson)}catch(e){}document.querySelectorAll('.option input').forEach(im=>im.checked=false);document.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('is-correct','is-wrong'));$('.score-text').textContent='已清除作答。';}});
new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["熱蘭遮城"]},"core-2":{"selector":".point","terms":["郭懷一事件"]},"core-3":{"selector":".point","terms":["聖薩爾瓦多城"]},"core-4":{"selector":".point","terms":["紅毛城"]},"core-5":{"selector":".point","terms":["反清復明"]},"core-6":{"selector":".point","terms":["承天府"]},"core-7":{"selector":".point","terms":["轉運站"]},"core-8":{"selector":".point","terms":["國姓爺"]},"core-9":{"selector":".point","terms":["歷史事實"]},"mindmap-overview":{"selector":".mind-branch p","terms":["郭懷一事件","聖多明哥城","承天府","轉運站"]},"trap-1":{"selector":".correct","terms":["熱蘭遮城"]},"trap-2":{"selector":".correct","terms":["郭懷一事件"]},"trap-3":{"selector":".correct","terms":["紅毛城"]},"trap-4":{"selector":".correct","terms":["反清復明"]},"trap-5":{"selector":".correct","terms":["承天府"]},"trap-6":{"selector":".correct","terms":["歷史事實"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["熱蘭遮城","普羅民遮城","郭懷一事件","聖薩爾瓦多城","紅毛城","承天府","鄭經","延平郡王","國姓爺","龜山島傳說"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });
 document.getElementById('mode-cloze').setAttribute('aria-pressed',String(clozeMode));document.getElementById('mode-full').setAttribute('aria-pressed',String(!clozeMode));
 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);
document.addEventListener('click',e=>toggleCloze(e.target.closest('#pages .cloze-slot')));
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cloze-slot')&&clozeMode){e.preventDefault();toggleCloze(e.target)}});
document.getElementById('mode-cloze').onclick=()=>{clozeMode=true;refreshCloze()};
document.getElementById('mode-full').onclick=()=>{clozeMode=false;refreshCloze()};
document.getElementById('mode-reset').onclick=refreshCloze;
document.body.classList.add('student-cloze');

async function addSnowNotes(all){
 const advice={

  logic:{asset:'check',title:'小雪的叮嚀｜先找線索，再下結論',text:'先圈出題目問的是背景、做法還是影響。遇到「全部、一定、只有」，記得回頭找證據，別急著選！'},
  answers:{asset:'explain',title:'小雪的叮嚀｜答對還要說得出理由',text:'核對後，挑一道錯題說說：我被哪個詞誤導？正確線索在哪裡？能解釋錯誤選項，才算真的學會了。'},
  figures:{asset:'check',title:'小雪的叮嚀｜看清楚圖在告訴你什麼',text:'先看圖名、圖例與單位。圖上沒有給的資料，就不要猜；用看得到的證據回答問題。'},
  traps:{asset:'shield',title:'小雪的叮嚀｜抓到陷阱的關鍵詞',text:'把錯誤說法改成正確句子，再說出理由。能解釋哪裡錯，比只記住答案更有用！'},
  compare:{asset:'check',title:'小雪的叮嚀｜比較同一個面向',text:'先看這一欄比較的是功能、時期，還是影響。用同一個標準對照，才不會把不同概念混在一起。'},
  keywords:{asset:'explain',title:'小雪的叮嚀｜把關鍵字變成一句話',text:'遮住說明，試著用自己的話解釋一個關鍵字，再搭配一個生活例子。說得出來，才算記得牢！'}
 };
 advice.mindmap={asset:'explain',title:'小雪的叮嚀｜把四條線連成故事',text:'先從中央主題說到四條主線，再用自己的話解釋它們如何連在一起。說得出關係，再補回關鍵詞！'};advice['question-types']={asset:'check',title:'小雪的叮嚀｜把方法帶進下一題',text:'先辨認題目問什麼，再找線索與證據。選好答案後，試著解釋其他選項為什麼不適合。'};for(const p of all){
  if(p.querySelector('.mascot-row img'))continue;
  const b=p.querySelector('.page-body'),last=b.lastElementChild;if(!last)continue;
  const free=b.getBoundingClientRect().bottom-last.getBoundingClientRect().bottom;
  let guide=advice[p.dataset.section];if(!guide||free<175)continue;
  if(p.querySelector('#core-c'))guide={asset:'explain',title:'小雪的叮嚀｜從工廠看見家庭生活',text:'想想看：工廠增加了哪些工作機會？收入能如何改變家庭生活與進修選擇？把生產、工作與生活連起來說。'};
  if(p.querySelector('#core-d'))guide={asset:'shield',title:'小雪的叮嚀｜便利與代價要一起看',text:'評估一項建設時，先找它改善了什麼，再問可能影響誰的健康、生活或生態。能看到不同立場，答案才完整。'};
  if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};
  if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;

 }

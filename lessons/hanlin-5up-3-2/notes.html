t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>翰林5上3-2 開港通商為什麼改變了臺灣的發展？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"翰林版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"3-2","title":"開港通商為什麼改變了臺灣的發展？"},"questions":[{"question":"西元1860年代，西方國家迫使清帝國開放臺灣對外通商，下列哪一個港口屬於當時開放的四大通商港口之一？","options":["鹿港","打狗（今高雄）","東港","笨港"],"answer":1,"explanation":"西元1860年代清帝國開放的四大通商港口為雞籠（今基隆）、淡水、安平（今臺南）與打狗（今高雄）。鹿港非此時期開放之四大通商港口。","concept":"開港通商背景與四大通商港口","skill":"概念理解","review":"core-1","evidence":"西元1860年代,西方國家迫使清帝國開放臺灣的雞籠、淡水、安平、打狗作為通商港口。","id":"q1","stem":"西元1860年代，西方國家迫使清帝國開放臺灣對外通商，下列哪一個港口屬於當時開放的四大通商港口之一？","theme":"開港通商背景與四大通商港口","explain":"西元1860年代清帝國開放的四大通商港口為雞籠（今基隆）、淡水、安平（今臺南）與打狗（今高雄）。鹿港非此時期開放之四大通商港口。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"開港通商後，外國政府與商人紛紛在臺灣設立機構。關於「領事館」與「洋行」的功能，下列敘述何者正確？","options":["領事館供外交官辦公與接待使節；洋行則為外商成立進行商品交易","領事館與洋行皆是清帝國設立的官辦學校","洋行是外國政府設立，供外交官員辦公居住","領事館為外國商人成立，專門買賣茶葉與蔗糖"],"answer":0,"explanation":"領事館為外國政府設立供官員辦公居住及接待使節；洋行則為外國商人成立的商業機構，負責商品交易與外銷。","concept":"領事館與洋行之功能與實例","skill":"概念理解","review":"core-2","evidence":"西方國家在臺灣設立領事館,作為官員辦公場所;外國商人則在港口設立洋行","id":"q2","stem":"開港通商後，外國政府與商人紛紛在臺灣設立機構。關於「領事館」與「洋行」的功能，下列敘述何者正確？","theme":"領事館與洋行之功能與實例","explain":"領事館為外國政府設立供官員辦公居住及接待使節；洋行則為外國商人成立的商業機構，負責商品交易與外銷。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"開港通商後，大稻埕因鄰近哪一個通商港口，成為北部茶葉與樟腦加工集散地，進而崛起為新興市街？","options":["淡水港","安平港","打狗港","雞籠港"],"answer":0,"explanation":"大稻埕臨近淡水港，方便集中北部產區的茶葉與樟腦進行加工與交易，因而發展為新興商業市街。","concept":"大稻埕興起與經濟重心北移","skill":"概念理解","review":"core-3","evidence":"鄰近淡水港的大稻埕,因為是茶與樟腦的集散地,促使當地商業興盛,成為新興市街。","id":"q3","stem":"開港通商後，大稻埕因鄰近哪一個通商港口，成為北部茶葉與樟腦加工集散地，進而崛起為新興市街？","theme":"大稻埕興起與經濟重心北移","explain":"大稻埕臨近淡水港，方便集中北部產區的茶葉與樟腦進行加工與交易，因而發展為新興商業市街。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"西元1874年日本以琉球人民在臺灣南端遭原住民殺害為藉口，出兵攻打臺灣南部部落，這場歷史事件被稱為：","options":["戴潮春事件","林爽文事件","牡丹社事件","郭懷一事件"],"answer":2,"explanation":"西元1874年日本以西元1871年琉球船民受害為藉口，出兵攻打臺灣南部的牡丹社等部落，稱為牡丹社事件。","concept":"牡丹社事件與清帝國治臺轉變","skill":"概念理解","review":"core-4","evidence":"西元1874年,日本以琉球人民在臺灣南端遭原住民殺害為藉口,出兵攻打臺灣南部的牡丹社等部落,稱為「牡丹社事件」。","id":"q4","stem":"西元1874年日本以琉球人民在臺灣南端遭原住民殺害為藉口，出兵攻打臺灣南部部落，這場歷史事件被稱為：","theme":"牡丹社事件與清帝國治臺轉變","explain":"西元1874年日本以西元1871年琉球船民受害為藉口，出兵攻打臺灣南部的牡丹社等部落，稱為牡丹社事件。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"牡丹社事件後，清廷派沈葆楨來臺處理善後並加強海防。沈葆楨在臺南修建了臺灣第一座西式砲臺，該砲臺名稱為何？","options":["億載金城（二鯤鯓砲臺）","普羅民遮城","熱蘭遮城","聖薩爾瓦多城"],"answer":0,"explanation":"沈葆楨在臺南修建的二鯤鯓砲臺（億載金城），是沈葆楨在臺灣修建的第一座西式砲臺，城牆呈凹凸狀以利防衛與射擊。","concept":"沈葆楨來臺防務與二鯤鯓砲臺","skill":"概念理解","review":"core-5","evidence":"位於臺南的二鯤鯓砲臺,為沈葆楨在臺修建的第一座西式砲臺。","id":"q5","stem":"牡丹社事件後，清廷派沈葆楨來臺處理善後並加強海防。沈葆楨在臺南修建了臺灣第一座西式砲臺，該砲臺名稱為何？","theme":"沈葆楨來臺防務與二鯤鯓砲臺","explain":"沈葆楨在臺南修建的二鯤鯓砲臺（億載金城），是沈葆楨在臺灣修建的第一座西式砲臺，城牆呈凹凸狀以利防衛與射擊。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"西元1885年清帝國宣布將臺灣獨立建省，並任命哪一位官員為臺灣建省後的首任巡撫？","options":["施琅","劉銘傳","沈葆楨","陳永華"],"answer":1,"explanation":"清法戰爭後清廷重視臺灣戰略地位，西元1885年宣布臺灣建省，並任命劉銘傳為臺灣建省後的首任巡撫。","concept":"清法戰爭與臺灣建省首任巡撫","skill":"概念理解","review":"core-6","evidence":"西元1885年,清帝國宣布將原屬福建省的臺灣建省,並任命劉銘傳為首任巡撫。","id":"q6","stem":"西元1885年清帝國宣布將臺灣獨立建省，並任命哪一位官員為臺灣建省後的首任巡撫？","theme":"清法戰爭與臺灣建省首任巡撫","explain":"清法戰爭後清廷重視臺灣戰略地位，西元1885年宣布臺灣建省，並任命劉銘傳為臺灣建省後的首任巡撫。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"劉銘傳擔任臺灣巡撫期間積極推動現代化建設，下列哪一項是劉銘傳在臺灣推動的交通與訊息建設？","options":["修建基隆至新竹的鐵路並架設電報系統","開鑿八堡圳與瑠公圳","建造安平熱蘭遮城","興建桃園台地的千座埤塘"],"answer":0,"explanation":"劉銘傳積極推動現代化建設，包括修建基隆到新竹間的鐵路、購入騰雲號火車頭、購置新式輪船與架設電報系統。","concept":"劉銘傳與臺灣現代化建設","skill":"概念理解","review":"core-7","evidence":"修建基隆到新竹之間的鐵路、購置新式輪船通行兩岸、架設電報系統……成為臺灣邁向現代化發展的起點。","id":"q7","stem":"劉銘傳擔任臺灣巡撫期間積極推動現代化建設，下列哪一項是劉銘傳在臺灣推動的交通與訊息建設？","theme":"劉銘傳與臺灣現代化建設","explain":"劉銘傳積極推動現代化建設，包括修建基隆到新竹間的鐵路、購入騰雲號火車頭、購置新式輪船與架設電報系統。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"英國外交官斯文豪深入臺灣山林調查野生動物，發表的哪一份研究報告成為臺灣歷史上第一份完整的鳥類記錄？","options":["《新港文書》","《東亞貿易考》","《福爾摩沙鳥類誌》","《臺灣府誌》"],"answer":2,"explanation":"斯文豪發表《福爾摩沙鳥類誌》，為臺灣歷史上第一份完整的鳥類紀錄報告，並發現命名多種臺灣特有新物種。","concept":"斯文豪與臺灣自然史研究","skill":"概念理解","review":"core-8","evidence":"英國人斯文豪以外交官員的身分來到臺灣並深入山林……發表多篇研究報告。","id":"q8","stem":"英國外交官斯文豪深入臺灣山林調查野生動物，發表的哪一份研究報告成為臺灣歷史上第一份完整的鳥類記錄？","theme":"斯文豪與臺灣自然史研究","explain":"斯文豪發表《福爾摩沙鳥類誌》，為臺灣歷史上第一份完整的鳥類紀錄報告，並發現命名多種臺灣特有新物種。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"加拿大傳教士馬偕在臺灣北部（淡水）積極傳教與服務民眾，他除了以免費拔牙傳教外，還設立了哪一座機構提倡女子教育？","options":["二鯤鯓砲臺","東興洋行","看西街醫館","淡水女學堂"],"answer":3,"explanation":"馬偕在淡水創辦理學堂大書院，並設立「淡水女學堂」提倡女子教育，讓臺灣女子開始接受現代教育。","concept":"西方傳教士馬雅各與馬偕之貢獻","skill":"概念理解","review":"core-9","evidence":"馬偕到臺灣北部……創辦理學堂大書院……設立淡水女學堂提倡女子教育。","id":"q9","stem":"加拿大傳教士馬偕在臺灣北部（淡水）積極傳教與服務民眾，他除了以免費拔牙傳教外，還設立了哪一座機構提倡女子教育？","theme":"西方傳教士馬雅各與馬偕之貢獻","explain":"馬偕在淡水創辦理學堂大書院，並設立「淡水女學堂」提倡女子教育，讓臺灣女子開始接受現代教育。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"西方傳教士馬雅各來到臺灣南部（臺南）傳教，並開設了全臺第一座西式醫館，該醫館即為今日哪一座醫院的前身？","options":["長庚醫院","臺大醫院","新樓醫院","馬偕醫院"],"answer":2,"explanation":"馬雅各在臺南開設全臺第一座西式醫館（看西街醫館），即為今日新樓醫院的前身，結合醫療與傳教。","concept":"西方傳教士馬雅各與馬偕之貢獻","skill":"概念理解","review":"core-9","evidence":"馬雅各在臺灣南部傳教時,開設全臺第一座西式醫館","id":"q10","stem":"西方傳教士馬雅各來到臺灣南部（臺南）傳教，並開設了全臺第一座西式醫館，該醫館即為今日哪一座醫院的前身？","theme":"西方傳教士馬雅各與馬偕之貢獻","explain":"馬雅各在臺南開設全臺第一座西式醫館（看西街醫館），即為今日新樓醫院的前身，結合醫療與傳教。","reviewText":"核心 9","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 開港通商背景與四大通商港口","title":"開港通商背景與四大通商港口","bullets":["西元1860年代西方國家迫使清帝國開港通商，開放臺灣四個港口","開放港口包括雞籠（今基隆）、淡水、安平（今臺南）與打狗（今高雄）","西方各國在港口設立領事館作為辦公場所，外商則成立洋行進行交易","打破原本封閉體制，使臺灣經濟加速發展並與國際市場緊密連結"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 領事館與洋行之功能與實例","title":"領事館與洋行之功能與實例","bullets":["領事館為外國政府設立，主要供外交官員辦公、居住及接待使節","洋行則為外國商人成立之商業組織，負責將臺灣物產出口至世界各地","英國在高雄設立打狗領事館，為臺灣第一個外國正式領事館","德國商人在臺南設立東興洋行，主要以輸出蔗糖為主要商業業務"]},{"id":"core-3","type":"core","tag":"C 大稻埕興起與經濟重心北移","title":"大稻埕興起與經濟重心北移","bullets":["開港後北部輸出茶葉與樟腦（由淡水出口），南部輸出蔗糖（由安平、打狗出口）","大稻埕臨近淡水港且為北部茶與樟腦集散地，促使當地商業興盛成為新興市街","茶葉與樟腦熱銷使得北部經濟重要性大幅提升","臺灣原本以南部為主的經濟型態，逐漸轉變為「經濟重心由南往北轉移」"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 牡丹社事件與清帝國治臺轉變","title":"牡丹社事件與清帝國治臺轉變","bullets":["西元1871年琉球船民漂流至臺灣南端誤闖原住民部落遭殺害","西元1874年日本以此為藉口出兵攻打牡丹社等部落，稱為牡丹社事件","事件暴露出臺灣海防危機，促使清帝國驚覺外國野心並轉為積極治理","清廷隨後派遣沈葆楨來臺防範，並開始推動南部海防與各項建設"]},{"id":"core-5","type":"core","tag":"E 沈葆楨來臺防務與二鯤鯓砲臺","title":"沈葆楨來臺防務與二鯤鯓砲臺","bullets":["沈葆楨奉命來臺處理牡丹社事件善後，並強化臺灣南部海防","在臺南興建二鯤鯓砲臺，為沈葆楨在臺灣修建的第一座西式砲臺","二鯤鯓砲臺城牆設計成凹凸狀，具有提供掩護與方便槍砲射擊雙重效果","興建恆春城加強南部區域安全與軍事防衛，改變治臺消極態度"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 清法戰爭與臺灣建省首任巡撫","title":"清法戰爭與臺灣建省首任巡撫","bullets":["西元1884年清帝國與法國爆發清法戰爭，戰火延燒至基隆、淡水等地","清廷派遣劉銘傳來臺指揮軍隊防守，成功阻擋法軍入侵","清帝國深感臺灣戰略地位重要，於西元1885年宣布臺灣脫離福建省獨立建省","任命劉銘傳為臺灣建省後的首任巡撫，積極展開各項現代化建設"]},{"id":"core-7","type":"core","tag":"G 劉銘傳與臺灣現代化建設","title":"劉銘傳與臺灣現代化建設","bullets":["劉銘傳擔任巡撫期間，積極推動各項交通與訊息基礎建設","修建基隆至新竹之間的鐵路，並購入「騰雲號」火車頭投入營運","購置新式輪船往返臺灣海峽兩岸，提升人貨運輸效率","架設電報系統快速傳遞訊息與掌握軍事情報，成為臺灣現代化起點"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 斯文豪與臺灣自然史研究","title":"斯文豪與臺灣自然史研究","bullets":["英國人斯文豪以外交官員身分來到臺灣，並深入山林調查野生動物","發表《福爾摩沙鳥類誌》，為臺灣歷史上第一份完整的鳥類記錄報告","發現並命名許多臺灣特有新物種，如斯文豪氏攀蜥、斯文豪氏赤蛙與斯文豪氏游蛇","開創臺灣自然史研究先河，對臺灣動物分類學做出重大貢獻"]},{"id":"core-9","type":"core","tag":"I 西方傳教士馬雅各與馬偕之貢獻","title":"西方傳教士馬雅各與馬偕之貢獻","bullets":["馬雅各於臺灣南部（臺南）傳教，開設全臺第一座西式醫館（看西街醫館/新樓醫院）","馬偕於臺灣北部（淡水）以免費拔牙傳教，並創辦理學堂大書院與淡水女學堂","淡水女學堂提倡女子教育，讓臺灣民眾開始接受現代與女子教育","傳教士雖早期因文化差異與居民產生誤解衝突，最終仍使西方文化逐漸被了解"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"西元1860年代開港通商後，臺灣的主要出口商品茶葉與樟腦，主要由南部的高雄打狗港外銷。","right":"茶葉與樟腦主要由北部淡水港出口；南部打狗港與安平港主要出口商品為蔗糖。 出口港與商品產地有南北地域區分，茶與樟腦在北部由淡水出口，糖在南部由安平、打狗出口。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"大稻埕之所以成為茶葉集散地與新興市街，是因為當地氣候平原廣闊，種植了大量優質茶樹。","right":"大稻埕本身並未種植茶樹，是因為臨近淡水港且方便集中北部產區的茶葉與樟腦進行加工交易。 集散地不等於產地，大稻埕憑藉鄰近淡水港的交通與商業優勢成為加工集散中心。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"日本在西元1874年出兵攻打臺灣牡丹社，是因為臺灣南部原住民偷襲並綁架日本東京的官員。","right":"日本是以西元1871年琉球人民漂流至臺灣南端遭原住民殺害為藉口，於1874年出兵攻打牡丹社。 事件導火線係琉球船民遭遇颱風漂流受害，日本以此為藉口入侵臺灣。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"沈葆楨在牡丹社事件後奉命來臺，為了加強北部防務，在基隆興建了臺灣第一座西式砲臺二鯤鯓砲臺。","right":"二鯤鯓砲臺位於臺南，是沈葆楨為了加強南部港口防衛所修建的第一座西式砲臺。 二鯤鯓砲臺地理位置在臺南（南部），非基隆（北部）。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"劉銘傳在臺灣建省後擔任首任巡撫，當時他興建的鐵路已經貫穿全臺灣，由基隆直達高雄打狗。","right":"劉銘傳時期興建的鐵路僅限於基隆至新竹之間，並未延伸至中南部或高雄。 清領後期鐵路建設範圍僅為北部「基隆至新竹」，中南部鐵路尚未興建。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"斯文豪氏赤蛙與斯文豪氏攀蜥等生物之所以帶有斯文豪的名字，是因為這些物種是斯文豪從國外引進臺灣飼養的。","right":"斯文豪是深入臺灣山林調查並發現這些臺灣特有新物種，後人為紀念其自然史研究貢獻而以其命名。 斯文豪係調查發現臺灣原生新物種並發表報告，而非從國外人工引進。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"開港通商與經濟北移｜知識關係","chain":["1860年代西方迫使清廷開放雞籠淡水安平打狗四港，設領事館與洋行","北部出口茶與樟腦（由淡水港），南部出口蔗糖（由安平打狗港），大稻埕成為茶樟集散地","茶與樟腦熱銷帶動北部商業興盛，臺灣經濟重心逐漸由南往北轉移"]},{"id":"logic-2","type":"chain","title":"外患衝擊與海防建設｜知識關係","chain":["1871琉球船民漂流遇害，1874日本藉口發動牡丹社事件攻打原住民部落","事件後清廷派沈葆楨來臺積極治理，興建恆春城與臺南二鯤鯓砲臺（第一座西式砲臺）","清帝國治臺態度由消極轉為積極，著手強化南部軍事防禦與海防建設"]},{"id":"logic-3","type":"chain","title":"清法戰爭與建省現代化｜知識關係","chain":["1884清法戰爭戰火波及基隆淡水，劉銘傳來臺指揮阻擋法軍入侵","1885年清廷宣布臺灣脫離福建獨立建省，劉銘傳擔任首任巡撫","推動修建基隆至新竹鐵路（購入騰雲號）、購新輪船、架電報系統，開啟現代化起點"]},{"id":"logic-4","type":"chain","title":"西方文化與科學傳播｜知識關係","chain":["英國官員斯文豪調查山林動物，發表《福爾摩沙鳥類誌》，開創自然史研究並命名新物種","馬雅各於南部傳教行醫，開設全臺第一座西式醫館（看西街醫館/新樓醫院）","馬偕於北部免費拔牙傳教，創辦理學堂大書院與淡水女學堂提倡女子教育，促進文化交流"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜清領後期臺灣重要通商港口與出口商品對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜清領後期重大事件與治臺政策轉變流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["領事館","洋行","領事館是外國政府設立供外交官員辦公、居住及接待使節客賓的官方場所（如英國打狗領事館）；洋行則是外國商人成立的商業組織，專門從事茶葉、糖、樟腦等商品的買賣與外銷（如德國東興洋行）。"],["沈葆楨的治臺建設","劉銘傳的治臺建設","沈葆楨係因牡丹社事件（1874年）來臺，重點在加強軍事海防與南部建設（興建恆春城、臺南二鯤鯓砲臺）；劉銘傳係因清法戰爭（1884年）來臺，於臺灣建省（1885年）後擔任首任巡撫，重點在推動現代化交通與訊息建設（鐵路、輪船、電報）。"],["馬雅各的傳教事蹟","馬偕的傳教事蹟","馬雅各主要在臺灣南部（臺南）傳教，開設全臺第一座西式醫館（看西街醫館/新樓醫院），結合醫療與傳教；馬偕主要在臺灣北部（淡水）傳教，以免費拔牙服務民眾，並創辦「理學堂大書院」與提倡女子教育的「淡水女學堂」。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","開港通商","西元1860年代西方國家迫使清帝國開放臺灣雞籠、淡水、安平、打狗四個港口與外國通商的歷史事件。"],["2","洋行","西元1860年代開港通商後，外國商人在臺灣港口設立的商業組織，專門將臺灣的茶葉、蔗糖與樟腦外銷至世界各地。"],["3","打狗領事館","英國於高雄打狗設立的官署，為外交官員辦公居住與接待賓客之場所，也是臺灣第一個外國正式領事館。"],["4","大稻埕","位於今臺北市大同區，因臨近淡水港且為北部茶葉與樟腦的加工集散地，在開港通商後迅速崛起為新興商業市街。"],["5","經濟重心北移","開港通商後，因北部熱銷商品茶葉與樟腦的出口額大增，使臺灣的經濟發展重心逐漸由南部轉移至北部的現象。"],["6","牡丹社事件","西元1874年日本以琉球船民在臺灣南部遭原住民殺害為藉口出兵攻打牡丹社等部落的事件，促使清廷轉為積極治理臺灣。"],["7","二鯤鯓砲臺","位於臺南，為牡丹社事件後沈葆楨來臺修建的第一座西式砲臺，牆體呈凹凸狀以提供掩護並方便射擊。"],["8","劉銘傳","清法戰爭期間來臺指揮作戰，西元1885年臺灣建省後擔任首任巡撫，大力推動鐵路、輪船與電報等現代化建設。"],["9","斯文豪","清領後期來到臺灣的英國外交官，深入山林調查動物並發表《福爾摩沙鳥類誌》，開創臺灣自然史研究並發現多種新物種。"],["10","淡水女學堂","加拿大傳教士馬偕於淡水創辦的西式女子學校，打破傳統觀念，為臺灣早期提倡女子教育與現代教育的重要機構。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"南北出口商品與港口比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較開港通商後臺灣南北兩端的出口商品與港口對應，下列敘述何者完全正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜因果推論","clue":"經濟重心北移之因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"開港通商後，臺灣原本以南部為主的經濟型態逐漸轉變為「經濟重心由南往北轉移」，造成這項轉變的主要因果原因為何？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜證據判讀","clue":"領事館與洋行史料證據判讀","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"高雄打狗設有英國打狗領事館，臺南安平設有德國東興洋行。比較「領事館」與「洋行」在歷史史料上的證據意義，下列判讀何者正確？"}]}],"cloze":{"core-1":{"selector":".point","terms":["開港通商"]},"core-2":{"selector":".point","terms":["打狗領事館"]},"core-3":{"selector":".point","terms":["經濟重心由南往北轉移"]},"core-4":{"selector":".point","terms":["牡丹社事件"]},"core-5":{"selector":".point","terms":["二鯤鯓砲臺"]},"core-6":{"selector":".point","terms":["首任巡撫"]},"core-7":{"selector":".point","terms":["騰雲號"]},"core-8":{"selector":".point","terms":["斯文豪"]},"core-9":{"selector":".point","terms":["淡水女學堂"]},"mindmap-overview":{"selector":".mind-branch p","terms":["經濟重心逐漸由南往北轉移","二鯤鯓砲臺","首任巡撫","淡水女學堂"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":["二鯤鯓砲臺"]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["斯文豪"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["開港通商","洋行","打狗領事館","大稻埕","經濟重心北移","牡丹社事件","二鯤鯓砲臺","劉銘傳","斯文豪","淡水女學堂"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>開港通商與經濟北移\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>1860年代西方迫使清廷開放雞籠淡水安平打狗四港，設領事館與洋行\u003c/p>\u003cp>\u003cb>關係：\u003c/b>北部出口茶與樟腦（由淡水港），南部出口蔗糖（由安平打狗港），大稻埕成為茶樟集散地\u003c/p>\u003cp>\u003cb>結果：\u003c/b>茶與樟腦熱銷帶動北部商業興盛，臺灣經濟重心逐漸由南往北轉移\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>外患衝擊與海防建設\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>1871琉球船民漂流遇害，1874日本藉口發動牡丹社事件攻打原住民部落\u003c/p>\u003cp>\u003cb>關係：\u003c/b>事件後清廷派沈葆楨來臺積極治理，興建恆春城與臺南二鯤鯓砲臺（第一座西式砲臺）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>清帝國治臺態度由消極轉為積極，著手強化南部軍事防禦與海防建設\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>清法戰爭與建省現代化\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>1884清法戰爭戰火波及基隆淡水，劉銘傳來臺指揮阻擋法軍入侵\u003c/p>\u003cp>\u003cb>關係：\u003c/b>1885年清廷宣布臺灣脫離福建獨立建省，劉銘傳擔任首任巡撫\u003c/p>\u003cp>\u003cb>結果：\u003c/b>推動修建基隆至新竹鐵路（購入騰雲號）、購新輪船、架電報系統，開啟現代化起點\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>西方文化與科學傳播\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>英國官員斯文豪調查山林動物，發表《福爾摩沙鳥類誌》，開創自然史研究並命名新物種\u003c/p>\u003cp>\u003cb>關係：\u003c/b>馬雅各於南部傳教行醫，開設全臺第一座西式醫館（看西街醫館/新樓醫院）\u003c/p>\u003cp>\u003cb>結果：\u003c/b>馬偕於北部免費拔牙傳教，創辦理學堂大書院與淡水女學堂提倡女子教育，促進文化交流\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>開港通商為什麼改變了臺灣的發展？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">港口名稱與位置\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">主要出口商品與組織\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">區域經濟影響與地位\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>港口名稱與位置\u003c/th>\u003cth>主要出口商品與組織\u003c/th>\u003cth>區域經濟影響與地位\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>淡水港（臺灣北部）\u003c/td>\u003ctd>主要出口茶葉與樟腦，外商透過洋行進行交易\u003c/td>\u003ctd>鄰近集散地大稻埕迅速崛起，帶動北部經濟繁榮與重心北移\u003c/td>\u003c/tr>\u003ctr>\u003ctd>雞籠港（今基隆/北部）\u003c/td>\u003ctd>開港通商港口之一，北部商品出口與軍事門戶\u003c/td>\u003ctd>軍事地位重要，後於清法戰爭中成為戰場並興建鐵路起點\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安平港（今臺南/南部）\u003c/td>\u003ctd>主要出口蔗糖，德國商人在當地設立東興洋行\u003c/td>\u003ctd>延續南部傳統糖業出口，為清代傳統政經與商業重鎮\u003c/td>\u003c/tr>\u003ctr>\u003ctd>打狗港（今高雄/南部）\u003c/td>\u003ctd>主要出口蔗糖，英國在當地設立打狗領事館\u003c/td>\u003ctd>設置臺灣第一個外國正式領事館，為南部重要貿易與外交港口\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按港口地理位置（北部港口→南部港口），橫向比較其出口商品、外國機構與區域經濟影響。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論安平港與打狗港主要外銷茶葉與樟腦，亦不能推論鹿港屬於1860年代開放的四大通商港口。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，北部淡水港與南部打狗港在「出口商品」與「外國設立機構」上有何主要差異？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>淡水港主要出口茶葉與樟腦，附近有洋行集散；打狗港主要出口蔗糖，並設立了臺灣第一個外國正式領事館（英國打狗領事館）。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">歷史事件與年代\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">清廷應對措施與關鍵人物\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史意義與影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>歷史事件與年代\u003c/th>\u003cth>清廷應對措施與關鍵人物\u003c/th>\u003cth>歷史意義與影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>西元1860年代開港通商\u003c/td>\u003ctd>西方國家迫使開放四港，外國設立領事館與洋行\u003c/td>\u003ctd>打破封閉限制，茶樟糖熱銷使臺灣經濟加速發展並融入全球市場\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1874年牡丹社事件\u003c/td>\u003ctd>日本以琉球船民受害為藉口出兵，清廷派沈葆楨來臺\u003c/td>\u003ctd>驚覺外國野心，治臺態度轉為積極，築恆春城與臺南二鯤鯓砲臺強化海防\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1884年清法戰爭\u003c/td>\u003ctd>法軍攻打基隆淡水，清廷派劉銘傳來臺指揮防守\u003c/td>\u003ctd>戰略地位極受重視，促成西元1885年臺灣脫離福建獨立建省\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西元1885年臺灣建省\u003c/td>\u003ctd>劉銘傳擔任首任巡撫，推動鐵路、輪船與電報建設\u003c/td>\u003ctd>基隆至新竹鐵路通車並引進騰雲號，成為臺灣邁向現代化發展的起點\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間先後順序（1860年代→1874年→1884年→1885年），閱讀歷史事件如何引導清廷治理態度與建設轉變。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論沈葆楨是因清法戰爭來臺，亦不能推論劉銘傳在建省前即已完工全臺高鐵。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據流程圖，清帝國對臺灣的治理態度是如何從消極防範轉變為積極建設的？兩位關鍵人物分別做了什麼？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>牡丹社事件後沈葆楨來臺興建砲臺城牆強化海防；清法戰爭後臺灣建省，首任巡撫劉銘傳推動鐵路、輪船與電報等現代化建設。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\   if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

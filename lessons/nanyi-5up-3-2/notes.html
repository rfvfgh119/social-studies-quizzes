t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>南一5上3-2 山中的故事</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"南一版","grade":"國小5年級上學期","gradeShort":"5 上","lesson":"3-2","title":"山中的故事"},"questions":[{"question":"臺灣早期先民常使用竹子、黃藤與木材來製作生活器具或建築材料，主要原因不包括下列哪一項？","options":["這些自然材料在生活周遭容易取得","早期政府規定只能使用竹藤建造房屋","竹藤材料具有耐用與彈性透氣的特性","這些材料質地合適且容易加工處理"],"answer":1,"explanation":"早期先民廣泛選用竹、藤、木材作為生活用品與建築原料，是因為這些材料易於取得、具耐用性且容易加工，並非政府法規強制規定。","concept":"山林資源的特質與傳統利用","skill":"概念理解","review":"core-1","evidence":"在臺灣早期的生活中，竹、藤、木材等自然資源扮演了重要角色，這些材料不僅易於取得，還具有耐用及容易加工的特性","id":"q1","stem":"臺灣早期先民常使用竹子、黃藤與木材來製作生活器具或建築材料，主要原因不包括下列哪一項？","theme":"山林資源的特質與傳統利用","explain":"早期先民廣泛選用竹、藤、木材作為生活用品與建築原料，是因為這些材料易於取得、具耐用性且容易加工，並非政府法規強制規定。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"關於臺灣傳統木造家具「紅眠床」的名稱由來與文化意涵，下列敘述何者正確？","options":["床外觀主要雕刻西方神話故事，象徵發財致富","「紅眠」發音與閩南語的「安眠」相似，蘊含期望能舒適睡眠的意涵","因為床身雕刻著紅色花朵圖案，故稱為紅眠床","是日治時期由日本專家專為臺灣氣候設計的西式鋼管床"],"answer":1,"explanation":"「紅眠」發音與閩南語的「安眠」相似，寄託著期望安穩舒適睡眠的意涵；床身為中式朱紅色木造大床，常雕刻鳳凰呈祥、麒麟送子等象徵吉祥與多子多孫的圖案。","concept":"傳統木造家具紅眠床的文化意涵","skill":"概念理解","review":"core-2","evidence":"「紅眠」與閩南語的「安眠」發音相似，所以也有期望能舒適睡眠的意涵。","id":"q2","stem":"關於臺灣傳統木造家具「紅眠床」的名稱由來與文化意涵，下列敘述何者正確？","theme":"傳統木造家具紅眠床的文化意涵","explain":"「紅眠」發音與閩南語的「安眠」相似，寄託著期望安穩舒適睡眠的意涵；床身為中式朱紅色木造大床，常雕刻鳳凰呈祥、麒麟送子等象徵吉祥與多子多孫的圖案。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"臺灣於民國80年頒布了重要林業政策，對國內山林利用產生深遠影響，該政策的主要內容為何？","options":["鼓勵大量設立私人林場並大幅擴大伐木規模","禁止由國外進口任何原木與木造家具","強制將所有山坡地樹木砍伐改種單一作物","全面禁止砍伐天然林以保護原始森林"],"answer":3,"explanation":"民國80年政府隨著環保意識抬頭，頒布全面禁止砍伐天然林政策，以維護高山原始森林與水土保持。","concept":"天然林禁伐與木材來源","skill":"概念理解","review":"core-3","evidence":"到了民國80年，隨著人們的環保意識抬頭，政府全面禁止砍伐天然林，並復育原始林木","id":"q3","stem":"臺灣於民國80年頒布了重要林業政策，對國內山林利用產生深遠影響，該政策的主要內容為何？","theme":"天然林禁伐與木材來源","explain":"民國80年政府隨著環保意識抬頭，頒布全面禁止砍伐天然林政策，以維護高山原始森林與水土保持。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於臺灣國家公園與林場轉型歷史，下列敘述何者正確？","options":["西元1937年日治時期公布的三座國立公園在當時即已正式開園營運","政府全面禁止入山後，將早期開採的林場完全廢棄不再開放","我國真正成立的第一座國家公園是西元1984年成立的墾丁國家公園","現今臺灣共有三座國家公園，全數分布於花蓮與臺東山區"],"answer":2,"explanation":"西元1937年日治時期規畫的三座國立公園因戰爭爆發未真正成立；我國第一座真正成立的國家公園是民國73年（1984年）成立的墾丁國家公園，目前全臺共有九座國家公園。","concept":"林場轉型與國家公園歷史","skill":"概念理解","review":"core-4","evidence":"我國真正第一座國家公園於西元1984年(民國73年)在墾丁成立","id":"q4","stem":"關於臺灣國家公園與林場轉型歷史，下列敘述何者正確？","theme":"林場轉型與國家公園歷史","explain":"西元1937年日治時期規畫的三座國立公園因戰爭爆發未真正成立；我國第一座真正成立的國家公園是民國73年（1984年）成立的墾丁國家公園，目前全臺共有九座國家公園。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"臺灣地下蘊藏著煤、石油、天然氣與金等礦物資源，這些礦產主要分布於臺灣的哪一個區域？","options":["主要分布於澎湖群島與綠島地區","主要分布於臺灣北部和中部地區","主要分布於恆春半島與東沙群島","主要分布於臺灣南部平原地區"],"answer":1,"explanation":"課文指出臺灣的煤、石油、天然氣與金等礦物資源，大多分布在臺灣的北部和中部地區（如瑞芳、九份、金瓜石、出磺坑等）。","concept":"地下礦物資源分布與重鎮","skill":"概念理解","review":"core-5","evidence":"臺灣的地下具有煤、石油、天然氣、金等礦物資源，大多分布在臺灣的北部和中部地區。","id":"q5","stem":"臺灣地下蘊藏著煤、石油、天然氣與金等礦物資源，這些礦產主要分布於臺灣的哪一個區域？","theme":"地下礦物資源分布與重鎮","explain":"課文指出臺灣的煤、石油、天然氣與金等礦物資源，大多分布在臺灣的北部和中部地區（如瑞芳、九份、金瓜石、出磺坑等）。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"早期礦工在坑道內工作環境極為艱辛，因長期吸入含二氧化矽的粉塵，最容易罹患下列哪一種職業疾病？","options":["矽肺症","口蹄疫","登革熱","腸病毒"],"answer":0,"explanation":"早期礦坑缺乏完善防護，礦工長期吸入含二氧化矽的粉塵，導致肺部纖維化而罹患「矽肺症」。","concept":"早期礦工的工作環境與健康問題","skill":"概念理解","review":"core-6","evidence":"礦工常會得到矽肺症，這是一種肺部疾病，因人體長期吸入含二氧化矽的粉塵，導致肺部纖維化","id":"q6","stem":"早期礦工在坑道內工作環境極為艱辛，因長期吸入含二氧化矽的粉塵，最容易罹患下列哪一種職業疾病？","theme":"早期礦工的工作環境與健康問題","explain":"早期礦坑缺乏完善防護，礦工長期吸入含二氧化矽的粉塵，導致肺部纖維化而罹患「矽肺症」。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"一百多年前先民入山開採山林資源時，主要依賴哪一種建設成本低、興建速度快的人力輕便鐵道？","options":["纜車系統","高速鐵路","地下捷運","臺車"],"answer":3,"explanation":"一百多年前山區交通主要依靠人力為動力的輕便鐵道「臺車」，其優點為建設成本低且能快速鋪設。","concept":"山區鐵道交通系統","skill":"概念理解","review":"core-7","evidence":"當時的山區交通大多依賴成本較低、建設較快的輕便鐵道——臺車。","id":"q7","stem":"一百多年前先民入山開採山林資源時，主要依賴哪一種建設成本低、興建速度快的人力輕便鐵道？","theme":"山區鐵道交通系統","explain":"一百多年前山區交通主要依靠人力為動力的輕便鐵道「臺車」，其優點為建設成本低且能快速鋪設。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"當天然林禁伐與礦區停止開採後，許多山城聚落失去主要產業，現今主要朝向哪一種方向發展以吸引遊客？","options":["朝向大規模砍伐樹木興建高爾夫球場","朝向開鑿深層地下礦坑重新抽乾水質","朝向生態旅遊與結合地方文史特色發展","朝向引進大量重工業工廠廢氣排放"],"answer":2,"explanation":"現今許多山城聚落結合當地的文史資源與地方特色產品，轉型發展生態旅遊，吸引遊客親近山林。","concept":"山城沒落與生態旅遊轉型","skill":"概念理解","review":"core-8","evidence":"現今為了保護自然環境，許多山區開始朝向生態旅遊發展。","id":"q8","stem":"當天然林禁伐與礦區停止開採後，許多山城聚落失去主要產業，現今主要朝向哪一種方向發展以吸引遊客？","theme":"山城沒落與生態旅遊轉型","explain":"現今許多山城聚落結合當地的文史資源與地方特色產品，轉型發展生態旅遊，吸引遊客親近山林。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"南投車埕早期為木材集散地，當時設置「貯木池」的主要功能為何？","options":["將砍伐原木浸泡於水中以釋放樹脂，延長木頭使用期限","作為觀光客夏季游泳與賽船的體育場地","作為儲存發電用石油與天然氣的地下水槽","作為養殖高價烏魚與海水魚類的池塘"],"answer":0,"explanation":"車埕的貯木池用來置放砍伐下來的木材，將原木浸泡水中能釋放原木中的樹脂，進而延長木頭使用期限。","concept":"車埕貯木池的作用","skill":"概念理解","review":"core-9","evidence":"貯木池用來置放砍伐下來的木材，將原木浸泡於池子內，釋放存在原木中的樹脂，能夠延長木頭使用期限。","id":"q9","stem":"南投車埕早期為木材集散地，當時設置「貯木池」的主要功能為何？","theme":"車埕貯木池的作用","explain":"車埕的貯木池用來置放砍伐下來的木材，將原木浸泡水中能釋放原木中的樹脂，進而延長木頭使用期限。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"雖然臺灣擁有豐富的森林資源，但目前市面上販售的原木家具原料主要來自何處？","options":["全部來自新北市瑞芳區的礦坑木材","大部分從國外進口（如北美洲與東南亞）","全數由阿里山與太平山伐木供應","完全由車埕貯木池打撈古木加工"],"answer":1,"explanation":"因民國80年實施天然林禁伐政策，臺灣本土木材供應大幅減少，現今市面原木家具主要進口自北美洲與東南亞等國。","concept":"現今市售原木家具的來源","skill":"概念理解","review":"core-1","evidence":"現今面上販賣的原木家具，大部分已經不是產自臺灣，而是從國外進口。","id":"q10","stem":"雖然臺灣擁有豐富的森林資源，但目前市面上販售的原木家具原料主要來自何處？","theme":"現今市售原木家具的來源","explain":"因民國80年實施天然林禁伐政策，臺灣本土木材供應大幅減少，現今市面原木家具主要進口自北美洲與東南亞等國。","reviewText":"核心 1","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 山林資源的分布與傳統利用","title":"山林資源的分布與傳統利用","bullets":["臺灣山地與丘陵約占全島三分之二面積，蘊藏豐富的山林資源與多樣物種。","早期生活中，竹、藤、木材因為易於取得、具有耐用性及容易加工的特性，成為製作日常生活用品的重要原料。","先民利用竹、藤製作堅固透氣的菜櫥、兒童椅、農用支撐架與養蚵的蚵架。","臺灣杉木、紅檜、樟樹及相思木等高經濟價值木材，常用於製作民房、廟宇建築與傳統家具。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 傳統木造家具紅眠床的文化意涵","title":"傳統木造家具紅眠床的文化意涵","bullets":["紅眠床是臺灣民間早年從中國引進的中式朱紅色木造大床。","名稱中的「紅眠」發音與閩南語的「安眠」相似，蘊含著期望能舒適睡眠的吉祥意涵。","床身外觀多雕刻圖案，如象徵吉祥的鳳凰呈祥與麒麟送子。","圖案設計代表長輩對於新婚夫婦多子多孫、富貴過一生與永浴愛河的期許與祝福。"]},{"id":"core-3","type":"core","tag":"C 林場開發與天然林禁伐政策","title":"林場開發與天然林禁伐政策","bullets":["過去人們在山中開闢大型林場（如阿里山、太平山），雖創造工作機會與經濟價值，卻嚴重破壞高山森林生態。","隨著大眾環保意識抬頭，政府於民國80年頒布天然林全面禁伐政策，以保護原始森林並復育生態。","現今市面上販售的原木家具與學校課桌椅，原料大多從國外進口（如北美洲與東南亞）。","政府持續推動人工林，透過有規畫的適度砍伐（疏伐）調整森林密度，提供少量的本土木材。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 林場轉型與國家公園歷史","title":"林場轉型與國家公園歷史","bullets":["禁伐天然林後，政府將過去的林場轉型為國家森林遊樂區，提供民眾親近山林與生態教育的場所。","西元1937年日本政府曾規畫大屯、次高太魯閣及新高阿里山三處國立公園預定地，但因戰爭爆發未能成立。","民國73年（西元1984年），我國成立第一座國家公園「墾丁國家公園」，展開全面的生態與文化保育。","目前全臺共有九座國家公園，透過研究保育與寓教於樂方式保護自然環境與人文史蹟。"]},{"id":"core-5","type":"core","tag":"E 地下礦物資源的分布與重鎮","title":"地下礦物資源的分布與重鎮","bullets":["臺灣地下蘊藏煤、石油、天然氣、金等礦物資源，主要分布在臺灣的北部與中部地區。","新北市瑞芳區煤炭產量曾占全臺一半，是當時臺灣極為重要的煤礦開採重鎮。","鄰近的九份與金瓜石地區因開發金礦而形成熱鬧的山城聚落。","出磺坑為臺灣最早發現石油的地點，至今仍持續生產天然氣，但產能已日益減少。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 礦工的工作環境與礦區停止開採","title":"礦工的工作環境與礦區停止開採","bullets":["早期挖礦工資高於一般工作約三倍，吸引許多居民投入以改善家庭經濟。","礦工必須在狹窄、悶熱且無完善防護的坑道中工作，長期吸入粉塵易罹患矽肺症等呼吸道疾病。","礦區逐漸停止開採的原因包含可開採礦脈過深、開發成本過高、礦災頻傳、破壞環境及產量減少。","目前花蓮地區仍持續開採大理石與石灰石，用於建築與雕刻，並需兼顧原住民族權益與環保法規。"]},{"id":"core-7","type":"core","tag":"G 山區鐵道交通系統與資源運輸","title":"山區鐵道交通系統與資源運輸","bullets":["大約一百多年前，鐵道系統成為先民入山大規模運輸與開採山區資源的主要交通工具。","臺車（人力輕便鐵道）以人力推動、軌距狹窄，具有建設成本低與興建速度快的優點。","森林鐵路為窄軌鐵路，載運能力優於臺車，利用之字形折返線或螺旋軌道將大型林木運往加工廠。","隨著山區公路普及與開發範圍擴大，臺車大多被公路取代，舊鐵道則轉型為觀光體驗設施。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 山城的沒落與生態旅遊轉型","title":"山城的沒落與生態旅遊轉型","bullets":["當林木禁伐與礦產停止開採後，山城聚落失去原有主要產業，面臨嚴重的人口外流與城鎮沒落。","現今許多山區轉向發展生態旅遊，結合當地的文史資源與地方特色產品。","透過歷史老街、博物館及文化園區的再造，吸引國內外遊客前往親近山林。","山城轉型旨在平衡自然保育與在地經濟發展，創造永續經營的新風貌。"]},{"id":"core-9","type":"core","tag":"I 南投車埕的木業興衰與觀光轉型","title":"南投車埕的木業興衰與觀光轉型","bullets":["南投車埕在日治時期因興建大觀發電廠與木材業而興盛，曾是人力臺車轉運站與木材集散地，號稱「小臺北」。","貯木池用於將砍伐下來的原木浸泡於水中，藉由釋放原木中的樹脂以延長木材使用期限。","民國80年代天然林禁伐政策與民國88年921大地震的雙重打擊，使車埕地區遭受空前危機。","在政府與民間努力下，車埕將昔日貯木池轉變為觀光勝地，結合鐵道、木業與原住民族文化重新發展。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"現今在臺灣市面上販售的原木家具，原料全部都是由臺灣本土山區砍伐的天然林木所製成。","right":"目前臺灣市面上販售的原木家具，原料大部分是從國外進口（如北美洲與東南亞），本土木材僅占極少數。 臺灣於民國80年實施天然林全面禁伐政策以保護生態，本土木材僅靠人工林限量疏伐，遠不足以供應市場需求。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"臺灣的地下礦物資源如煤、石油與天然氣等，主要分布在臺灣南部地區。","right":"臺灣的地下礦物資源主要分布在臺灣的北部與中部地區（如瑞芳、九份、出磺坑等）。 課本明確指出礦物資源大多分布在北部與中部，南部並非主要礦產分布區。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"阿里山林場在政府宣布禁伐天然林之後，已經完全荒廢，不再具備任何價值。","right":"阿里山林場禁伐後並未荒廢，而是轉型為「阿里山國家森林遊樂區」，具有珍貴的觀光與保育價值。 政府將舊林場轉型為森林遊樂區與生態旅遊據點，提供民眾親近山林並保存森林生態。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"早期先民在山區運輸大型林木時，主要依賴高鐵與公路系統。","right":"大約一百多年前先民主要依賴鐵道系統（如人力推動的臺車與森林鐵路）來運輸山區資源。 早期山區地形崎嶇，公路與高鐵尚未發達，當時係依靠建設成本低、速度快的輕便鐵路與窄軌森林鐵路。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"西元1937年日本統治時期規畫的三處國立公園，在當時就已經正式設立並對外營運。","right":"西元1937年日治時期規畫的三處國立公園僅止於預定地與調查規畫，因隨後爆發戰爭而未能真正成立。 臺灣真正成立的第一座國家公園是民國73年（1984年）成立的墾丁國家公園。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"現今為了徹底保護山林與自然環境，政府嚴格禁止任何民眾進入山區活動。","right":"現今政府並未禁止民眾入山，而是推動生態旅遊與森林遊樂區，鼓勵民眾在不破壞環境的前提下親近山林。 環境保育與山城轉型強調「保育與遊憩並重」，透過教育與體驗讓民眾理解生態永續。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"山林資源利用與林業轉型｜知識關係","chain":["山地丘陵占三分之二，早期利用竹藤木材製作菜櫥與紅眠床等用品","民國80年實施天然林全面禁伐，林場轉型為森林遊樂區並推動人工林疏伐","維護原始森林生態多樣性，原木家具轉為國外進口，促進親近山林生態教育"]},{"id":"logic-2","type":"chain","title":"地下礦產開採與山城演變｜知識關係","chain":["北部與中部蘊藏煤石油金礦，瑞芳九份金瓜石因礦業形成繁榮山城","礦工在狹窄悶熱坑道中高風險採礦，後因成本高、礦災與產量減少停止開採","山城面臨人口外流與沒落，後結合文史資源轉型老街與博物館等觀光景點"]},{"id":"logic-3","type":"chain","title":"山區鐵道交通與聚落發展｜知識關係","chain":["山地地形崎嶇人力難運，一百多年前引進鐵道作為山區資源運輸工具","採用低成本快速興建的人力臺車與載運力強、設折返線的窄軌森林鐵路","帶動沿線林場聚落與商業榮景，隨著公路普及與採伐停止，舊鐵道轉型觀光"]},{"id":"logic-4","type":"chain","title":"車埕聚落的木業與觀光再造｜知識關係","chain":["日治時期因發電工程與木材業興盛，成為臺車轉運站與木材集散地小臺北","設置貯木池浸泡原木釋放樹脂以延長使用壽命，後遭禁伐與921大地震打擊","轉型將貯木池打造成美麗觀光水景，結合鐵道、木業與原住民族文化振興地方"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣林業發展歷程與轉型對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜臺灣礦業與山城聚落演變對照表","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["臺車（人力輕便鐵道）","森林鐵路","臺車以人力推動、軌距極窄、建設成本低且興建速度快，主要用於早期一般山區及短程資源運輸，現大多被公路取代；森林鐵路採用窄軌蒸汽或機車牽引，設有之字形折返線或螺旋軌道，載運能力優於臺車，專用於運輸高山大型林木。"],["天然林禁伐","人工林疏伐","天然林禁伐是政府於民國80年頒布的政策，全面禁止砍伐自然形成的原始森林以維護生態平衡；人工林疏伐是透過有規畫的適度砍伐人工植栽培育的樹木，藉由調整森林密度讓樹木獲得充分日晒，並提供少量的本土木材。"],["國家森林遊樂區","國家公園","國家森林遊樂區主要由早期開採林木的林場轉型而來（如阿里山、太平山），著重於森林生態保護與親近山林體驗；國家公園（如墾丁、玉山）依國家公園法設立，範圍更廣泛，涵蓋高山、珊瑚礁、火山及離島等多元生態與人文史蹟的全面研究與保育。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","紅眠床","臺灣傳統中式朱紅色木造大床，發音與閩南語「安眠」相似，床身常雕刻鳳凰呈祥、麒麟送子等圖案，表達對新婚夫婦多子多孫與吉祥舒適睡眠的期許。"],["2","天然林禁伐","政府於民國80年頒布的環保政策，全面禁止砍伐天然形成的原始森林，以維護高山生態平衡與水土保持。"],["3","森林遊樂區","將過去開採林木的林場轉型而成的休憩場所，兼具保存珍貴森林生態與提供民眾親近山林、進行生態教育的功能。"],["4","疏伐","在人工林中有規畫地適度砍伐部分樹木，藉由調整森林密度使樹木獲得充足日晒，維護生物多樣性並提供少量本土木材。"],["5","矽肺症","早期礦工常見的職業病，因長期在狹窄悶熱的礦坑中吸入含有二氧化矽的粉塵，導致肺部纖維化、咳嗽及呼吸困難。"],["6","臺車","早期山區盛行的人力輕便鐵道，具有建設成本低與快速鋪設的特點，依靠人力推動運送資源與乘客，現大多被公路取代。"],["7","森林鐵路","專為運輸高山大型林木而興建的窄軌鐵路，常設計之字形折返線或螺旋軌道以克服陡峭地形，載運能力優於臺車。"],["8","貯木池","林業中用於存放伐採原木的池塘，將原木浸泡於水中可釋放樹脂，有效防止木材龜裂並延長使用期限。"],["9","車埕","南投縣水里鄉聚落，日治時期因發電工程與木材業興盛被譽為「小臺北」，後經歷禁伐與921大地震衝擊，成功轉型為鐵道與木業觀光勝地。"],["10","生態旅遊","一種結合當地文史資源、地方特色產品與自然景觀的旅遊模式，旨在維護生態環境的同時帶動山城經濟與地方創生。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜因果推論","clue":"天然林禁伐政策的因果推論","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"政府於民國80年頒布天然林全面禁伐政策，關於此政策產生的原因與後續影響，下列因果推論何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"日治國立公園與現今國家公園比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較西元1937年日治時期規畫的國立公園預定地與現今我國國家公園，下列分類比較何者正確？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"早期採礦高風險與停採原因","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"早期許多先民願意從事高危險的採礦工作，但後來多數礦區卻陸續停止開採，下列相關因果說明何者正確？"}]}],"cloze":{"core-1":{"selector":".point","terms":["容易加工"]},"core-2":{"selector":".point","terms":["安眠"]},"core-3":{"selector":".point","terms":["禁伐"]},"core-4":{"selector":".point","terms":["森林遊樂區"]},"core-5":{"selector":".point","terms":["瑞芳區"]},"core-6":{"selector":".point","terms":["矽肺症"]},"core-7":{"selector":".point","terms":["臺車"]},"core-8":{"selector":".point","terms":["生態旅遊"]},"core-9":{"selector":".point","terms":["貯木池"]},"mindmap-overview":{"selector":".mind-branch p","terms":["森林遊樂區","瑞芳","臺車","貯木池"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["禁伐"]},"trap-4":{"selector":".correct","terms":["臺車"]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["森林遊樂區"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["紅眠床","天然林禁伐","森林遊樂區","疏伐","矽肺症","臺車","森林鐵路","貯木池","車埕","生態旅遊"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>山林資源利用與林業轉型\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>山地丘陵占三分之二，早期利用竹藤木材製作菜櫥與紅眠床等用品\u003c/p>\u003cp>\u003cb>關係：\u003c/b>民國80年實施天然林全面禁伐，林場轉型為森林遊樂區並推動人工林疏伐\u003c/p>\u003cp>\u003cb>結果：\u003c/b>維護原始森林生態多樣性，原木家具轉為國外進口，促進親近山林生態教育\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>地下礦產開採與山城演變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>北部與中部蘊藏煤石油金礦，瑞芳九份金瓜石因礦業形成繁榮山城\u003c/p>\u003cp>\u003cb>關係：\u003c/b>礦工在狹窄悶熱坑道中高風險採礦，後因成本高、礦災與產量減少停止開採\u003c/p>\u003cp>\u003cb>結果：\u003c/b>山城面臨人口外流與沒落，後結合文史資源轉型老街與博物館等觀光景點\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>山區鐵道交通與聚落發展\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>山地地形崎嶇人力難運，一百多年前引進鐵道作為山區資源運輸工具\u003c/p>\u003cp>\u003cb>關係：\u003c/b>採用低成本快速興建的人力臺車與載運力強、設折返線的窄軌森林鐵路\u003c/p>\u003cp>\u003cb>結果：\u003c/b>帶動沿線林場聚落與商業榮景，隨著公路普及與採伐停止，舊鐵道轉型觀光\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>車埕聚落的木業與觀光再造\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>日治時期因發電工程與木材業興盛，成為臺車轉運站與木材集散地小臺北\u003c/p>\u003cp>\u003cb>關係：\u003c/b>設置貯木池浸泡原木釋放樹脂以延長使用壽命，後遭禁伐與921大地震打擊\u003c/p>\u003cp>\u003cb>結果：\u003c/b>轉型將貯木池打造成美麗觀光水景，結合鐵道、木業與原住民族文化振興地方\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>山中的故事\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>早期傳統利用（明清至早期）\u003c/td>\u003ctd>先民善用竹、藤及高經濟價值木材（如紅檜、樟樹、相思木）製作生活器具、建築及紅眠床\u003c/td>\u003ctd>資源易於取得且耐用易加工，生活用品與在地自然環境緊密結合\u003c/td>\u003c/tr>\u003ctr>\u003ctd>林場大規模開採（日治至民國80年前）\u003c/td>\u003ctd>於山中開闢大型林場（阿里山、太平山等），鋪設森林鐵路與臺車運輸大量林木\u003c/td>\u003ctd>創造許多工作機會與經濟效益，但也造成高山森林生態嚴重破壞與資源枯枯竭\u003c/td>\u003c/tr>\u003ctr>\u003ctd>政策轉折與保育（民國80年起）\u003c/td>\u003ctd>政府頒布「天然林全面禁伐」政策，復育原始林木，並將林場轉型為森林遊樂區\u003c/td>\u003ctd>由單純經濟開發轉向環境永續與生態保育，市售原木多改由國外進口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>現代永續經營（現今）\u003c/td>\u003ctd>推動人工林進行計畫性疏伐提供少量本土材，結合生態旅遊與木業文化體驗（如車埕）\u003c/td>\u003ctd>調整森林密度維護生物多樣性，促進山城地方創生與永續發展\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依時間軸從早期傳統利用、大型林場開採，看至天然林禁伐政策及現代永續經營轉型。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論實施禁伐天然林政策後，市面上所有木製家具與課桌椅就完全無法購買或無木材來源。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，政府在民國80年實施「天然林全面禁伐」政策的主要原因與影響為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>主要原因是為了保護原始森林並復育生態；影響是促使林場轉型為森林遊樂區，市售原木改由國外進口，並兼顧人工林疏伐與生態旅遊。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">內容\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>面向\u003c/th>\u003cth>內容\u003c/th>\u003cth>意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>資源分布與重鎮\u003c/td>\u003ctd>地下礦產（煤、石油、天然氣、金）主要分布於中北部；瑞芳煤產量占全臺一半，九份金瓜石以金礦聞名\u003c/td>\u003ctd>礦業開發帶動人口聚集與商業繁榮，形成特色山城聚落\u003c/td>\u003c/tr>\u003ctr>\u003ctd>勞動環境與風險\u003c/td>\u003ctd>早期工資高吸引居民投入；礦工於狹窄悶熱坑道工作，無口罩易患矽肺症且面臨礦災與爆破危險\u003c/td>\u003ctd>反映前人為了改善家庭經濟所付出高昂的健康與生命代價\u003c/td>\u003c/tr>\u003ctr>\u003ctd>停採原因與困境\u003c/td>\u003ctd>因可採礦脈過深、開發成本過高、礦災事件頻傳、破壞環境及產量減少，多數礦區停止開採\u003c/td>\u003ctd>產業停止導致山城聚落失去主要經濟支柱，產生人口外流與城鎮沒落困境\u003c/td>\u003c/tr>\u003ctr>\u003ctd>山城新風貌轉型\u003c/td>\u003ctd>花蓮地區持續開採大理石與石灰石；停採山城結合老街、博物館及文史資源發展觀光\u003c/td>\u003ctd>在合法開發、原住民族權益與環保法規下尋求經濟與環境維護的平衡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>由礦產分布重鎮、早期勞動風險，比較至停止開採原因及現今山城觀光轉型。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論臺灣目前所有的地下礦產與石頭開採已全部完全停止。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據對照表，早期瑞芳與九份等山城在停止開採礦產後，面臨什麼困境？現今如何轉型？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>困境為失去原有產業、人口外流與城鎮沒落；現今轉型為結合文史資源、老街與博物館發展生態旅遊與觀光。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>山林資源利用與林業轉型\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>山地丘陵占三分之二，早期利用竹藤木材製作菜櫥與紅眠床等用品\u003c/p>\u003cp>\u003cb>關係：\u003c/b>民國80年實施天然林全面禁伐，林場轉型為森林遊樂區並推動人工林疏伐\u003c/p>\u003cp>\u003cb>結果：\u003c/b>維護原始森林生態多樣性，原木家具轉為國外進口，促進親近山林生態教育\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>地下礦產開採與山城演變\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>北部與中部蘊藏煤石油金礦，瑞芳九份金瓜石因礦業形成繁榮山城\u003c/p>\u003cp>\u003cb>關係：\u003c/b>礦工在狹窄悶熱坑道中高風險採礦，後因成本高、礦災與產量減少停止開採\u003c/p>\u003cp>\u003cb>結果：\u003c/b>山城面臨人口外流與沒落，後結合文史資源轉型老街與博物館等觀光景點\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>山區鐵道交通與聚落發展\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>山地地形崎嶇人力難運，一百多年前引進鐵道作為山區資源運輸工具\u003c/p>\u003cp>\u003cb>關係：\u003c/b>採用低成本快速興建的人力臺車與載運力強、設折返線的窄軌森林鐵路\u003c/p>\u003cp>\u003cb>結果：\u003c/b>帶動沿線林場聚落與商業榮景，隨著公路普及與採伐停止，舊鐵道轉型觀光\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>車埕聚落的木業與觀光再造\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>日治時期因發電工程與木材業興盛，成為臺車轉運站與木材集散地小臺北\u003c/p>\u003cp>\u003cb>關係：\u003c/b>設置貯木池浸泡原木釋放樹脂以延長使用壽命，後遭禁伐與921大地震打擊\u003c/p>\u003cp>\u003cb>結果：\u003c/b>轉型將貯木池打造成美麗觀光水景，結合鐵道、木業與原住民族文化振 document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}
if(e.target.id==='reset'){answers={};try{localStorage.removeItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson)}catch(e){}document.querySelectorAll('.option input').forEach(im=>im.checked=false);document.querySelectorAll('.answer-row').forEach(r=>r.classList.remove('is-correct','is-wrong'));$('.score-text').textContent='已清除作答。';}});

const clozePlan={"core-1":{"selector":".point","terms":["容易加工"]},"core-2":{"selector":".point","terms":["安眠"]},"core-3":{"selector":".point","terms":["禁伐"]},"core-4":{"selector":".point","terms":["森林遊樂區"]},"core-5":{"selector":".point","terms":["瑞芳區"]},"core-6":{"selector":".point","terms":["矽肺症"]},"core-7":{"selector":".point","terms":["臺車"]},"core-8":{"selector":".point","terms":["生態旅遊"]},"core-9":{"selector":".point","terms":["貯木池"]},"mindmap-overview":{"selector":".mind-branch p","terms":["森林遊樂區","瑞芳","臺車","貯木池"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["禁伐"]},"trap-4":{"selector":".correct","terms":["臺車"]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["森林遊樂區"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["紅眠床","天然林禁伐","森林遊樂區","疏伐","矽肺症","臺車","森林鐵路","貯木池","車埕","生態旅遊"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });
 document.getElementById('mode-cloze').setAttribute('aria-pressed',String(clozeMode));document.getElementById('mode-full').setAttribute('aria-pressed',String(!clozeMode));
 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);
document.addEventListener('click',e=>toggleCloze(e.target.closest('#pages .cloze-slot')));
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cloze-slot')&&clozeMode){e.preventDefault();toggleCloze(e.target)}});
document.getElementById('mode-cloze').onclick=()=>{clozeMode=true;refreshCloze()};
document.getElementById('mode-full').onclick=()=>{clozeMode=false;refreshCloze()};
document.getElementById('mode-reset').onclick=refreshCloze;
document.body.classList.add('student-cloze');

 };

  let guide=advice[p.dataset.section];if(!guide||free<175)continue;
  if(p.querySelector('#core-c'))guide={asset:'explain',title:'小雪的叮嚀｜從工廠看見家庭生活',text:'想想看：工廠增加了哪些工作機會？收入能如何改變家庭生活與進修選擇？把生產、工作與生活連起來說。'};
  if(p.querySelector('#core-d'))guide={asset:'shield',title:'小雪的叮嚀｜便利與代價要一起看',text:'評估一項建設時，先找它改善了什麼，再問可能影響誰的健康、生活或生態。能看到不同立場，答案才完整。'};
  if(p.querySelector('#skill-1'))guide={asset:'explain',title:'小雪的叮嚀｜先辨角色與問題',text:'同一項政策，對不同角色的影響可能不同。先確認題目問的是誰，再區分背景、措施與結果，就比較不會選錯。'};

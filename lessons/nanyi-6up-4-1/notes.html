":"花蓮吉安鄉日治移民村街道特色","explain":"正確答案為(1)，日治時期日本政府在吉野移民村從住宅到耕地之間修築了整齊的棋盤狀農用道路；選項(0)、(2)、(3)皆不符合課本記載的吉安鄉日治移民村道路特色。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"花蓮縣吉安慶修院現今是知名觀光景點，關於其歷史前身與建築保存的敘述，下列何者正確？","options":["原本是戰後眷村居民共同建立的佛寺","原本是阿美族部落舉辦豐年祭的集會所","原本是日治時期移民村的真言宗吉野布教所","原本是清帝國時期漢人開墾建立的媽祖廟"],"answer":2,"explanation":"正確答案為(1)，吉安慶修院前身為日治時期西元1917年建立的「真言宗高野山派吉野布教所」，現為臺灣保存最完整的日式寺院；選項(0)錯在非清代媽祖廟；選項(2)錯在非戰後眷村佛寺；選項(3)錯在非阿美族集會所。","concept":"吉安慶修院的歷史前身與地位","skill":"概念理解","review":"core-2","evidence":"吉安慶修院是當初移民村的信仰中心,目前是知名觀光景點,也是臺灣現存最完整的日式寺院","id":"q2","stem":"花蓮縣吉安慶修院現今是知名觀光景點，關於其歷史前身與建築保存的敘述，下列何者正確？","theme":"吉安慶修院的歷史前身與地位","explain":"正確答案為(1)，吉安慶修院前身為日治時期西元1917年建立的「真言宗高野山派吉野布教所」，現為臺灣保存最完整的日式寺院；選項(0)錯在非清代媽祖廟；選項(2)錯在非戰後眷村佛寺；選項(3)錯在非阿美族集會所。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"原住民族的傳統飲食承載著部落文化，下列關於魯凱族傳統美食「阿拜（abai）」的敘述，何者正確？","options":["過去是小米收成舉辦豐年祭時製作食用的部落粽","是由泰國與緬甸國軍撤退來臺時引進的料理","內餡主要包裹粒粒分明的高粱與糙米","源自於閩南地區沿海居民就地取材的麵食"],"answer":0,"explanation":"正確答案為(0)，魯凱族的阿拜（abai）是部落粽，過去在小米收成後舉辦豐年祭時製作食用；選項(1)描述的是吉拿富（阿拜內包被搗碎的小米粉等粉狀物，吃起來黏性明顯）；選項(2)與(3)將原住民傳統美食誤植為滇緬國軍或閩南麵食。","concept":"魯凱族傳統美食阿拜","skill":"概念理解","review":"core-3","evidence":"魯凱族的阿拜是一種部落粽,魯凱語是abai,在過去是小米收成後,舉辦豐年祭時才會製作並食用","id":"q3","stem":"原住民族的傳統飲食承載著部落文化，下列關於魯凱族傳統美食「阿拜（abai）」的敘述，何者正確？","theme":"魯凱族傳統美食阿拜","explain":"正確答案為(0)，魯凱族的阿拜（abai）是部落粽，過去在小米收成後舉辦豐年祭時製作食用；選項(1)描述的是吉拿富（阿拜內包被搗碎的小米粉等粉狀物，吃起來黏性明顯）；選項(2)與(3)將原住民傳統美食誤植為滇緬國軍或閩南麵食。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"臺灣傳統農業社會原本沒有吃牛肉的習慣，牛肉麵料理在臺灣出現並發展的歷史背景為何？","options":["荷蘭人治臺期間從歐洲引入牛隻與牛肉烹調法","民國38年政府來臺，軍人與家眷帶來麵食文化","日治時期日本總督府推廣牛肉膳食文化","清帝國時期閩南移民開墾時引進的家鄉菜"],"answer":1,"explanation":"正確答案為(1)，傳統農業社會務農不吃牛肉，直到民國38年中華民國政府來臺，軍事人員與家眷將中國麵食文化帶到臺灣，才逐漸發展出紅燒與清燉牛肉麵；選項(0)、(2)、(3)之時代與族群背景皆不符合事實。","concept":"臺灣牛肉麵料理出現的歷史背景","skill":"概念理解","review":"core-4","evidence":"直到民國38年中華民國政府來臺,軍人與家眷也將中國麵食文化帶到臺灣","id":"q4","stem":"臺灣傳統農業社會原本沒有吃牛肉的習慣，牛肉麵料理在臺灣出現並發展的歷史背景為何？","theme":"臺灣牛肉麵料理出現的歷史背景","explain":"正確答案為(1)，傳統農業社會務農不吃牛肉，直到民國38年中華民國政府來臺，軍事人員與家眷將中國麵食文化帶到臺灣，才逐漸發展出紅燒與清燉牛肉麵；選項(0)、(2)、(3)之時代與族群背景皆不符合事實。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"高雄市戰後吸引大量來自澎湖的移民定居，下列何者是澎湖移民在高雄建立的重要民間信仰中心？","options":["吉安慶修院","寶藏巖廟","開臺天后宮","文武聖殿"],"answer":3,"explanation":"正確答案為(1)，高雄市文武聖殿是由澎湖移民建造的「澎湖廟」，至今仍為當地重要的民間信仰中心；選項(0)慶修院在花蓮吉安；選項(2)、(3)非澎湖移民在高雄建造的代表性移民廟宇。","concept":"澎湖移民在高雄的民間信仰","skill":"概念理解","review":"core-5","evidence":"高雄市文武聖殿是由澎湖移民建造的「澎湖廟」,至今仍為當地重要的民間信仰中心","id":"q5","stem":"高雄市戰後吸引大量來自澎湖的移民定居，下列何者是澎湖移民在高雄建立的重要民間信仰中心？","theme":"澎湖移民在高雄的民間信仰","explain":"正確答案為(1)，高雄市文武聖殿是由澎湖移民建造的「澎湖廟」，至今仍為當地重要的民間信仰中心；選項(0)慶修院在花蓮吉安；選項(2)、(3)非澎湖移民在高雄建造的代表性移民廟宇。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"戰後隨政府撤退來臺的軍民在各地建立眷村，下列哪一個位於高雄市鳳山區的眷村已被登錄為文化景觀？","options":["黃埔新村","定遠新村","博望新村","壽亭新村"],"answer":0,"explanation":"正確答案為(2)，高雄市鳳山區的黃埔新村是臺灣第一代眷村之一，為高雄戰後作為軍事重鎮的象徵，已登錄為文化景觀；選項(0)、(1)、(3)皆為南投縣仁愛鄉清境農場的高山眷村。","concept":"眷村建築景觀與黃埔新村","skill":"概念理解","review":"core-6","evidence":"高雄市鳳山區的黃埔新村,是臺灣第一代眷村之一,也是高雄在戰後作為軍事重鎮的具體象徵,已登錄為文化景觀","id":"q6","stem":"戰後隨政府撤退來臺的軍民在各地建立眷村，下列哪一個位於高雄市鳳山區的眷村已被登錄為文化景觀？","theme":"眷村建築景觀與黃埔新村","explain":"正確答案為(2)，高雄市鳳山區的黃埔新村是臺灣第一代眷村之一，為高雄戰後作為軍事重鎮的象徵，已登錄為文化景觀；選項(0)、(1)、(3)皆為南投縣仁愛鄉清境農場的高山眷村。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"民國50年代政府將曾在泰國、緬甸邊界駐守撤退來臺的國軍安置於南投縣仁愛鄉（清境農場），這批滇緬義胞帶來了哪一種地方特色料理與節慶？","options":["越南河粉與潑水節","雲南料理與清境火把節","阿美族野菜與豐年祭","客家擂茶與客家義民祭"],"answer":1,"explanation":"正確答案為(1)，滇緬邊區國軍多來自雲南地區，安置於清境農場後帶來雲南料理（如米線、涼拌豌豆粉）並舉辦清境火把節；選項(0)、(2)、(3)皆屬其他族群或國家的文化特色。","concept":"滇緬國軍撤退與清境雲南文化","skill":"概念理解","review":"core-7","evidence":"地方因此出現許多雲南料理。一年一度的「清境火把節」是源自於中國西南地區少數民族的傳統節日","id":"q7","stem":"民國50年代政府將曾在泰國、緬甸邊界駐守撤退來臺的國軍安置於南投縣仁愛鄉（清境農場），這批滇緬義胞帶來了哪一種地方特色料理與節慶？","theme":"滇緬國軍撤退與清境雲南文化","explain":"正確答案為(1)，滇緬邊區國軍多來自雲南地區，安置於清境農場後帶來雲南料理（如米線、涼拌豌豆粉）並舉辦清境火把節；選項(0)、(2)、(3)皆屬其他族群或國家的文化特色。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"新住民陳玉水女士（原籍越南）在臺灣致力於促進文化與權益保障，她的主要傑出貢獻為何？","options":["編寫臺灣與越南重要法律名詞對照表","推動黃埔新村以住代護計畫","獲得金鐘獎最佳行腳節目主持人","創立韻律體操協會培育臺灣選手"],"answer":0,"explanation":"正確答案為(2)，陳玉水女士編寫法律名詞對照表，幫助越南新住民和移工了解臺灣法律以保障自身權益；選項(0)為瑞莎的貢獻；選項(1)為吳鳳的成就；選項(3)為高雄市政府文化局的眷村維護計畫。","concept":"新住民的傑出貢獻","skill":"概念理解","review":"core-8","evidence":"臺灣、越南重要法律名詞對照表編者——陳玉水,透過法律名詞對照表,讓越南新住民和移工了解臺灣法律,保障自身權益","id":"q8","stem":"新住民陳玉水女士（原籍越南）在臺灣致力於促進文化與權益保障，她的主要傑出貢獻為何？","theme":"新住民的傑出貢獻","explain":"正確答案為(2)，陳玉水女士編寫法律名詞對照表，幫助越南新住民和移工了解臺灣法律以保障自身權益；選項(0)為瑞莎的貢獻；選項(1)為吳鳳的成就；選項(3)為高雄市政府文化局的眷村維護計畫。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"臺中市「東協廣場」（舊稱第一廣場）轉型為東南亞特色商圈的主要原因為何？","options":["日治時期即被指定為日本移民專用購物商場","政府強制將所有老舊市場改建為外籍醫院","舊商圈沒落後，因交通便利與租金低廉吸引移工與新住民聚集開店","周邊興建了大型國際機場與港口吸引觀光客"],"answer":2,"explanation":"正確答案為(1)，第一廣場因商圈移轉人潮散去，後來因距離火車站近、交通便利且租金低廉，吸引移工與新住民進駐開店，轉型為東協廣場；選項(0)非改建為醫院；選項(2)非日治移民專用場；選項(3)與轉型主因無關。","concept":"臺中東協廣場轉型原因","skill":"概念理解","review":"core-9","evidence":"第一廣場低廉的租金也吸引臺灣人、新住民進駐開店,形成東南亞特色商圈,政府也將此地更名為「東協廣場」","id":"q9","stem":"臺中市「東協廣場」（舊稱第一廣場）轉型為東南亞特色商圈的主要原因為何？","theme":"臺中東協廣場轉型原因","explain":"正確答案為(1)，第一廣場因商圈移轉人潮散去，後來因距離火車站近、交通便利且租金低廉，吸引移工與新住民進駐開店，轉型為東協廣場；選項(0)非改建為醫院；選項(2)非日治移民專用場；選項(3)與轉型主因無關。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"日治時期日本政府在花蓮吉安建立移民村時，除了鼓勵日本民眾移入外，還主要招募了臺灣哪一個區域的客家人前往開墾？","options":["宜蘭、花蓮、臺東地區","桃園、新竹、苗栗地區","臺南、高雄、屏東地區","基隆、臺北、新北地區"],"answer":1,"explanation":"正確答案為(2)，日治時期總督府招募桃、竹、苗等地的客家人前往吉安開墾；選項(0)、(1)、(3)皆非課本記載當時主要招募客家移民的來源地。","concept":"吉安鄉客家移民來源","skill":"概念理解","review":"core-1","evidence":"當時不只鼓勵日本人移民,也招募桃、竹、苗等地的客家人來此開墾","id":"q10","stem":"日治時期日本政府在花蓮吉安建立移民村時，除了鼓勵日本民眾移入外，還主要招募了臺灣哪一個區域的客家人前往開墾？","theme":"吉安鄉客家移民來源","explain":"正確答案為(2)，日治時期總督府招募桃、竹、苗等地的客家人前往吉安開墾；選項(0)、(1)、(3)皆非課本記載當時主要招募客家移民的來源地。","reviewText":"核心 1","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 花蓮吉安鄉的族群歷史與棋盤狀街道","title":"花蓮吉安鄉的族群歷史與棋盤狀街道","bullets":["花蓮縣吉安鄉早期為阿美族部落，現今黃昏市場仍販售阿美族自家摘採的各類野菜。","日治時期日本政府在此建立移民村並稱作吉野，規劃整齊的棋盤狀農用道路與交通網絡。","政府當時除了鼓勵日本人移入開墾外，也招募桃園、新竹、苗栗等地的客家人前來開墾。","不同族群在吉安鄉留下豐富活動軌跡，展現原住民、日本與客家文化交融的特色。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 慶修院與客家移民歷史廊道","title":"慶修院與客家移民歷史廊道","bullets":["吉安慶修院原本是日治時期日本移民村的信仰中心，名為真言宗高野山派吉野布教所。","日治時期結束後改名為慶修院，是臺灣現存最完整的日式寺院並列為觀光景點。","吉安溪出海口曾是早期漢人與日本移民在花蓮上岸之處，現規畫為客家移民歷史廊道。","廊道設有伯公的叮嚀標語，伯公在客家話中代表對土地公或爸爸的伯父的尊稱與守護之意。"]},{"id":"core-3","type":"core","tag":"C 多元族群帶來的飲食文化特色","title":"多元族群帶來的飲食文化特色","bullets":["人們因人生各階段需求、天災或戰爭改變居住地點，對移入地區帶來不同生活風貌。","飲食是生活環境中最容易觀察的族群特色，承載著族群歷史記憶與生活經驗。","魯凱族傳統美食阿拜為部落粽，過去在小米收成舉辦豐年祭時製作並食用。","閩南傳統小吃蚵仔煎傳入臺灣後，成為街頭巷尾常見且極具代表性的在地美食。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 客家傳統茶點與牛肉麵的歷史演變","title":"客家傳統茶點與牛肉麵的歷史演變","bullets":["客家人招待貴賓常準備擂茶與糍粑，擂茶將茶葉與花生等研磨成粉沖泡並加入玄米。","臺灣傳統農業社會因務農不吃牛肉，直到民國38年政府來臺帶來中國麵食文化。","四川老兵思念家鄉辣味使用豆瓣醬與牛肉烹煮，演變為現在的臺式紅燒牛肉麵。","清燉牛肉麵則源於伊斯蘭信仰，湯頭清爽，展現宗教與飲食文化在臺灣的結合。"]},{"id":"core-5","type":"core","tag":"E 高雄港發展與澎湖移民的深耕貢獻","title":"高雄港發展與澎湖移民的深耕貢獻","bullets":["高雄市於日治時期修築高雄港及戰後設置加工出口區，吸引大量外縣市移民移入。","其中來自澎湖的移民人數眾多，在高雄推動教育文化、創辦私塾與詩社並參與政治。","高雄市首位民選市長即為澎湖籍，當地街道上也開設許多強調澎湖料理的海產店。","澎湖移民建造文武聖殿作為澎湖廟，成為當地重要民間信仰中心與同鄉凝聚據點。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 眷村建築景觀與黃埔新村的文化資產保存","title":"眷村建築景觀與黃埔新村的文化資產保存","bullets":["二戰後隨政府撤退來臺的軍民在各地建立眷村，形成臺灣特殊的社區與建築景觀。","眷村常見紅磚搭建的矮平房以及可以養雞鴨的竹籬笆，承載著特殊的族群生活記憶。","高雄市鳳山區的黃埔新村是臺灣第一代眷村之一，為軍事重鎮象徵且登錄為文化景觀。","政府現今推動以住代護計畫，讓民眾入住經營老屋，用不一樣的方式維護歷史建物。"]},{"id":"core-7","type":"core","tag":"G 滇緬國軍撤退與清境的雲南少數民族文化","title":"滇緬國軍撤退與清境的雲南少數民族文化","bullets":["曾在泰國與緬甸邊界駐守的國軍，於民國50年代撤退來臺後安置於南投縣仁愛鄉。","這批滇緬義胞多來自雲南地區，在清境農場從事農墾開發並帶來多道雲南特色料理。","當地舉辦清境火把節，源自中國西南地區少數民族傳統節日，具有照天祈年與除穢意涵。","火把節結合滇緬義胞孤軍精神與在地原住民族舞蹈，展現多元文化融合與傳承。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 新住民的加入與各領域的傑出貢獻","title":"新住民的加入與各領域的傑出貢獻","bullets":["現今有越來越多因婚姻或工作關係申請歸化我國的新住民及其子女，成為重要族群。","土耳其籍吳鳳獲得金鐘獎行腳節目主持人，以不同視角帶領大家看見臺灣在地文化。","烏克蘭籍瑞莎創立韻律體操協會培育臺灣選手；越南籍陳玉水編寫法律名詞對照表。","陳玉水編寫臺灣與越南法律名詞對照表，幫助新住民與移工了解法律以保障自身權益。"]},{"id":"core-9","type":"core","tag":"I 臺中東協廣場的轉型與東南亞特色商圈","title":"臺中東協廣場的轉型與東南亞特色商圈","bullets":["臺中市第一廣場曾是繁華商圈，後因商圈移轉與市政府搬遷人潮散去而落寞。","臺中市產業發達且移工眾多，交通便利的第一廣場成為移工假日碰面集合的首選。","低廉租金吸引臺灣人與新住民進駐開店，形成充滿東南亞風味的特色商圈。","政府將第一廣場更名為東協廣場並整治附近的綠川與柳川，提供友善文化交流空間。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"花蓮縣吉安鄉的吉安慶修院是清帝國時期漢人開墾時興建的傳統廟宇。","right":"吉安慶修院是日治時期日本移民村的日式布教所，為臺灣現存最完整的日式寺院。 課本明載慶修院前身為日治時期日本移民村信仰中心真言宗布教所，非清朝漢人古廟。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"南投清境農場的雲南料理與清境火把節是由日治時期的日本移民所傳入。","right":"是由民國50年代從泰國、緬甸邊界撤退來臺的國軍（滇緬義胞）安置在仁愛鄉農墾傳入。 清境雲南文化源於戰後泰緬邊境駐守國軍撤退安置，火把節則源自中國西南少數民族傳統。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"高雄市著名信仰中心文武聖殿是由金門移民為了推動經濟發展所興建。","right":"文武聖殿是由澎湖移民所建造的澎湖廟，為澎湖移民在高雄深耕的民間信仰中心。 課本與考題明確指出高雄戰後吸引大量澎湖移民，文武聖殿是澎湖同鄉建造的信仰中心。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"早期政府要求原住民族使用漢名，現今身分證仍嚴格規定只能單獨標示漢語名字。","right":"政府已修法保障姓名權，原住民族身分證可選擇漢名、漢名與族語拼音並列或單列族語名。 現行法規已尊重原住民族身分認同，提供多種族語名字登記選項，不再強制僅用漢名。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"魯凱族的阿拜與排灣族的吉拿富完全相同，包的食材與口感沒有任何區別。","right":"阿拜裡面包搗碎的小米粉等粉狀物且黏性明顯；吉拿富包粒粒分明的小米、糯米或芋頭粉。 課本圖意明確說明兩者可從內容物區分，包粉狀黏性大者為阿拜，包粒粒分明者為吉拿富。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"臺中東協廣場舊稱第一廣場，因商圈沒落後已被改建為大型醫療院所且只許外籍人士進入。","right":"第一廣場因交通便利吸引移工與新住民進駐開店，轉型為東南亞特色商圈並促進文化交流。 第一廣場更名東協廣場後形成東南亞特色商圈，並未改成醫院，也是開放給大眾交流的空間。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"移居歷史與在地聚落風貌｜知識關係","chain":["早期原住民族部落與遷徙","日治時期吉安鄉棋盤狀街道與慶修院日式寺院","吉安溪出海口規劃客家移民歷史廊道與伯公信仰"]},{"id":"logic-2","type":"chain","title":"族群遷徙與飲食文化交融｜知識關係","chain":["不同歷史階段族群移入帶來的生活改變","原住民阿拜、閩南蚵仔煎與客家擂茶糍粑","戰後牛肉麵演變及新住民引入越南河粉"]},{"id":"logic-3","type":"chain","title":"移入地區深耕與特色景觀｜知識關係","chain":["戰後高雄港與加工區吸引大量澎湖移民建立文武聖殿","國軍撤退建眷村形成紅磚竹籬笆與黃埔新村景觀","泰緬國軍安置清境農場帶來雲南料理與火把節"]},{"id":"logic-4","type":"chain","title":"新住民貢獻與商圈空間再生｜知識關係","chain":["婚姻與工作歸化我國的新住民人數增加","吳鳳、瑞莎與陳玉水在各專業領域展現貢獻","臺中第一廣場因移工與新住民進駐轉型東協廣場"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣主要族群移入背景與在地文化特色對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜臺灣代表性飲食文化與族群背景及因果流變圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["魯凱族阿拜（abai）","排灣族吉拿富（cinavu）","兩者外型相像，但阿拜內部包裹粉狀物（如搗碎的小米粉），吃起來黏性明顯；吉拿富則包裹粒粒分明的小米、糯米、紅藜或芋頭粉。"],["紅燒牛肉麵","清燉牛肉麵","紅燒牛肉麵係由思念家鄉辣味的四川老兵使用豆瓣醬與花椒烹煮演變而成；清燉牛肉麵則源於伊斯蘭信仰，湯頭較為清爽。"],["眷村建築景觀（如黃埔新村）","東南亞特色商圈（如東協廣場）","眷村係戰後隨政府撤退軍民所建，以紅磚平房與竹籬笆為特色，如高雄黃埔新村登錄為文化景觀；東協廣場則由臺中第一廣場轉型，因交通便利吸引移工與新住民進駐形成特色商圈。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","慶修院","位於花蓮縣吉安鄉，前身為日治時期日本移民村的真言宗布教所，現為臺灣保存最完整的日式寺院。"],["2","伯公","客家話中對土地公或爸爸的伯父的尊稱，在客家聚落中象徵守護家園的指標性信仰。"],["3","阿拜（abai）","魯凱族傳統部落粽，過去於小米收成豐年祭時製作，內包被搗碎的小米粉等粉狀物，具有明顯黏性。"],["4","客家擂茶","客家人招待貴賓的茶點，以陶製擂缽將茶葉、芝麻、花生研磨成粉後沖泡熱水並加入玄米飲用。"],["5","文武聖殿","位於高雄市鹽埕區，由戰後移入高雄的澎湖移民所建造的澎湖廟，為當地重要民間信仰中心。"],["6","黃埔新村","位於高雄市鳳山區，為臺灣第一代眷村之一，展現戰後眷村建築紋理與文化，已登錄為文化景觀。"],["7","清境火把節","源自中國西南少數民族傳統節日，由泰緬撤退來臺的滇緬義胞帶入清境農場，象徵照天祈年與團結傳承。"],["8","歸化","外國人依據法律規定申請取得中華民國國籍，如新住民因婚姻或高級專業人才關係歸化我國。"],["9","東協廣場","位於臺中火車站附近，舊稱第一廣場，因交通便利吸引移工與新住民聚集進駐，轉型為東南亞特色商圈。"],["10","身分證姓名權","政府修法保障原住民族身分權益，身分證姓名可選擇漢名、漢名與族語拼音並列、漢字音譯或單列族語名。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"客家伯公信仰意涵","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"客家移民在吉安溪出海口設立了「客家移民歷史廊道」，並使用「伯公的叮嚀」為標語。關於客家文化中「伯公」的意涵與信仰功能判讀，下列何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"阿拜與吉拿富的比較區分","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較魯凱族的「阿拜（abai）」與排灣族的「吉拿富（cinavu）」這兩種傳統美食，主要可以透過下列哪一個特徵來精準區分？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜比較分類","clue":"紅燒與清燉牛肉麵的起源比較","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較臺式「紅燒牛肉麵」與「清燉牛肉麵」的起源與口味特色，下列敘述何者符合歷史因果發展？"}]}],"cloze":{"core-1":{"selector":".point","terms":["棋盤狀農用道路"]},"core-2":{"selector":".point","terms":["慶修院"]},"core-3":{"selector":".point","terms":["飲食"]},"core-4":{"selector":".point","terms":["紅燒牛肉麵"]},"core-5":{"selector":".point","terms":["文武聖殿"]},"core-6":{"selector":".point","terms":["黃埔新村"]},"core-7":{"selector":".point","terms":["清境火把節"]},"core-8":{"selector":".point","terms":["法律名詞對照表"]},"core-9":{"selector":".point","terms":["東協廣場"]},"mindmap-overview":{"selector":".mind-branch p","terms":["慶修院日式寺院","牛肉麵","黃埔新村","東協廣場"]},"trap-1":{"selector":".correct","terms":["慶修院"]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["文武聖殿"]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["慶修院","伯公","阿拜（abai）","客家擂茶","文武聖殿","黃埔新村","清境火把節","歸化","東協廣場","身分證姓名權"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>移居歷史與在地聚落風貌\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>早期原住民族部落與遷徙\u003c/p>\u003cp>\u003cb>關係：\u003c/b>日治時期吉安鄉棋盤狀街道與慶修院日式寺院\u003c/p>\u003cp>\u003cb>結果：\u003c/b>吉安溪出海口規劃客家移民歷史廊道與伯公信仰\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>族群遷徙與飲食文化交融\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>不同歷史階段族群移入帶來的生活改變\u003c/p>\u003cp>\u003cb>關係：\u003c/b>原住民阿拜、閩南蚵仔煎與客家擂茶糍粑\u003c/p>\u003cp>\u003cb>結果：\u003c/b>戰後牛肉麵演變及新住民引入越南河粉\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>移入地區深耕與特色景觀\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>戰後高雄港與加工區吸引大量澎湖移民建立文武聖殿\u003c/p>\u003cp>\u003cb>關係：\u003c/b>國軍撤退建眷村形成紅磚竹籬笆與黃埔新村景觀\u003c/p>\u003cp>\u003cb>結果：\u003c/b>泰緬國軍安置清境農場帶來雲南料理與火把節\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>新住民貢獻與商圈空間再生\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>婚姻與工作歸化我國的新住民人數增加\u003c/p>\u003cp>\u003cb>關係：\u003c/b>吳鳳、瑞莎與陳玉水在各專業領域展現貢獻\u003c/p>\u003cp>\u003cb>結果：\u003c/b>臺中第一廣場因移工與新住民進駐轉型東協廣場\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>多元族群的共榮\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">族群與移入背景\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">代表性地點或聚落\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">文化特色與生活影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>族群與移入背景\u003c/th>\u003cth>代表性地點或聚落\u003c/th>\u003cth>文化特色與生活影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>日治及客家移民（開墾移入）\u003c/td>\u003ctd>花蓮縣吉安鄉（吉野移民村）\u003c/td>\u003ctd>棋盤狀整齊道路、吉安慶修院日式寺院、客家移民歷史廊道\u003c/td>\u003c/tr>\u003ctr>\u003ctd>澎湖移民（工作與經商）\u003c/td>\u003ctd>高雄市鹽埕區等地區\u003c/td>\u003ctd>興建文武聖殿（澎湖廟）、參與地方政治與推廣澎湖海鮮料理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>滇緬邊區國軍（戰後撤退安置）\u003c/td>\u003ctd>南投縣仁愛鄉清境農場\u003c/td>\u003ctd>建立博望等高山眷村、發展雲南料理與舉辦清境火把節\u003c/td>\u003c/tr>\u003ctr>\u003ctd>新住民與移工（婚姻與工作歸化）\u003c/td>\u003ctd>臺中市東協廣場（原第一廣場）\u003c/td>\u003ctd>引進東南亞飲食與商品、形成異國特色商圈與促進文化交流\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依族群移入背景、所在代表地點至文化特色與影響進行橫向比對判讀。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論南投清境農場的雲南文化是在日治時期由日本移民所引進的。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>戰後吸引大量澎湖移民移入，並由澎湖同鄉建立文武聖殿與推廣海鮮料理的是哪一個城市？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>高雄市。因為日治時期修築高雄港及戰後設置加工出口區，提供大量就業機會吸引澎湖移民定居。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">飲食文化名稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">族群背景與來源\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">歷史因果與文化意涵\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>飲食文化名稱\u003c/th>\u003cth>族群背景與來源\u003c/th>\u003cth>歷史因果與文化意涵\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>魯凱族阿拜（abai）\u003c/td>\u003ctd>原住民族傳統美食\u003c/td>\u003ctd>過去在小米收成豐年祭時製作食用，內包粉狀物黏性明顯\u003c/td>\u003c/tr>\u003ctr>\u003ctd>客家擂茶與糍粑\u003c/td>\u003ctd>客家傳統招待茶點\u003c/td>\u003ctd>擂茶將茶葉與花生研磨成粉沖泡加入玄米；糍粑為搥打糯米製成\u003c/td>\u003c/tr>\u003ctr>\u003ctd>紅燒與清燉牛肉麵\u003c/td>\u003ctd>戰後軍民與伊斯蘭信仰演變\u003c/td>\u003ctd>傳統農家不吃牛肉，戰後軍眷引入麵食，老兵以豆瓣醬烹調紅燒牛肉麵\u003c/td>\u003c/tr>\u003ctr>\u003ctd>越南河粉與雲南料理\u003c/td>\u003ctd>跨國新住民與泰緬國軍眷屬\u003c/td>\u003ctd>由婚姻工作新住民及撤退來臺滇緬國軍帶入，豐富臺灣多樣飲食風貌\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>從飲食名稱、族群背景順序比對   if(p.querySelector('#skill-3'))guide={asset:'check',title:'小雪的叮嚀｜用圖上的證據回答',text:'看清圖名、圖例、單位與時間，再判斷變化。圖上沒有的數字不要猜，也不能把不同時期的建設混在一起。'};
  if(p.dataset.section==='core'){const subject=last.querySelector('h3')?.textContent||BOOK.meta.title;guide={asset:'explain',title:'小雪的叮嚀｜從這一頁想一想',text:'試著用自己的話解釋『'+esc(subject)+'』：有哪些重要條件？發生了什麼變化？又造成什麼影響？'}}const height=Math.min(230,Math.floor(free-24));
  const note=document.createElement('aside');note.className='snow-note';note.style.setProperty('--snow-height',height+'px');
  note.innerHTML=`<img src="${ASSETS[guide.asset]}" alt="去背的小雪${guide.asset==='check'?'舉掌提醒先查核':guide.asset==='shield'?'持盾提醒注意陷阱':'側身介紹學習重點'}"><div class="snow-bubble"><h4>${guide.title}</h4><p>${guide.text}</p></div>`;
  b.append(note);await readyImages(note);
  if(!fits(p))note.remove();
 }
}

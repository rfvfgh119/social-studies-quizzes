t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>南一6上3-2 臺灣的區域發展與交流</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"南一版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-2","title":"臺灣的區域發展與交流"},"questions":[{"question":"民國80年代，政府在臺南設立臺南科學工業園區（今南部科學園區臺南園區），主要是希望達到何種效益？","options":["取代臺北地區成為臺灣唯一的政經中心","將傳統農業全數改為牛隻榨汁的糖廍生產","帶動當地高科技產業發展並形成以園區為核心的聚落","促使人口與工廠全面向東部花蓮移動"],"answer":2,"explanation":"正確答案為(1)，民國80年代政府在臺南設立臺南科學工業園區，目的是帶動當地高科技產業發展，並規劃交通道路形成以園區為核心的聚落；選項(0)錯在並非向東部花蓮移動；選項(2)錯在糖廍係日治早期傳統榨汁設施；選項(3)錯在北部臺北仍為政經中心。","concept":"產業發展與人口向都市移動","skill":"概念理解","review":"core-1","evidence":"民國80年代,政府在臺南設立臺南科學工業園區(今南部科學園區臺南園區),希望以此帶動臺南市高科技產業的發展","id":"q1","stem":"民國80年代，政府在臺南設立臺南科學工業園區（今南部科學園區臺南園區），主要是希望達到何種效益？","theme":"產業發展與人口向都市移動","explain":"正確答案為(1)，民國80年代政府在臺南設立臺南科學工業園區，目的是帶動當地高科技產業發展，並規劃交通道路形成以園區為核心的聚落；選項(0)錯在並非向東部花蓮移動；選項(2)錯在糖廍係日治早期傳統榨汁設施；選項(3)錯在北部臺北仍為政經中心。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"關於現今臺灣人口主要聚集地「六都」的組成縣市，下列哪一個縣市屬於六都之一？","options":["基隆市","桃園市","新竹市","嘉義市"],"answer":1,"explanation":"正確答案為(2)，現今臺灣的六都包含臺北市、新北市、桃園市、臺中市、臺南市與高雄市；選項(0)新竹市、選項(1)基隆市與選項(3)嘉義市皆非六直轄市之一。","concept":"六都與都會區的形成","skill":"概念理解","review":"core-2","evidence":"臺北市、新北市、桃園市、臺中市、臺南市與高雄市被合稱為「六都」","id":"q2","stem":"關於現今臺灣人口主要聚集地「六都」的組成縣市，下列哪一個縣市屬於六都之一？","theme":"六都與都會區的形成","explain":"正確答案為(2)，現今臺灣的六都包含臺北市、新北市、桃園市、臺中市、臺南市與高雄市；選項(0)新竹市、選項(1)基隆市與選項(3)嘉義市皆非六直轄市之一。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"關於日治時期（西元1926年）臺灣行政區域劃分中的「州」，其性質與劃分目的為何？","options":["屬於軍事管制區，僅設於金門與馬祖地區","由國家發展委員會前身劃定，專門用於土地改革","非正式地方政府，僅用於中央規劃區域發展方向","屬於正式的地方政府行政區，主要目的為治理方便"],"answer":3,"explanation":"正確答案為(0)，日治時期的「州」（如臺北州、新竹州等五州三廳）屬於正式的地方政府，設立目的係為了治理方便；選項(1)係現行五大區域的性質；選項(2)與(3)之機構與範圍描述均不符合日治時期行政區劃事實。","concept":"五大區域劃分與日治時期行政區對比","skill":"概念理解","review":"core-3","evidence":"日治時期的「州」屬於正式的地方政府,而現今五大區域則用於規畫區域各項發展","id":"q3","stem":"關於日治時期（西元1926年）臺灣行政區域劃分中的「州」，其性質與劃分目的為何？","theme":"五大區域劃分與日治時期行政區對比","explain":"正確答案為(0)，日治時期的「州」（如臺北州、新竹州等五州三廳）屬於正式的地方政府，設立目的係為了治理方便；選項(1)係現行五大區域的性質；選項(2)與(3)之機構與範圍描述均不符合日治時期行政區劃事實。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"行政院交通部推出的「TPASS行政院通勤月票」，主要透過何種方式協助民眾在地方生活圈內通勤？","options":["提供免費搭乘飛機前往金馬地區戰地觀光的優惠","強制所有汽車與機車駕駛改騎腳踏車通勤","透過一張票卡整合公車、捷運、輕軌、臺鐵與城際客運等大眾運輸工具","限制民眾只能在自己居住的單一村里內使用公共運輸"],"answer":2,"explanation":"正確答案為(3)，TPASS包含公車、捷運、輕軌、臺鐵及城際客運等大眾運輸工具，民眾可透過一張票卡整合在生活圈內通勤；選項(0)限制村里與課本擴大生活圈不符；選項(1)與(2)皆非TPASS月票的整合功能。","concept":"TPASS與地方生活圈","skill":"概念理解","review":"core-4","evidence":"行政院交通部推出的「TPASS行政院通勤月票」,包含公車、捷運、輕軌、臺鐵、城際間的客運等各類大眾運輸工具,都能透過一張票卡整合","id":"q4","stem":"行政院交通部推出的「TPASS行政院通勤月票」，主要透過何種方式協助民眾在地方生活圈內通勤？","theme":"TPASS與地方生活圈","explain":"正確答案為(3)，TPASS包含公車、捷運、輕軌、臺鐵及城際客運等大眾運輸工具，民眾可透過一張票卡整合在生活圈內通勤；選項(0)限制村里與課本擴大生活圈不符；選項(1)與(2)皆非TPASS月票的整合功能。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"中部地區發展多元，其中哪一個都市發展精密機械業及高科技產業，成為中部區域發展的核心？","options":["苗栗縣","臺中市","彰化縣","南投縣"],"answer":1,"explanation":"正確答案為(1)，臺中市發展精密機械業及高科技產業，吸引民眾就業與生活，成為中部區域發展的核心；選項(0)苗栗與選項(2)南投以觀光業為主；選項(3)彰化與雲林為蔬果之鄉。","concept":"北部與中部區域發展特色","skill":"概念理解","review":"core-5","evidence":"臺中市則發展精密機械業及高科技產業,吸引民眾前來就業與生活,因而成為中部區域發展的核心","id":"q5","stem":"中部地區發展多元，其中哪一個都市發展精密機械業及高科技產業，成為中部區域發展的核心？","theme":"北部與中部區域發展特色","explain":"正確答案為(1)，臺中市發展精密機械業及高科技產業，吸引民眾就業與生活，成為中部區域發展的核心；選項(0)苗栗與選項(2)南投以觀光業為主；選項(3)彰化與雲林為蔬果之鄉。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"臺灣東部地區大規模開發較晚，位於中央山脈與海岸山脈之間的平原區域，為當地主要的農業區。該平原名稱為何？","options":["蘭陽平原","花東縱谷平原","彰化平原","嘉南平原"],"answer":1,"explanation":"正確答案為(0)，位於中央山脈與海岸山脈之間的花東縱谷平原係東部主要的農業區；選項(1)嘉南平原在南部；選項(2)彰化平原在中部；選項(3)蘭陽平原在北部宜蘭。","concept":"南部、東部與金馬區域發展特色","skill":"概念理解","review":"core-6","evidence":"位於中央山脈與海岸山脈之間的花東縱谷平原,是當地主要的農業區","id":"q6","stem":"臺灣東部地區大規模開發較晚，位於中央山脈與海岸山脈之間的平原區域，為當地主要的農業區。該平原名稱為何？","theme":"南部、東部與金馬區域發展特色","explain":"正確答案為(0)，位於中央山脈與海岸山脈之間的花東縱谷平原係東部主要的農業區；選項(1)嘉南平原在南部；選項(2)彰化平原在中部；選項(3)蘭陽平原在北部宜蘭。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"為了避免區域經濟開發對環境造成不可逆的傷害，政府訂定相關法律規定在經濟開發前須採取何種措施？","options":["強制將工業廢水全數排入農田","禁止廠商設置任何汙水處理設備","要求所有工廠取締後立即停止生產","評估開發行為對環境的影響"],"answer":3,"explanation":"正確答案為(1)，政府訂定環境影響評估等法律，要求在經濟開發前先評估開發行為對環境的影響；選項(0)非預先評估機制；選項(2)任意排放廢水會造成汙染；選項(3)與裝設汙水處理設備之規定相反。","concept":"區域發展中的環境議題與預防機制","skill":"概念理解","review":"core-7","evidence":"政府訂定相關法律,希望在經濟開發前,先評估開發行為對環境有什麼影響","id":"q7","stem":"為了避免區域經濟開發對環境造成不可逆的傷害，政府訂定相關法律規定在經濟開發前須採取何種措施？","theme":"區域發展中的環境議題與預防機制","explain":"正確答案為(1)，政府訂定環境影響評估等法律，要求在經濟開發前先評估開發行為對環境的影響；選項(0)非預先評估機制；選項(2)任意排放廢水會造成汙染；選項(3)與裝設汙水處理設備之規定相反。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"由於廣大工作機會與生活便利吸引人口過度湧入都市，常引發下列哪一種都市區域常見的困境？","options":["人口嚴重的急遽老齡空洞化","醫療資源嚴重閒置無人使用","交通壅塞與房價高漲","工作機會極度缺乏"],"answer":2,"explanation":"正確答案為(2)，人口過度湧入都市常引發交通壅塞、房價高漲與空氣汙染等問題；選項(0)、(1)、(3)皆屬於鄉村區域面臨的人口外移、就業缺乏與醫療資源不足問題。","concept":"都市區域發展的困境與因應","skill":"概念理解","review":"core-8","evidence":"因人口過度湧入都市,常引發許多問題,例如:交通壅塞、房價高漲、空氣汙染等","id":"q8","stem":"由於廣大工作機會與生活便利吸引人口過度湧入都市，常引發下列哪一種都市區域常見的困境？","theme":"都市區域發展的困境與因應","explain":"正確答案為(2)，人口過度湧入都市常引發交通壅塞、房價高漲與空氣汙染等問題；選項(0)、(1)、(3)皆屬於鄉村區域面臨的人口外移、就業缺乏與醫療資源不足問題。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"為了因應鄉村人口外移與人口老化現象，政府制定政策鼓勵青年返鄉工作，預期能帶來何種正面效益？","options":["將鄉村農田全數改建為重工業大煉鋼廠","限制年輕人不得在鄉村舉辦任何市集活動","強制鄉村老人家全數移居都市住高樓大廈","減緩鄉村人口老化並帶動地方產業發展創新經營方式"],"answer":3,"explanation":"正確答案為(0)，鼓勵青年返鄉工作可減緩鄉村人口老化，並透過創新經營帶動地方產業；選項(1)強制移居不合情理；選項(2)改建大煉鋼廠非鄉村活化政策；選項(3)與開發農產特色餐點及舉辦市集相反。","concept":"鄉村區域困境與青年返鄉推動","skill":"概念理解","review":"core-9","evidence":"鼓勵青年返鄉工作,以減緩鄉村人口老化,還能帶動地方產業,發展創新經營方式","id":"q9","stem":"為了因應鄉村人口外移與人口老化現象，政府制定政策鼓勵青年返鄉工作，預期能帶來何種正面效益？","theme":"鄉村區域困境與青年返鄉推動","explain":"正確答案為(0)，鼓勵青年返鄉工作可減緩鄉村人口老化，並透過創新經營帶動地方產業；選項(1)強制移居不合情理；選項(2)改建大煉鋼廠非鄉村活化政策；選項(3)與開發農產特色餐點及舉辦市集相反。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"早期發展工業時因未對工業廢棄物進行管制，工廠任意排放含有重金屬的汙水造成水汙染，導致臺灣西部沿海出現了何種環境汙染案例？","options":["紅潮魚類死亡事件","戴奧辛毒奶粉事件","沙灘石油汙染事件","綠牡蠣事件"],"answer":3,"explanation":"正確答案為(2)，早期政府未對工業廢棄物進行管制，工廠排放含重金屬汙水導致綠牡蠣出現，為水汙染典型案例；選項(0)、(1)、(3)皆非課本記載工廠排放重金屬汙水導致牡蠣變綠的案例名稱。","concept":"區域發展中的環境議題與預防機制","skill":"概念理解","review":"core-7","evidence":"這是因為工廠任意排放含有重金屬的汙水,所以讓牡蠣變成綠色了","id":"q10","stem":"早期發展工業時因未對工業廢棄物進行管制，工廠任意排放含有重金屬的汙水造成水汙染，導致臺灣西部沿海出現了何種環境汙染案例？","theme":"區域發展中的環境議題與預防機制","explain":"正確答案為(2)，早期政府未對工業廢棄物進行管制，工廠排放含重金屬汙水導致綠牡蠣出現，為水汙染典型案例；選項(0)、(1)、(3)皆非課本記載工廠排放重金屬汙水導致牡蠣變綠的案例名稱。","reviewText":"核心 7","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 產業發展與人口向都市移動","title":"產業發展與人口向都市移動","bullets":["工商業與服務業興起形成都市，提供廣大工作機會，吸引鄉村人口移居都市。","產業發展及交通建設會影響人口移動與聚落規模，促使人口與產業向西半部都市高度集中。","政府設立工業區與科學園區時會考量交通方便與人口密集，例民國80年代在臺南設立臺南科學工業園區帶動高科技產業。","人口分布呈現西半部密集、東半部較稀疏的現象，原加工出口區也轉型為科技產業園區吸引人口進駐。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 六都與都會區的形成","title":"六都與都會區的形成","bullets":["臺北市、新北市、桃園市、臺中市、臺南市與高雄市合稱為六都，是現今臺灣人口主要聚集地。","因市中心居住成本較高，不少民眾選擇居住在周圍縣市，再往來市中心工作或就學。","市中心與周邊城鎮人口互相支援產業服務與生活機能，透過公路、高鐵、臺鐵或捷運串聯共同組成都會區。","都會區帶動周圍縣市的發展，使市中心與周圍城鎮形成關係緊密的區域並發展出區域特色。"]},{"id":"core-3","type":"core","tag":"C 五大區域劃分與日治時期行政區對比","title":"五大區域劃分與日治時期行政區對比","bullets":["現行五大區域劃分為北部、中部、南部、東部及金馬地區，用於規畫區域各項發展。","日治西元1926年行政區域劃分為五州三廳，包含臺北州、新竹州、臺中州、臺南州、高雄州及花蓮港廳、臺東廳、澎湖廳。","日治時期的「州」屬於正式的地方政府行政區，劃分目的主要為了治理方便。","現行五大區域則非正式地方政府，而是以區域發展規畫為主要方向將縣市劃分在一起。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D TPASS與地方生活圈","title":"TPASS與地方生活圈","bullets":["地方生活圈是依照能滿足居民基本生活需求的範圍所劃定出的區域。","行政院交通部推出TPASS行政院通勤月票，整合公車、捷運、輕軌、臺鐵與城際客運等大眾運輸工具。","民眾透過單一張票卡即可在生活圈範圍內搭乘公共運輸往來各地通勤與就學。","不同縣市依據地方狀況推出不同的生活圈方案，如北北宜版、桃竹竹苗版與中彰投苗版等。"]},{"id":"core-5","type":"core","tag":"E 北部與中部區域發展特色","title":"北部與中部區域發展特色","bullets":["北部區域自清帝國時期逐漸成為政經中心，桃園與新竹發展交通運輸與高科技，宜蘭則因山脈阻隔保留自然風光發展觀光業。","中部地區地形多元，早期為貨物轉運站，苗栗與南投以觀光業為主，彰化與雲林為蔬果之鄉。","臺中市發展精密機械與高科技產業，吸引民眾就業與生活，成為中部區域發展的核心。","苗栗草莓園開放採果DIY、新北耶誕活動帶動商機但也產生交通與噪音影響。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 南部、東部與金馬區域發展特色","title":"南部、東部與金馬區域發展特色","bullets":["南部地勢平坦為主要農漁業區，興建水利設施與水庫降低乾季缺水衝擊，臺南與高雄發展重工業並轉型高科技產業。","東部地區大規模開發較晚，花東縱谷平原為主要農業區，保留自然資源與原住民族文化發展部落深度旅遊。","金馬地區鄰近中國曾為軍事防禦要塞，解除軍事管制後開放觀光，結合戰地風情與自然生態發展戰地觀光。","南部如鰲鼓溼地體驗與月津港燈節，金馬如金門戰車群與馬祖北海坑道皆為在地觀光例子。"]},{"id":"core-7","type":"core","tag":"G 區域發展中的環境議題與預防機制","title":"區域發展中的環境議題與預防機制","bullets":["區域開發過程中若產生廢棄物與汙染會降低民眾生活品質，引發對環境保護的重視。","政府訂定環境相關法律，規定在經濟開發前須先進行環境影響評估，評估開發對環境的影響。","廠商須裝設汙水處理設備將廢水處理後排放，政府利用固定式水質自動監測系統監控河川水質，並設再生水廠回收水資源。","早期未管制工業廢棄物曾引發綠牡蠣事件，係因工廠任意排放含有重金屬的汙水造成水汙染。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 都市區域發展的困境與因應","title":"都市區域發展的困境與因應","bullets":["大量人口過度湧入都市區域，導致都市公共設施與空間不堪負荷。","人口集中引發交通壅塞、房價高漲、空氣汙染與垃圾過量等都市問題。","解決都市困境需要政府訂定完備法規與處理模式，並配合民眾共同遵守法律。","推廣TPASS通勤月票鼓勵搭乘大眾運輸，或鼓勵廠商前往周邊城鎮投資設廠分散通勤車流。"]},{"id":"core-9","type":"core","tag":"I 鄉村區域困境與青年返鄉推動","title":"鄉村區域困境與青年返鄉推動","bullets":["鄉村因工作機會少且就醫與公共設施缺乏，年輕人多前往都市發展，導致鄉村人口老化與經濟發展停滯。","醫療資源不足與遙遠的就醫路途，使鄉村就醫與老人照護成為現代社會嚴肅課題。","政府制定政策鼓勵青年返鄉工作，減緩鄉村人口老化，並帶動地方產業發展創新經營方式。","返鄉青年開發在地農產特色餐點、定期舉辦市集或推動文創醬油禮盒，留住鄉村勞動力。"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"日治時期的五州三廳行政區劃分與現行五大區域劃分完全相同，都是正式的地方政府單位。","right":"日治時期的「州」是正式的地方政府行政區；現行五大區域則非行政區，而是用於規畫區域發展的方向。 課本比較圖指出日治州屬地方政府，現行五大區域係國家發展委員會前身劃定，用於區域發展規畫而非地方政府。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"南部地區因為地勢平坦且為農漁業大鎮，完全沒有發展高科技產業或轉型。","right":"南部地區在臺南市與高雄市的工商業基礎上，已帶動產業轉型，涵蓋觀光農漁業至高科技產業。 課本第61頁拉頁明確指出南部設有南部科學園區臺南園區，且臺南、高雄已有高科技與重工業進駐轉型。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"都市化的環境影響評估可以在工廠開發完畢並營運後，再補做評估即可。","right":"環境影響評估法律規定必須在「經濟開發前」預先評估開發行為對環境的影響。 課本第62頁強調政府訂定法律要求在「經濟開發前」先評估對環境影響，並非事後補評。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"綠牡蠣現象是因為養殖業者在海中添加化學肥料，導致牡蠣變綠。","right":"綠牡蠣現象係因早期工業廢棄物未受管制，工廠任意排放含有重金屬的汙水造成水汙染所致。 課本第62頁圖文明確說明綠牡蠣是工廠排放含重金屬汙水導致的水汙染案例。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"現今鄉村區域人口過度集中，因此引發了房價高漲與嚴重交通壅塞問題。","right":"房價高漲與交通壅塞是「都市區域」人口過度集中引發的困境；鄉村面臨的是人口外移與老化。 考卷與課本皆強調都市人口集中引發交通壅塞與房價高漲；鄉村則是就業機會少、人口老化與醫療缺乏。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"只要政府發行TPASS通勤月票，就能完全解決鄉村地區醫療資源不足與人口老化的困境。","right":"TPASS係整合大眾運輸方便地方生活圈通勤；解決鄉村人口老化需靠鼓勵青年返鄉與產業活化。 TPASS解決的是通勤與交通整合問題，鄉村老化與醫療缺乏需透過返鄉政策、照護機構與醫療資源投入解決。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"產業發展與人口城鄉移動｜知識關係","chain":["工商業與服務業在都市興起提供工作機會","人口與產業向西半部都市集中形成六都","鄉村勞動力外移導致城鄉發展與人口分布不均"]},{"id":"logic-2","type":"chain","title":"都會區與地方生活圈串聯｜知識關係","chain":["市中心居住成本高民眾選擇住周圍城鎮","透過捷運高鐵與TPASS通勤月票串聯生活圈","市中心與周邊縣市互相支援產業與生活機能"]},{"id":"logic-3","type":"chain","title":"臺灣五大區域發展特色｜知識關係","chain":["地理環境與歷史發展造就各區域產業差異","北部政經高科技、中部蔬果機械、南部農漁高科技、東部自然文化觀光、金馬戰地風情","因地制宜發展在地特色帶動區域經濟繁榮"]},{"id":"logic-4","type":"chain","title":"區域發展困境與永續解決方案｜知識關係","chain":["都市面臨交通房價問題，鄉村面臨老化與醫療缺乏","事前實施環境影響評估、設置汙水處理與水質監測","鼓勵青年返鄉創新經營以活化鄉村經濟"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣五大區域發展特色與代表產業對照表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜都市與鄉村區域發展困境與解決方案對照表","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["日治時期行政區劃分（五州三廳）","現行五大區域劃分","日治時期的「州」屬於正式的地方政府行政區，劃分目的為治理方便；現行五大區域係由政府行政院經建會制定，非正式地方政府，主要用於規劃區域各項發展方向。"],["都市區域發展困境","鄉村區域發展困境","都市區域困境源於人口過度湧入集中，引發交通壅塞、房價高漲、空氣汙染與垃圾過量；鄉村區域困境源於年輕人口大量外移，導致人口老化、經濟發展停滯、缺乏工作機會與醫療資源不足。"],["科學園區（如南部科學園區）","科技產業園區（原加工出口區轉型）","科學園區係政府規畫以園區為核心帶動高科技產業聚落與交通發展（如民國80年代臺南園區）；科技產業園區係由傳統加工出口區轉型而來，引進高附加價值電子零組件與科技產業。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","cards":[]},{"id":"answers","nav":"答案解析","title":"答案解析｜說得出理由才算會","subtitle":"錯題也能幫你找出下一步需要補強的知識。","cards":[]},{"id":"keywords","nav":"關鍵字","title":"07 單元關鍵字總整理","subtitle":"遮住關鍵詞，看看自己能不能從解釋回想。","cards":[{"id":"keyword-table","type":"table","title":"用一句話說清楚，不只背名稱","headers":["序","關鍵字","觀念與線索"],"rows":[["1","六都","指臺北市、新北市、桃園市、臺中市、臺南市與高雄市六個直轄市，為現今臺灣人口與產業的主要聚集地。"],["2","都會區","由市中心都市與周邊城鎮共同組成，人口透過交通路網互相支援產業服務與生活機能的緊密區域。"],["3","五大區域","包含北部、中部、南部、東部及金馬地區，係政府為規劃區域各項綜合發展所劃定的區域範圍。"],["4","地方生活圈","居民依照能夠滿足日常基本生活需求（如上學、購物、通勤）的活動範圍所劃定出的生活區域。"],["5","TPASS行政院通勤月票","由交通部推出的通勤月票，整合公車、捷運、臺鐵及客運等大眾運輸，方便民眾在生活圈內跨縣市通勤。"],["6","環境影響評估","政府訂定法律規定在經濟開發前，預先調查與分析開發行為對環境可能造成的影響程度，以保護環境品質。"],["7","綠牡蠣","早期工業發展時因工廠任意排放含有重金屬的廢水造成水汙染，導致沿海養殖牡蠣吸收重金屬而變綠的環境案例。"],["8","再生水廠","將工業或都市產生的汙水與廢水經過淨化處理後回收再利用的水資源處理設施。"],["9","花東縱谷平原","位於中央山脈與海岸山脈之間的平原區域，為臺灣東部地區最主要的農業發展區。"],["10","戰地觀光","金門與馬祖地區解除軍事管制後，結合當地保留的戰車群、坑道等軍事防禦遺跡與特有風物所發展的觀光產業。"]]}]},{"id":"question-types","nav":"解題方法","title":"08 考試快速辨識","subtitle":"連起題目、概念與判斷方法。","cards":[{"id":"ask-1","type":"ask","title":"判斷方法 1｜比較分類","clue":"五大區域劃分與日治時期行政區對比","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較日治時期「五州三廳」行政區劃分與現行「五大區域」劃分，下列關於兩者差異的敘述何者正確？"},{"id":"ask-2","type":"ask","title":"判斷方法 2｜比較分類","clue":"都市與鄉村發展困境對比","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"比較「都市區域」與「鄉村區域」在發展過程中面臨的困境，下列敘述何者符合課本的因果對比？"},{"id":"ask-3","type":"ask","title":"判斷方法 3｜因果推論","clue":"產業發展與人口向都市移動","steps":"先辨認題目問的是事實、分類還是因果，再回到對應知識點確認。","example":"日治時期至今，工商業及服務業的興起促使人口與產業向都市移動。造成臺灣人口分布呈現「西半部密集、東半部較稀疏」的主要因果原因為何？"}]}],"cloze":{"core-1":{"selector":".point","terms":["臺南科學工業園區"]},"core-2":{"selector":".point","terms":["都會區"]},"core-3":{"selector":".point","terms":["五大區域劃分"]},"core-4":{"selector":".point","terms":["TPASS行政院通勤月票"]},"core-5":{"selector":".point","terms":["精密機械"]},"core-6":{"selector":".point","terms":["花東縱谷平原"]},"core-7":{"selector":".point","terms":["環境影響評估"]},"core-8":{"selector":".point","terms":["交通壅塞、房價高漲"]},"core-9":{"selector":".point","terms":["鼓勵青年返鄉工作"]},"mindmap-overview":{"selector":".mind-branch p","terms":["人口與產業向西半部都市集中","TPASS通勤月票","北部政經高科技","環境影響評估"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["環境影響評估"]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["六都","都會區","五大區域","地方生活圈","TPASS行政院通勤月票","環境影響評估","綠牡蠣","再生水廠","花東縱谷平原","戰地觀光"]}},"custom":{"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>產業發展與人口城鄉移動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>工商業與服務業在都市興起提供工作機會\u003c/p>\u003cp>\u003cb>關係：\u003c/b>人口與產業向西半部都市集中形成六都\u003c/p>\u003cp>\u003cb>結果：\u003c/b>鄉村勞動力外移導致城鄉發展與人口分布不均\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>都會區與地方生活圈串聯\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>市中心居住成本高民眾選擇住周圍城鎮\u003c/p>\u003cp>\u003cb>關係：\u003c/b>透過捷運高鐵與TPASS通勤月票串聯生活圈\u003c/p>\u003cp>\u003cb>結果：\u003c/b>市中心與周邊縣市互相支援產業與生活機能\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>臺灣五大區域發展特色\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>地理環境與歷史發展造就各區域產業差異\u003c/p>\u003cp>\u003cb>關係：\u003c/b>北部政經高科技、中部蔬果機械、南部農漁高科技、東部自然文化觀光、金馬戰地風情\u003c/p>\u003cp>\u003cb>結果：\u003c/b>因地制宜發展在地特色帶動區域經濟繁榮\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>區域發展困境與永續解決方案\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>都市面臨交通房價問題，鄉村面臨老化與醫療缺乏\u003c/p>\u003cp>\u003cb>關係：\u003c/b>事前實施環境影響評估、設置汙水處理與水質監測\u003c/p>\u003cp>\u003cb>結果：\u003c/b>鼓勵青年返鄉創新經營以活化鄉村經濟\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>臺灣的區域發展與交流\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">區域名稱\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">地理與歷史條件特色\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">代表產業與發展實例\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>區域名稱\u003c/th>\u003cth>地理與歷史條件特色\u003c/th>\u003cth>代表產業與發展實例\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>北部地區\u003c/td>\u003ctd>清帝國起為政經中心，山脈阻隔宜蘭\u003c/td>\u003ctd>桃園新竹高科技與運輸，宜蘭休閒農場觀光\u003c/td>\u003c/tr>\u003ctr>\u003ctd>中部地區\u003c/td>\u003ctd>地形多元，早期為貨物轉運站\u003c/td>\u003ctd>彰化雲林蔬果之鄉，臺中精密機械與高科技\u003c/td>\u003c/tr>\u003ctr>\u003ctd>南部地區\u003c/td>\u003ctd>地勢平坦，水利設施降低乾季缺水衝擊\u003c/td>\u003ctd>觀光農漁業轉型，臺南高雄高科技與重工業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>東部與金馬地區\u003c/td>\u003ctd>東部開發晚保留自然文化；金馬曾為軍事要塞\u003c/td>\u003ctd>花東縱谷農業與部落深度旅遊，金馬戰地觀光\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依照區域位置自北部、中部、南部、東部至金馬地區，比對其自然歷史背景與代表產業成果。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論東部地區因為大規模開發較晚，所以完全沒有任何農業發展。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>根據圖表，哪一個區域因地勢平坦且有水利設施，早期為主要農漁業區，近年更結合高科技產業進行轉型？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>南部地區。因為南部地勢平坦廣大，配合水利設施降低乾季衝擊，並在臺南與高雄基礎上發展高科技產業與觀光農漁業。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">區域類型\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">面臨之發展困境與原因\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">政府與民間解決方案\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>區域類型\u003c/th>\u003cth>面臨之發展困境與原因\u003c/th>\u003cth>政府與民間解決方案\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>都市區域（環境面向）\u003c/td>\u003ctd>工廠廢水廢棄物汙染環境（如綠牡蠣）\u003c/td>\u003ctd>事前實施環境影響評估法，裝設汙水處理設備與水質自動監測\u003c/td>\u003c/tr>\u003ctr>\u003ctd>都市區域（居住交通面向）\u003c/td>\u003ctd>人口過度湧入造成交通壅塞、房價高漲\u003c/td>\u003ctd>發行TPASS通勤月票推廣大眾運輸，鼓勵廠商至周邊城鎮設廠\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鄉村區域（產業人口面向）\u003c/td>\u003ctd>年輕人移出致人口老化、經濟發展停滯\u003c/td>\u003ctd>鼓勵青年返鄉工作，開發在地特色餐點與市集，推動創新經營\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鄉村區域（公共服務面向）\u003c/td>\u003ctd>工作機會少、公共設施缺乏、醫療資源不足\u003c/td>\u003ctd>興建照護機構、整合醫療資源與建立在地長者互助網絡\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先區分都市與鄉村兩大區域，再分別從環境、交通居住、產業人口與公共服務四面向比對困境與解決對策。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論只要實施環境影響評估，就能自動解決鄉村地區醫療資源不足的問題。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>為解決都市人口集中造成的交通壅塞與通勤負擔，政府推出了哪一項整合性大眾運輸政策？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>TPASS行政院通勤月票。因為TPASS整合公車、捷運、臺鐵與客運，讓民眾能在地方生活圈內方便搭乘大眾運輸工具。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>產業發展與人口城鄉移動\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>工商業與服務業在都市興起提供工作機會\u003c/p>\u003cp>\u003cb>關係：\u003c/b>人口與產業向西半部都市集中形成六都\u003c/p>\u003cp>\u003cb>結果：\u003c/b>鄉村勞動力外移導致城鄉發展與人口分布不均\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-aid\">\u003ch4>\u003cspan>B\u003c/span>都會區與地方生活圈串聯\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>市中心居住成本高民眾選擇住周圍城鎮\u003c/p>\u003cp>\u003cb>關係：\u003c/b>透過捷運高鐵與TPASS通勤月票串聯生活圈\u003c/p>\u003cp>\u003cb>結果：\u003c/b>市中心與周邊縣市互相支援產業與生活機能\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-industry\">\u003ch4>\u003cspan>C\u003c/span>臺灣五大區域發展特色\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>地理環境與歷史發展造就各區域產業差異\u003c/p>\u003cp>\u003cb>關係：\u003c/b>北部政經高科技、中部蔬果機械、南部 function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;

mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}

BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["臺南科學工業園區"]},"core-2":{"selector":".point","terms":["都會區"]},"core-3":{"selector":".point","terms":["五大區域劃分"]},"core-4":{"selector":".point","terms":["TPASS行政院通勤月票"]},"core-5":{"selector":".point","terms":["精密機械"]},"core-6":{"selector":".point","terms":["花東縱谷平原"]},"core-7":{"selector":".point","terms":["環境影響評估"]},"core-8":{"selector":".point","terms":["交通壅塞、房價高漲"]},"core-9":{"selector":".point","terms":["鼓勵青年返鄉工作"]},"mindmap-overview":{"selector":".mind-branch p","terms":["人口與產業向西半部都市集中","TPASS通勤月票","北部政經高科技","環境影響評估"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":["環境影響評估"]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["六都","都會區","五大區域","地方生活圈","TPASS行政院通勤月票","環境影響評估","綠牡蠣","再生水廠","花東縱谷平原","戰地觀光"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 const total=document.querySelectorAll('#pages .cloze-slot').length;

 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

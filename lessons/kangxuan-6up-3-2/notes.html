t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒6上3-2 臺灣如何發展成為科技島？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"3-2","title":"臺灣如何發展成為科技島？"},"questions":[{"question":"民國六十年代後期，促使臺灣政府與民間企業尋求產業轉型、邁向「科技島」的最主要原因為何？","options":["農產品產量嚴重過剩，迫使政府放棄農業發展","加工出口區全面停擺，導致外籍移工大幅流失","代工產品品質持續惡化，遭國際市場大量退貨","勞工薪資上漲且生產成本增加，導致產品利潤減少"],"answer":3,"explanation":"正解為(0)，課文明確記載六十年代後期因勞工薪資上漲與生產成本增加，致利潤受到壓力，失去低廉人力優勢而尋求轉型升級；(1)當時臺灣代工品質良好穩定，非因品質惡化；(2)(3)皆背離課文所述之事實原因。","concept":"產業轉型的背景與原因","skill":"概念理解","review":"core-1","evidence":"在六十年代後期,隨著勞工薪資上漲,臺灣失去了經濟發展的重爭優勢","id":"q1","stem":"民國六十年代後期，促使臺灣政府與民間企業尋求產業轉型、邁向「科技島」的最主要原因為何？","theme":"產業轉型的背景與原因","explain":"正解為(0)，課文明確記載六十年代後期因勞工薪資上漲與生產成本增加，致利潤受到壓力，失去低廉人力優勢而尋求轉型升級；(1)當時臺灣代工品質良好穩定，非因品質惡化；(2)(3)皆背離課文所述之事實原因。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"民國69年，政府為了推動高科技產業發展，在全臺灣設立的第一座科學園區位於何處？","options":["高雄市","臺中市","新竹縣市","苗栗縣"],"answer":2,"explanation":"正解為(1)，課文記載民國69年在新竹成立全臺灣第一座科學園區；(0)高雄設置的是早期加工出口區；(2)(3)中部科學園區與苗栗開發案皆為後續增設或規劃項目，非第一座。","concept":"新竹科學園區的設立與產學合作","skill":"概念理解","review":"core-2","evidence":"民國六十九年,新竹成立第一座科學園區","id":"q2","stem":"民國69年，政府為了推動高科技產業發展，在全臺灣設立的第一座科學園區位於何處？","theme":"新竹科學園區的設立與產學合作","explain":"正解為(1)，課文記載民國69年在新竹成立全臺灣第一座科學園區；(0)高雄設置的是早期加工出口區；(2)(3)中部科學園區與苗栗開發案皆為後續增設或規劃項目，非第一座。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"新竹科學園區設立與持續擴建後，對當地土地利用與自然地貌帶來的直接改變是什麼？","options":["許多農地轉為工業使用並興建一棟棟廠房","都市公園與綠地保護區面積大幅增加","全面停止園區周邊住宅與商業區的發展","所有傳統工業廠房全部遷回鄉村地區"],"answer":0,"explanation":"正解為(0)，課文指出園區擴建使許多農地轉為工業使用、蓋成一棟棟廠房，改變了當地的自然環境與地貌；(1)(2)(3)皆不符合課文敘述之事實。","concept":"科學園區對當地的影響與負面挑戰","skill":"概念理解","review":"core-3","evidence":"許多農地轉為工業使用,蓋成一棟棟的廠房,改變了當地的自然環境和地貌","id":"q3","stem":"新竹科學園區設立與持續擴建後，對當地土地利用與自然地貌帶來的直接改變是什麼？","theme":"科學園區對當地的影響與負面挑戰","explain":"正解為(0)，課文指出園區擴建使許多農地轉為工業使用、蓋成一棟棟廠房，改變了當地的自然環境與地貌；(1)(2)(3)皆不符合課文敘述之事實。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"關於「代工」生產模式的定義，下列哪一項敘述最符合課文小百科的說明？","options":["工廠只負責研發設計，完全不參與任何實際製造過程","企業自行創立品牌名稱並直接對全球消費者推廣銷售","政府出資收購產品後免費發放給國內居民使用","臺灣工廠根據客戶訂單生產相關產品，再交由客戶進行產品銷售"],"answer":3,"explanation":"正解為(0)，課文小百科定義代工為臺灣工廠根據客戶訂單生產相關產品，再交由客戶進行銷售；(1)為自我品牌概念；(2)(3)皆非代工定義。","concept":"專業代工模式與半導體晶圓","skill":"概念理解","review":"core-4","evidence":"代工是指臺灣工廠根據客戶的訂單生產相關產品,再交由客戶進行產品的銷售","id":"q4","stem":"關於「代工」生產模式的定義，下列哪一項敘述最符合課文小百科的說明？","theme":"專業代工模式與半導體晶圓","explain":"正解為(0)，課文小百科定義代工為臺灣工廠根據客戶訂單生產相關產品，再交由客戶進行銷售；(1)為自我品牌概念；(2)(3)皆非代工定義。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"在產品包裝或標籤上常見的「MIT」字樣，其代表的明確含義為何？","options":["品質未達標準而需要返工重做的產品標記","Made in Taiwan（臺灣製造），代表產品生產製造地位於臺灣","Made 線索","wrong":"只要標示 MIT (Made in Taiwan) 的商品，就代表該品牌一定是臺灣企業創立的自有品牌。","right":"MIT 意思是『臺灣製造』，強調製造地點在臺灣，包含臺灣代工生產的國外品牌商品。 MIT 指生產製造地，例如臺灣工廠受國外品牌委託代工生產的鞋子或家電，標示 MIT 但非臺灣品牌。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"政府投資台積電並創立晶圓專業代工模式，主要是由張木村與洪箱夫婦所規劃推動。","right":"支持政府投資台積電的政策推手是李國鼎，創辦台積電並推動晶圓代工的是張忠謀。 張木村與洪箱夫婦是苗栗灣寶社區反對後龍科技園區徵收農地的自救會領導人，不可混淆。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"科學園區大多設置在臺灣西部，這是因為臺灣東部完全沒有科技業人才。","right":"集中西部是因為西部擁有既有的交通網絡、產業聚落與大學人才配套，非東部無人才。 讀圖題特別強調不能由分布圖直接推論『東部沒有科技人才』，這是典型的過度推論陷阱。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"智慧家庭與智慧醫療能夠自動處理所有事情，因此民眾可以完全仰賴科技而不必防範風險。","right":"過度依賴科技可能面臨資訊外洩、遭駭窺探隱私或作息受影響等風險，仍需人工謹慎把關。 課文明確強調科技能改善生活但不能完全仰賴，智慧家電有隱私風險，醫療仍需醫師專業診斷。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"科技產業轉型背景｜知識關係","chain":["加工出口區與廉價勞力推動早期經濟成長","勞工薪資上漲與生產成本增加致利潤減少","政府與企業推動技術研發與高科技產業升級"]},{"id":"logic-2","type":"chain","title":"科學園區發展與影響｜知識關係","chain":["民國69年新竹成立第一座科學園區並推動產學合作","農地轉為廠房且就業機會吸引人口遷入","周邊交通擁擠與房屋價格租金居住成本上漲"]},{"id":"logic-3","type":"chain","title":"代工生產與自有品牌｜知識關係","chain":["高雄加工出口區奠定代工基礎與半導體晶圓製造領先","台積電開創晶圓專業代工成為全球護國神山","捷安特與華碩等企業建立自有品牌展現MIT認同"]},{"id":"logic-4","type":"chain","title":"科技發展的社會挑戰｜知識關係","chain":["增設中南部園區並協調工時與土地環境衝突","苗栗灣寶社區成功反徵收展現土地正義公民行動","智慧科技帶來生活便利但也需注意隱私資安風險"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜臺灣產業轉型與生產模式演進流程圖","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜科學園區發展優勢與社會挑戰對照圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["專業代工","自有品牌","專業代工是工廠根據客戶訂單進行生產再交由客戶銷售（如台積電晶圓製造、早期球鞋組裝）；自有品牌是企業以自己創立的品牌名稱行銷全球並建立國際名聲（如捷安特、華碩）。"],["李國鼎","張忠謀", u003c/b>台積電開創晶圓專業代工成為全球護國神山\u003c/p>\u003cp>\u003cb>結果：\u003c/b>捷安特與華碩等企業建立自有品牌展現MIT認同\u003c/p>\u003c/section>\u003csection class=\"mind-branch mind-build\">\u003ch4>\u003cspan>D\u003c/span>科技發展的社會挑戰\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>增設中南部園區並協調工時與土地環境衝突\u003c/p>\u003cp>\u003cb>關係：\u003c/b>苗栗灣寶社區成功反徵收展現土地正義公民行動\u003c/p>\u003cp>\u003cb>結果：\u003c/b>智慧科技帶來生活便利但也需注意隱私資安風險\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>臺灣如何發展成為科技島？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展時期\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">代表性措施或產業型態\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">社會經濟意義與影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展時期\u003c/th>\u003cth>代表性措施或產業型態\u003c/th>\u003cth>社會經濟意義與影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>民國50-60年代\u003c/td>\u003ctd>設置加工出口區（如高雄加工出口區），利用廉價勞力發展成衣、鞋類與家電代工\u003c/td>\u003ctd>奠定臺灣代工產業基礎，創造就業機會並推動早期經濟快速成長\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國60年代後期\u003c/td>\u003ctd>勞工薪資上漲、生產成本增加導致產品利潤受到打壓，失去低廉人力競爭優勢\u003c/td>\u003ctd>逼迫政府與民間企業尋求轉型，由傳統代工轉向高技術、高附加價值產業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國69年起\u003c/td>\u003ctd>設立新竹科學園區，推動大學與企業產學合作，發展電子與資訊高科技產業\u003c/td>\u003ctd>吸引科技人才與企業聚集，改變當地地貌，但也帶來交通擁擠與居住成本上升\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國70-80年代後\u003c/td>\u003ctd>台積電發展半導體晶圓專業代工；捷安特、華碩等企業積極建立自我品牌\u003c/td>\u003ctd>晶圓代工技術全球領先被稱為護國神山，MIT（臺灣製造）獲得國際市場認同\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依照時間先後順序，從民國50年代加工出口區的傳統代工，看至勞動成本上升帶動轉型，再到科學園區設立與晶圓代工、自有品牌發展。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論建立自有品牌後所有臺灣企業就完全停止代工業務，也不可推論轉型後傳統工廠立即消失。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>為什麼民國60年代後期臺灣必須設立新竹科學園區並推動科技產業轉型？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>因為當時勞工薪資上漲、生產成本增加導致產品利潤減少，原本依靠廉價勞力的競爭優勢喪失，因此必須透過科學園區發展高科技產業與技術研發來提升競爭力。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">評估面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體措施或現象\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對社會與居民之影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>評估面向\u003c/th>\u003cth>具體措施或現象\u003c/th>\u003cth>對社會與居民之影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>經濟與產業優勢\u003c/td>\u003ctd>吸引科技企業投資設廠，園區廠商聚集並推動產學合作研發\u003c/td>\u003ctd>提升國家高科技產業全球競爭力，創造產品訂單與企業獲利\u003c/td>\u003c/tr>\u003ctr>\u003ctd>地方發展與生活\u003c/td>\u003ctd>提供多元工作機會，人口聚集增加地方稅收與公共建設（交通、醫療）\u003c/td>\u003ctd>吸引人口遷入帶動商業與住宅發展，提升整體公共服務品質\u003c/td>\u003c/tr>\u003ctr>\u003ctd>環境與居住挑戰\u003c/td>\u003ctd>農地轉為工業廠房改變自然地貌；外來人口湧入使房價租金上揚與交通壅塞\u003c/td>\u003ctd>當地居民需承擔較高的負擔與生活不便，農地與土地利用產生衝突\u003c/td>\u003c/tr>\u003ctr>\u003ctd>權利協調與案例\u003c/td>\u003ctd>苗栗灣寶社區居民因後龍科技園區徵收案發起自救抗爭，內政部駁回開發\u003c/td>\u003ctd>展現政府、企業與居民需溝通協調，強調環境永續、人民權利與土地正義\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先區分『正面經濟效益』與『負面環境居住挑戰』，再對照具體措施與居民承受之影響，最後看權利協調案例。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論科學園區設置在西部是因為東部沒有科技人才，也不能推論促進經濟發展就可以完全忽視居民權益與環境保育。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>從苗栗灣寶社區反對後龍科技園區開發案的結果，呈現出什麼樣的社會意義？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>呈現出土地開發過程中政府與居民溝通對話的重要性，並反映社會越來越重視環境永續、保護人民權利與土地正義。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 03cth>發展時期\u003c/th>\u003cth>代表性措施或產業型態\u003c/th>\u003cth>社會經濟意義與影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>民國50-60年代\u003c/td>\u003ctd>設置加工出口區（如高雄加工出口區），利用廉價勞力發展成衣、鞋類與家電代工\u003c/td>\u003ctd>奠定臺灣代工產業基礎，創造就業機會並推動早期經濟快速成長\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國60年代後期\u003c/td>\u003ctd>勞工薪資上漲、生產成本增加導致產品利潤受到打壓，失去低廉人力競爭優勢\u003c/td>\u003ctd>逼迫政府與民間企業尋求轉型，由傳統代工轉向高技術、高附加價值產業\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國69年起\u003c/td>\u003ctd>設立新竹科學園區，推動大學與企業產學合作，發展電子與資訊高科技產業\u003c/td>\u003ctd>吸引科技人才與企業聚集，改變當地地貌，但也帶來交通擁擠與居住成本上升\u003c/td>\u003c/tr>\u003ctr>\u003ctd>民國70-80年代後\u003c/td>\u003ctd>台積電發展半導體晶圓專業代工；捷安特、華碩等企業積極建立自我品牌\u003c/td>\u003ctd>晶圓代工技術全球領先被稱為護國神山，MIT（臺灣製造）獲得國際市場認同\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>依照時間先後順序，從民國50年代加工出口區的傳統代工，看至勞動成本上升帶動轉型，再到科學園區設立與晶圓代工、自有品牌發展。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論建立自有品牌後所有臺灣企業就完全停止代工業務，也不可推論轉型後傳統工廠立即消失。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>為什麼民國60年代後期臺灣必須設立新竹科學園區並推動科技產業轉型？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>因為當時勞工薪資上漲、生產成本增加導致產品利潤減少，原本依靠廉價勞力的競爭優勢喪失，因此必須透過科學園區發展高科技產業與技術研發來提升競爭力。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">評估面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體措施或現象\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">對社會與居民之影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>評估面向\u003c/th>\u003cth>具體措施或現象\u003c/th>\u003cth>對社會與居民之影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>經濟與產業優勢\u003c/td>\u003ctd>吸引科技企業投資設廠，園區廠商聚集並推動產學合作研發\u003c/td>\u003ctd>提升國家高科技產業全球競爭力，創造產品訂單與企業獲利\u003c/td>\u003c/tr>\u003ctr>\u003ctd>地方發展與生活\u003c/td>\u003ctd>提供多元工作機會，人口聚集增加地方稅收與公共建設（交通、醫療）\u003c/td>\u003ctd>吸引人口遷入帶動商業與住宅發展，提升整體公共服務品質\u003c/td>\u003c/tr>\u003ctr>\u003ctd>環境與居住挑戰\u003c/td>\u0 else if(c.type==='answers'){content=`<div class="table-wrap"><table class="answer-table"><thead><tr><th>題號</th><th>答案</th><th>解析關鍵</th><th>回去複習</th></tr></thead><tbody>${BOOK.questions.map((q,i)=>`<tr class="answer-row" data-question="${q.id}"><td>${i+1}</td><td><b>${String.fromCharCode(65+q.answer)}</b></td><td>${esc(q.explain)}</td><td><a href="#${q.review}">${esc(q.reviewText)}</a></td></tr>`).join('')}</tbody></table></div><div class="score-box"><p><b>複習指南</b></p><p>${Math.ceil(BOOK.questions.length*.9)}～${BOOK.questions.length} 題：再說出理由，確認概念穩固。<br>${Math.ceil(BOOK.questions.length*.7)}～${Math.ceil(BOOK.questions.length*.9)-1} 題：依右欄補強錯題。<br>${Math.ceil(BOOK.questions.length*.7)-1} 題以下：先重讀核心重點，再看易錯陷阱。</p><div class="screen-only score-tools"><button id="grade">核對我的答案</button><button id="reset">清除作答</button><span class="score-text" aria-live="polite"></span></div></div>`;}

function createPage(section,continued){const p=document.createElement('section');p.className='page';p.dataset.section=section.id;p.innerHTML=`<header class="page-header"><div class="folio-brand"><span class="folio-name"><img class="page-logo" src="../../assets/logo.png" alt="六號叔叔"><span>六號叔叔｜考前大補帖</span></span><span>${esc(BOOK.meta.version)} ${esc(BOOK.meta.gradeShort||BOOK.meta.grade)}・${esc(BOOK.meta.lesson)}</span></div>${section.id==='core'&&!continued?`<p class="lesson-title">${esc(BOOK.meta.title)}</p>`:''}<h2>${esc(section.title)}${continued?'（續）':''}</h2><p class="page-subtitle">${esc(section.subtitle)}</p></header><div class="page-body"></div><footer class="page-footer"><span>${esc(BOOK.meta.title)}</span><strong class="page-count"></strong></footer>`;$('#measure').append(p);return p;}

function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

new ResizeObserver(()=>{document.documentElement.style.setProperty('--nav-height',Math.ceil($('.topbar').getBoundingClientRect().height)+'px');}).observe($('.topbar'));
const clozePlan={"core-1":{"selector":".point","terms":["薪資上漲"]},"core-2":{"selector":".point","terms":["產學合作"]},"core-3":{"selector":".point","terms":["房屋價格與租金上漲"]},"core-4":{"selector":".point","terms":["半導體晶圓"]},"core-5":{"selector":".point","terms":["自有品牌"]},"core-6":{"selector":".point","terms":["護國神山"]},"core-7":{"selector":".point","terms":["區域間的均衡發展"]},"core-8":{"selector":".point","terms":["我要西瓜不要開發"]},"core-9":{"selector":".point","terms":["窺探隱私"]},"mindmap-overview":{"selector":".mind-branch p","terms":["生產成本增加","產學合作","晶圓專業代工","土地正義"]},"trap-1":{"selector":".correct","terms":["薪資上漲"]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":[]},"trap-5":{"selector":".correct","terms":[]},"trap-6":{"selector":".correct","terms":["窺探隱私"]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["科技島","新竹科學園區","產學合作","專業代工","半導體晶圓","台積電","MIT","自有品牌","土地正義","智慧科技"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;

  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}

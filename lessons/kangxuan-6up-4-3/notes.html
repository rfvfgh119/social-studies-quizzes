t:28px}.page-header h2,.page:not(#measure .page) .page-header h2{font-size:24px}.reading-panel table{font-size:14px}.reading-panel{padding:12px}.folio-brand{font-size:11px;letter-spacing:1.5px}}</style></head><body><header class="topbar"><div class="nav-inner"><div class="brand"><img class="nav-logo" src="../../assets/logo.png" alt="六號叔叔標誌"><div><span class="eyebrow">六號叔叔・考前大補帖</span><h1>康軒6上4-3 都市與鄉村為什麼需要邁向永續發展？</h1></div></div><div class="controls"><a class="course-back" href="./">← 課程首頁</a><label class="page-label">跳到第 <select id="page-select" aria-label="選擇頁碼"></select> 頁</label><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button><div class="study-modes" role="group" aria-label="教材模式"><button id="mode-cloze" aria-pressed="true">學生挖空</button><button id="mode-full" aria-pressed="false">完整解答</button><button id="mode-reset">收起單格答案</button></div><button id="font-toggle" aria-pressed="false">大字閱讀</button><label class="paper-label">底紙<select id="paper-select"><option value="dot">點點紙</option><option value="ring">活頁紙</option><option value="plain">白紙</option></select></label><button class="print-button" id="print">列印教材</button><span id="status" role="status">正在排版…</span></div><div id="study-hint" class="study-hint" role="status"></div><nav class="section-nav" aria-label="教材章節"></nav></div></header><main id="pages" aria-label="教材頁面"></main><div id="measure" aria-hidden="true"></div><noscript>請啟用 JavaScript 以顯示教材。</noscript><script>const BOOK={"meta":{"version":"康軒版","grade":"國小6年級上學期","gradeShort":"6 上","lesson":"4-3","title":"都市與鄉村為什麼需要邁向永續發展？"},"questions":[{"question":"為了確保都市居民能獲得安全且可負擔的住宅，政府規劃並推動下列哪一種住宅政策？","options":["豪宅開發案","社會住宅","商業辦公大樓","工業廠房重劃"],"answer":1,"explanation":"正解為(1)。課文明確指出，為確保都市居民能獲得安全、可負擔的住宅，政府規劃興建社會住宅並以較低廉的租金出租給符合條件的民眾。","concept":"都市居住權益與社會住宅","skill":"概念理解","review":"core-1","evidence":"為確保都市居民能獲得安全、可負擔的住宅,有些國家規畫興建社會住宅","id":"q1","stem":"為了確保都市居民能獲得安全且可負擔的住宅，政府規劃並推動下列哪一種住宅政策？","theme":"都市居住權益與社會住宅","explain":"正解為(1)。課文明確指出，為確保都市居民能獲得安全、可負擔的住宅，政府規劃興建社會住宅並以較低廉的租金出租給符合條件的民眾。","reviewText":"核心 1","source":["同課知識練習"]},{"question":"受都市化影響，鄉村地區青壯年人口大多移往都市，導致鄉村面臨下列哪一種社會現象？","options":["人口逐漸老化且缺乏勞力","大專校院數量超越都市","住宅價格飛漲且交通極度擁擠","幼兒公立幼兒園過度飽和"],"answer":0,"explanation":"正解為(0)。課本記載，鄉村地區受到青壯年外移影響，導致人口逐漸老化，且日常照護與醫療需求增加。","concept":"鄉村老化與宜居照顧服務","skill":"概念理解","review":"core-2","evidence":"受到都市化影響,鄉村地區青壯年人口大多往都市移動,使得鄉村人口逐漸老化","id":"q2","stem":"受都市化影響，鄉村地區青壯年人口大多移往都市，導致鄉村面臨下列哪一種社會現象？","theme":"鄉村老化與宜居照顧服務","explain":"正解為(0)。課本記載，鄉村地區受到青壯年外移影響，導致人口逐漸老化，且日常照護與醫療需求增加。","reviewText":"核心 2","source":["同課知識練習"]},{"question":"行政院於民國108年開始推動的「地方創生國家計畫」，其最核心的推動目標為何？","options":["促進地方產業發展與城鄉均衡發展","強制將全臺農地全面改建為科學園區","要求所有都市居民強制搬遷至離島","取消所有鄉村地區的醫療與公車服務"],"answer":0,"explanation":"正解為(1)。課文明確指出行政院於民國108年推動「地方創生國家計畫」，旨在結合在地特色與創新，促進地方產業發展並減緩城鄉失衡。","concept":"青年返鄉與地方創生計畫","skill":"概念理解","review":"core-3","evidence":"行政院於民國108年開始推動「地方創生國家計畫」,促進地方產業發展","id":"q3","stem":"行政院於民國108年開始推動的「地方創生國家計畫」，其最核心的推動目標為何？","theme":"青年返鄉與地方創生計畫","explain":"正解為(1)。課文明確指出行政院於民國108年推動「地方創生國家計畫」，旨在結合在地特色與創新，促進地方產業發展並減緩城鄉失衡。","reviewText":"核心 3","source":["同課知識練習"]},{"question":"西元2008年成立於高雄市旗山的「台青蕉樂團」，係透過何種方式推廣家鄉的香蕉文化與土地故事？","options":["僅在國外巡迴演出且拒絕在地居民參與","專門經營高速公路貨運配送","結合音樂創作、創意商品與社區小旅行","向政府申請將旗山農地全數改建為水庫"],"answer":2,"explanation":"正解為(0)。台青蕉樂團創作搖滾音樂傳達土地關懷，成立香蕉創意工坊開發商品，並舉辦社區小旅行與音樂節來凝聚在地認同。","concept":"台青蕉樂團的香蕉產業創新","skill":"概念理解","review":"core-4","evidence":"台青蕉樂團還成立了「台青蕉香蕉創意工坊」,開發、販售香蕉相關產品","id":"q4","stem":"西元2008年成立於高雄市旗山的「台青蕉樂團」，係透過何種方式推廣家鄉的香蕉文化與土地故事？","theme":"台青蕉樂團的香蕉產業創新","explain":"正解為(0)。台青蕉樂團創作搖滾音樂傳達土地關懷，成立香蕉創意工坊開發商品，並舉辦社區小旅行與音樂節來凝聚在地認同。","reviewText":"核心 4","source":["同課知識練習"]},{"question":"面對極端氣候帶來強降雨的淹水威脅，現代都市防災思維發生了什麼樣的重大轉變？","options":["將都市所有河流與淹水區域全部填平蓋高樓","由傳統築堤治水轉變為「與水共生」開闢滯洪公園","完全放棄所有防洪措施並聽天由命","規定豪雨期間禁止任何居民留在室內"],"answer":1,"explanation":"正解為(0)。課本敘述都市改變了單純築堤治水的思維，轉變為「與水共生」，開闢河岸溼地公園或滯洪池兼具休閒與防洪蓄水功能。","concept":"都市防災與與水共生理念","skill":"概念理解","review":"core-5","evidence":"轉變為與水共生的思維,開闢河岸溼地公園等,兼具休閒活動與防洪滯水的多功能場域","id":"q5","stem":"面對極端氣候帶來強降雨的淹水威脅，現代都市防災思維發生了什麼樣的重大轉變？","theme":"都市防災與與水共生理念","explain":"正解為(0)。課本敘述都市改變了單純築堤治水的思維，轉變為「與水共生」，開闢河岸溼地公園或滯洪池兼具休閒與防洪蓄水功能。","reviewText":"核心 5","source":["同課知識練習"]},{"question":"花蓮舞鶴台地將當地的防災觀念與哪一種特色農業產業互相結合，以促進環境與產業的永續發展？","options":["茶產業","養豬產業","香蕉種植業","水產養殖業"],"answer":0,"explanation":"正解為(1)。課本圖文指出，花蓮舞鶴台地設置水土保持戶外教室，將水土保持與防災觀念結合當地的茶產業發展。","concept":"鄉村水土保持與防災演練","skill":"概念理解","review":"core-6","evidence":"舞鶴台地……設置水土保持戶外教室,結合防災觀念與當地茶產業","id":"q6","stem":"花蓮舞鶴台地將當地的防災觀念與哪一種特色農業產業互相結合，以促進環境與產業的永續發展？","theme":"鄉村水土保持與防災演練","explain":"正解為(1)。課本圖文指出，花蓮舞鶴台地設置水土保持戶外教室，將水土保持與防災觀念結合當地的茶產業發展。","reviewText":"核心 6","source":["同課知識練習"]},{"question":"西班牙巴塞隆納為了提供居民更友善的步行環境，在都市空間規劃上採取了何種作法？","options":["強制所有居民出門必須駕駛私人汽車","將部分街道的人行空間擴大並縮減車道","將所有街道全面鋪設為快速車道","取消所有行人路口並禁止行人步行"],"answer":1,"explanation":"正解為(0)。課本介紹巴塞隆納將部分街道的人行空間擴大、縮減車道，提供包容不同族群需求的友善步行環境。","concept":"友善空間與人行路網建構","skill":"概念理解","review":"core-7","evidence":"西班牙巴塞隆納將部分街道的人行空間擴大,並縮減車道,提供行人更友善的步行環境","id":"q7","stem":"西班牙巴塞隆納為了提供居民更友善的步行環境，在都市空間規劃上採取了何種作法？","theme":"友善空間與人行路網建構","explain":"正解為(0)。課本介紹巴塞隆納將部分街道的人行空間擴大、縮減車道，提供包容不同族群需求的友善步行環境。","reviewText":"核心 7","source":["同課知識練習"]},{"question":"雲林縣口湖鄉成龍村長年面臨地層下陷，並在颱風侵襲後積水無法耕種。後來當地政府與居民於民國99年起推動何種活動進行轉型？","options":["開挖地下水吸引重工業進駐","興建大型半導體晶圓廠","舉辦國際環境藝術季","將溼地完全填平並鋪設水泥"],"answer":2,"explanation":"正解為(0)。課本記載成龍村於民國99年起舉辦「國際環境藝術季」，結合藝術與溼地生態，轉型為永續藝術村落。","concept":"成龍溼地生態轉型與藝術村","skill":"概念理解","review":"core-8","evidence":"民國99年,政府及居民開始舉辦「國際環境藝術季」,透過藝術創作將人與土地連結起來","id":"q8","stem":"雲林縣口湖鄉成龍村長年面臨地層下陷，並在颱風侵襲後積水無法耕種。後來當地政府與居民於民國99年起推動何種活動進行轉型？","theme":"成龍溼地生態轉型與藝術村","explain":"正解為(0)。課本記載成龍村於民國99年起舉辦「國際環境藝術季」，結合藝術與溼地生態，轉型為永續藝術村落。","reviewText":"核心 8","source":["同課知識練習"]},{"question":"政府於民國73年設立的哪一座國家公園，係臺灣所成立的第一座國家公園？","options":["太魯閣國家公園","墾丁國家公園","玉山國家公園","陽明山國家公園"],"answer":1,"explanation":"正解為(1)。課文明確記載，政府在民國73年設立墾丁國家公園，成為我國的第一座國家公園；陽明山國家公園則設立於民國74年。","concept":"國家公園對城鄉永續之助益","skill":"概念理解","review":"core-9","evidence":"政府在民國73年設立國家公園,成為我國的第一座國家公園","id":"q9","stem":"政府於民國73年設立的哪一座國家公園，係臺灣所成立的第一座國家公園？","theme":"國家公園對城鄉永續之助益","explain":"正解為(1)。課文明確記載，政府在民國73年設立墾丁國家公園，成為我國的第一座國家公園；陽明山國家公園則設立於民國74年。","reviewText":"核心 9","source":["同課知識練習"]},{"question":"在鄉村推行的「幸福小黃」計程車服務，主要旨在解決鄉村地區的何種生活困境？","options":["農產品完全無法運出村外銷售","鄉村青年缺乏大專院校就讀","缺少大型購物中心與電影院","無公車路線或班次不足造成的交通不便"],"answer":3,"explanation":"正解為(1)。課本與練習卷指出，幸福小黃是政府在公車路線未覆蓋或班次不足的鄉村地區推動的彈性交通服務，用以補足基層交通網絡。","concept":"鄉村老化與宜居照顧服務","skill":"概念理解","review":"core-2","evidence":"幸福小黃……補足鄉村公車路線與班次不足","id":"q10","stem":"在鄉村推行的「幸福小黃」計程車服務，主要旨在解決鄉村地區的何種生活困境？","theme":"鄉村老化與宜居照顧服務","explain":"正解為(1)。課本與練習卷指出，幸福小黃是政府在公車路線未覆蓋或班次不足的鄉村地區推動的彈性交通服務，用以補足基層交通網絡。","reviewText":"核心 2","source":["同課知識練習"]}],"sections":[{"id":"core","nav":"核心重點","title":"01 單元核心重點","subtitle":"沿課文脈絡讀懂背景、措施、特色與影響。","cards":[{"id":"core-1","type":"core","tag":"A 都市居住權益與社會住宅","title":"都市居住權益與社會住宅","bullets":["全球半數以上人口居住在都市，政府需確保居民獲得安全且可負擔的住宅","都市人口持續成長導致居住需求高昂與房價負擔沉重","政府規畫興建社會住宅並以較低廉的租金出租給符合條件的民眾","新北市林口區社會住宅鄰近捷運站、學校及公園綠地，提供良好生活機能"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-2","type":"core","tag":"B 鄉村老化與宜居照顧服務","title":"鄉村老化與宜居照顧服務","bullets":["受到都市化影響，鄉村青壯年人口大多往都市移動使鄉村人口逐漸老化","青壯年外移導致鄉村缺乏勞力且長者外出就醫與日常交通極為不便","政府與民間合作強化居家照護，並推動巡迴醫療與幸福小黃計程車服務","讓外出就醫不便的長者獲得健康諮詢，並補足無公車路線地區的交通網絡"]},{"id":"core-3","type":"core","tag":"C 青年返鄉與地方創生計畫","title":"青年返鄉與地方創生計畫","bullets":["行政院於民國108年開始推動地方創生國家計畫，促進城鄉均衡發展","面對總人口數減少、人口過度集中都市及城鄉發展失衡等社會挑戰","青年因關懷家鄉土地、陪伴家人或習慣家鄉環境而選擇返鄉工作","政府提供青年創業貸款額度與育兒托育補助等三好政策，吸引青年留鄉圓夢"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-4","type":"core","tag":"D 台青蕉樂團的香蕉產業創新","title":"台青蕉樂團的香蕉產業創新","bullets":["成立於西元2008年的台青蕉樂團，結合音樂人與農民角色推廣高雄旗山香蕉","源於對家鄉土地的關懷與產業興衰觀察，希望喚起大眾關注在地青年聲音","創作搖滾樂曲傳達土地故事，並成立香蕉創意工坊開發販售相關產品","舉辦旗山社區小旅行與音樂節活動，邀請返鄉青年分享並凝聚在地認同"]},{"id":"core-5","type":"core","tag":"E 都市防災與與水共生理念","title":"都市防災與與水共生理念","bullets":["都市改變早期築堤治水的思維，轉變為與水共生的防災新觀念","都市人口集中且受極端氣候強降雨威脅，淹水災害影響層面複雜","政府開闢河岸溼地公園或滯洪池，兼具休閒運動與防洪蓄水功能","彰化員林龍燈公園與新北大都會公園平時為休閒空間，汛期可暫存雨水降低淹水風險"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-6","type":"core","tag":"F 鄉村水土保持與防災演練","title":"鄉村水土保持與防災演練","bullets":["鄉村將水土保持觀念融入產業發展，提升環境的災害承受力與災後回復力","花蓮位於板塊交界帶地震頻繁，且高山台地豪雨沖刷易造成道路下陷與邊坡坍塌","學校定期舉行地震防災演練，社區設置水土保持戶外教室進行推廣","花蓮舞鶴台地將水土保持與當地茶產業結合，期盼促進環境與產業永續發展"]},{"id":"core-7","type":"core","tag":"G 友善空間與人行路網建構","title":"友善空間與人行路網建構","bullets":["建立能包容兒童、身心障礙、婦女及長者等不同群體需求的通行與生活空間","傳統都市規劃過度偏重車輛通行，忽視行人步行安全與各類弱勢移動權益","將部分街道的人行空間擴大並縮減車道，提供行人友善的步行環境","西班牙巴塞隆納擴大人行空間，臺灣亦持續推動改善人行空間以提升居民健康"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"},{"id":"core-8","type":"core","tag":"H 成龍溼地生態轉型與藝術村","title":"成龍溼地生態轉型與藝術村","bullets":["雲林縣口湖鄉成龍村長年超抽地下水造成地層下陷，海水倒灌後轉型為藝術村","民國75年韋恩與85年賀伯颱風侵襲導致海水倒灌農地，長期積水無法耕種","積水濕地逐漸聚集水鳥與魚類，政府與居民於民國99年起舉辦國際環境藝術季","居民利用老屋與舊校舍打造藝術參觀空間，轉型為生態保育與藝文扎根的永續村落"]},{"id":"core-9","type":"core","tag":"I 國家公園對城鄉永續之助益","title":"國家公園對城鄉永續之助益","bullets":["國家公園保護當地特有自然景觀與人文風貌，並對城鄉永續發展產生積極助益","都市缺乏綠地且過度開發，鄉村則需要優美景觀帶動經濟但防範過度觀光衝擊","設立鄰近都市或鄉村的國家公園，提供生態保護、環境教育與親近自然機會","臺北市郊區陽明山國家公園（民國74年）提供綠地；屏東縣墾丁國家公園（民國73年第一座國家公園）促進鄉村觀光"],"tip":"想一想：這個觀念的原因、過程與影響分別是什麼？"}]},{"id":"mindmap","nav":"全課心智圖","title":"全課心智圖｜把知識連起來","subtitle":"保留主幹，回想分支；不要只背零散名詞。","cards":[{"id":"mindmap-overview","type":"mindmap","title":"從全課主題出發，追查四條知識線索"}]},{"id":"traps","nav":"易錯陷阱","title":"02 必考陷阱深度破解","subtitle":"先讀錯誤說法，再用關鍵線索說明哪裡不對。","cards":[{"id":"trap-1","type":"trap","n":1,"title":"迷思 1","label":"找出判斷線索","wrong":"興建社會住宅是政府為了滿足民眾跨縣市通勤與交通需求所推行的運輸政策。","right":"社會住宅是政府為了確保居民居住權益、提供安全且可負擔住宅的居住政策。 課文與練習卷明確指出社會住宅是解決都市居住需求與房價負擔問題，非交通政策。"},{"id":"trap-2","type":"trap","n":2,"title":"迷思 2","label":"找出判斷線索","wrong":"彰化員林龍燈公園開闢滯洪池，主要作用是在豪雨時將公園大量的積水排入周邊街道。","right":"滯洪池的作用是在豪雨汛期暫時儲存大量雨水，降低周邊地區淹水風險。 滯洪池為與水共生的防災設施，平時供休閒，豪雨時蓄水而非將水排向街道。"},{"id":"trap-3","type":"trap","n":3,"title":"迷思 3","label":"找出判斷線索","wrong":"桃園觀音與新屋區的觀新藻礁生態系保護區，近年因為廢水嚴重汙染已完全沒有生物生存。","right":"設立觀新藻礁野生動物保護區是為了保護當地重要物種與自然景觀，並非已無生物。 課本練習卷強調保護區目的在於保護特有生態與物種，『已無生物』為錯誤敘述。"},{"id":"trap-4","type":"trap","n":4,"title":"迷思 4","label":"找出判斷線索","wrong":"陽明山國家公園設立於民國73年，是臺灣歷史上第一座設立的國家公園。","right":"屏東縣墾丁國家公園設立於民國73年，才是臺灣第一座國家公園；陽明山設立於民國74年。 課本明確記載墾丁國家公園為我國第一座國家公園（民國73年），陽明山為民國74年設立。"},{"id":"trap-5","type":"trap","n":5,"title":"迷思 5","label":"找出判斷線索","wrong":"為了解決鄉村人口老化與就醫不便，政府應強制將鄉村年長者全數移居至都市生活。","right":"政府透過建立巡迴醫療網與幸福小黃，將醫療與交通服務主動帶入鄉村提供照護。 永續鄉村強調把服務帶到需要的人身邊，維護鄉村居民原居地生活品質，而非強制移居。"},{"id":"trap-6","type":"trap","n":6,"title":"迷思 6","label":"找出判斷線索","wrong":"雲林成龍村地層下陷並積水成溼地，完全是因為韋恩颱風單一自然災害所造成的。","right":"長期人為『超抽地下水』造成地層下陷是主因，颱風海水倒灌則是觸發積水的災害因素。 成龍濕地形成背景包含人為長年超抽地下水與颱風海水倒灌雙重因素，不能僅歸咎單一颱風。"}]},{"id":"logic","nav":"知識脈絡","title":"03 知識因果與脈絡","subtitle":"依箭頭說出關係：為什麼、如何發生、帶來什麼影響。","cards":[{"id":"logic-1","type":"chain","title":"都市宜居與社會住宅｜知識關係","chain":["都市人口持續成長且居住負擔沉重","興建社會住宅並以較低廉租金出租","提供安全可負擔住宅並鄰近捷運公園提升生活機能"]},{"id":"logic-2","type":"chain","title":"鄉村照護與地方創生｜知識關係","chain":["青壯年移往都市導致鄉村人口老化與發展失衡","推動巡迴醫療幸福小黃與民國108年地方創生國家計畫","改善長者照護交通並吸引青年返鄉活化在地產業"]},{"id":"logic-3","type":"chain","title":"氣候變遷與防災韌性｜知識關係","chain":["強降雨極端氣候與地震自然災害威脅城鄉","開闢滯洪池公園推電動公車與水土保持戶外教室","實現與水共生並提升城鄉災害承受力與災後回復力"]},{"id":"logic-4","type":"chain","title":"成龍溼地生態轉型｜知識關係","chain":["超抽地下水致地層下陷與颱風海水倒灌農地淹沒","政府與居民舉辦國際環境藝術季與老屋改造","轉型為生態保育與藝文扎根的國際永續藝術村"]}]},{"id":"figures","nav":"圖表判讀","title":"04 必考「圖表與地圖」秒殺判讀區","subtitle":"讀圖名、看分類或順序、找證據，再回答問題。","cards":[{"id":"figure-1","type":"reading","title":"圖 1｜都市與鄉村永續發展措施與功能分類表","breakBefore":false},{"id":"figure-2","type":"reading","title":"圖 2｜雲林縣成龍村土地轉型與永續發展時序流程圖","breakBefore":true}]},{"id":"compare","nav":"概念對照","title":"05 知識混淆深度對照","subtitle":"在同一面向比較兩個概念，找出真正差異。","cards":[{"id":"compare-1","type":"table","title":"相近概念不要混在一起","headers":["概念甲","概念乙","關鍵差異"],"rows":[["社會住宅","一般商業住宅","社會住宅為政府規劃興建、以較低廉租金出租給符合條件之民眾與弱勢族群的公共居住政策；一般商業住宅則由民間建商興建並以市場價格買賣或出租。"],["傳統築堤治水","與水共生思維","傳統築堤治水著重於興建高大混凝土堤防強行阻擋河水；與水共生思維則透過開闢滯洪池與河岸溼地公園，平時供休閒、汛期暫存雨水以降低淹水風險。"],["陽明山國家公園","墾丁國家公園","陽明山國家公園（民國74年設立）鄰近都市（臺北市郊區），主在保護火山地形生態並提供都市廣大綠地與環境教育；墾丁國家公園（民國73年設立）位於鄉村（屏東縣最南端），為臺灣第一座國家公園，主在保護森林海洋生態並帶動鄉村觀光經濟。"]]}]},{"id":"quiz","nav":"自我檢測","title":"06 單元知識交叉檢測","subtitle":"先讀題幹與線索，再選唯一最合適的答案。","ca 3cp>\u003cb>關係：\u003c/b>政府與居民舉辦國際環境藝術季與老屋改造\u003c/p>\u003cp>\u003cb>結果：\u003c/b>轉型為生態保育與藝文扎根的國際永續藝術村\u003c/p>\u003c/section>\u003cdiv class=\"mind-center\">\u003cspan>全課探索主題\u003c/span>\u003cstrong>都市與鄉村為什麼需要邁向永續發展？\u003c/strong>\u003c/div>\u003c/div>\u003cp class=\"mind-connection\">\u003cb>整合挑戰：\u003c/b>選兩條分支，試著用「因為……所以……，也要注意……」連成一段完整的解釋。\u003c/p>","figure-1":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">環境面向\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">具體做法與案例\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">城鄉永續意義\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>環境面向\u003c/th>\u003cth>具體做法與案例\u003c/th>\u003cth>城鄉永續意義\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>都市居住權益\u003c/td>\u003ctd>興建社會住宅（如荷蘭阿姆斯特丹、新北林口區）\u003c/td>\u003ctd>提供安全且較低廉租金住宅，鄰近捷運學校公園提升生活機能\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鄉村生活照顧\u003c/td>\u003ctd>推動巡迴醫療服務與設置幸福小黃計程車\u003c/td>\u003ctd>主動將醫療與交通服務送入鄉村，保障年長者醫療與出行品質\u003c/td>\u003c/tr>\u003ctr>\u003ctd>與水共生防災\u003c/td>\u003ctd>開闢多功能滯洪池公園（如新北大都會公園、員林龍燈公園）\u003c/td>\u003ctd>平時提供休閒運動，汛期暫存豪雨水量，降低周邊淹水風險\u003c/td>\u003c/tr>\u003ctr>\u003ctd>產業與水土保持\u003c/td>\u003ctd>設置水土保持戶外教室結合茶產業（如花蓮舞鶴台地）\u003c/td>\u003ctd>將水土保持觀念融入農業發展，培育土地災害承受力與回復力\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先由環境面向了解城鄉發展需求，再閱讀具體做法與案例，最後理解其對城鄉永續之效益。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論開闢滯洪池會把洪水排向街道，也不能推論幸福小黃是免費提供給全臺灣所有民眾乘車。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>當極端氣候帶來強降雨時，彰化員林龍燈公園的滯洪池如何協助都市防災？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>龍燈公園的滯洪池在豪雨汛期能暫時儲存大量雨水，降低周邊地區因強降雨引發的淹水風險，展現與水共生的防災理念。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">環境事件與轉型措施\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">社會與生態影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>環境事件與轉型措施\u003c/th>\u003cth>社會與生態影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>長期累積階段\u003c/td>\u003ctd>當地農耕地與魚塭長年超抽地下水\u003c/td>\u003ctd>環境脆弱，導致嚴重之地層下陷問題\u003c/td>\u003c/tr>\u003ctr>\u003ctd>災害觸發階段\u003c/td>\u003ctd>民國75年韋恩颱風及85年賀伯颱風侵襲\u003c/td>\u003ctd>海水倒灌淹沒農地，長期積水無法繼續耕種\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生態形成階段\u003c/td>\u003ctd>淹沒農地長期積水後形成濕地環境\u003c/td>\u003ctd>吸引各種水鳥與魚類聚集，逐漸演變成豐富生態區\u003c/td>\u003c/tr>\u003ctr>\u003ctd>永續社區階段\u003c/td>\u003ctd>民國99年起舉辦國際環境藝術季與藝術饗宴\u003c/td>\u003ctd>結合生態與藝術打造國際永續藝術村，活化地方經濟與認同\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按時間順序由長年人為超抽地下水，看至颱風災害觸發淹水，再看生態自然形成與最後走向藝術轉型。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論成龍溼地是由於政府填海造陸所形成，也不能推論居民選擇將積水完全抽乾恢復舊有農地。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>成龍村從『農民失落難過的傷心地』轉化為『國際永續藝術村』的關鍵轉型作法為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>關鍵在於政府與居民合作舉辦國際環境藝術季，透過藝術創作將人與土地連結，並利用老屋舊校舍打造藝術空間，將溼地生態與藝文相互融合。\u003c/p>\u003c/div>"}};const CUSTOM={"mindmap-overview":"\u003cdiv class=\"mind-guide\">讀圖任務：從中央主題出發，沿四條分支說出關係，再補回關鍵詞。\u003c/div>\u003cdiv class=\"mind-network\">\u003csvg class=\"mind-links\" viewBox=\"0 0 640 620\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\u003cpath d=\"M320 306 C220 306 150 286 150 232\" stroke=\"#ab83c6\"/>\u003cpath d=\"M320 306 C420 306 490 286 490 232\" stroke=\"#77a5ce\"/>\u003cpath d=\"M320 326 C220 326 150 346 150 380\" stroke=\"#d5ae4d\"/>\u003cpath d=\"M320 326 C420 326 490 346 490 380\" stroke=\"#d39286\"/>\u003c/svg>\u003csection class=\"mind-branch mind-land\">\u003ch4>\u003cspan>A\u003c/span>都市宜居與社會住宅\u003c/h4>\u003cp>\u003cb>線索：\u003c/b>都市人口持續成長且居住負擔沉重\u003c/p>\u003cp>\u003cb>關係：\u003c/b>興建社會住宅並以較低廉租金出租\u003c/p>\u003cp>\u003 險\u003c/td>\u003c/tr>\u003ctr>\u003ctd>產業與水土保持\u003c/td>\u003ctd>設置水土保持戶外教室結合茶產業（如花蓮舞鶴台地）\u003c/td>\u003ctd>將水土保持觀念融入農業發展，培育土地災害承受力與回復力\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>先由環境面向了解城鄉發展需求，再閱讀具體做法與案例，最後理解其對城鄉永續之效益。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論開闢滯洪池會把洪水排向街道，也不能推論幸福小黃是免費提供給全臺灣所有民眾乘車。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>當極端氣候帶來強降雨時，彰化員林龍燈公園的滯洪池如何協助都市防災？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>龍燈公園的滯洪池在豪雨汛期能暫時儲存大量雨水，降低周邊地區因強降雨引發的淹水風險，展現與水共生的防災理念。\u003c/p>\u003c/div>","figure-2":"\u003cdiv class=\"reading-panel\">\u003cdiv class=\"reading-table-visual flow\">\u003cdiv class=\"flow-step\">發展階段\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">環境事件與轉型措施\u003c/div>\u003cspan class=\"flow-arrow\">→\u003c/span>\u003cdiv class=\"flow-step\">社會與生態影響\u003c/div>\u003c/div>\u003ctable>\u003cthead>\u003ctr>\u003cth>發展階段\u003c/th>\u003cth>環境事件與轉型措施\u003c/th>\u003cth>社會與生態影響\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>長期累積階段\u003c/td>\u003ctd>當地農耕地與魚塭長年超抽地下水\u003c/td>\u003ctd>環境脆弱，導致嚴重之地層下陷問題\u003c/td>\u003c/tr>\u003ctr>\u003ctd>災害觸發階段\u003c/td>\u003ctd>民國75年韋恩颱風及85年賀伯颱風侵襲\u003c/td>\u003ctd>海水倒灌淹沒農地，長期積水無法繼續耕種\u003c/td>\u003c/tr>\u003ctr>\u003ctd>生態形成階段\u003c/td>\u003ctd>淹沒農地長期積水後形成濕地環境\u003c/td>\u003ctd>吸引各種水鳥與魚類聚集，逐漸演變成豐富生態區\u003c/td>\u003c/tr>\u003ctr>\u003ctd>永續社區階段\u003c/td>\u003ctd>民國99年起舉辦國際環境藝術季與藝術饗宴\u003c/td>\u003ctd>結合生態與藝術打造國際永續藝術村，活化地方經濟與認同\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"reading-cue\">\u003cb>讀圖步驟：\u003c/b>按時間順序由長年人為超抽地下水，看至颱風災害觸發淹水，再看生態自然形成與最後走向藝術轉型。\u003c/p>\u003cp class=\"reading-cue\">\u003cb>小心陷阱：\u003c/b>不能推論成龍溼地是由於政府填海造陸所形成，也不能推論居民選擇將積水完全抽乾恢復舊有農地。\u003c/p>\u003cdiv class=\"reading-question\">\u003cp>\u003cb>試判斷：\u003c/b>成龍村從『農民失落難過的傷心地』轉化為『國際永續藝術村』的關鍵轉型作法為何？\u003c/p>\u003cp>\u003cb>核對：\u003c/b>關鍵在於政府與居民合作舉辦國際環境藝術季，透過藝術創作將人與土地連結，並利用老屋舊校 function cardHTML(c){let content='';const tag=c.tag?`<div class="tag">${esc(c.tag)}</div>`:'';let heading=`<h3>${esc(c.title)}</h3>`;
if(c.type==='mindmap'||c.type==='reading')content=CUSTOM[c.id];else if(c.type==='trap'){heading=`<div class="card-title"><h3><span class="trap-n">${String(c.n).padStart(2,'0')}</span>${esc(c.title)}</h3><span class="small-label">${esc(c.label)}</span></div>`;content=`<p class="mistake"><span class="text-label">易錯</span>${fmt(c.wrong)}</p><p class="correct"><span class="text-label">破解</span>${fmt(c.right)}</p>`;}

else if(c.type==='diagram')content=`<div class="figure-visual" role="img" aria-label="${esc(c.title+'。'+c.caption)}">${diagrams[c.diagram]}</div><p class="diagram-caption">${esc(c.caption)}</p>`;
else if(c.type==='ask')content=`<p><b>題幹線索：</b>${fmt(c.clue)}</p><p><b>處理步驟：</b>${fmt(c.steps)}</p><p class="example">練習例句：「${esc(c.example)}」</p>`;
else if(c.type==='question'){const q=c.question;content=`<div class="question-head"><span>第 ${c.n} 題・主題 ${esc(q.theme)}</span><span>${q.source.length===1&&q.source[0].startsWith('課本')?'課文延伸練習':'單課知識練習'}</span></div><p class="question-stem">${esc(q.stem)}</p><div class="options">${q.options.map((s,i)=>`<label class="option"><input type="radio" name="${q.id}" value="${i}" ${Number(answers[q.id])===i&&answers[q.id]!==undefined?'checked':''}><span>(${String.fromCharCode(65+i)}) ${esc(s)}</span></label>`).join('')}</div>`;heading='';}
else if(c.type==='answers'){content=`<div class="table-wrap"><table class="answer-table"><thead><tr><th>題號</th><th>答案</th><th>解析關鍵</th><th>回去複習</th></tr></thead><tbody>${BOOK.questions.map((q,i)=>`<tr class="answer-row" data-question="${q.id}"><td>${i+1}</td><td><b>${String.fromCharCode(65+q.answer)}</b></td><td>${esc(q.explain)}</td><td><a href="#${q.review}">${esc(q.reviewText)}</a></td></tr>`).join('')}</tbody></table></div><div class="score-box"><p><b>複習指南</b></p><p>${Math.ceil(BOOK.questions.length*.9)}～${BOOK.questions.length} 題：再說出理由，確認概念穩固。<br>${Math.ceil(BOOK.questions.length*.7)}～${Math.ceil(BOOK.questions.length*.9)-1} 題：依右欄補強錯題。<br>${Math.ceil(BOOK.questions.length*.7)-1} 題以下：先重讀核心重點，再看易錯陷阱。</p><div class="screen-only score-tools"><button id="grade">核對我的答案</button><button id="reset">清除作答</button><span class="score-text" aria-live="polite"></span></div></div>`;}
else{content=(c.intro?`<p class="intro">${fmt(c.intro)}</p>`:'')+(c.bullets||[]).map(s=>`<p class="point">${fmt(s)}</p>`).join('');}
if(c.tip)content+=c.mascot?`<div class="mascot-row"><img alt="小雪拿著教材介紹" src="${ASSETS[c.mascot]}"><p class="tip">${fmt(c.tip)}</p></div>`:`<p class="tip">${fmt(c.tip)}</p>`;

function fits(p){const b=p.querySelector('.page-body'),last=b.lastElementChild;return b.scrollHeight<=b.clientHeight+1&&(!last||last.getBoundingClientRect().bottom<=b.getBoundingClientRect().bottom+1);}
function splitCard(card,p,section,all){const src=card.querySelector('.card-content');let part=0,current;
function mount(){current=card.cloneNode(true);current.querySelector('.card-content').replaceChildren();if(part){current.id=card.id+'-part-'+(part+1);current.querySelector('h3')?.append('（續）');}part++;p.querySelector('.page-body').append(current);}
function advance(){if(!current.querySelector('.card-content').children.length)throw Error('單一內容過高：'+card.id);p=createPage(section,true);all.push(p);mount();}
mount();for(const child of [...src.children]){if(child.classList.contains('table-wrap')){let shell;const makeTable=()=>{shell=child.cloneNode(true);shell.querySelector('tbody').replaceChildren();current.querySelector('.card-content').append(shell);};makeTable();for(const row of child.querySelectorAll('tbody tr')){shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p)){shell.querySelector('tbody').lastElementChild.remove();if(!shell.querySelector('tbody').children.length)shell.remove();advance();makeTable();shell.querySelector('tbody').append(row.cloneNode(true));if(!fits(p))throw Error('單列表格過高：'+card.id);}}}else{current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p)){current.querySelector('.card-content').lastElementChild.remove();advance();current.querySelector('.card-content').append(child.cloneNode(true));if(!fits(p))throw Error('單一內容過高：'+card.id);}}}return p;}
async function readyImages(scope){await Promise.all([...scope.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(resolve=>{im.onload=im.onerror=resolve})));}
async function paginate(){if(busy)return;busy=true;$('#status').textContent='正在重新分頁…';const targetSection=pages[activePage]?.dataset.section;try{
observer?.disconnect();$('#measure').replaceChildren();let all=[];
for(const section of BOOK.sections){let p=createPage(section,false);all.push(p);for(const c of section.cards){if(c.breakBefore&&p.querySelector('.page-body').children.length){p=createPage(section,true);all.push(p);}let card=cardHTML(c);let b=p.querySelector('.page-body');b.append(card);await readyImages(card);if(!fits(p)){card.remove();if(b.children.length){p=createPage(section,true);all.push(p);p.querySelector('.page-body').append(card);}else p.querySelector('.page-body').append(card);if(!fits(p)){card.remove();p=splitCard(card,p,section,all);}}}}
await addSnowNotes(all);const issues=[];for(const p of all)if(!fits(p))issues.push(p.dataset.section);if(issues.length)throw Error('頁面仍溢出：'+issues.join('、'));
all.forEach((p,i)=>{p.id='page-'+(i+1);p.dataset.page=i+1;p.querySelector('.page-count').textContent=`${String(i+1).padStart(2,'0')} / ${all.length}`;p.setAttribute('aria-label',`第 ${i+1} 頁，${p.querySelector('h2').textContent}`);});
$('#pages').replaceChildren(...all);pages=all;$('#measure').replaceChildren();$('#page-select').innerHTML=all.map((p,i)=>`<option value="${i}">${i+1}｜${esc(p.querySelector('h2').textContent.replace(/^\d+ /,''))}</option>`).join('');
$('.section-nav').innerHTML=BOOK.sections.map(s=>{const first=all.find(p=>p.dataset.section===s.id);return `<a href="#${first.id}" data-section="${s.id}">${esc(s.nav)}</a>`;}).join('');
activePage=Math.max(0,targetSection?all.findIndex(p=>p.dataset.section===targetSection):0);setActive(activePage);observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)setActive(pages.indexOf(visible[0].target));},{rootMargin:`-${Math.round($('.topbar').getBoundingClientRect().height)}px 0px -45% 0px`,threshold:[0,.1,.3,.6]});all.forEach(p=>observer.observe(p));
window.__issues=[];window.__pageCount=all.length;window.__ready=true;$('#status').classList.remove('error');$('#status').textContent=`已排版 ${all.length} 頁`;document.dispatchEvent(new Event('book-ready'));
}catch(e){window.__issues=[e.message];window.__ready=false;$('#status').classList.add('error');$('#status').textContent='排版需調整，請重新載入頁面';console.error(e);}finally{busy=false;}}
function setActive(i){activePage=i;$('#page-select').value=String(i);$('#prev').disabled=i===0;$('#next').disabled=i===pages.length-1;$('.section-nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.section===pages[i]?.dataset.section));}
function gotoPage(i){i=Math.max(0,Math.min(pages.length-1,i));setActive(i);pages[i]?.scrollIntoView({behavior:'smooth',block:'start'});}
BOOK.sections.find(s=>s.id==='quiz').cards=BOOK.questions.map((q,i)=>({id:q.id,type:'question',n:i+1,question:q,breakBefore:i>0&&i%5===0}));BOOK.sections.find(s=>s.id==='answers').cards=[{id:'answer-key',type:'answers',title:'作答完成後，再看這一頁'}];
$('#page-select').onchange=e=>gotoPage(Number(e.target.value));$('#prev').onclick=()=>gotoPage(activePage-1);$('#next').onclick=()=>gotoPage(activePage+1);$('#font-toggle').onclick=async()=>{large=!large;document.body.classList.toggle('large-text',large);$('#font-toggle').setAttribute('aria-pressed',String(large));$('#font-toggle').textContent=large?'恢復標準字級':'大字閱讀';await paginate();gotoPage(activePage);};
$('#print').onclick=async()=>{if(!window.__ready){alert('頁面尚未準備完成，請稍候再試。');return;}await document.fonts.ready;await readyImages($('#pages'));window.print();};
document.addEventListener('change',e=>{if(e.target.matches('.option input')){answers[e.target.name]=Number(e.target.value);try{localStorage.setItem('sixuncle-'+BOOK.meta.version+'-'+BOOK.meta.grade+'-'+BOOK.meta.lesson,JSON.stringify(answers))}catch(e){}}});
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){const target=document.getElementById(a.getAttribute('href').slice(1));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'});const p=target.closest('.page');if(p)setActive(pages.indexOf(p));}}if(e.target.id==='grade'){let correct=0,answered=0;BOOK.questions.forEach(q=>{const has=answers[q.id]!==undefined,ok=has&&answers[q.id]===q.answer;answered+=has;correct+=ok;const row=document.querySelector(`[data-question="${q.id}"]`);row.classList.toggle('is-correct',ok);row.classList.toggle('is-wrong',has&&!ok);});$('.score-text').textContent=`已答 ${answered}／${BOOK.questions.length} 題，答對 ${correct} 題。`;}

const clozePlan={"core-1":{"selector":".point","terms":["較低廉的租金"]},"core-2":{"selector":".point","terms":["巡迴醫療"]},"core-3":{"selector":".point","terms":["地方創生國家計畫"]},"core-4":{"selector":".point","terms":["香蕉創意工坊"]},"core-5":{"selector":".point","terms":["與水共生"]},"core-6":{"selector":".point","terms":["水土保持戶外教室"]},"core-7":{"selector":".point","terms":["友善的步行環境"]},"core-8":{"selector":".point","terms":["國際環境藝術季"]},"core-9":{"selector":".point","terms":["第一座國家公園"]},"mindmap-overview":{"selector":".mind-branch p","terms":["社會住宅","幸福小黃","滯洪池","國際環境藝術季"]},"trap-1":{"selector":".correct","terms":[]},"trap-2":{"selector":".correct","terms":[]},"trap-3":{"selector":".correct","terms":[]},"trap-4":{"selector":".correct","terms":["第一座國家公園"]},"trap-5":{"selector":".correct","terms":["巡迴醫療"]},"trap-6":{"selector":".correct","terms":[]},"keyword-table":{"selector":"tbody td:nth-child(2)","terms":["永續發展","社會住宅","巡迴醫療","幸福小黃","地方創生","台青蕉","與水共生","滯洪池","成龍溼地","國家公園"]}};
let clozeMode=true;
function markCloze(card){
 const plan=clozePlan[card.id];if(!plan)return;
 for(const term of plan.terms){let done=false;for(const container of card.querySelectorAll(plan.selector)){
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.cloze-slot,svg,button')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let node;while(node=walker.nextNode()){const at=node.nodeValue.indexOf(term);if(at<0)continue;const matched=node.splitText(at);matched.splitText(term.length);const slot=document.createElement('span');slot.className='cloze-slot';const answer=document.createElement('span');answer.className='cloze-answer';answer.textContent=term;slot.append(answer);matched.replaceWith(slot);done=true;break;}if(done)break;
 }}
}
function refreshCloze(){
 document.body.classList.toggle('student-cloze',clozeMode);
 document.querySelectorAll('#pages .cloze-slot').forEach((slot,i)=>{
  slot.classList.remove('is-revealed');slot.setAttribute('role',clozeMode?'button':'text');slot.tabIndex=clozeMode?0:-1;
  if(clozeMode){slot.setAttribute('aria-label',`第 ${i+1} 格，按 Enter 或點擊查看答案`);slot.setAttribute('aria-pressed','false')}else{slot.removeAttribute('aria-label');slot.removeAttribute('aria-pressed')}
  slot.firstElementChild.setAttribute('aria-hidden',String(clozeMode));
 });

 const total=document.querySelectorAll('#pages .cloze-slot').length;
 document.getElementById('study-hint').textContent=clozeMode?`學生挖空｜共 ${total} 格。點擊空格或按 Enter 可開啟／收起單格答案；列印時一律保留空格。`:'完整解答｜所有關鍵詞皆已顯示，可閱讀或列印完整版。';
 window.__clozeCount=total;
}
function toggleCloze(slot){if(!clozeMode||!slot)return;const show=slot.classList.toggle('is-revealed');slot.firstElementChild.setAttribute('aria-hidden',String(!show));slot.setAttribute('aria-pressed',String(show));slot.setAttribute('aria-label',show?slot.textContent+'，再按一次收起答案':'空格，按 Enter 或點擊查看答案');}
document.addEventListener('book-ready',refreshCloze);

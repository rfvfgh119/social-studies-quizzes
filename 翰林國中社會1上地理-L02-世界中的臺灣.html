": "台灣面積只有荷蘭的 0.94 倍，顯示台灣土地面積相當小。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "地理位置", "skill": "資料分析與比較", "difficulty": 2, "id": 7}, {"question": "台灣四面環海，根據聯合國海洋法公約，領海基線往外多少浬為領海？", "options": ["3 浬", "12 浬", "200 浬", "50 浬"], "answer": 1, "explanation": "領海基線往外 12 浬是領海，等於國家主權範圍。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "海洋法與經濟海域", "skill": "基礎認知", "difficulty": 2, "id": 8}, {"question": "台灣北接日本、南連菲律賓，這個位置被稱為？", "options": ["太平洋中脊", "東亞島弧", "馬六甲海峽", "珊瑚海三角"], "answer": 1, "explanation": "台灣位於東亞島弧的中心，北接日本、南連菲律賓。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "地理位置", "skill": "地圖解讀與空間定位", "difficulty": 2, "id": 9}, {"question": "地圖上北極永遠在上方，主要原因是？", "options": ["北極最重要的氣候", "所有畫地圖的人都在北半球", "地球自转轴偏向北方", "南半球沒有地圖"], "answer": 1, "explanation": "地圖本身有偏見，因為繪製地圖的人幾乎都在北半球，所以北極總在上方。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "地圖解讀", "skill": "基礎認知", "difficulty": 2, "id": 10}]}, {"level": 2, "name": "深入分析", "questions": [{"question": "冰河時期台灣海峽變成陸地，主要的原因是？", "options": ["板塊運動使海床上升", "全球氣溫降低，海水結成冰蓋使海平面下降", "太平洋板塊俯衝造成海床隆起", "歐亞板塊擠壓使海水排擠出去"], "answer": 1, "explanation": "冰河時期全球氣溫很低，海水結成冰蓋，海平面下降 65 公尺，台灣海峽變成陸地。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "冰河時期與特有種", "skill": "因果關係推理", "difficulty": 3, "id": 11}, {"question": "櫻花鉤吻鮭原為冰河時期從亞洲大陸移入，後來成為台灣特有種，這個過程稱為什麼？", "options": ["物種滅絕", "地理隔離創造特有種", "外來種入侵", "人工育種"], "answer": 1, "explanation": "冰河期結束後海平面上升，陸橋消失，動物被隔離在島上獨立演化，形成特有種。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "地理隔離創造特有種", "skill": "因果關係推理", "difficulty": 3, "id": 12}, {"question": "下列哪一物種不是台灣特有種，而是冰河時期從大陸移入後獨立演化的遺留物種？", "options": ["梅花鹿（台灣梅花鹿）", "黑長尾雉（帝雉）", "黑面琵鷺", "櫻花鉤吻鮭（臺灣鮭）"], "answer": 3, "explanation": "櫻花鉤吻鮭是冰河時期從大陸走過來，後來成為台灣特有的臺灣鮭，為冰河時期遺留物種。", "subject": "社會科", "unit": "台灣的地理位置與自然環境", "concept": "地理隔離創造特有種", "skill": "資料分析與比較", "difficulty": 3, "id": 13}, {"question": "台灣漁船常在巴士海峽被扣留，最主要的原因為何？", "options": ["台灣漁船非法捕撈", "台灣與菲律賓經濟海域重疊，引發主權爭議", "颱風季節航行危險", "當地漁業資源枯竭"], "answer": 1, "explanation": "巴 function restartAll(){ state.screen = "home"; state.currentLevelIdx = 0; state.currentQIdx = 0; state.selectedOption = null; state.levelResults = [null,null,null]; state.levelAnswers = [{},{},{}]; state.retryQueue = []; state.retryIdx = 0; state.inRetry = false; state.abilityStats = {}; state.conceptStats = {}; render(); }
function esc(str){ const div = document.createElement("div"); div.textContent = String(str ?? ""); return div.innerHTML; }
render();

ect": "地理", "unit": "L02", "concept": "臺灣的地理位置", "skill": "空間認知", "difficulty": 2, "id": 7}, {"question": "臺灣位於亞洲的哪一區域？", "options": ["南亞", "東南亞", "東亞", "中亞"], "answer": 2, "explanation": "臺灣位於東亞地區，是太平洋西岸島鏈的重要一環。", "subject": "地理", "unit": "L02", "concept": "臺灣的區域定位", "skill": "空間認知", "difficulty": 2, "id": 8}, {"question": "下列哪一項屬於「第一層面的人權」（生存與基本需求）？", "options": ["言論自由", "受教育權", "身體生命權", "參政權"], "answer": 2, "explanation": "身體生命權是人類最基本的人權，屬於生存與基本需求的層面，是其他人權的前提。", "subject": "公民", "unit": "L02", "concept": "基本人權的類型", "skill": "概念理解", "difficulty": 2, "id": 9}, {"question": "臺灣島位於北迴線通過的位置，其氣候帶主要屬於：", "options": ["北極圈內的寒帶", "熱帶與亞熱帶", "溫帶與寒帶", "只有熱帶"], "answer": 1, "explanation": "臺灣島被北迴線穿過，南部屬熱帶氣候，北部屬亞熱帶氣候。", "subject": "地理", "unit": "L02", "concept": "臺灣的地理環境", "skill": "空間認知", "difficulty": 2, "id": 10}]}, {"level": 2, "name": "深入分析", "questions": [{"question": "某國政府以「維護公共安全」為由，無限期拘留一名異議人士，此舉最可能違反何種人權保障原則？", "options": ["保障人權不得任意剝奪人身自由", "政府有權為了多數人利益犧牲少數人", "安全問題可以超越人性尊嚴", "異議人士不享有基本人權"], "answer": 0, "explanation": "任何人身自由的限制都須依法進行，不得任意剝奪；以公共安全為由無限期拘留，違反人權保障原則。", "subject": "公民", "unit": "L02", "concept": "人權保障的限制與底線", "skill": "情境判斷", "difficulty": 3, "id": 11}, {"question": "以下哪一種情境最能展現「公民德性」？", "options": ["在網路上隨意謾罵不認同的人", "遵守交通規則並主動讓座給需要的人", "只關心自己的權益，不顧社會大眾", "逃避參與社區環境清潔活動"], "answer": 1, "explanation": "遵守規則、尊重他人是公民德性的具體表現；其他選項均為缺乏公民德性的行為。", "subject": "公民", "unit": "L01", "concept": "公民德性的表現", "skill": "情境判斷", "difficulty": 3, "id": 12}, {"question": "從地理位置來看，臺灣在亞洲貿易網絡中最具優勢的原因是：", "options": ["臺灣四面環山，陸路交通發達", "位於太平洋與臺灣海峽之間，是東西向海運樞紐", "臺灣位於亞洲正中心，四周距離相等", "臺灣四面環海，無需與其他國家貿易"], "answer": 1, "explanation": "臺灣位於太平洋與臺灣海峽之間，北連東北亞、南接東南亞，是國際海運的重要中轉站。", "subject": "地理", "unit": "L02", "concept": "臺灣的地理優勢", "skill": "區域分析", "difficulty": 3, "id": 13}, {"question": "某學校規定學生必須穿著整齊制服才能入學，此規定若過度限制學生的個人選擇，可能涉及侵害何種人權？", "options": ["生命權", "人性尊嚴與個人自由發展的空間", "投票權", "參政權"], "answer": 1, "explanation": "人性尊嚴包含個人自由發展的空間；若規定過度限制，可能侵害學生的人格發展權。", "subject": "公民", "unit": "L02", "co     <button onclick="restartAll()" class="w-full bg-[var(--gold-dark)] text-white font-bold py-3 rounded-xl">🔄 重新挑戰全部</button>
  </div>`;
}
function restartAll(){ state.screen = "home"; state.currentLevelIdx = 0; state.currentQIdx = 0; state.selectedOption = null; state.levelResults = [null,null,null]; state.levelAnswers = [{},{},{}]; state.retryQueue = []; state.retryIdx = 0; state.inRetry = false; state.abilityStats = {}; state.conceptStats = {}; render(); }
function esc(str){ const div = document.createElement("div"); div.textContent = String(str ?? ""); return div.innerHTML; }
render();
</script>
